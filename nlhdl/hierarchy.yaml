# =============================================================================
# hierarchy.yaml — NL_HDL project module map
# =============================================================================
# This file is the authoritative map of the design. The generation agent reads
# it to:
#   1. Locate each module's nlhdl source and generated output.
#   2. Resolve <|begin_dependencies|> entries to concrete module interfaces.
#   3. Derive build order (topological sort of the instantiation DAG) so that
#      leaf modules are generated before the modules that instantiate them.
#   4. Elaborate the instance tree (arrays, parameter overrides, connections).
#
# Design principle — DEFINE ONCE, INSTANTIATE MANY:
#   A module is DEFINED once under `modules:` (its source, params, interface).
#   It is INSTANTIATED any number of times via another module's `instantiates:`
#   list, each with its own instance name, replication count, and parameter
#   overrides. This is what lets one definition (e.g. sync_fifo) serve dozens of
#   uses across a complex design without duplication.
#
# Source of truth for interfaces:
#   For nlhdl-backed modules, the module's <|begin_ports|> / <|begin_parameters|>
#   sections are authoritative — do NOT duplicate them here. Declare `ports:` /
#   `parameters:` inline ONLY for `blackbox:` modules that have no nlhdl source.
#
# -----------------------------------------------------------------------------
# `kind:` — what sort of node this is
# -----------------------------------------------------------------------------
# Optional; defaults to `module`. Two values:
#
#   kind: module   (default)
#     An instantiable RTL module. Participates in `top:` and `instantiates:`.
#     The registry key MUST match the RTL module name.
#
#   kind: package
#     A shared DECLARATION unit, not an instantiable module: an SV `package` /
#     `svh` header, a Chisel `Bundle`/`object`/parameter case class. It declares
#     types, constants, and parameters that other nodes bind to.
#       - MUST NOT carry `instantiates:` and MUST NOT appear in `top:` — a
#         package is never instantiated, only depended on.
#       - MAY appear in another node's `depends_on:` list (see below). Packages
#         sort BEFORE their dependents in build order; unlike an instantiation
#         edge this is a hard compile requirement, not a convenience.
#       - The registry key is the package/declaration name (e.g. `MicroOp`,
#         `tt_cii_caracal_pkg`), which need not name any module.
#       - Takes `mode:` like any other node, and may be `blackbox: true` when it
#         is a frozen contract this flow must bind to but never edit.
#
# `depends_on:` — a list of package names this node binds to. Declaration-only
# edges, kept separate from `instantiates:` so the instance tree stays a tree.
# Answers "what breaks if this type changes?" as a fan-in query.
#
# -----------------------------------------------------------------------------
# `mode:` — how the implementor agent must treat the target RTL file
# -----------------------------------------------------------------------------
# REQUIRED on every non-blackbox module. It tells the agent whether it is
# writing a file from scratch or editing one that already exists, and therefore
# how much of the file the nlhdl source is authoritative over.
#
#   mode: new
#     No existing RTL. The nlhdl source describes the WHOLE module. The agent
#     emits the complete file at `output:`. The generated RTL must fully match
#     the spec — every port, parameter, and behavior in the nlhdl file, and
#     nothing beyond it.
#
#   mode: edit_generated
#     `output:` already exists AND was produced by this flow from `source:`.
#     The nlhdl source is still authoritative over the WHOLE module: treat this
#     as a regeneration. The agent may restructure freely, but the result must
#     fully match the current spec. Hand edits made to a generated file are not
#     protected — if they matter, they belong in the nlhdl source. Diff the new
#     output against the old and report any behavior that changed.
#
#   mode: edit_existing
#     `target:` is pre-existing RTL that this flow did NOT generate (hand-written
#     or third-party). The nlhdl source is a DELTA SPEC: it describes only the
#     modification/extension to apply, not the module as a whole. Rules:
#       - Edit in place. Preserve the existing file's style, naming, formatting,
#         and license/copyright header — do not reformat or re-header it.
#       - Change ONLY what the spec calls for. No drive-by cleanups, renames,
#         reordering, or "while I'm here" fixes.
#       - No functional regression. Existing behavior outside the specified
#         change must be bit- and cycle-identical. Ports and parameters not
#         mentioned by the spec keep their current semantics.
#       - If the spec cannot be applied without touching unspecified behavior,
#         STOP and report the conflict instead of guessing.
#       - Report the edit as a diff of the touched hunks, plus an explicit
#         statement of what was left untouched.
#
# Path convention by mode:
#   new / edit_generated  -> `output:` (a path under a `generated/` directory)
#   edit_existing         -> `target:` (the pre-existing file, edited in place;
#                            `output:` must NOT be set — there is no separate
#                            generated artifact)
#
# NAME COLLISION, resolved. `target:` means two different things depending on
# scope, so they are kept apart:
#   defaults.target:  the project-default HDL LANGUAGE (sv | v | vhd | scala)
#   <module>.target:  the pre-existing FILE PATH edited in place (edit_existing)
#   <module>.target_hdl:  a per-module HDL override, when it differs from
#                         `defaults.target`
# Do not use a module-scope `target:` to mean a language — it will be read as a
# file path.
#
# Blackbox modules take no `mode:` — they are never written at all.
#
# -----------------------------------------------------------------------------
# `reqs:` — which requirements this module is responsible for
# -----------------------------------------------------------------------------
# A list of requirement IDs from the corpus under `reqs/` (see the spec-to-reqs
# skill): `reqs: [spec-cii.e1, spec-cii.e2]`. Written by `/nlhdl architect`,
# which allocates every live requirement to a module or to the out-of-scope
# ledger below.
#
#   ALLOCATION, NOT IMPLEMENTATION. `reqs:` here is a plan — "this module owes
#   this obligation". The claim that code actually satisfies it is the
#   `//@req-<id>` comment placed in the nlhdl source by `gen-nlhdl` and carried
#   into the RTL by `gen-rtl`. The two are separate records on purpose: the gap
#   between them is the work outstanding, and if the same field served both, an
#   untagged requirement would stop being a signal.
#
#   BARE IDS ONLY. Write `spec-cii.e1` — never that ID with the tag prefix
#   ("//@req-" + the ID) in front of it. The spec-to-reqs validator greps
#   `.yaml` files for that literal token, so a tagged ID here would register as
#   an implementation claim and inflate coverage before any RTL exists. Note
#   this comment deliberately does not spell the prefixed form out: written
#   whole, even as a counter-example, it would be picked up as a real tag.
#
#   Every ID must be live (present in a family's `reqs:`, not its `retired:`).
#   Blackbox nodes take no `reqs:` — nothing this flow writes will ever tag them.
#   Prefer one owner per requirement; list a second only for an obligation that
#   genuinely binds both sides of a seam, and say why in a comment.
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# Project-wide defaults. Any module may override these.
# -----------------------------------------------------------------------------
defaults:
  target: sv                 # default HDL when a module doesn't pin one
  clock: core_clk            # default clock domain name
  reset: core_rst_n          # default reset net
  reset_polarity: active_low # active_low | active_high
  reset_sync: sync           # sync | async

# -----------------------------------------------------------------------------
# Clock domains. Name them here and reference by name from modules/instances.
# Enables multi-clock designs and makes CDC crossings explicit.
# -----------------------------------------------------------------------------
clocks:
  core_clk: { freq_mhz: 1000 }
  io_clk:   { freq_mhz: 200 }

resets:
  core_rst_n: { clock: core_clk, polarity: active_low, sync: async }
  io_rst_n:   { clock: io_clk,   polarity: active_low, sync: async }

# -----------------------------------------------------------------------------
# Reusable interface / bundle definitions (SV `interface`, Chisel `Bundle`).
# Bind them at instantiation with `connect:` instead of listing every signal.
# Widths may reference parameters, resolved in the binding module's scope.
# -----------------------------------------------------------------------------
interfaces:
  axi4_lite:
    description: "AXI4-Lite manager/subordinate channel bundle"
    params:
      - { name: ADDR_W, default: 32 }
      - { name: DATA_W, default: 64 }
    signals:
      - { name: awaddr,  dir: fwd, width: ADDR_W }
      - { name: awvalid, dir: fwd, width: 1 }
      - { name: awready, dir: bwd, width: 1 }
      - { name: wdata,   dir: fwd, width: DATA_W }
      - { name: wvalid,  dir: fwd, width: 1 }
      - { name: wready,  dir: bwd, width: 1 }
      - { name: rdata,   dir: bwd, width: DATA_W }
      - { name: rvalid,  dir: bwd, width: 1 }
      - { name: rready,  dir: fwd, width: 1 }
      # dir is from the manager's viewpoint: fwd = manager->subordinate.

# -----------------------------------------------------------------------------
# Top-level module(s) of the design. May be a single name or a list.
# Build/elaboration starts here and walks the instantiates DAG downward.
# -----------------------------------------------------------------------------
top: soc_top

# -----------------------------------------------------------------------------
# Live requirements this map deliberately does NOT allocate to any module.
# Written by `/nlhdl architect`. Every live requirement in the corpus is either
# in some module's `reqs:` or here — an unallocated requirement is an error,
# because nothing downstream can see it: it is never specified in an nlhdl file,
# never tagged, and never missed. A reason is reviewable; silence is not.
# (The IDs in this file are illustrative — real ones come from `reqs/`.)
# -----------------------------------------------------------------------------
reqs_out_of_scope:
  - reqs: [spec-soc.h1, spec-soc.h2]
    reason: implemented inside vendor IP (regfile blackbox); not ours to write.
  - reqs: [spec-soc.k4]
    reason: >
      Deferred past this milestone — the plan lists DMA descriptor chaining as
      a non-goal.

# -----------------------------------------------------------------------------
# Module registry. Key = module name; MUST match the generated RTL module name
# and the <module_name> in the nlhdl filename.
# -----------------------------------------------------------------------------
modules:

  # ---- Top-level subsystem: shows arrays, param propagation, interfaces ------
  soc_top:
    source: soc/soc_top.nlhdl.sv
    mode: new                      # whole module owned by the nlhdl source
    output: soc/generated/soc_top.sv
    group: soc                     # optional tag for organization/reporting
    clock: core_clk
    reset: core_rst_n
    reqs: [spec-soc.a1, spec-soc.a2]   # obligations this module owns (bare IDs)
    # parameters/ports come from the nlhdl file — not repeated here.
    instantiates:
      - module: cpu_core
        instance: core             # elaborates to core[0..NUM_CORES-1]
        count: NUM_CORES           # array -> generate/genvar in RTL
        params: { XLEN: 64 }       # override applied to every element
      - module: axi_xbar
        instance: xbar
        params: { NUM_M: NUM_CORES, NUM_S: 3 }   # expr refs parent param
      - module: sram_ctrl
        instance: mem
        connect:
          bus: { interface: axi4_lite, params: { ADDR_W: 32, DATA_W: 64 } }
      - module: uart
        instance: uart0
        clock: io_clk              # different clock domain (CDC boundary)
        reset: io_rst_n

  # ---- A core: shows reuse of one definition across two instances -----------
  cpu_core:
    source: cores/cpu_core.nlhdl.sv
    mode: edit_generated           # regenerating a file this flow already wrote
    output: cores/generated/cpu_core.sv
    group: core
    reqs: []
    instantiates:
      - { module: alu,       instance: alu }
      - { module: regfile,   instance: rf }       # blackbox, see below
      - { module: sync_fifo, instance: ld_q, params: { WIDTH: XLEN, DEPTH: 8 } }
      - { module: sync_fifo, instance: st_q, params: { WIDTH: XLEN, DEPTH: 8 } }

  # ---- Leaf modules backed by nlhdl sources ---------------------------------
  alu:
    source: examples/alu/alu.nlhdl.sv
    mode: new
    output: examples/alu/generated/alu.sv
    group: core
    reqs: []
    # no instantiates -> leaf; generated first in topo order.

  sync_fifo:
    source: examples/fifo/fifo.nlhdl.sv
    mode: new
    output: examples/fifo/generated/sync_fifo.sv
    group: common
    reqs: []

  axi_xbar:
    source: soc/axi_xbar.nlhdl.sv
    mode: new
    output: soc/generated/axi_xbar.sv
    group: soc
    reqs: []

  sram_ctrl:
    source: soc/sram_ctrl.nlhdl.sv
    mode: new
    output: soc/generated/sram_ctrl.sv
    group: soc
    reqs: []

  # ---- Pre-existing hand-written RTL, extended in place ----------------------
  # `uart.nlhdl.sv` is a DELTA SPEC (e.g. "add a 16-deep RX FIFO and an
  # rx_overflow status bit"), not a description of the whole UART. The agent
  # edits `target:` surgically and must not regress existing behavior. Note
  # there is no `output:` — the pre-existing file IS the artifact.
  uart:
    source: soc/uart.nlhdl.sv
    mode: edit_existing
    target: soc/rtl/uart.sv
    group: soc
    # An edit_existing node owns only the reqs its DELTA answers — the
    # pre-existing UART behavior predates this corpus and is not allocated here.
    reqs: [spec-soc.d3]

  # ---- Blackbox / external IP: interface-only, NEVER generated --------------
  # Has no nlhdl source, so its interface MUST be declared inline here. The
  # agent instantiates against this interface but does not emit RTL for it.
  # No `mode:` — a blackbox is never written or edited by this flow. Use
  # `mode: edit_existing` instead when pre-existing RTL *is* meant to be changed.
  regfile:
    blackbox: true
    output: vendor/regfile.sv      # pre-existing RTL, referenced not written
    parameters:
      - { name: XLEN,    default: 64 }
      - { name: N_READ,  default: 2 }
      - { name: N_WRITE, default: 1 }
    ports:
      - { name: clk,   dir: input,  width: 1 }
      - { name: raddr, dir: input,  width: "5 * N_READ" }
      - { name: rdata, dir: output, width: "XLEN * N_READ" }
      - { name: waddr, dir: input,  width: "5 * N_WRITE" }
      - { name: wdata, dir: input,  width: "XLEN * N_WRITE" }
      - { name: wen,   dir: input,  width: N_WRITE }

  # ---- Packages: shared declarations, never instantiated ---------------------
  # A package declares the types/constants/parameters other nodes bind to. It has
  # no ports and no instance, so it carries no `instantiates:` and never appears
  # in `top:`. Dependents name it in `depends_on:`, which fixes build order
  # (packages first) and makes "what breaks if this type changes?" answerable.
  soc_pkg:
    kind: package
    source: soc/soc_pkg.nlhdl.sv
    mode: new
    output: soc/generated/soc_pkg.svh
    group: common

  # A frozen contract: both sides bind to it, this flow never writes it. A
  # blackbox package takes no `mode:` and needs no `ports:` — it declares types,
  # not an interface, so there is nothing to instantiate against.
  vendor_axi_pkg:
    kind: package
    blackbox: true
    output: vendor/axi/vendor_axi_pkg.svh
