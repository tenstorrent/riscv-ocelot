    property: >
      laneValid && !laneUsesStq

  # ---- group e: the load coalescing buffer ----------------------------------

  - id: formal-lsu.e1
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_load_grant_has_lcb_credit
    kind: assert
    reqs: [spec-lsu.e24]
    statement: >
      A load element access must not be granted a D$ lane unless an LCB assembly
      entry is free to receive its response.
    property: >
      ldWins |-> Sequence.BoolSequence(lcbFree =/= 0.U)
    reachability: formal-lsu.e2
    notes: >
      "Entries are allocated before the accesses that fill them" enforced at the
      arbiter, which is where the credit is consulted.

  - id: formal-lsu.e2
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_load_grant_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.e1
    statement: >
