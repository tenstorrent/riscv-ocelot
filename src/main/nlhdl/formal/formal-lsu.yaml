    reachability: formal-lsu.e19

  - id: formal-lsu.e19
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_group_done_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.e18
    statement: >
      The LCB emits a group-done.
    property: >
      groupDoneValid

  - id: formal-lsu.e20
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_group_done_count_matches_target
    kind: assert
    reqs: [spec-lsu.e13, spec-lsu.e14]
    statement: >
      The per-group PRN-done count must equal the destination-group size the
      group-done reports.
    property: >
      groupDoneValid |-> Sequence.BoolSequence(groupCountWinner === groupDoneMembers)
    reachability: formal-lsu.e19

  - id: formal-lsu.e21
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_group_done_pvdest_matches_entry
    kind: assert
    reqs: [spec-lsu.e16, spec-lsu.l1, spec-lsu.l3, spec-lsu.l4, spec-lsu.l8, spec-lsu.l9]
    statement: >
      The group-done's member-PRN vector must name, at the winning entry's own
      member index, that entry's physical register.
    property: >
      groupDoneValid |-> Sequence.BoolSequence(pvdestAtWinnerMember === winnerPrn)
    reachability: formal-lsu.e19
    notes: >
      Also the segmented-load obligation: the LSU half fills whichever group it
      was allocated with (pvtmp for a shared op, pvdest otherwise) and completes
      it through this one path, with no special case.

  - id: formal-lsu.e22
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_no_duplicate_prn
    kind: assert
    reqs: [spec-lsu.e2]
    statement: >
      Two live assembly entries must not be filling the same destination PRN of
      the same load.
    property: >
      Sequence.BoolSequence(e0Valid && e1Valid) |-> Sequence.BoolSequence((e0Prn =/= e1Prn) || (e0LdqIdx =/= e1LdqIdx))
    reachability: formal-lsu.e23
    notes: >
      "One entry per destination PRN currently being filled", sampled on the
      entry pair 0/1. A duplicate would double-count bytes and complete early.

  - id: formal-lsu.e23
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_two_entries_live_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.e22
    statement: >
      Two LCB entries are live at once.
    property: >
      e0Valid && e1Valid

  # ---- group f: per-element progress ----------------------------------------

  - id: formal-lsu.f1
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_killed_entry_never_written
    kind: assert
    reqs: [spec-lsu.f15, spec-lsu.i8]
    statement: >
      An assembly entry whose owning ldq_idx has been killed must never be
      written to the VRF.
    property: >
      wrValid |-> Sequence.BoolSequence(!wrKilled)
    reachability: formal-lsu.e12
    notes: >
      The reclaimed pvdest group is reallocated within a few cycles, so a late
      VLEN-wide write must be impossible rather than merely harmless. Also the
      drop rule for a late response on a rolled-back ldq_idx.

  - id: formal-lsu.f2
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_kill_clears_entry
    kind: assert
    reqs: [spec-lsu.f14, spec-lsu.i7]
    statement: >
      A killed assembly entry must be invalid on the next cycle.
    property: >
      killHere0 |=> Sequence.BoolSequence(!e0Valid)
    reachability: formal-lsu.f3

  - id: formal-lsu.f3
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_entry_killed_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.f2
    statement: >
      An assembly entry is killed by its owning ldq_idx.
    property: >
      killHere0

  - id: formal-lsu.f4
    checker: VecElemAgenChecks
    label: vec_elem_agen_fault_latches_seen
    kind: assert
    reqs: [spec-lsu.f5]
    statement: >
      The first fault of a walk must latch the fault-seen state.
    property: >
      newFault |=> faultSeen
    reachability: formal-lsu.f5

  - id: formal-lsu.f5
    checker: VecElemAgenChecks
    label: vec_elem_agen_new_fault_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.f4
    statement: >
      A first fault is reported to the element agen.
    property: >
      newFault

  - id: formal-lsu.f6
    checker: VecElemAgenChecks
    label: vec_elem_agen_no_emit_after_fault
    kind: assert
    reqs: [spec-lsu.f9, spec-lsu.a10]
    statement: >
      Once a fault is latched the walk must stop emitting element accesses.
    property: >
      faultSeen |-> Sequence.BoolSequence(!pushValid)
    reachability: formal-lsu.f7

  - id: formal-lsu.f7
    checker: VecElemAgenChecks
    label: vec_elem_agen_fault_seen_state
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.f6
    statement: >
      The element agen is in its fault-stopped state.
    property: >
      faultSeen

  - id: formal-lsu.f8
    checker: VecElemAgenChecks
    label: vec_elem_agen_emit_counter_advances
    kind: assert
    reqs: [spec-lsu.f8]
    statement: >
      Each emitted element access must advance the emission counter, so accesses
