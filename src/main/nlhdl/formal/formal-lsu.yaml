# =============================================================================
# formal-lsu.yaml — the formal ledger for the `lsu` requirement family
# =============================================================================
# Written by /req-formal-chisel (orchestrator). Read alongside
# req-formal-chisel/references/schema.md.
#
# SCOPE — COMPLETE. `coverage:` covers all 161 live requirements of
# spec-lsu.yaml, groups a through m, across every module hierarchy.yaml allocates
# them to. Built in two passes:
#
#   pass 1 (store data path): group d, the store half of j, b4-b9/b19, c3-c6, k8
#           -> formal-lsu.b1-b8, c1-c8, d1-d18, j1-j14, k1
#   pass 2 (the rest of the family): a, e, f, g, h, i, l, m, the load half of j,
#           b1-b3/b10-b18, c2, k2-k7/k10
#           -> formal-lsu.a1-a4, b9-b14, e1-e24, f1-f9, g1-g2, h1-h13, i1-i10,
#              j15-j19, k2-k3, m1-m16
#
# Pass 2 APPENDED: no pass-1 ID, label or `property:` text was renumbered or
# rewritten. The one pass-1 ledger delta is recorded in VecLsuChecks' notes.
#
# notes:
#   Un-speced obligations found while planning. Each is a seam the store bug
#   hunt wants asserted, for which NO requirement in spec-lsu.yaml (or any
#   family assigned to this module set) provides an obligation. They are
#   recorded here rather than smuggled in as properties with an empty `reqs:`.
#
#   1. "The DGEN grant implies the store's vs3/pvtmp source group is not busy."
#      The DGEN-grant-vs-operand-readiness obligation lives in spec-issue
#      (g22-g28, g32) and is owned by VecStoreDgenPath, which holds NO spec-lsu
#      requirement at all. It cannot be ledgered in this family. The nearest
#      lsu-family property is formal-lsu.d17, which checks only that the DGEN
#      grant and the uop VecDgen actually reads name the same instruction.
#      spec-lsu.d7 says WHEN the data is read (at DGEN, execute time) but says
#      nothing about the source group being written first.
#   2. "is_write_pass has exactly one driver." No requirement states that the
#      US and SSI store classes share one pass-state port; it is an as-built
#      consequence of VecBeatExpander's interface. formal-lsu.j7 asserts the
#      agreement condition the sharing needs, citing spec-lsu.j7/j9 (the
#      obligations that break when it is violated), but the single-driver
#      structure itself is un-speced.
#   3. "Every store byte written falls inside the op's own reserved footprint."
#      spec-lsu.b6/d11 give the queue-entry-granular half (asserted as
#      formal-lsu.b1), and k8 the lane-width half (formal-lsu.k1). There is NO
#      requirement bounding a beat's byte_en/vaddr by the range's own
#      [base, base+len) footprint, which is the granularity at which the
#      observed "dword written past the range" bug lives.
#   4. The `xlated` bitmap in VecElemQueue (the per-entry translated flag, the
#      only as-built evidence that spec-lsu.b9's pre-commit fault detection
#      happened) HAS NO READER: nothing in VecLsu or VecBeatExpander consults
#      it before a write-pass beat drains the entry. See the b9 coverage row.
#   5. spec-lsu.d3/d4 fix the store data queue entry widths at ELEN and VLEN.
#      VecElemQueue only `require(width > 0)`; nothing at elaboration pins
#      either queue's width to ELEN/VLEN. See the d3/d4 coverage rows.
#
#   Findings added by pass 2 (all are RTL findings, not skip excuses):
#
#   6. MicroOp DOES carry the spec's per-entry element cursor
#      (`v_elem_cursor.{elem_next,elem_done,fault_elem}`, micro-op.scala:68-70),
#      but it is DEAD: VecDecode zeroes all three at decode and asserts they stay
#      zero (VecDecode.scala:182-184, 325-327), and nothing in the LSU ever
#      writes them. The live cursor is VecElemAgen's elem_ptr/emit_ctr/
#      fault_seen/fault_elem and VecLsu's stUsCursor. spec-lsu.f1-f4 are
#      therefore satisfied structurally by fields nothing uses; the properties
#      that check the real cursor are formal-lsu.b9/f4/f6/f8.
#
#   7. `vstart` appears NOWHERE in rob.scala. spec-lsu.f10/f11/f12 (trap with
#      vstart = 0, restart from the beginning, never resume at k) have no
#      as-built signal to sample on the vector exception path. See their
#      coverage rows.
#
#   8. The vleff fault/trim path is UNREACHABLE as built. VecLsu ties
#      ld_range_agen.io.fault.valid to false.B because VecBeatExpander exposes no
#      fault port at all (VecLsu.scala:993-998 documents this as a high-severity
#      spec defect). Every property over spec-lsu.g1-g4/g9/g10 would therefore
#      have a constant-false antecedent. See those coverage rows.
#
#   9. spec-lsu.b11 ("a load whose active element count exceeds its reservation
#      must be streamed in waves") is NOT implemented: VecElemAgen asserts
#      `emit_ctr < resv_count` (VecElemAgen.scala:331) instead of streaming.
#      formal-lsu.b9 mirrors that bound, so the property passes for exactly the
#      reason the requirement is unmet.
#
#  10. spec-lsu.j3 ("each element access fire must perform the TLB, D$ and LCAM
#      lookups together") does NOT hold literally as built: VecBeatExpander sets
#      uses_lcam only on the first beat of a range and uses_dcache only on a
#      store's write pass. A property asserting the triple would fail on correct
#      RTL, so j3 is ledgered against what the design does do.
#
#  12. THE ENTIRE FAULT-REPORT PATH IS DEAD, not just vleff's. Layer 2 of this
#      pass showed VecElemAgen's four fault properties constant-folding to a
#      false antecedent in BOTH instances: VecLsu ties ld_elem_agen.io.fault and
#      st_elem_agen.io.fault to false.B (VecLsu.scala:999-1002) for the same
#      reason as finding 8 — VecBeatExpander exposes no fault port, so no
#      drain-side fault report exists anywhere. `fault_seen` can therefore never
#      set. spec-lsu.f5, f9 and a10 are consequently ledgered unassertable with
#      this as the reason; formal-lsu.f4/f6 and their covers REMAIN IN THE
#      CHECKER as armed properties that begin checking the moment a fault report
#      is wired, and their covers reading zero is the evidence that it is not.
#
#  11. UN-SPECED OBLIGATION #3 IS NOW PARTLY CLOSED. Pass 1 found that no
#      requirement bounds a written byte by its op's own footprint. On the LOAD
#      side spec-lsu.e20 supplies exactly that obligation at VLEN granularity,
#      and formal-lsu.e8 asserts it (`byte_valid & ~own_bytes == 0`), with
#      formal-lsu.e5 bounding the response's byte offset inside the entry. On the
#      STORE side there is STILL no such requirement: neither group h nor group k
#      bounds a beat's byte_en/vaddr by the range's [base, base+len), and that is
#      the granularity the observed store corruption lives at. Findings 1, 2 and
#      the store half of 3 remain open; 4 and 5 are unchanged.
# =============================================================================

family: lsu
description: >
  Properties for the vector STORE DATA PATH of the unified LSU: the store data
  queues and their reservation, DGEN's VRF read of the source vPRN, the Packer's
  just-in-time beat expansion, and the translate/write two-pass store drain.
  A scoped first pass — see the header for what is deliberately not covered.
reqs_source: src/main/nlhdl/reqs/spec-lsu.yaml
layer: BoomSvaLayer

checkers:
  - name: VecElemQueueChecks
    file: src/main/scala/v4/vec/formal/VecElemQueueChecks.scala
    dut: VecElemQueue
    dut_file: src/main/scala/v4/vec/generated/lsu/VecElemQueue.scala
    signals:
      - { name: enqValid,     expr: "io.enq(0).valid",                    kind: bool }
      - { name: enqInRegion,  expr: "inRegion(io.enq(0).bits.idx)",       kind: bool, internal: true }
      - { name: claimValid,   expr: "io.resv.claim.valid",                kind: bool }
      - { name: claimEntries, expr: "io.resv.claim.bits",                 kind: uint }
      - { name: avail,        expr: "avail_reg",                          kind: uint, internal: true }
      - { name: freeValid,    expr: "io.resv.free.valid",                 kind: bool }
      - { name: freeBase,     expr: "io.resv.free.bits.base",             kind: uint }
      - { name: qHead,        expr: "head",                               kind: uint, internal: true }
      - { name: updateValid,  expr: "io.update.map(_(0).valid).getOrElse(false.B)",                kind: bool }
      - { name: updateInRegion, expr: "io.update.map(u => inRegion(u(0).bits.idx)).getOrElse(false.B)", kind: bool, internal: true }
      - { name: rdReqValid,   expr: "io.rd(0).req.valid",                 kind: bool }
      - { name: rdFilled,     expr: "io.rd(0).resp.filled",               kind: bool }
      # pass 2 additions
      - { name: squashValid,    expr: "io.squash.valid",                      kind: bool }
      - { name: squashLen,      expr: "wrapSub(tail, io.squash.bits)",         kind: uint, internal: true }
      - { name: occRegion,      expr: "wrapSub(tail, head)",                  kind: uint, internal: true }
      - { name: consumeValid,   expr: "io.consume(0).valid",                  kind: bool }
      - { name: consumeInRegion, expr: "inRegion(io.consume(0).bits)",        kind: bool, internal: true }
    notes: >
      ONE definition, SIX instances (ld_SSI_ADDR_Q, st_SSI_ADDR_Q, st_SSI_DATA_Q,
      ld_US_ADDR_Q, st_US_ADDR_Q, st_US_DATA_Q), each a distinct elaborated
      module, so each gets its own bind. `inRegion` is the module's own def and
      `head`/`avail_reg` its own registers, all in scope at the anchor; no port
      was added. `io.update` is None in the four instances without
      hasXlatePass, so formal-lsu.j1 constant-folds in those four and is live
      only in st_SSI_ADDR_Q / st_US_ADDR_Q — which is exactly where the
      translate pass writes back. That fold is a parameterization artifact, not
      a misremembered signal; it is reported, not hidden.

  - name: VecDgenChecks
    file: src/main/scala/v4/vec/formal/VecDgenChecks.scala
    dut: VecDgen
    dut_file: src/main/scala/v4/vec/generated/lsu/VecDgen.scala
    signals:
      - { name: reqResident,  expr: "req_valid",                                 kind: bool, internal: true }
      - { name: killed,       expr: "killed",                                    kind: bool, internal: true }
      - { name: r3ReqValid,   expr: "io.vrf_r3.req.valid",                       kind: bool }
      - { name: outReqValid,  expr: "outReqValid",                               kind: bool, internal: true }
      - { name: r3RespValid,  expr: "io.vrf_r3.resp.valid",                      kind: bool }
      - { name: outReqMbr,    expr: "outReqMbr",                                 kind: uint, internal: true }
      - { name: membersUsed,  expr: "membersUsed",                               kind: uint, internal: true }
      - { name: haveData,     expr: "haveData",                                  kind: bool, internal: true }
      - { name: ssiEnqValid,  expr: "io.ssi_data_enq.valid",                     kind: bool }
      - { name: usEnqValid,   expr: "io.us_data_enq.valid",                      kind: bool }
      - { name: usEnqBytes,   expr: "io.us_data_enq.bits.data.valid_bytes",       kind: uint }
      - { name: vLenBytesLit, expr: "vLenBytes.U",                               kind: uint, internal: true }
      - { name: isLastMbr,    expr: "isLastMbr",                                 kind: bool, internal: true }
    notes: >
      All internals are module-level vals at the end of the body. VecDgen has no
      visibility of the source group's busy bits (that is VecStoreDgenPath's, a
      spec-issue obligation) and its cursor input carries no rob_idx, so the
      "DGEN accepted a cursor stream belonging to a different op" seam is not
      observable here — see the header notes and the report.

  - name: VecBeatExpanderChecks
    file: src/main/scala/v4/vec/formal/VecBeatExpanderChecks.scala
    dut: VecBeatExpander
    dut_file: src/main/scala/v4/vec/generated/lsu/VecBeatExpander.scala
    signals:
      - { name: reqValid,      expr: "io.req(0).valid",           kind: bool }
      - { name: reqByteEn,     expr: "io.req(0).bits.byte_en",    kind: uint }
      - { name: usHeadValid,   expr: "io.us_head.valid",          kind: bool }
      - { name: ssiHeadValid,  expr: "io.ssi_head(0).valid",      kind: bool }
      - { name: cursorWrValid, expr: "io.us_cursor_wr.valid",     kind: bool }
      - { name: cursorWrBits,  expr: "io.us_cursor_wr.bits",      kind: uint }
      - { name: usCursor,      expr: "io.us_cursor",              kind: uint }
      # pass 2 addition
      - { name: reqFire,       expr: "io.req(0).fire",            kind: bool }
    notes: >
      Direction-agnostic only: this module is instantiated once per direction
      and every store-only port is an Option, so a store-gated property would
      constant-fold in the load instance. The store-specific beat properties are
      therefore in VecLsuChecks, on st_beat's ports, where they elaborate once.

  - name: VecRangeAgenChecks
    file: src/main/scala/v4/vec/formal/VecRangeAgenChecks.scala
    dut: VecRangeAgen
    dut_file: src/main/scala/v4/vec/generated/lsu/VecRangeAgen.scala
    signals:
      - { name: rangeValid,   expr: "io.range.valid",       kind: bool }
      - { name: rangeLen,     expr: "io.range.bits.len",    kind: uint }
      - { name: rangeEew,     expr: "io.range.bits.eew",    kind: uint }
      - { name: scalarValid,  expr: "io.scalar.valid",      kind: bool }
      - { name: scalarVl,     expr: "io.scalar.bits.vl",    kind: uint }
      - { name: releaseValid, expr: "io.release.valid",     kind: bool }
      - { name: isWholeReg,   expr: "isWholeReg",           kind: bool, internal: true }
      - { name: isMaskOp,     expr: "isMaskOp",             kind: bool, internal: true }
    notes: >
      Instantiated twice (load/store); every signal above exists in both
      directions, so no property here folds on direction.

  - name: VecQueueReservationChecks
    file: src/main/scala/v4/vec/formal/VecQueueReservationChecks.scala
    dut: VecQueueReservation
    dut_file: src/main/scala/v4/vec/generated/lsu/VecQueueReservation.scala
    signals:
      - { name: laneValid,      expr: "laneValid(0)",                kind: bool, internal: true }
      - { name: laneUsesStq,    expr: "laneUsesStq(0)",              kind: bool, internal: true }
      - { name: laneAddrCount,  expr: "laneCount(0)(0)",             kind: uint, internal: true }
      - { name: laneDataCount,  expr: "laneCount(0)(1)",             kind: uint, internal: true }
      - { name: resvAddrValid,  expr: "io.resv_out(0)(0).valid",     kind: bool }
      - { name: resvDataValid,  expr: "io.resv_out(0)(1).valid",     kind: bool }
      - { name: retireValid,    expr: "io.retire.valid",             kind: bool }
      - { name: retireRowValid, expr: "io.retire_row_valid",         kind: bool }
      # pass 2 additions
      - { name: occSsiAddr,   expr: "occ(0)",                                            kind: uint, internal: true }
      - { name: ssiDepthLit,  expr: "qDepth(0).U",                                       kind: uint, internal: true }
      - { name: ldCapLit,     expr: "ldResvCapTbl(io.dis_uops(0).bits.v_eew.get)",        kind: uint, internal: true }
    notes: >
      OBSERVABILITY GAP (reported): the per-lane worst-case count, the access
      class (isUSClass), and every per-row slot field are loop-local vals or
      table reads inside a `for`, so they are NOT in scope at the end of the
      module body. Only lane 0's module-level Wire(Vec) entries can be reached.
      spec-lsu.b19's "full worst case" therefore cannot be compared against the
      granted count without adding a DUT signal, which is forbidden.

  - name: VecLsuChecks
    file: src/main/scala/v4/vec/formal/VecLsuChecks.scala
    dut: VecLsu
    dut_file: src/main/scala/v4/vec/generated/lsu/VecLsu.scala
    signals:
      - { name: stUsWritePass,   expr: "stUsWritePass",                          kind: bool, internal: true }
      - { name: stSsiPass2Prev,  expr: "stSsiDoPass2Prev",                       kind: bool, internal: true }
      - { name: stUsCursorWrValid, expr: "st_beat.io.us_cursor_wr.valid",        kind: bool, internal: true }
      - { name: stUsCursorWrBits,  expr: "st_beat.io.us_cursor_wr.bits",         kind: uint, internal: true }
      - { name: stUsTotalElems,  expr: "stUsTotalElems",                         kind: uint, internal: true }
      - { name: stUsUpdateValid, expr: "st_US_ADDR_Q.io.update.get(0).valid",    kind: bool, internal: true }
      - { name: stBeatReqValid,  expr: "st_beat.io.req(0).valid",                kind: bool, internal: true }
      - { name: stBeatUsHead,    expr: "st_beat.io.us_head.valid",               kind: bool, internal: true }
      - { name: stBeatSsiHead,   expr: "st_beat.io.ssi_head(0).valid",           kind: bool, internal: true }
      - { name: stBeatWritePass, expr: "st_beat.io.is_write_pass.get",           kind: bool, internal: true }
      - { name: stUsDataValid,   expr: "st_beat.io.st_us_data.get.valid",        kind: bool, internal: true }
      - { name: stUsDataPop,     expr: "st_beat.io.st_us_data_pop.get",          kind: bool, internal: true }
      - { name: stSsiDataValid,  expr: "st_beat.io.st_ssi_data.get(0).valid",    kind: bool, internal: true }
      - { name: dgenReqValid,    expr: "dgen.io.req.valid",                      kind: bool, internal: true }
      - { name: dgenReqRobIdx,   expr: "dgen.io.req.bits.uop.rob_idx",           kind: uint, internal: true }
      - { name: issStRobIdx,     expr: "io.iss_st.bits.rob_idx",                 kind: uint }
      # pass 2 additions
      - { name: issStAgen,        expr: "issStAgen",                                                 kind: bool, internal: true }
      - { name: stRowTargetValid, expr: "stRows(GetRealLSQIdx(io.iss_st.bits.stq_idx)).valid",        kind: bool, internal: true }
      - { name: gcopyLaunchValid, expr: "gcopy.io.launch.valid",                                     kind: bool, internal: true }
      - { name: ldLcbTrigger,     expr: "ldLcbTrigger",                                              kind: bool, internal: true }
    notes: >
      Every `internal: true` entry above is either a module-level val of VecLsu
      or a port of one of its child instances, all in scope at the end of the
      body. Child-instance ports are used deliberately: the store-only halves of
      VecBeatExpander are Options, so binding them in the child would fold in
      the load instance (see VecBeatExpanderChecks notes).
      RECONCILIATION (gen pass): `stUsStagedValid` was dropped from this list
      after the coder reported it unused. It is the same signal as
      `stBeatUsHead` (VecLsu drives st_beat.io.us_head.valid := stUsStagedValid),
      so every property that needed it already reads it through the child port.
      The coder was right; the ledger changed, not the code.

  # ==== pass 2: the rest of the family ======================================

  - name: VecDcacheArbiterChecks
    file: src/main/scala/v4/vec/formal/VecDcacheArbiterChecks.scala
    dut: VecDcacheArbiter
    dut_file: src/main/scala/v4/vec/generated/lsu/VecDcacheArbiter.scala
    signals:
      - { name: ldReqValid,  expr: "io.ld_req(0).valid",              kind: bool }
      - { name: ldReqDcache, expr: "io.ld_req(0).bits.uses_dcache",   kind: bool }
      - { name: ldWins,      expr: "ldWins(0)",                       kind: bool, internal: true }
      - { name: stWins,      expr: "stWins(0)",                       kind: bool, internal: true }
      - { name: ldWinsElev,  expr: "ldWinsElevated(0)",               kind: bool, internal: true }
      - { name: stWinsElev,  expr: "stWinsElevated(0)",               kind: bool, internal: true }
      - { name: ldEligible,  expr: "ldEligible(0)",                   kind: bool, internal: true }
      - { name: vecFireValid, expr: "io.vec_fire(0).valid",           kind: bool }
      - { name: claimTlb,    expr: "io.vec_claim(0).tlb",             kind: bool }
      - { name: claimDcache, expr: "io.vec_claim(0).dcache",          kind: bool }
      - { name: claimLcam,   expr: "io.vec_claim(0).lcam",            kind: bool }
      - { name: availDcache, expr: "io.scalar_avail(0).dcache",       kind: bool }
      - { name: rrPtr,       expr: "rr_ptr",                          kind: uint, internal: true }
      - { name: blockedLd,   expr: "blocked_ld",                      kind: bool, internal: true }
      - { name: dmemReady,   expr: "io.dmem_req_ready(0)",            kind: bool }
      - { name: lcbFree,     expr: "io.lcb_free_count",               kind: uint }
    notes: >
      Lane 0 only: lsuWidth is 1 on MediumBoomV4VectorConfig, so any reference to
      lane 1 would not elaborate there. That is why spec-lsu.h7's two-lane clause
      is ledgered partial rather than asserted. Every internal signal is a
      module-level Wire(Vec)/Reg; `resourceOk`'s per-lane results (ldOkDefault,
      ldOkElevated, ...) are loop-local vals and deliberately NOT in this list.

  - name: VecLoadCoalescingBufferChecks
    file: src/main/scala/v4/vec/formal/VecLoadCoalescingBufferChecks.scala
    dut: VecLoadCoalescingBuffer
    dut_file: src/main/scala/v4/vec/generated/lsu/VecLoadCoalescingBuffer.scala
    signals:
      - { name: respValid,        expr: "respRegValid(0)",                                      kind: bool, internal: true }
      - { name: respDstByte,      expr: "respRegBits(0).dst_byte",                              kind: uint, internal: true }
      - { name: hitVec,           expr: "VecInit(hitMatrix(0)).asUInt",                         kind: uint, internal: true }
      - { name: vLenBytesLit,     expr: "vLenBytes.U",                                          kind: uint, internal: true }
      - { name: e0Valid,          expr: "entries(0).valid",                                     kind: bool, internal: true }
      - { name: e0Prn,            expr: "entries(0).prn",                                       kind: uint, internal: true }
      - { name: e0LdqIdx,         expr: "entries(0).ldq_idx",                                   kind: uint, internal: true }
      - { name: e0ByteValid,      expr: "entries(0).byte_valid",                                kind: uint, internal: true }
      - { name: e0OwnBytes,       expr: "entries(0).own_bytes",                                 kind: uint, internal: true }
      - { name: e0ActiveBytes,    expr: "entries(0).active_bytes",                              kind: uint, internal: true }
      - { name: e1Valid,          expr: "entries(1).valid",                                     kind: bool, internal: true }
      - { name: e1Prn,            expr: "entries(1).prn",                                       kind: uint, internal: true }
      - { name: e1LdqIdx,         expr: "entries(1).ldq_idx",                                   kind: uint, internal: true }
      - { name: killHere0,        expr: "killHere(0)",                                          kind: bool, internal: true }
      - { name: wrValid,          expr: "io.vrf_write(0).valid",                                kind: bool }
      - { name: wrMask,           expr: "io.vrf_write(0).bits.mask",                            kind: uint }
      - { name: wrWritten,        expr: "entries(OHToUInt(writeSel(0))).written",               kind: bool, internal: true }
      - { name: wrActiveCovered,  expr: "activeCovered(OHToUInt(writeSel(0)))",                  kind: bool, internal: true }
      - { name: wrPreloadPending, expr: "entries(OHToUInt(writeSel(0))).preload_pending",       kind: bool, internal: true }
      - { name: wrActiveBytes,    expr: "entries(OHToUInt(writeSel(0))).active_bytes",          kind: uint, internal: true }
      - { name: wrKilled,         expr: "killHere(OHToUInt(writeSel(0)))",                      kind: bool, internal: true }
      - { name: staleReqValid,    expr: "io.stale_req.valid",                                   kind: bool }
      - { name: preloadUndisturbed, expr: "entries(preloadIdx).undisturbed",                    kind: bool, internal: true }
      - { name: groupDoneValid,   expr: "io.group_done.valid",                                  kind: bool }
      - { name: groupDoneMembers, expr: "io.group_done.bits.members",                           kind: uint }
      - { name: winnerActiveCovered, expr: "activeCovered(winnerIdx)",                          kind: bool, internal: true }
      - { name: groupCountWinner, expr: "groupCount(winnerIdx)",                                kind: uint, internal: true }
      - { name: pvdestAtWinnerMember, expr: "io.group_done.bits.pvdest(entries(winnerIdx).member_idx)", kind: uint }
      - { name: winnerPrn,        expr: "entries(winnerIdx).prn",                               kind: uint, internal: true }
      - { name: elemDoneValid,    expr: "io.elem_done(0).valid",                                kind: bool }
      - { name: elemDoneNelem,    expr: "io.elem_done(0).bits.nelem",                           kind: uint }
      - { name: vlWbValid,        expr: "io.vl_wb.valid",                                       kind: bool }
    notes: >
      `writeSel` is a Seq of one-hot UInts and `OHToUInt(writeSel(0))` names the
      entry the W0 write is about to target, so the four `wr*` signals are that
      entry's own fields. `entries`, `killHere`, `activeCovered`, `groupCount`,
      `preloadIdx`, `winnerIdx`, `respRegValid/Bits` and `hitMatrix` are all
      module-level vals at the end of the body; nothing was added to reach them.
      Entries 0 and 1 are sampled by name for the pairwise no-duplicate-PRN
      property: lcbEntries is required >= maxVecMembers (8), so both exist.
      NOTE FOR THE READER: VecLsu currently allocates every LCB entry with
      active_bytes = all ones, inactive_bytes = 0 and undisturbed = false
      (VecLsu.scala:964-969, a documented simplification), so the undisturbed
      pre-load path is unexercised in this configuration and formal-lsu.e14/e17's
      covers are expected to read zero. That is reported, not hidden.

  - name: VecSquashUnitChecks
    file: src/main/scala/v4/vec/formal/VecSquashUnitChecks.scala
    dut: VecSquashUnit
    dut_file: src/main/scala/v4/vec/generated/lsu/VecSquashUnit.scala
    signals:
      - { name: branch,        expr: "branch",                        kind: bool, internal: true }
      - { name: flush,         expr: "flush",                         kind: bool, internal: true }
      - { name: rollbackLdq,   expr: "io.resv_rollback.bits.ldq_idx",  kind: uint }
      - { name: brLdqIdx,      expr: "io.brupdate.b2.uop.ldq_idx",     kind: uint }
      - { name: killLdq,       expr: "io.kill_ldq",                    kind: uint }
      - { name: kill0,         expr: "io.kill(0)",                     kind: bool }
      - { name: killUop0Valid, expr: "io.kill_uop(0).valid",           kind: bool }

  - name: VecGroupCopyChecks
    file: src/main/scala/v4/vec/formal/VecGroupCopyChecks.scala
    dut: VecGroupCopy
    dut_file: src/main/scala/v4/vec/generated/lsu/VecGroupCopy.scala
    signals:
      - { name: needCopy,      expr: "needCopy",                  kind: bool, internal: true }
      - { name: noCopyFire,    expr: "noCopyFire",                kind: bool, internal: true }
      - { name: noCopyValid,   expr: "noCopyValid",               kind: bool, internal: true }
      - { name: vlZero,        expr: "io.launch.bits.vl_zero",    kind: bool }
      - { name: allInactive,   expr: "io.launch.bits.all_inactive", kind: bool }
      - { name: gcFlush,       expr: "io.flush",                  kind: bool }
      - { name: w0Granted,     expr: "w0Granted",                 kind: bool, internal: true }
      - { name: stageBDst,     expr: "stageBDst",                 kind: uint, internal: true }
      - { name: stageBSrc,     expr: "stageBSrc",                 kind: uint, internal: true }
      - { name: copyDoneValid, expr: "copyDoneValid",             kind: bool, internal: true }
      - { name: groupDoneValid, expr: "io.group_done.valid",      kind: bool }
      - { name: lcbR2Valid,    expr: "io.lcb_r2_req.valid",       kind: bool }
      - { name: lcbR2Bits,     expr: "io.lcb_r2_req.bits",        kind: uint }
      - { name: vrfR2Bits,     expr: "io.vrf_r2_req.bits",        kind: uint }
      - { name: lcbW0Valid,    expr: "io.lcb_w0.valid",           kind: bool }
      - { name: lcbW0Addr,     expr: "io.lcb_w0.bits.addr",       kind: uint }
      - { name: vrfW0Addr,     expr: "io.vrf_w0.bits.addr",       kind: uint }
      - { name: vrfW0Mask,     expr: "io.vrf_w0.bits.mask",       kind: uint }
      - { name: allOnesMask,   expr: "allOnesMask",               kind: uint, internal: true }

  - name: VecElemAgenChecks
    file: src/main/scala/v4/vec/formal/VecElemAgenChecks.scala
    dut: VecElemAgen
    dut_file: src/main/scala/v4/vec/generated/lsu/VecElemAgen.scala
    signals:
      - { name: pushValid, expr: "pushValid",         kind: bool, internal: true }
      - { name: pushFire,  expr: "io.addr_enq.fire",  kind: bool }
      - { name: emitCtr,   expr: "emit_ctr",          kind: uint, internal: true }
      - { name: resvCount, expr: "resv_count",        kind: uint, internal: true }
      - { name: newFault,  expr: "newFault",          kind: bool, internal: true }
      - { name: faultSeen, expr: "fault_seen",        kind: bool, internal: true }
    notes: >
      Instantiated twice (isStore false/true); every signal above exists in both
      directions. The real per-element cursor of this design lives here
      (elem_ptr/emit_ctr/fault_seen/fault_elem), not in MicroOp's dead
      v_elem_cursor — see header finding 6.

  - name: LSUChecks
    file: src/main/scala/v4/vec/formal/LSUChecks.scala
    dut: LSU
    dut_file: src/main/scala/v4/lsu/lsu.scala
    signals:
      - { name: stqExecEnqValid, expr: "stq_execute_queue.io.enq.valid", kind: bool, internal: true }
      - { name: stqEnqCommitted, expr: "stq_enq_e.bits.committed",       kind: bool, internal: true }
      - { name: stqEnqIsAmo,     expr: "stq_enq_e.bits.uop.is_amo",      kind: bool, internal: true }
      - { name: stqEnqAddrValid, expr: "stq_enq_e.bits.addr.valid",      kind: bool, internal: true }
      - { name: stqEnqDataValid, expr: "stq_enq_e.bits.data.valid",      kind: bool, internal: true }
    notes: >
      THE ONE SHARED SCALAR FILE TOUCHED BY THIS FAMILY. src/main/scala/v4/lsu/
      lsu.scala is `mode: edit_existing` in hierarchy.yaml and elaborates for
      NON-VECTOR BOOM configs too, so every signal above is deliberately one that
      exists unconditionally: no `usingRVV`-gated Option and no `.get`. Reaching
      for io.core.lsu_vec.get or uop.is_vec.get here would break every scalar
      config in the tree. The anchor goes at the end of `class LSU`'s body only.

assertions:

  # ---- group b: store retention and the program-order reservation ------------

  - id: formal-lsu.b1
    checker: VecElemQueueChecks
    label: vec_elem_queue_enq_in_reserved_region
    kind: assert
    reqs: [spec-lsu.b6, spec-lsu.d11]
    statement: >
      A fill presented to an element queue must target an entry inside the
      queue's currently occupied (reserved) region.
    property: >
      enqValid |-> enqInRegion
    reachability: formal-lsu.b2
    notes: >
      `ready` is `inRegion && !filled`, so this is a check on the PRODUCER: an
      agen or DGEN presenting an index outside the op's reserved footprint is
      the queue-granular form of "a store wrote outside its own footprint".

  - id: formal-lsu.b2
    checker: VecElemQueueChecks
    label: vec_elem_queue_enq_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.b1
    statement: >
      A fill is presented to an element queue.
    property: >
      enqValid

  - id: formal-lsu.b3
    checker: VecElemQueueChecks
    label: vec_elem_queue_free_base_is_head
    kind: assert
    reqs: [spec-lsu.b7, spec-lsu.d8]
    statement: >
      A region free must start at the queue's head, so a store's retained
      entries are released only as the whole head region at commit-drain.
    property: >
      freeValid |-> Sequence.BoolSequence(freeBase === qHead)
    reachability: formal-lsu.b4
    notes: >
      The free base comes from VecQueueReservation's row bookkeeping and the
      head from the queue's own pointer — two independently maintained cones.
      A mismatch frees somebody else's entries mid-instruction.

  - id: formal-lsu.b4
    checker: VecElemQueueChecks
    label: vec_elem_queue_free_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.b3
    statement: >
      A queue region is freed at retire.
    property: >
      freeValid

  - id: formal-lsu.b5
    checker: VecQueueReservationChecks
    label: vec_resv_store_count_nonzero
    kind: assert
    reqs: [spec-lsu.b19]
    statement: >
      A dispatching vector store must request a non-zero number of entries in
      both its address and its data queue.
    property: >
      (laneValid && laneUsesStq) |-> Sequence.BoolSequence((laneAddrCount =/= 0.U) && (laneDataCount =/= 0.U))
    reachability: formal-lsu.b6
    notes: >
      VL is unknown at dispatch, so the store must reserve worst case; the
      checkable clause here is only that the request is non-empty. The worst-case
      VALUE is loop-local and unreachable at the anchor — see the checker note.

  - id: formal-lsu.b6
    checker: VecQueueReservationChecks
    label: vec_resv_store_dispatch_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.b5
    statement: >
      A vector store is presented at dispatch lane 0.
    property: >
      laneValid && laneUsesStq

  - id: formal-lsu.b7
    checker: VecQueueReservationChecks
    label: vec_resv_retire_row_live
    kind: assert
    reqs: [spec-lsu.b4, spec-lsu.b5]
    statement: >
      Capacity may be reclaimed only against a reservation row that was actually
      claimed at dispatch.
    property: >
      retireValid |-> retireRowValid
    reachability: formal-lsu.b8
    notes: >
      The head-side half of "reserved in program order at dispatch, never
      claimed opportunistically at execute": the retire walk is driven by
      ldq_head/stq_head in VecLsu, so retiring against an empty row means the
      program-order correspondence between the LSQ and the reservation table has
      broken.

  - id: formal-lsu.b8
    checker: VecQueueReservationChecks
    label: vec_resv_retire_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.b7
    statement: >
      A reservation retire is presented.
    property: >
      retireValid

  # ---- group c: the unit-stride range and the just-in-time Packer ------------

  - id: formal-lsu.c1
    checker: VecBeatExpanderChecks
    label: vec_beat_expander_beat_needs_head
    kind: assert
    reqs: [spec-lsu.c5]
    statement: >
      The Packer must present a D$ access only while a queue entry is staged for
      it to expand.
    property: >
      reqValid |-> Sequence.BoolSequence(usHeadValid || ssiHeadValid)
    reachability: formal-lsu.c2

  - id: formal-lsu.c2
    checker: VecBeatExpanderChecks
    label: vec_beat_expander_beat_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.c1
    statement: >
      The beat expander presents a D$ access on lane 0.
    property: >
      reqValid

  - id: formal-lsu.c3
    checker: VecBeatExpanderChecks
    label: vec_beat_expander_cursor_advances
    kind: assert
    reqs: [spec-lsu.c6]
    statement: >
      A just-in-time expansion step must advance the element cursor.
    property: >
      cursorWrValid |-> Sequence.BoolSequence(cursorWrBits > usCursor)
    reachability: formal-lsu.c4
    notes: >
      A cursor write that does not advance is the just-in-time expansion failing
      to make progress — the shape of the observed store hang.

  - id: formal-lsu.c4
    checker: VecBeatExpanderChecks
    label: vec_beat_expander_cursor_write_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.c3
    statement: >
      The expander writes back an advanced element cursor.
    property: >
      cursorWrValid

  - id: formal-lsu.c5
    checker: VecRangeAgenChecks
    label: vec_range_agen_one_range_per_activation
    kind: assert
    reqs: [spec-lsu.c3]
    statement: >
      A unit-stride access must push only a single range entry: the push must not
      persist into the following cycle.
    property: >
      rangeValid |=> Sequence.BoolSequence(!rangeValid)
    reachability: formal-lsu.c6
    notes: >
      VecRangeAgen is stateless and pushes whenever io.req.valid holds, so a
      two-cycle activation pulse in VecLsu would push the same range twice into
      one reserved slot.

  - id: formal-lsu.c6
    checker: VecRangeAgenChecks
    label: vec_range_agen_range_push_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.c5
    statement: >
      A range entry is pushed.
    property: >
      rangeValid

  - id: formal-lsu.c7
    checker: VecRangeAgenChecks
    label: vec_range_agen_len_is_vl_times_eew
    kind: assert
    reqs: [spec-lsu.c4]
    statement: >
      For a plain unit-stride access the pushed range must describe exactly
      VL * EEW bytes.
    property: >
      (rangeValid && !isWholeReg && !isMaskOp) |-> Sequence.BoolSequence((rangeLen >> rangeEew) === scalarVl)
    reachability: formal-lsu.c8

  - id: formal-lsu.c8
    checker: VecRangeAgenChecks
    label: vec_range_agen_us_range_push_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.c7
    statement: >
      A plain unit-stride (not whole-register, not mask) range is pushed.
    property: >
      rangeValid && !isWholeReg && !isMaskOp

  # ---- group d: the store data queues ---------------------------------------

  - id: formal-lsu.d1
    checker: VecElemQueueChecks
    label: vec_elem_queue_claim_fits_avail
    kind: assert
    reqs: [spec-lsu.d13]
    statement: >
      A dispatch-time claim presented to a queue must fit in that queue's
      available capacity.
    property: >
      claimValid |-> Sequence.BoolSequence(claimEntries <= avail)
    reachability: formal-lsu.d2
    notes: >
      The queue-side half of "reserves capacity in BOTH queues or does not
      dispatch": if a claim can exceed avail then dispatch went ahead without the
      capacity it claimed.

  - id: formal-lsu.d2
    checker: VecElemQueueChecks
    label: vec_elem_queue_claim_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.d1
    statement: >
      A claim is presented to an element queue.
    property: >
      claimValid

  - id: formal-lsu.d3
    checker: VecDgenChecks
    label: vec_dgen_r3_read_only_while_resident
    kind: assert
    reqs: [spec-lsu.d9, spec-lsu.d10]
    statement: >
      DGEN must issue a VRF R3 read only while its store is resident and
      unkilled.
    property: >
      r3ReqValid |-> Sequence.BoolSequence(reqResident && !killed)
    reachability: formal-lsu.d4
    notes: >
      This is the condition that makes "the source vPRN needs no pin" safe: the
      capture window is inside the op's own residency, so a read can never land
      after the group was reclaimed to the free list.

  - id: formal-lsu.d4
    checker: VecDgenChecks
    label: vec_dgen_r3_read_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.d3
    statement: >
      DGEN issues a VRF R3 read.
    property: >
      r3ReqValid

  - id: formal-lsu.d5
    checker: VecDgenChecks
    label: vec_dgen_r3_resp_member_in_range
    kind: assert
    reqs: [spec-lsu.d7]
    statement: >
      An R3 read response consumed by DGEN must belong to a group member inside
      the op's used-member count.
    property: >
      (outReqValid && r3RespValid) |-> Sequence.BoolSequence(outReqMbr < membersUsed)
    reachability: formal-lsu.d6

  - id: formal-lsu.d6
    checker: VecDgenChecks
    label: vec_dgen_r3_resp_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.d5
    statement: >
      An outstanding R3 read returns.
    property: >
      outReqValid && r3RespValid

  - id: formal-lsu.d7
    checker: VecDgenChecks
    label: vec_dgen_enq_data_from_vrf_read
    kind: assert
    reqs: [spec-lsu.d7]
    statement: >
      DGEN must not enqueue store data unless the member's VRF read data is
      buffered.
    property: >
      Sequence.BoolSequence(ssiEnqValid || usEnqValid) |-> haveData
    reachability: formal-lsu.d8

  - id: formal-lsu.d8
    checker: VecDgenChecks
    label: vec_dgen_data_enq_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.d7
    statement: >
      DGEN enqueues store data into one of the two data queues.
    property: >
      ssiEnqValid || usEnqValid

  - id: formal-lsu.d9
    checker: VecDgenChecks
    label: vec_dgen_us_push_is_whole_member
    kind: assert
    reqs: [spec-lsu.d5]
    statement: >
      Every unit-stride store data push must carry a whole VLEN-wide member,
      except the op's final (possibly partial) member.
    property: >
      usEnqValid |-> Sequence.BoolSequence((usEnqBytes === vLenBytesLit) || isLastMbr)
    reachability: formal-lsu.d10
    notes: >
      "Reads its entire source vPRN in one access" stated on the push side. A
      short non-final push is the phantom/partial-member bug class.

  - id: formal-lsu.d10
    checker: VecDgenChecks
    label: vec_dgen_us_push_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.d9
    statement: >
      A unit-stride store data push occurs.
    property: >
      usEnqValid

  - id: formal-lsu.d11
    checker: VecQueueReservationChecks
    label: vec_resv_store_claims_both_queues
    kind: assert
    reqs: [spec-lsu.d12, spec-lsu.d13]
    statement: >
      A granted vector store reservation must claim its data-queue slot in the
      same cycle it claims its address-queue slot.
    property: >
      (resvAddrValid && laneUsesStq) |-> resvDataValid
    reachability: formal-lsu.d12

  - id: formal-lsu.d12
    checker: VecQueueReservationChecks
    label: vec_resv_store_grant_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.d11
    statement: >
      A vector store's address-queue reservation is granted.
    property: >
      resvAddrValid && laneUsesStq

  - id: formal-lsu.d13
    checker: VecLsuChecks
    label: vec_lsu_st_us_write_beat_has_data
    kind: assert
    reqs: [spec-lsu.d6, spec-lsu.j10]
    statement: >
      A unit-stride store write-pass beat must not leave the expander before its
      st_US_DATA_Q read has landed.
    property: >
      (stBeatReqValid && stBeatUsHead && stUsWritePass) |-> stUsDataValid
    reachability: formal-lsu.d14
    notes: >
      The data-queue read has a cycle of latency, so a beat composed before it
      lands sends stale bytes to the D$ silently. The SSI lane can drive the same
      req port without the US data gate, which is how this can fail.

  - id: formal-lsu.d14
    checker: VecLsuChecks
    label: vec_lsu_st_us_write_beat_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.d13
    statement: >
      A unit-stride store write-pass beat is presented.
    property: >
      stBeatReqValid && stBeatUsHead && stUsWritePass

  - id: formal-lsu.d15
    checker: VecLsuChecks
    label: vec_lsu_st_us_data_pop_only_on_write_pass
    kind: assert
    reqs: [spec-lsu.d8]
    statement: >
      The unit-stride store data queue must be popped only on the write pass, so
      the data is held until the post-commit drain.
    property: >
      stUsDataPop |-> Sequence.BoolSequence(stUsWritePass)
    reachability: formal-lsu.d16

  - id: formal-lsu.d16
    checker: VecLsuChecks
    label: vec_lsu_st_us_data_pop_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.d15
    statement: >
      A unit-stride store data queue entry is popped.
    property: >
      stUsDataPop

  - id: formal-lsu.d17
    checker: VecLsuChecks
    label: vec_lsu_dgen_request_matches_granted_store
    kind: assert
    reqs: [spec-lsu.d7]
    statement: >
      The uop DGEN reads its source vPRN from must be the same instruction as the
      store the issue unit granted the DGEN pass to.
    property: >
      dgenReqValid |-> Sequence.BoolSequence(dgenReqRobIdx === issStRobIdx)
    reachability: formal-lsu.d18
    notes: >
      dgen.io.req.bits.uop comes from the held st_opnd output while
      dgen.io.req.valid comes from the DGEN grant — two independent cones. A
      mismatch means the store data is read from another instruction's pvs3.

  - id: formal-lsu.d18
    checker: VecLsuChecks
    label: vec_lsu_dgen_grant_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.d17
    statement: >
      A DGEN pass is granted to VecDgen.
    property: >
      dgenReqValid

  # ---- group j: the vector store algorithm ----------------------------------

  - id: formal-lsu.j1
    checker: VecElemQueueChecks
    label: vec_elem_queue_xlate_update_in_region
    kind: assert
    reqs: [spec-lsu.j8]
    statement: >
      A translate-pass write-back must target an entry inside the queue's
      occupied region.
    property: >
      updateValid |-> updateInRegion
    reachability: formal-lsu.j2
    notes: >
      A physical address written back outside the occupied region has translated
      an entry this store no longer owns — the pre-commit translation did not
      land on the entry the write pass will drain.

  - id: formal-lsu.j2
    checker: VecElemQueueChecks
    label: vec_elem_queue_xlate_update_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.j1
    statement: >
      A translate-pass write-back is presented to a store address queue.
    property: >
      updateValid

  - id: formal-lsu.j3
    checker: VecElemQueueChecks
    label: vec_elem_queue_no_filled_resp_without_req
    kind: assert
    reqs: [spec-lsu.j10]
    statement: >
      A queue must not report a filled read response for a cycle in which no
      read was requested.
    property: >
      Sequence.BoolSequence(!rdReqValid) |=> Sequence.BoolSequence(!rdFilled)
    reachability: formal-lsu.j4
    notes: >
      The drain takes store data from the data queue's read port, and treats
      `filled` as "this data is real". A filled response for an unasked read
      would let the drain use whatever the read port happened to hold.

  - id: formal-lsu.j4
    checker: VecElemQueueChecks
    label: vec_elem_queue_rd_idle_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.j3
    statement: >
      The queue's drain read port is idle for a cycle.
    property: >
      !rdReqValid

  - id: formal-lsu.j5
    checker: VecRangeAgenChecks
    label: vec_range_agen_release_needs_vl
    kind: assert
    reqs: [spec-lsu.j6]
    statement: >
      The surplus-reservation release must be presented only while the resolved
      VL operand bundle is valid.
    property: >
      releaseValid |-> scalarValid
    reachability: formal-lsu.j6
    notes: >
      "The surplus is released at execute once VL is read from the VL RF" — the
      release count is computed from io.scalar.bits.vl, so releasing while that
      bundle is invalid trims against a stale VL.

  - id: formal-lsu.j6
    checker: VecRangeAgenChecks
    label: vec_range_agen_release_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.j5
    statement: >
      A surplus release is presented to the reservation unit.
    property: >
      releaseValid

  - id: formal-lsu.j7
    checker: VecLsuChecks
    label: vec_lsu_pass_state_agrees_across_classes
    kind: assert
    reqs: [spec-lsu.j7, spec-lsu.j9]
    statement: >
      When a unit-stride and an SSI store entry are staged in the same cycle,
      their pass states must agree, because both classes share one
      is_write_pass port.
    property: >
      Sequence.BoolSequence(stBeatUsHead && stBeatSsiHead) |-> Sequence.BoolSequence(stUsWritePass === stSsiPass2Prev)
    reachability: formal-lsu.j8
    notes: >
      is_write_pass is Mux(stUsStagedValid, stUsWritePass, stSsiDoPass2Prev), so
      a staged US entry forces its own pass state onto a co-staged SSI beat. If
      they disagree, either an uncommitted store's beat performs the D$ write
      (violating j9's commit gate) or a committed store's beat performs only the
      translate pass and never writes.

  - id: formal-lsu.j8
    checker: VecLsuChecks
    label: vec_lsu_both_classes_staged_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.j7
    statement: >
      A unit-stride store entry and an SSI store entry are staged in the same
      cycle.
    property: >
      stBeatUsHead && stBeatSsiHead

  - id: formal-lsu.j9
    checker: VecLsuChecks
    label: vec_lsu_st_us_paddr_writeback_before_write_pass
    kind: assert
    reqs: [spec-lsu.j8]
    statement: >
      The unit-stride store's translated-address write-back must land before the
      write pass starts.
    property: >
      stUsUpdateValid |-> Sequence.BoolSequence(!stUsWritePass)
    reachability: formal-lsu.j10
    notes: >
      The write-back is RegNext-delayed off the first beat's translate fire. For
      a single-beat range the pass flips in the same cycle the write-back lands,
      so the write pass composes its beat from the untranslated base. Invisible
      under an identity page mapping, wrong under any real one.

  - id: formal-lsu.j10
    checker: VecLsuChecks
    label: vec_lsu_st_us_paddr_writeback_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.j9
    statement: >
      A translated address is written back into the unit-stride store's range
      entry.
    property: >
      stUsUpdateValid

  - id: formal-lsu.j11
    checker: VecLsuChecks
    label: vec_lsu_st_us_write_pass_follows_translate
    kind: assert
    reqs: [spec-lsu.j8, spec-lsu.j11]
    statement: >
      Completing the translate pass over a unit-stride store's range must enter
      the write pass on the next cycle.
    property: >
      Sequence.BoolSequence(stUsCursorWrValid && !stUsWritePass && (stUsCursorWrBits >= stUsTotalElems)) |=> stUsWritePass
    reachability: formal-lsu.j12
    notes: >
      The two-pass drain is the whole of "pre-commit translation of the whole
      active element range": if translate completion does not hand over to the
      write pass, the store never writes memory at all.

  - id: formal-lsu.j12
    checker: VecLsuChecks
    label: vec_lsu_st_us_translate_complete_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.j11
    statement: >
      A unit-stride store's translate pass reaches the end of its range.
    property: >
      stUsCursorWrValid && !stUsWritePass && (stUsCursorWrBits >= stUsTotalElems)

  - id: formal-lsu.j13
    checker: VecLsuChecks
    label: vec_lsu_st_ssi_write_beat_has_data
    kind: assert
    reqs: [spec-lsu.j10]
    statement: >
      An SSI store write-pass beat must not leave the expander before its
      st_SSI_DATA_Q read has landed.
    property: >
      Sequence.BoolSequence(stBeatReqValid && stBeatSsiHead && !stBeatUsHead && stBeatWritePass) |-> stSsiDataValid
    reachability: formal-lsu.j14
    notes: >
      The SSI store lane's fire condition is ssi_head.valid && lcb credit only —
      unlike the unit-stride lane it does NOT consult its data queue's staged
      validity. If this fires, an SSI store is writing whatever the data read
      port held.

  - id: formal-lsu.j14
    checker: VecLsuChecks
    label: vec_lsu_st_ssi_write_beat_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.j13
    statement: >
      An SSI store write-pass beat is presented with no unit-stride entry
      staged.
    property: >
      stBeatReqValid && stBeatSsiHead && !stBeatUsHead && stBeatWritePass

  # ---- group k: the Packer's byte coalescing --------------------------------

  - id: formal-lsu.k1
    checker: VecBeatExpanderChecks
    label: vec_beat_expander_beat_has_enabled_bytes
    kind: assert
    reqs: [spec-lsu.k8]
    statement: >
      Every D$ access the Packer presents must enable at least one byte.
    property: >
      reqValid |-> Sequence.BoolSequence(reqByteEn =/= 0.U)
    reachability: formal-lsu.c2
    notes: >
      byte_en is derived from the coalesced run length and the address
      alignment; a zero mask is a beat that writes nothing, which for a store is
      silent data loss rather than a hang.

  # ==========================================================================
  # ==== pass 2 assertions ===================================================
  # ==========================================================================

  # ---- group a: the unified LSU ---------------------------------------------

  - id: formal-lsu.a1
    checker: LSUChecks
    label: lsu_stq_execute_enq_has_addr_and_data
    kind: assert
    reqs: [spec-lsu.a6]
    statement: >
      An entry may only be handed to the store-execute queue once both its
      address and its data are marked present.
    property: >
      stqExecEnqValid |-> Sequence.BoolSequence(stqEnqAddrValid && stqEnqDataValid)
    reachability: formal-lsu.a2
    notes: >
      For a VECTOR store those two flags are set by VecLsu's st_pass_done rather
      than by a uop payload, which is the substance of a6: the entry becomes
      drainable off the separate queues' progress, not off its own uop.

  - id: formal-lsu.a2
    checker: LSUChecks
    label: lsu_stq_execute_enq_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.a1
    statement: >
      An entry is enqueued into the store-execute queue.
    property: >
      stqExecEnqValid

  - id: formal-lsu.a3
    checker: VecLsuChecks
    label: vec_lsu_store_grant_into_free_pending_row
    kind: assert
    reqs: [spec-lsu.a8, spec-lsu.a9]
    statement: >
      A store's AGEN grant must land in a pending-descriptor row that is not
      already occupied.
    property: >
      issStAgen |-> Sequence.BoolSequence(!stRowTargetValid)
    reachability: formal-lsu.a4
    notes: >
      One row per STQ index, so a second grant into a live row is exactly another
      op interleaving at that entry while it drains.

  - id: formal-lsu.a4
    checker: VecLsuChecks
    label: vec_lsu_store_agen_grant_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.a3
    statement: >
      A vector store's AGEN pass is granted.
    property: >
      issStAgen

  # ---- group b: the element queues and the reservation (pass 2 half) --------

  - id: formal-lsu.b9
    checker: VecElemAgenChecks
    label: vec_elem_agen_emit_within_reservation
    kind: assert
    reqs: [spec-lsu.b11, spec-lsu.j1]
    statement: >
      Every element address the stage-1 agen emits must fall inside the
      reservation it claimed at dispatch.
    property: >
      pushValid |-> Sequence.BoolSequence(emitCtr < resvCount)
    reachability: formal-lsu.b10

  - id: formal-lsu.b10
    checker: VecElemAgenChecks
    label: vec_elem_agen_emit_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.b9
    statement: >
      The element agen presents an element address.
    property: >
      pushValid

  - id: formal-lsu.b11
    checker: VecQueueReservationChecks
    label: vec_resv_occupancy_within_depth
    kind: assert
    reqs: [spec-lsu.b14, spec-lsu.b15]
    statement: >
      A queue's reserved occupancy must never exceed its depth.
    property: >
      Sequence.BoolSequence(occSsiAddr <= ssiDepthLit)
    notes: >
      Bare invariant, no antecedent, so no reachability cover. Occupancy is what
      bounds in-flight vector memory ops; an occupancy above the depth is the
      accounting failure behind the ssi-queues deadlock.

  - id: formal-lsu.b12
    checker: VecQueueReservationChecks
    label: vec_resv_load_count_within_cap
    kind: assert
    reqs: [spec-lsu.b18]
    statement: >
