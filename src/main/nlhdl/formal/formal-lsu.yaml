      inactive lanes is not checked, and note that VecLsu currently allocates
      every entry with inactive_bytes = 0 (VecLsu.scala:964-969), so the
      inactive-lane path is unexercised in this configuration.
  - req: spec-lsu.e9
    assertions: [formal-lsu.e14]
    partial: >
      Checks that an entry with an outstanding pre-load is never written. That
      the pre-load DATA comes from stale_pvdest on R2 is the stale_req/stale_resp
      wiring; a property would re-read the same port. Unexercised in this config
