  # --- group j (the store half of the load/store algorithms) -----------------
  - req: spec-lsu.j6
    assertions: [formal-lsu.j5]
    partial: >
      Checks that the release is presented only with a valid resolved-VL bundle.
      The released COUNT (reserved minus used) is computed from loop-local row
      fields inside VecQueueReservation and cannot be compared at the anchor.
  - req: spec-lsu.j7
    assertions: [formal-lsu.j7]
    partial: >
      Checks the pass-state agreement that keeps the execute pass from turning
      into a D$ write (the failure this requirement guards). The positive clause
      — that the execute pass performs TLB and LCAM — cannot be asserted:
      uses_dcache is literally `is_write_pass` and uses_tlb is literally
      `true.B` in VecBeatExpander, so both properties constant-fold.
  - req: spec-lsu.j8
    assertions: [formal-lsu.j9, formal-lsu.j11, formal-lsu.j1]
    partial: >
      Checks that translation write-backs land before the write pass starts, in
      the right entry, and that translate completion hands over to the write
      pass. Not checked: that EVERY active element was translated — the drain
      keeps no per-element translated count and the `xlated` bitmap has no
      reader (see spec-lsu.b9).
  - req: spec-lsu.j9
    assertions: [formal-lsu.j7]
    partial: >
      Owned by the scalar LSU (src/main/scala/v4/lsu/lsu.scala) in
      hierarchy.yaml; no anchor was placed there in this pass. What is checked
      is the vector-side consequence: the shared pass state must not let an
      uncommitted store's beat take the write pass. The direct commit gate
      (stUsStagedValid folds in stUsCommitted) cannot be asserted without
      restating the staging expression, and the SSI per-lane commit compare is
      loop-local.
  - req: spec-lsu.j10
    assertions: [formal-lsu.j13, formal-lsu.d13, formal-lsu.j3]
    partial: >
      Checks that a beat of either class only leaves with its own data queue's
      staged read valid, and that the queue never reports a filled response for
      an unasked read. Which of the two queues supplies the data is selected by
      access class in a direct Mux and folds.
  - req: spec-lsu.j11
    assertions: [formal-lsu.j11]
    partial: >
      "Identical to scalar stores other than the vector queue drains and the
      pre-commit translation of the whole active element range" is a
      provenance/equivalence claim over two code paths. Only the named
      difference — the two-pass translate/write drain — is asserted here; the
      "identical otherwise" half is a review obligation, not a property.

  # --- group k (only the Packer's byte coalescing is in scope) ---------------
  - req: spec-lsu.k8
    assertions: [formal-lsu.k1]
    partial: >
      Checks that every presented beat enables at least one byte. That the run
      is MAXIMAL up to the lane width (the coalescing being as wide as it could
      be) is a performance clause with no failure signature the checker can see;
      the minBytes reduction that computes it would have to be re-implemented in
      the property to compare against.

  # ==========================================================================
  # ==== pass 2 coverage: groups a, e, f, g, h, i, l, m and the remainders ====
  # ==========================================================================

  # --- group a: the unified LSU (structure and provenance, mostly) -----------
  - req: spec-lsu.a1
    unassertable: >
      Structure/provenance: "the LSU must extend the BOOM load/store unit to
      support scalar and vector". Discharged by src/main/scala/v4/lsu/lsu.scala
      being the BOOM v4 LSU with the vector hooks added in place (LSUCoreIO gains
      lsu_vec/vec_lsu_empty under usingRVV) rather than a second unit. No signal
      distinguishes "extended" from "replaced".
  - req: spec-lsu.a2
    unassertable: >
      Provenance claim about the source, not about any signal: "with usingRVV
      disabled the underlying BOOM LSU is untouched". Enforced by the gate-(f)
      diff flow (a usingRVV=false elaboration must be bit-identical to the
      rebaselined manifest), which is where a regression here would be caught.
      The Scala shape that makes it true is that every vector addition in
      lsu.scala sits behind `if (usingRVV)` or an Option port.
  - req: spec-lsu.a3
    unassertable: >
      Structure: "with usingRVV enabled the vector address and data queues must
      be initialized". An elaboration-time fact — VecLsu instantiates the six
      VecElemQueues unconditionally and VecLsu itself `require(usingRVV)`s. There
      is no runtime signal for "was initialized".
  - req: spec-lsu.a4
    unassertable: >
      Structure: one LDQ/STQ entry per vector OP.v. Discharged by dispatch
      allocating exactly one entry (the placeholder) and by VecLsu keeping the
      cracked element accesses in its own queues; the absence of extra LSQ
      allocations cannot be sampled.
  - req: spec-lsu.a5
    unassertable: >
      Structure: separate address and data queues exist to buffer the effective
      nOP.v operations. Six named VecElemQueue instances in VecLsu.scala; a
      "these exist" obligation has no runtime property (schema.md §5.2).
  - req: spec-lsu.a6
    assertions: [formal-lsu.a1]
    partial: >
      Checks that an entry only becomes drainable once its address and data are
      both marked present, which for a vector store is what VecLsu's st_pass_done
      signals off the separate queues. That the values THEMSELVES come from the
      queues rather than a uop payload is a data-path fact in lsu.scala's
      stq_addr/stq_data write, not observable at the enq handshake.
  - req: spec-lsu.a7
    unassertable: >
      Equivalence claim: "the conditions that allow a vector entry to become
      eligible to drain are the same as scalar". The as-built shares one
      expression (canEnqStoreExecuteScalar) between both, so the claim is
      discharged by the code being common, not by a property; a property could
      only restate the shared expression.
  - req: spec-lsu.a8
    assertions: [formal-lsu.a3]
    partial: >
      Checks the atomicity precondition — a store's grant never lands in a
      pending row that is still occupied, so one op owns the entry while it
      drains. That the drain covers ALL of its element accesses is the agen's
      completion accounting (formal-lsu.b9, and VecDgen's total-bytes asserts).
  - req: spec-lsu.a9
    assertions: [formal-lsu.a3]
    partial: >
      The no-interleaving half of the same obligation. Only the AGEN-grant path
      is checked; the DGEN pass shares the row by construction (VecLsu drives
      dgen off the same descriptor).
  - req: spec-lsu.a10
    unassertable: >
      The LSU-side half ("a faulting walk stops emitting") is formal-lsu.f6,
      which per header finding 12 has a constant-false antecedent because no
      fault report reaches the agen; the architectural half (the ROB not
      committing) is spec-rob's and per finding 7 has no vstart write to observe.
      Neither half is checkable today, so this row claims nothing.
  - req: spec-lsu.a11
    assertions: [formal-lsu.h1]
    partial: >
      Checks that element accesses go through the arbiter's single-grant-per-lane
      contract. That EVERY element access is routed through the arbiter (rather
      than some bypass) is structural: VecLsu wires both beat expanders only to
      arb.
  - req: spec-lsu.a12
    unassertable: >
      Configuration structure, owned by BoomConfigMixins: Large/Mega set
      lsuWidth = 2. Discharged at elaboration, and cross-checked by
      `require((dcacheArbiterMode == "single" && lsuWidth == 1) || ...)` in both
      VecLsu and VecDcacheArbiter.
  - req: spec-lsu.a13
    unassertable: >
      Structure: the queues are 2 x nOP.v wide on those configs. A parameter
      obligation discharged by the same `require` pair as spec-lsu.a12 plus the
      queuePorts = lsuWidth wiring; not a runtime property.
  - req: spec-lsu.a14
    unassertable: >
      Naming convention ({ld,st}_{SSI,US}_{ADDR,DATA}_Q). The names are Scala
      instance names and the queueName string passed to each VecElemQueue; a
      naming obligation has no signal at all.
  - req: spec-lsu.a15
    unassertable: >
      Structure: the queue SET is exactly those six. Discharged by VecQueueId's
      enumeration (and `require(nQueues == queueEnum.length)` in VecSquashUnit,
      which fails if the set changes size) plus the six instances in VecLsu.

  # --- group b: the remaining SSI-queue and reservation requirements ---------
  - req: spec-lsu.b1
    unassertable: >
      Structure/content: the SSI queues hold effective addresses for strided,
      indexed and segmented accesses. Discharged by the queue payload type — the
      SSI address queues are sized to (new VecElemAccess).getWidth and the agen
      enqueues that bundle. A property could only re-read the same field.
  - req: spec-lsu.b2
    unassertable: >
      Parameter default (512 entries), owned by VectorParams. An elaboration
      fact; the depth appears in the emitted RTL only as an address width.
  - req: spec-lsu.b3
    unassertable: >
      Wiring fact: the SSI address queues' enq ports are driven by
      ld_elem_agen/st_elem_agen in VecLsu.scala:582-590. Nothing sampled at the
      queue can tell which module drives its input.
  - req: spec-lsu.b10
    assertions: [formal-lsu.k2]
    partial: >
      Checks the streaming mechanism a load uses to complete without gating on
      commit: entries are consumed (freed) from inside the occupied region as the
      drain advances, which stores never do. That completion is via the LCB
      rather than commit is checked on the LCB side by formal-lsu.e18/e20.
  - req: spec-lsu.b11
    assertions: [formal-lsu.b9]
    partial: >
