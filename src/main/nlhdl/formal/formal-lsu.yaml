    property: >
      Sequence.BoolSequence(ldReqValid && (lcbFree === 0.U)) |-> Sequence.BoolSequence(!ldWins)
    reachability: formal-lsu.e4

  - id: formal-lsu.e4
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_load_pending_without_credit_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.e3
    statement: >
