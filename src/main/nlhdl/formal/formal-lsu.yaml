    reachability: formal-lsu.b13
    notes: >
      The upper half of min(worstCase, cap). The other half (never MORE than
      worstCase) is the same table lookup and would fold.

  - id: formal-lsu.b13
    checker: VecQueueReservationChecks
    label: vec_resv_load_dispatch_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.b12
    statement: >
