      write waits for the pre-load) is formal-lsu.e14.
  - req: spec-lsu.e13
    assertions: [formal-lsu.e20]
    partial: >
      Checks that the count the LCB owns agrees with the group size it reports.
      That the count is OWNED here rather than elsewhere is structural.
  - req: spec-lsu.e14
    assertions: [formal-lsu.e20]
  - req: spec-lsu.e15
    assertions: [formal-lsu.e18]
    partial: >
      Checks that a group-done is not emitted while the winning member is still
      incomplete. "Exactly one group-done per group" is enforced by the entries
      freeing in the same event (freeThisGroup) and is not separately asserted.
  - req: spec-lsu.e16
    assertions: [formal-lsu.e21]
  - req: spec-lsu.e17
    unassertable: >
      Absence of a mechanism: there is no per-PRN ROB writeback port on the LCB's
      interface to sample. The positive counterpart — one group-done carrying the
      whole member vector — is formal-lsu.e18/e20/e21.
  - req: spec-lsu.e18
    unassertable: >
      Absence of a mechanism, as spec-lsu.e17: no per-PRN wakeup port exists.
      Vector wakeup rides the group-done only.
  - req: spec-lsu.e19
    assertions: [formal-lsu.e13]
    partial: >
      Checks that each entry produces exactly one VRF write, which is what makes
