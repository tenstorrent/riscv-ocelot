  - req: spec-lsu.e4
    assertions: [formal-lsu.e7]
    partial: >
      Checks that a returning element lands in at most one assembly entry. That
      it lands at the RIGHT byte offset is formal-lsu.e5 (bounded) and
      formal-lsu.e8 (inside own_bytes); the exact placement expression would fold.
  - req: spec-lsu.e5
    assertions: [formal-lsu.e5]
    partial: >
      Checks that the carried offset lands inside the entry. That the offset was
      DERIVED from the element index is a provenance fact about the nOP.v the
