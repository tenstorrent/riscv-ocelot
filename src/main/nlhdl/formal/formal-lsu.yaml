      property therefore holds precisely because the requirement is unmet; it will
      fire the day a load legitimately needs a second wave.
  - req: spec-lsu.b14
    assertions: [formal-lsu.b11]
  - req: spec-lsu.b15
    assertions: [formal-lsu.b11]
    partial: >
      Checks the occupancy bound that produces the in-flight limit. The specific
