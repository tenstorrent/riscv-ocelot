  - id: formal-lsu.e5
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_resp_byte_offset_in_entry
    kind: assert
    reqs: [spec-lsu.e5]
    statement: >
      A returning element's destination byte offset must lie inside the
      VLEN-wide assembly entry.
    property: >
      respValid |-> Sequence.BoolSequence(respDstByte < vLenBytesLit)
    reachability: formal-lsu.e6
    notes: >
      The offset is derived from the element index carried on the nOP.v; an
      offset at or beyond VLEN/8 is a write past the destination register.

  - id: formal-lsu.e6
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_resp_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.e5
    statement: >
      An element response is presented to the LCB.
    property: >
      respValid

  - id: formal-lsu.e7
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_resp_matches_at_most_one_entry
    kind: assert
    reqs: [spec-lsu.e4]
    statement: >
      A returning element must match at most one assembly entry.
    property: >
      respValid |-> Sequence.BoolSequence(PopCount(hitVec) <= 1.U)
    reachability: formal-lsu.e6

  - id: formal-lsu.e8
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_byte_valid_within_own_bytes
    kind: assert
    reqs: [spec-lsu.e20]
    statement: >
      No byte outside an entry's own footprint may ever be marked valid.
    property: >
      e0Valid |-> Sequence.BoolSequence((e0ByteValid & ~e0OwnBytes) === 0.U)
    reachability: formal-lsu.e9
    notes: >
      The byte-valid bitmap is bounded by the AGEN-selected active set. This is
      the load-side form of the footprint bound that pass 1 found missing on the
      store side (header finding 11).

  - id: formal-lsu.e9
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_entry_live_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.e8
    statement: >
      LCB entry 0 is live.
    property: >
      e0Valid

  - id: formal-lsu.e10
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_active_within_own_bytes
    kind: assert
    reqs: [spec-lsu.e21, spec-lsu.e22, spec-lsu.e23]
    statement: >
      An entry's active-byte set must stay inside the footprint it was allocated
      with.
    property: >
      e0Valid |-> Sequence.BoolSequence((e0ActiveBytes & ~e0OwnBytes) === 0.U)
    reachability: formal-lsu.e9
    notes: >
      The LCB never re-derives which elements are active: active_bytes arrives at
      allocation and only shrinks (on a vleff trim). A byte becoming active that
      the AGEN never selected would be a masked-off element counted as
      outstanding.

  - id: formal-lsu.e11
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_write_needs_active_bytes_present
    kind: assert
    reqs: [spec-lsu.e6]
    statement: >
      The VRF write for a destination PRN must not issue until all of that
      entry's active bytes are present.
    property: >
      wrValid |-> wrActiveCovered
    reachability: formal-lsu.e12

  - id: formal-lsu.e12
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_vrf_write_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.e11
    statement: >
      The LCB issues a VRF write on W0.
    property: >
      wrValid

  - id: formal-lsu.e13
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_write_only_once_per_entry
    kind: assert
    reqs: [spec-lsu.e19]
    statement: >
      An assembly entry must not be written to the VRF twice.
    property: >
      wrValid |-> Sequence.BoolSequence(!wrWritten)
    reachability: formal-lsu.e12
    notes: >
      One W0 write per destination PRN: the intermediate write is visible only to
      the register file precisely because there is exactly one of them.

  - id: formal-lsu.e14
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_write_after_preload
    kind: assert
    reqs: [spec-lsu.e9, spec-lsu.e10]
    statement: >
      An entry with an outstanding undisturbed pre-load must not be written to
      the VRF.
    property: >
      wrValid |-> Sequence.BoolSequence(!wrPreloadPending)
    reachability: formal-lsu.e12

  - id: formal-lsu.e15
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_write_mask_covers_active
    kind: assert
    reqs: [spec-lsu.e8]
    statement: >
      The VRF write mask must cover every active byte of the entry.
    property: >
      wrValid |-> Sequence.BoolSequence((wrMask & wrActiveBytes) === wrActiveBytes)
    reachability: formal-lsu.e12
    notes: >
      The mask is own_bytes = active | inactive, so a mask that fails to cover
      active means the inactive-lane accounting has diverged and the single write
      would leave stale bytes.

  - id: formal-lsu.e16
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_preload_only_undisturbed
    kind: assert
    reqs: [spec-lsu.e11]
    statement: >
      Only an entry marked undisturbed may request a stale_pvdest pre-load.
    property: >
      staleReqValid |-> preloadUndisturbed
    reachability: formal-lsu.e17

  - id: formal-lsu.e17
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_preload_request_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.e16
    statement: >
      The LCB requests a stale_pvdest pre-load on R2.
    property: >
      staleReqValid

  - id: formal-lsu.e18
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_group_done_last_member_complete
    kind: assert
    reqs: [spec-lsu.e15]
