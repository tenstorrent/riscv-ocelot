      parameter, not a separate runtime fact.
  - req: spec-lsu.b16
    unassertable: >
      Minimum-depth floor (>= VLEN elements per element-granular queue) — a
      compile-time obligation. FINDING: the only depth `require` in VecElemQueue
      is isPow2(entries); I found no elaboration check tying ssiQueueEntries to
      the VLEN-element floor. A `require(entries >= vecVLen)` on the three
      element-granular instances would discharge b16/b17 properly.
  - req: spec-lsu.b17
    unassertable: >
      "The minimum-depth floor must be checked at elaboration" — a claim about a
      `require` existing, which is exactly what the previous row reports is
      missing. Untaggable as SVA either way.
  - req: spec-lsu.b18
    assertions: [formal-lsu.b12]

  # --- group c: the remaining unit-stride queue requirement ------------------
  - req: spec-lsu.c2
    unassertable: >
      Structure: a separate ld_US_ADDR_Q and st_US_ADDR_Q hold the unit-stride
      transactions. Two named instances in VecLsu.scala; "these exist" has no
      runtime property.

  # --- group e: the load coalescing buffer -----------------------------------
  - req: spec-lsu.e1
    unassertable: >
      Structure: an LCB exists in front of the VRF write port. Discharged by
      VecLoadCoalescingBuffer being instantiated in VecLsu and owning W0; every
      functional consequence is checked by the e-group properties below.
  - req: spec-lsu.e2
    assertions: [formal-lsu.e22]
    partial: >
      Checks the one-entry-per-destination-PRN invariant on the entry pair 0/1.
      Entry WIDTH being a full VLEN is a type fact (LcbEntry.data is vecVLen
      wide), and the pairwise sample does not cover all lcbEntries pairs — a full
      pairwise reduction would build a large comparator tree inside the bind.
  - req: spec-lsu.e3
    unassertable: >
      Parameterizability of the entry count: a Scala parameter (lcbEntries) with
