  - req: spec-lsu.e10
    assertions: [formal-lsu.e14]
  - req: spec-lsu.e11
    assertions: [formal-lsu.e16]
    partial: >
      Checks that only an undisturbed entry requests a pre-load. The "only
      members that actually contain inactive lanes" clause is the
      inactive_bytes.orR half of allocPreloadPending, which folds against the
