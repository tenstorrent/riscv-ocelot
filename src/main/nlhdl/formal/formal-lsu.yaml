  - req: spec-lsu.e6
    assertions: [formal-lsu.e11]
    partial: >
      Checks the "all active bytes present" precondition. The "single write on
      W0" clause is formal-lsu.e13.
  - req: spec-lsu.e8
    assertions: [formal-lsu.e15]
    partial: >
      Checks that the write mask covers every active byte, so the single write
