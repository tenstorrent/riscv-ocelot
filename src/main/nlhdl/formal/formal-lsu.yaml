    property: >
      pushFire |=> Sequence.BoolSequence(emitCtr =/= 0.U)
    reachability: formal-lsu.f9

  - id: formal-lsu.f9
    checker: VecElemAgenChecks
    label: vec_elem_agen_push_fire_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.f8
    statement: >
      An element address is accepted into the address queue.
    property: >
      pushFire

  # ---- group g: fault-only-first (only the VL producer half is reachable) ----

  - id: formal-lsu.g1
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_vl_wb_with_group_done
    kind: assert
    reqs: [spec-lsu.g7, spec-lsu.g6]
    statement: >
      A vleff VL write-back must ride the same completion event as the group-done
      that carries it onto the wakeup network.
    property: >
      vlWbValid |-> groupDoneValid
    reachability: formal-lsu.g2

  - id: formal-lsu.g2
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_vl_wb_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.g1
    statement: >
      The LCB writes back a trimmed VL.
    property: >
      vlWbValid

  # ---- group h: D$, LCAM and TLB arbitration --------------------------------

  - id: formal-lsu.h1
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_lane_exclusive
    kind: assert
    reqs: [spec-lsu.h1, spec-lsu.k5, spec-lsu.a11]
    statement: >
      A D$ lane must never be granted to the load drain and the store drain in
      the same cycle.
    property: >
      Sequence.BoolSequence(!(ldWins && stWins))
    notes: >
      Bare invariant, no antecedent, so no reachability cover. This is what makes
      the lane carry at most one element per cycle, and it is the shared-lane
      contract every element access goes through.

  - id: formal-lsu.h2
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_rr_pointer_rotates
    kind: assert
    reqs: [spec-lsu.h3]
    statement: >
      The round-robin phase pointer must advance every cycle.
    property: >
      Sequence.BoolSequence(rrPtr === 0.U) |=> Sequence.BoolSequence(rrPtr === 1.U)
    reachability: formal-lsu.h3
    notes: >
      KNOWN FALSE POSITIVE — DO NOT TRUST A FAILURE OF THIS PROPERTY AT 783 ns.
      Layer 3 fired it once per run at exactly 783000ps -> 785000ps in all three
      tests, including the two that PASS, and never again in ~1450 enabled
      cycles. 783 ns is the first cycle after the boom tile's reset domain
      releases (the first 391 of 1843 sampled cycles are disabled), and
      VecDcacheArbiter.sv:842-863 both RANDOMIZEs rr_ptr at time 0 and resets it
      synchronously, so the first enabled sample straddles the reset release.
      The property text is exactly as planned — firtool bound the consequent to
      the DUT's own `_elevateLoad_T` (`rr_ptr == 2'h1`) wire, so there is no CSE
      hazard and no tautology — but the OBLIGATION needs a steady-state
      qualification (e.g. require one prior observed rotation) before a failure
      of it means anything. NOT weakened here: that is the RTL/spec owner's
      call, and a silent relaxation would hide the next real rotation stall.

  - id: formal-lsu.h3
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_phase_zero_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.h2
    statement: >
      The arbiter is in round-robin phase 0.
    property: >
      rrPtr === 0.U

  - id: formal-lsu.h4
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_default_grant_respects_scalar
    kind: assert
    reqs: [spec-lsu.h4]
    statement: >
      Outside an elevation phase a vector load may only take the D$ if the scalar
      side left it available.
    property: >
      Sequence.BoolSequence(ldWins && !ldWinsElev && ldReqDcache) |-> availDcache
    reachability: formal-lsu.h5
    notes: >
      The priority floor: scalar memory ops outrank vector drains except in the
      anti-starvation phase.

  - id: formal-lsu.h5
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_default_load_dcache_grant_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.h4
    statement: >
      A load grant takes the D$ outside an elevation phase.
    property: >
      ldWins && !ldWinsElev && ldReqDcache

  - id: formal-lsu.h6
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_elevation_grants_blocked_load
    kind: assert
    reqs: [spec-lsu.h6]
    statement: >
      In its elevation phase a blocked, eligible load drain whose D$ is ready
      must be granted.
    property: >
      Sequence.BoolSequence((rrPtr === 1.U) && blockedLd && ldEligible && (!ldReqDcache || dmemReady)) |-> ldWins
    reachability: formal-lsu.h7
    notes: >
      The mechanism behind the every-4-cycles bound: phase 1 belongs to a blocked
      load and ignores scalar availability.

  - id: formal-lsu.h7
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_load_elevation_phase_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.h6
    statement: >
      A blocked, eligible load reaches its elevation phase.
    property: >
      (rrPtr === 1.U) && blockedLd && ldEligible

  - id: formal-lsu.h8
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_claim_only_on_elevation
    kind: assert
    reqs: [spec-lsu.h9, spec-lsu.h5, spec-lsu.h11]
    statement: >
      The vector side may claim a shared TLB, D$ or LCAM port only as part of an
      elevation grant.
    property: >
      Sequence.BoolSequence(claimTlb || claimDcache || claimLcam) |-> Sequence.BoolSequence(ldWinsElev || stWinsElev)
    reachability: formal-lsu.h9
    notes: >
      One policy for all three resources, and the reason a vector burst cannot
      indefinitely hold any of them: outside elevation the vector side takes only
      what scalar left free and claims nothing.

  - id: formal-lsu.h9
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_resource_claim_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.h8
    statement: >
      The vector side claims a shared resource.
    property: >
      claimTlb || claimDcache || claimLcam

  - id: formal-lsu.h10
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_claim_only_in_elevation_phase
    kind: assert
    reqs: [spec-lsu.h10]
    statement: >
      A shared-resource claim may only occur in one of the two elevation phases,
      so all three resources return to scalar on the round-robin boundary.
    property: >
      Sequence.BoolSequence(claimTlb || claimDcache || claimLcam) |-> Sequence.BoolSequence((rrPtr === 1.U) || (rrPtr === 2.U))
    reachability: formal-lsu.h9

  - id: formal-lsu.h11
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_grant_presents_fire
    kind: assert
    reqs: [spec-lsu.h8, spec-lsu.h7]
    statement: >
      A granted lane must present a fire in the same cycle, so no granted
      bandwidth is left unused.
    property: >
      Sequence.BoolSequence(ldWins || stWins) |-> vecFireValid
    reachability: formal-lsu.h12

  - id: formal-lsu.h12
    checker: VecDcacheArbiterChecks
    label: vec_dcache_arb_any_grant_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.h11
    statement: >
      The arbiter grants a lane to either drain.
    property: >
      ldWins || stWins

  # ---- group i: squash by pointer rollback ----------------------------------

  - id: formal-lsu.i1
    checker: VecSquashUnitChecks
    label: vec_squash_branch_pivot_is_branch_ldq
    kind: assert
    reqs: [spec-lsu.i2]
    statement: >
      On a mispredict the rollback pivot must be the branch's own LDQ index.
    property: >
      branch |-> Sequence.BoolSequence(rollbackLdq === brLdqIdx)
    reachability: formal-lsu.i2
    notes: >
      Rolling back to anything else either strands surviving reservations or
      frees entries a younger-than-the-branch op still owns.

  - id: formal-lsu.i2
    checker: VecSquashUnitChecks
    label: vec_squash_branch_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.i1
    statement: >
      A branch mispredict squashes the vector LSU.
    property: >
      branch

  - id: formal-lsu.i3
    checker: VecSquashUnitChecks
    label: vec_squash_no_kill_without_event
    kind: assert
    reqs: [spec-lsu.i7]
    statement: >
      No LCB entry may be invalidated except on a branch or flush event.
    property: >
      Sequence.BoolSequence(!branch && !flush) |-> Sequence.BoolSequence(killLdq === 0.U)
    reachability: formal-lsu.i4

  - id: formal-lsu.i4
    checker: VecSquashUnitChecks
    label: vec_squash_quiet_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.i3
    statement: >
      A cycle with neither a branch squash nor a flush.
    property: >
      !branch && !flush

  - id: formal-lsu.i5
    checker: VecSquashUnitChecks
    label: vec_squash_flush_kills_every_entry
    kind: assert
    reqs: [spec-lsu.i4]
    statement: >
      A flush must kill every LDQ index in one event.
    property: >
      flush |-> Sequence.BoolSequence(killLdq.andR)
    reachability: formal-lsu.i6
    notes: >
      One event, no per-entry compare: the kill vector is produced whole rather
      than walked.

  - id: formal-lsu.i6
    checker: VecSquashUnitChecks
    label: vec_squash_flush_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.i5
    statement: >
      A ROB flush squashes the vector LSU.
    property: >
      flush

  - id: formal-lsu.i7
    checker: VecSquashUnitChecks
    label: vec_squash_kill_requires_uop
    kind: assert
    reqs: [spec-lsu.i6]
    statement: >
      A per-stage kill must not be raised for a client with no uop in flight.
    property: >
      kill0 |-> killUop0Valid
    reachability: formal-lsu.i8

  - id: formal-lsu.i8
    checker: VecSquashUnitChecks
    label: vec_squash_stage_kill_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.i7
    statement: >
      A pipeline stage is killed.
    property: >
      kill0

  - id: formal-lsu.i9
    checker: VecElemQueueChecks
    label: vec_elem_queue_squash_within_region
    kind: assert
    reqs: [spec-lsu.i3, spec-lsu.i5]
    statement: >
      A squash must roll the tail back to a point inside the queue's occupied
      region.
    property: >
      squashValid |-> Sequence.BoolSequence(squashLen <= occRegion)
    reachability: formal-lsu.i10
    notes: >
      The occupied region is program-ordered, so a rollback beyond it would move
      the tail past the head and release reservations that were never claimed by
      the killed ops.

  - id: formal-lsu.i10
    checker: VecElemQueueChecks
    label: vec_elem_queue_squash_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.i9
    statement: >
      A queue is squashed by pointer rollback.
    property: >
      squashValid

  # ---- group j: the load half of the algorithms -----------------------------

  - id: formal-lsu.j15
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_elem_done_nonzero_elements
    kind: assert
    reqs: [spec-lsu.j4]
    statement: >
      An elem_done report must account for at least one element.
    property: >
      elemDoneValid |-> Sequence.BoolSequence(elemDoneNelem =/= 0.U)
    reachability: formal-lsu.j16
    notes: >
      elem_done advances the entry's progress; a zero-element report is progress
      that never happened, which stalls the drain.

  - id: formal-lsu.j16
    checker: VecLoadCoalescingBufferChecks
    label: vec_lcb_elem_done_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.j15
    statement: >
      The LCB reports an element as done.
    property: >
      elemDoneValid

  - id: formal-lsu.j17
    checker: LSUChecks
    label: lsu_stq_execute_enq_is_committed
    kind: assert
    reqs: [spec-lsu.j9]
    statement: >
      A store becomes eligible to drain to the store-execute queue only once it
      is committed.
    property: >
      stqExecEnqValid |-> Sequence.BoolSequence(stqEnqCommitted || stqEnqIsAmo)
    reachability: formal-lsu.a2
    notes: >
      The AMO disjunct is the pre-existing scalar exemption in
      can_enq_store_execute, not a weakening added here.

  - id: formal-lsu.j18
    checker: VecBeatExpanderChecks
    label: vec_beat_expander_us_beat_advances_cursor
    kind: assert
    reqs: [spec-lsu.j2]
    statement: >
      A granted beat generated from a unit-stride range entry must advance that
      range's element cursor.
    property: >
      Sequence.BoolSequence(reqFire && usHeadValid && !ssiHeadValid) |-> cursorWrValid
    reachability: formal-lsu.j19
    notes: >
      The stage-2 Packer runs over the single US nOP.v; a granted beat that does
      not move the cursor re-sends the same element for ever.

  - id: formal-lsu.j19
    checker: VecBeatExpanderChecks
    label: vec_beat_expander_us_beat_granted_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.j18
    statement: >
      A unit-stride beat is granted with no SSI entry staged.
    property: >
      reqFire && usHeadValid && !ssiHeadValid

  # ---- group k: the bandwidth ceiling --------------------------------------

  - id: formal-lsu.k2
    checker: VecElemQueueChecks
    label: vec_elem_queue_consume_in_region
    kind: assert
    reqs: [spec-lsu.k7, spec-lsu.b10]
    statement: >
      A drain consume must name an entry inside the queue's occupied region.
    property: >
      consumeValid |-> consumeInRegion
    reachability: formal-lsu.k3
    notes: >
      One element per granted lane, freed from the region it was filled into. A
      consume outside the region frees an entry the queue does not own, which is
      how a streamed load loses a wave.

  - id: formal-lsu.k3
    checker: VecElemQueueChecks
    label: vec_elem_queue_consume_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.k2
    statement: >
      A queue entry is consumed by the drain.
    property: >
      consumeValid

  # ---- group m: the VL == 0 group copy --------------------------------------

  - id: formal-lsu.m1
    checker: VecGroupCopyChecks
    label: vec_gcopy_copy_only_for_no_execution
    kind: assert
    reqs: [spec-lsu.m12, spec-lsu.m3]
    statement: >
      A standalone group copy may only be started for a VL = 0 or fully-inactive
      op.
    property: >
      needCopy |-> Sequence.BoolSequence(vlZero || allInactive)
    reachability: formal-lsu.m2
    notes: >
      The copy is the mechanism that makes a freshly-renamed pvdest group
      architecturally correct when nothing executes; starting one for an
      executing op would race the real write.

  - id: formal-lsu.m2
    checker: VecGroupCopyChecks
    label: vec_gcopy_copy_start_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.m1
    statement: >
      A group copy is started.
    property: >
      needCopy

  - id: formal-lsu.m3
    checker: VecGroupCopyChecks
    label: vec_gcopy_member_copy_between_distinct_prns
    kind: assert
    reqs: [spec-lsu.m5]
    statement: >
      Each member write of a group copy must move data between two distinct
      physical registers.
    property: >
      w0Granted |-> Sequence.BoolSequence(stageBDst =/= stageBSrc)
    reachability: formal-lsu.m4
    notes: >
      pvdest and stale_pvdest are different physical groups by construction; a
      member copying onto itself means the rename pairing has collapsed and the
      old value was never actually preserved.

  - id: formal-lsu.m4
    checker: VecGroupCopyChecks
    label: vec_gcopy_member_write_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.m3
    statement: >
      A group-copy member write is granted W0.
    property: >
      w0Granted

  - id: formal-lsu.m5
    checker: VecGroupCopyChecks
    label: vec_gcopy_single_group_done
    kind: assert
    reqs: [spec-lsu.m8]
    statement: >
      The copy path and the no-copy path must never present a group-done in the
      same cycle.
    property: >
      groupDoneValid |-> Sequence.BoolSequence(!(noCopyValid && copyDoneValid))
    reachability: formal-lsu.m6
    notes: >
      One group_done port: two completions colliding in one cycle silently lose
      one instruction's completion, which hangs the ROB.

  - id: formal-lsu.m6
    checker: VecGroupCopyChecks
    label: vec_gcopy_group_done_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.m5
    statement: >
      The group copy unit emits a group-done.
    property: >
      groupDoneValid

  - id: formal-lsu.m7
    checker: VecGroupCopyChecks
    label: vec_gcopy_no_copy_path_completes_next_cycle
    kind: assert
    reqs: [spec-lsu.m9, spec-lsu.m10]
    statement: >
      An unflushed no-copy launch must present its group-done on the next cycle.
    property: >
      Sequence.BoolSequence(noCopyFire && !gcFlush) |=> noCopyValid
    reachability: formal-lsu.m8
    notes: >
      Tail-agnostic VL = 0 takes the complete-without-execute path and emits
      immediately; the !flush guard is required because a flush retires the ROB
      entry this pulse would clear.

  - id: formal-lsu.m8
    checker: VecGroupCopyChecks
    label: vec_gcopy_no_copy_launch_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.m7
    statement: >
      A no-copy (tail-agnostic or shared) launch fires.
    property: >
      noCopyFire && !gcFlush

  - id: formal-lsu.m9
    checker: VecGroupCopyChecks
    label: vec_gcopy_lcb_wins_r2
    kind: assert
    reqs: [spec-lsu.m13]
    statement: >
      When the LCB requests VRF read port R2 the port must carry the LCB's
      address, not the group copy's.
    property: >
      lcbR2Valid |-> Sequence.BoolSequence(vrfR2Bits === lcbR2Bits)
    reachability: formal-lsu.m10

  - id: formal-lsu.m10
    checker: VecGroupCopyChecks
    label: vec_gcopy_lcb_r2_request_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.m9
    statement: >
      The LCB requests R2 while the group copy unit is arbitrating.
    property: >
      lcbR2Valid

  - id: formal-lsu.m11
    checker: VecGroupCopyChecks
    label: vec_gcopy_lcb_wins_w0
    kind: assert
    reqs: [spec-lsu.m14]
    statement: >
      When the LCB writes W0 the port must carry the LCB's destination, not the
      group copy's.
    property: >
      lcbW0Valid |-> Sequence.BoolSequence(vrfW0Addr === lcbW0Addr)
    reachability: formal-lsu.m12
    notes: >
      Strict priority: an active load drain always wins, and the copy takes the
      ports only in a cycle when no drain is using them.

  - id: formal-lsu.m12
    checker: VecGroupCopyChecks
    label: vec_gcopy_lcb_w0_write_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.m11
    statement: >
      The LCB writes W0 while the group copy unit is arbitrating.
    property: >
      lcbW0Valid

  - id: formal-lsu.m13
    checker: VecGroupCopyChecks
    label: vec_gcopy_write_mask_is_whole_register
    kind: assert
    reqs: [spec-lsu.m11]
    statement: >
      A group-copy member write must write the whole register.
    property: >
      w0Granted |-> Sequence.BoolSequence(vrfW0Mask === allOnesMask)
    reachability: formal-lsu.m4
    notes: >
      The inactive lanes of a fully-inactive destination are preserved by copying
      every byte of the stale member, so a partial mask would leave stale bytes
      from the freshly-allocated register.

  - id: formal-lsu.m15
    checker: VecLsuChecks
    label: vec_lsu_group_copy_excludes_memory_path
    kind: assert
    reqs: [spec-lsu.m2, spec-lsu.m1]
    statement: >
      An op launched into the group-copy path must not also trigger the load
      drain's LCB allocation.
    property: >
      gcopyLaunchValid |-> Sequence.BoolSequence(!ldLcbTrigger)
    reachability: formal-lsu.m16
    notes: >
      With VL = 0 no element is active, so nothing executes: the two paths are
      exact complements and an overlap would both copy and load into the same
      group.

  - id: formal-lsu.m16
    checker: VecLsuChecks
    label: vec_lsu_group_copy_launch_seen
    kind: cover
    reqs: []
    covers_antecedent_of: formal-lsu.m15
    statement: >
      A VL = 0 or fully-inactive op is launched into the group-copy path.
    property: >
      gcopyLaunchValid

coverage:

  # --- group b (store retention and reservation; the load half is out of scope)
  - req: spec-lsu.b4
    assertions: [formal-lsu.b7]
    partial: >
      Checks only the head-side correspondence (capacity is reclaimed only
      against a row claimed at dispatch). The program-ORDER of the claims
      themselves is a prefix-sum over dispatch lanes whose per-lane bases are
      loop-local and not in scope at the anchor.
  - req: spec-lsu.b5
    assertions: [formal-lsu.b7]
    partial: >
      The negative half ("not claimed opportunistically at execute") is checked
      only in that the sole reclamation path is the dispatch-claimed row. No
      property can observe the absence of an execute-time claim path; that
      absence is structural.
  - req: spec-lsu.b6
    assertions: [formal-lsu.b1]
    partial: >
      Checks that every fill lands inside the reserved region, i.e. the store's
      address set stays within what it holds. It does not check that the set is
      COMPLETE (that every active element was filled before commit) — the queue
      has no per-op element count to compare against.
  - req: spec-lsu.b7
    assertions: [formal-lsu.b3]
    partial: >
      Checks that release happens only as a whole head region (the commit-drain
      shape). The retention interval itself — execute until commit-drain — is
      enforced structurally by consume_mask being forced to 0 for stores, which
      no runtime property can observe (see spec-lsu.b8).
  - req: spec-lsu.b8
    unassertable: >
      Discharged structurally, not at runtime: VecElemQueue forces consume_mask
      to 0.U for every isStore instance (a Scala `if`, so the mid-instruction
      free path does not exist in the emitted RTL), and VecLsu additionally ties
      all four store queues' consume ports to false. There is no signal whose
      value could differ between a conforming and a violating design, so any
      property here would constant-fold. A violation would be a source change,
      caught by review and by formal-lsu.b3, not by a property.
  - req: spec-lsu.b9
    unassertable: >
      NOT a legitimate-by-default skip — this is an RTL finding. The only
      as-built evidence that an element was translated before commit is
      VecElemQueue's `xlated` bitmap, and that bitmap HAS NO READER: neither
      VecLsu nor VecBeatExpander consults it before a write-pass beat drains an
      entry, so there is no signal that distinguishes "fault detection completed
      for this element" from "it did not". Asserting the obligation needs a
      consumer of `xlated` (or an equivalent per-entry translated flag on the
      drain path) to exist first; adding one is an RTL decision, not this
      skill's. formal-lsu.j1/j9/j11 check the translate pass's placement and
      ordering, which is as close as the present signal set allows.
  - req: spec-lsu.b19
    assertions: [formal-lsu.b5]
    partial: >
      Checks only that a store's two reservation requests are non-empty. The
      "full worst case" VALUE (worstCaseTbl(eew)(emul_total)) is a loop-local
      val in VecQueueReservation and is not in scope at the anchor, so the
      granted count cannot be compared against it without adding a DUT signal.

  # --- group c (the unit-stride range and the Packer) -------------------------
  - req: spec-lsu.c3
    assertions: [formal-lsu.c5]
    partial: >
      Checks single-push-per-activation in time (the push does not persist into
      the next cycle). It does not check that a whole-register or mask access
      also produces exactly one entry per instruction across a longer gap.
  - req: spec-lsu.c4
    assertions: [formal-lsu.c7]
    partial: >
      Checks the LENGTH clause (VL * EEW) for plain unit-stride accesses. The
      BASE clause (the range starts at the scalar base) is the direct assignment
      io.range.bits.base := scalar.base and would constant-fold. Whole-register
      and mask accesses are excluded by the antecedent: their lengths are
      EMUL*VLEN and ceil(VL/8), which spec-lsu.c4's formula does not describe.
  - req: spec-lsu.c5
    assertions: [formal-lsu.c1]
    partial: >
      Checks that no beat is presented without a staged entry to expand ("fires
      when an entry is activated", the necessary direction). That the second
      Packer-based AGEN unit EXISTS is structural, discharged by
      VecBeatExpander being instantiated per direction in VecLsu.
  - req: spec-lsu.c6
    assertions: [formal-lsu.c3]
    partial: >
      Checks that each expansion step advances the cursor, which is the
      observable content of "just-in-time": the expansion is driven from queue
      state one step at a time. The absence of an eager pre-expansion buffer is
      structural.

  # --- group d (the store data queues) ---------------------------------------
  - req: spec-lsu.d1
    unassertable: >
      Structure: the two data queues exist. Discharged by elaboration —
      VecLsu.scala instantiates st_SSI_DATA_Q and st_US_DATA_Q as named
      VecElemQueue instances. A "this thing exists" obligation has no runtime
      property (schema.md §5.2).
  - req: spec-lsu.d2
    unassertable: >
      Structure stated as an absence ("store data must NOT be held in the STQ
      entry"). The scalar STQ in src/main/scala/v4/lsu/lsu.scala has no vector
      data field to observe; nothing in the emitted RTL can be sampled to
      distinguish compliance from violation.
  - req: spec-lsu.d3
    unassertable: >
      Width obligation — a compile-time fact, per schema.md §5.2 an elaboration
      `require`, not SVA. FINDING: the only width check in VecElemQueue is
      `require(width > 0)`; nothing pins st_SSI_DATA_Q's entry width to ELEN.
      VecLsu sizes it to (new VecDgenSsiPayload).getWidth, whose data field is
      vecELen wide, so the obligation is met by construction but is not checked
      anywhere. A `require` naming ELEN would discharge it properly.
  - req: spec-lsu.d4
    unassertable: >
      Same as spec-lsu.d3 for st_US_DATA_Q and VLEN: met by construction
      ((new VecDgenUsPayload).getWidth carries a vecVLen data field) but pinned
      by no `require`.
  - req: spec-lsu.d5
    assertions: [formal-lsu.d9]
    partial: >
      Checks the push side: every unit-stride data push carries a whole
      VLEN-wide member except the final one. That each member was fetched in ONE
      R3 access (rather than reassembled from several) is checked indirectly by
      formal-lsu.d5's member-range property, not directly.
  - req: spec-lsu.d6
    assertions: [formal-lsu.d13]
    partial: >
      Checks that a write-pass beat has its whole-member data available before
      it leaves (the precondition for slicing). The slice ITSELF —
      extract(st_us_data, memberOff, beatBytes) — is a direct expression whose
      property would constant-fold; comparing the sliced bytes against the
      member would require re-implementing the slice inside the checker.
  - req: spec-lsu.d7
    assertions: [formal-lsu.d5, formal-lsu.d7, formal-lsu.d17]
    partial: >
