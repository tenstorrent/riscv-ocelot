  - req: spec-lsu.g6
    assertions: [formal-lsu.g1]
    partial: >
      Checks that the VL write-back accompanies the completion event, i.e. that
      the op acts as a VL producer on completion. The VALUE written (full VL, or
      i on a fault) depends on the trim that cannot fire (header finding 8).
  - req: spec-lsu.g7
    assertions: [formal-lsu.g1]
  - req: spec-lsu.g8
    unassertable: >
      "The architectural vl CSR is updated at commit." The commit-side read port
      exists (VlRegFile.io.r_commit) but the CSR write itself is in csr.scala,
      which hierarchy.yaml does not allocate to any module of this family. Out of
      this family's module set, not merely unwritten.
  - req: spec-lsu.g9
    unassertable: >
      Same as spec-lsu.g1: only the element-0 fault raises rob_exception, and no
      fault reaches the unit that would make that distinction.
  - req: spec-lsu.g10
    unassertable: >
      Same as spec-lsu.g1, stated as an absence ("clears no architectural state
      beyond trimming VL") on a path that never activates.
  - req: spec-lsu.g11
    unassertable: >
      Absence: is_unique was REMOVED from vleff. There is no `is_unique :=` in
      VLSDecode at all, so nothing can be sampled; a regression would be a new
      assignment, caught by review and by the decode family's own properties.

  # --- group h: D$, LCAM and TLB arbitration --------------------------------
  - req: spec-lsu.h1
    assertions: [formal-lsu.h1]
    partial: >
      Checks the exclusivity that makes one lane serve several requestors. That
      the SCALAR fire is the third requestor on the same lane is expressed
      through scalar_avail/vec_claim rather than a request port here, and is
      checked by formal-lsu.h4/h8.
  - req: spec-lsu.h2
    unassertable: >
      Parameter obligation (lsuWidth 1 on Medium, 2 on Large/Mega), owned by
      BoomConfigMixins and cross-checked by the dcacheArbiterMode `require` in
      VecDcacheArbiter and VecLsu. Compile-time.
  - req: spec-lsu.h3
    assertions: [formal-lsu.h2]
    partial: >
      Checks that the round-robin phase pointer really rotates (phase 0 -> 1).
      The PRIORITY half of "priority round-robin" is formal-lsu.h4; the remaining
      phase transitions are the same increment.
  - req: spec-lsu.h4
    assertions: [formal-lsu.h4]
    partial: >
      Checks the D$ resource on lane 0 outside elevation. The TLB and LCAM
      resources take the same expression shape (resourceOk) and are checked
      indirectly through formal-lsu.h8's claim rule.
  - req: spec-lsu.h5
    assertions: [formal-lsu.h8]
    partial: >
      Checks the mechanism that bounds blocking: outside its elevation phase the
      vector side claims nothing and can only take what scalar left free.
      "Never indefinitely" is a liveness statement over scalar progress, which
      this module cannot observe (it has no scalar-progress input).
  - req: spec-lsu.h6
    assertions: [formal-lsu.h6]
    partial: >
      Checks that the elevation phase does grant a blocked, eligible requestor.
      The literal every-4-cycles BOUND is not asserted as a bounded-delay
      property because a requestor that withdraws its request mid-window would
      make such a property fire on correct RTL.
  - req: spec-lsu.h7
    assertions: [formal-lsu.h11]
    partial: >
      The work-conserving per-lane obligation is checked on lane 0. The
      two-grants-per-cycle clause needs lsuWidth = 2, which only elaborates on
      Large/Mega; this run elaborates Medium, where lane 1 does not exist.
  - req: spec-lsu.h8
    assertions: [formal-lsu.h11]
  - req: spec-lsu.h9
    assertions: [formal-lsu.h8]
  - req: spec-lsu.h10
    assertions: [formal-lsu.h10]
  - req: spec-lsu.h11
    assertions: [formal-lsu.h8]
    partial: >
      Checks that no vector OP.v holds a shared resource outside its elevation
      phase, which is what prevents monopolizing disambiguation or translation.
      The per-OP.v accounting (that it is one op rather than a stream) is not
      distinguished by the arbiter, which sees only per-lane requests.

  # --- group i: squash by pointer rollback ----------------------------------
  - req: spec-lsu.i1
    unassertable: >
      The obligation is on the ISSUE unit's grant condition (IQ_V_LOAD/IQ_V_STORE
      must not gate on the PNR), which is spec-issue's and lives in
      VecIssueUnit/VecIssueSlot; no PNR signal reaches any module in this
      family's set. What can be shown here is only that a squash of an in-flight
      drain happens at all, which is a cover (formal-lsu.i2), not coverage.
  - req: spec-lsu.i2
    assertions: [formal-lsu.i1]
    partial: >
      Checks that the rollback pivot is the branch's own index. That each queue's
      TAIL then lands on that reservation index is VecQueueReservation's
      rollback_tail computation, whose per-row selection is loop-local.
  - req: spec-lsu.i3
    assertions: [formal-lsu.i9]
    partial: >
      Checks that a rollback target lies inside the occupied region, which is the
      observable consequence of the region being program-ordered. Program order
      itself is established at dispatch (formal-lsu.b7).
  - req: spec-lsu.i4
    assertions: [formal-lsu.i5]
    partial: >
      Checks that a flush kills the whole LCB index space in one event, i.e. that
      killing is a whole-vector operation rather than a walk. The ABSENCE of a
      per-entry br_mask compare is structural (see spec-lsu.i10).
  - req: spec-lsu.i5
    assertions: [formal-lsu.i9]
    partial: >
      Checks the queue-side half: the same squash event that rolls the tail also
      bounds the released region. That resv's row invalidation happens in that
      same cycle is asserted inside VecQueueReservation by its own Chisel assert
      on rollbackValidPrev, not by an SVA property here.
  - req: spec-lsu.i6
    assertions: [formal-lsu.i7]
    partial: >
      Checks that a stage kill is never raised without a uop behind it. The
      positive direction (every killed-by-branch uop IS killed) is the assignment
      itself — io.kill(c) := valid && IsKilledByBranch(...) — and would fold.
  - req: spec-lsu.i7
    assertions: [formal-lsu.f2, formal-lsu.i3]
  - req: spec-lsu.i8
    assertions: [formal-lsu.f1]
  - req: spec-lsu.i9
    unassertable: >
      Absence of a mechanism: the vector LSU must NOT drain-and-discard. There is
      no drain-and-discard path in the emitted RTL to sample; the positive
      alternative (invalidate by ldq_idx so a late response lands nowhere) is
      checked by formal-lsu.f1/f2/i3.
  - req: spec-lsu.i10
    unassertable: >
      Design-choice absence: pointer rollback INSTEAD OF per-entry br_mask +
      IsKilledByBranch on ~1000 entries. VecElemQueue has no br_mask field, so
      there is nothing to sample; the positive half (rollback works) is
      formal-lsu.i1/i9.

  # --- group j: the load half of the algorithms ------------------------------
  - req: spec-lsu.j1
    assertions: [formal-lsu.b9]
    partial: >
      Checks that the per-element addresses the load drains were emitted into its
      own reserved region of ld_SSI_ADDR_Q. The drain-side read of that region is
      VecLsu's ldSsiBase walk, which has no separate property.
  - req: spec-lsu.j2
    assertions: [formal-lsu.j18]
  - req: spec-lsu.j3
    unassertable: >
      FINDING (header 10): as built the triple does NOT happen together. In
      VecBeatExpander uses_tlb is always true, uses_lcam only on the first beat of
      a range, and uses_dcache only on a store's write pass. A property asserting
      "TLB and D$ and LCAM together" would fail on correct RTL, and weakening it
      to match the code would assert nothing. The requirement needs restating
      against the as-built per-class policy before it can be checked.
  - req: spec-lsu.j4
    assertions: [formal-lsu.j15]
    partial: >
      Checks that each progress report accounts for at least one element. The
      cumulative "elem_done advances" accounting is the LCB's byte_valid merge,
      checked structurally by formal-lsu.e8.
  - req: spec-lsu.j5
    unassertable: >
      Equivalence claim: the vector load path is identical to the scalar load
      path apart from three named differences. A claim over two code paths, not a
      signal; the three differences themselves are checked by the e-group (LCB),
      formal-lsu.b9/k2 (queue drain) and formal-lsu.j15 (progress).

  # --- group k: memory subsystem and the bandwidth ceiling ------------------
  - req: spec-lsu.k1
    unassertable: >
      Provenance: "the memory subsystem remains unchanged from BOOM v4".
      PLAN FINDING: this requirement is allocated to NO module in
      hierarchy.yaml — it is the only spec-lsu requirement with no owner. Nothing
      implements it because it is a statement about what was not changed;
      enforced, like spec-lsu.a2, by the gate-(f) diff rather than by RTL.
  - req: spec-lsu.k2
    unassertable: >
      Structure: the arbiter sits OUTSIDE the cache. Discharged by
      VecDcacheArbiter being instantiated in VecLsu and presenting dmem.req
      through the host LSU; module topology is not sampleable.
  - req: spec-lsu.k3
    unassertable: >
      Interface provenance: the same dmem.req interface is presented. Discharged
      by lsu.scala still driving io.dmem.req with the unchanged BoomDCacheReq
      bundle; a property could only re-read that bundle.
  - req: spec-lsu.k5
    assertions: [formal-lsu.h1]
    partial: >
      Checks that a lane serves at most one requestor per cycle, so it carries at
      most one element. The <= ELEN WIDTH of that element is a bundle-width fact
      (VecMemAccess.data), not a runtime property.
  - req: spec-lsu.k7
    assertions: [formal-lsu.k2]
    partial: >
      Checks that an SSI drain frees exactly the entries it consumed from its own
      region — one element per granted lane. The sharing of that lane with scalar
      traffic is the h-group's.
  - req: spec-lsu.k10
    unassertable: >
      Structure/design choice: reuse the scalar cache port rather than build a
      VLEN-wide vector interface. Discharged by the absence of a wide port; the
      consequence (the bandwidth ceiling) is spec-lsu.k5/k7.

  # --- group l: segmented load/store, the LSU half --------------------------
  - req: spec-lsu.l1
    assertions: [formal-lsu.e21]
    partial: >
      Checks that the completion names the physical registers of the group the
      LSU half actually filled, which for a shared op is the pvtmp group VecLsu
      allocated from. The SELECTION of pvtmp over pvdest is a direct Mux in
      VecLsu's LCB alloc walk and would fold.
  - req: spec-lsu.l2
    unassertable: >
      The LSU half's issue condition is the vector issue slot's operand-readiness
      grant, which spec-issue.g29-g32 states and VecIssueSlot implements. A
      property here would be a second copy of an issue-family assertion rather
      than an lsu-family check; it belongs to `/req-formal-chisel run issue`.
  - req: spec-lsu.l3
    assertions: [formal-lsu.e21]
    partial: >
      Checks that the loaded data completes into the allocated group. The write
      itself (data into pvtmp in the VRF) is the same W0 path every load uses and
      is checked by formal-lsu.e11/e13/e15.
  - req: spec-lsu.l4
    assertions: [formal-lsu.e21]
    partial: >
      "Treated as an ordinary vector destination" is checked in the sense that
      pvtmp takes the identical allocate/fill/write/complete path with no
      special-casing; the absence of a special case is structural.
  - req: spec-lsu.l5
    unassertable: >
      The pvtmp group-done waking the coprocessor's IQ slot is the vector wakeup
      match, owned by VecGroupReady/VecIssueSlot and stated by
      spec-issue.g12-g18. Asserting it here would duplicate an issue-family
      property; recommended for `/req-formal-chisel run issue`.
  - req: spec-lsu.l7
    unassertable: >
      The two-halves split is a DECODE obligation (the is_shared marking), mined
      as spec-decode.b1/b2 and implemented in VecDecode; nothing in the LSU can
      observe whether an instruction was split, only that it carries is_shared.
  - req: spec-lsu.l8
    assertions: [formal-lsu.e21]
    partial: >
      Checks that the LSU half's memory-side work completes into the handoff
      group. That the OTHER half is the coprocessor's transpose is spec-cii's.
  - req: spec-lsu.l9
    assertions: [formal-lsu.e21]
    partial: >
      Checks the LSU-half end of the pvtmp rendezvous. The consumer end (the
      coprocessor reading pvtmp) is spec-cii's; VecDgen's shared-operand select
      is checked from the store side by formal-lsu.d17.

  # --- group m: the VL == 0 group copy --------------------------------------
  - req: spec-lsu.m1
    assertions: [formal-lsu.m15]
    partial: >
      Checks that a VL = 0 op does reach the LSU and is routed to the no-execution
      path there (rather than being dropped earlier). That pvl RESOLVES to 0 at
      issue is VecScalarOperandRead's vl_zero := (vl === 0), which folds against
      its own definition.
  - req: spec-lsu.m2
    assertions: [formal-lsu.m15]
  - req: spec-lsu.m3
    assertions: [formal-lsu.m1]
    partial: >
      Checks that the mechanism which makes the fresh group correct is started
      exactly for the no-execution cases. That it COMPLETES before commit is
      formal-lsu.m5/m7 plus the ROB's own completion accounting.
  - req: spec-lsu.m4
    unassertable: >
      "The new destination group must equal the OLD value of the architectural
      vreg group" is an equality between VRF contents across two physical groups.
      VecGroupCopy stages one member at a time through a single register and
      retains neither operand for comparison, so no property in this module can
      observe the equality. OBSERVABILITY GAP, reported: closing it would need a
      VRF-level property (spec-vrf's) or a DUT signal, which this flow may not
      add. The mechanism that produces the equality is checked by formal-lsu.m3
      (distinct source and destination) and formal-lsu.m13 (whole-register mask).
  - req: spec-lsu.m5
    assertions: [formal-lsu.m3]
    partial: >
      Checks that each member write moves between two distinct physical
      registers. That the number of member writes equals EMUL is the expansion
      cursor's own arithmetic (expandCursor vs expandCount), which folds.
  - req: spec-lsu.m6
    unassertable: >
      Structure: the copy reuses the Load Unit's VRF ports. Discharged by
      VecGroupCopy taking R2/W0 through the same mux as the LCB (its io.vrf_r2_req
      / io.vrf_w0 are VecLsu's only R2/W0 drivers); the reuse is topology.
  - req: spec-lsu.m7
    unassertable: >
      "Adds no new VRF ports" — an absence, and a port-budget fact owned by
      VecRegFile (9R/3W is fixed there). Discharged at elaboration by the port
      list, not by a property.
  - req: spec-lsu.m8
    assertions: [formal-lsu.m5]
    partial: >
      Checks that the two completion paths never collide on the single group_done
      port. "Exactly one per copy" additionally relies on stageBLast, which is
      the expansion cursor's own last-member flag.
  - req: spec-lsu.m9
    assertions: [formal-lsu.m7]
    partial: >
      Checks the complete-without-execute path fires and completes. That it is
      the SQUASH path variant (as opposed to a distinct third path) is structural
      — there is one noCopy path serving both.
  - req: spec-lsu.m10
    assertions: [formal-lsu.m7]
  - req: spec-lsu.m11
    assertions: [formal-lsu.m13]
    partial: >
      Checks the whole-register mask on the copy path, which is how inactive
      lanes are preserved when nothing executes. The executing cases are covered
      elsewhere: loads by formal-lsu.e15 (LCB fill), arithmetic by spec-cii.
  - req: spec-lsu.m12
    assertions: [formal-lsu.m1]
  - req: spec-lsu.m13
    assertions: [formal-lsu.m9]
    partial: >
      Checks the R2 half of the strict-priority mux. The W0 half is
      formal-lsu.m11; the absence of an anti-starvation counter is deliberate per
      the requirement's own notes and is structural.
  - req: spec-lsu.m14
    assertions: [formal-lsu.m11]
