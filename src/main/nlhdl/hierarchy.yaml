           spec-rename.g26, spec-rename.h12, spec-rename.h13, spec-rename.h14, spec-vrf.d6]
    depends_on: [VecBundles, VectorParams, VecTrace]
    # Cleared by the SAME group-done event that clears rob_bsy and drives the
    # vector wakeup network — one event, three consumers, no per-PRN path.

