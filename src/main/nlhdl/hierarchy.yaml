    kind: module
    source: src/main/nlhdl/vec/issue/VecStoreDgenPath.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/issue/VecStoreDgenPath.scala
    group: vec_issue
    reqs: [spec-core.f13, spec-issue.d10, spec-issue.d11, spec-issue.d12, spec-issue.d13,
           spec-issue.g22, spec-issue.g23, spec-issue.g24, spec-issue.g25, spec-issue.g26,
           spec-issue.g27, spec-issue.g28, spec-issue.c12, spec-issue.c13, spec-cii.i6,
           spec-cii.i12]
    depends_on: [MicroOp, VecBundles, VecTrace]
    # ===> THE DGEN OPERAND IS SELECTED BY is_shared, and getting this wrong is
    #      one of the M1 bugs: the gated operand is `pvtmp` when is_shared is
    #      set and `pvs3` otherwise (issue.g25, g26). Gating DGEN
    #      unconditionally on pvs3 (issue.g27) reads the wrong group for a
    #      shared op and deadlocks the chain, because pvs3's group-done never
    #      comes. Correspondingly pvs3's busy bit must be EXCLUDED from the LSU
    #      half's vector_operands_ready when is_shared is set (issue.g32).
    # AGEN is granted before DGEN (issue.d11) and never as a single grant
    # (issue.d13). The chain has no circular wait (issue.d14) precisely because
    # AGEN's operands are all older than the store.

  # ===========================================================================
  # REGISTER FILES
  # ===========================================================================
  VecRegFile:
    kind: module
    source: src/main/nlhdl/vec/regfile/VecRegFile.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/regfile/VecRegFile.scala
    group: vec_regfile
    reqs: [spec-core.d4, spec-core.h1, spec-core.h2, spec-vrf.c9, spec-vrf.c10, spec-vrf.d1,
           spec-vrf.d2, spec-vrf.d3, spec-vrf.d4, spec-vrf.d5, spec-vrf.f1, spec-vrf.f2,
           spec-vrf.f3, spec-vrf.f9, spec-vrf.g1, spec-vrf.g9, spec-vrf.g10, spec-vrf.g11,
           spec-vrf.g13, spec-vrf.g14, spec-vrf.g15, spec-vrf.g16, spec-vrf.g17, spec-vrf.g18,
           spec-vrf.g19, spec-vrf.g20, spec-vrf.g21, spec-vrf.g22, spec-vrf.g23, spec-vrf.h3,
           spec-vrf.h4, spec-cii.f25, spec-cii.f26, spec-cii.f29, spec-cii.f30, spec-cii.g2,
           spec-lsu.m6, spec-lsu.m7]
    depends_on: [VectorParams, VecTrace]
    instantiates:
      # The storage array is four banks of VLEN/4 = 64b (vrf.f6, f10, f11); this
      # node owns only the port partition, the write-mask fan-out and the bypass.
      - { module: VecRegFileBank, instance: bank, count: 4 }
    # ===> 96 PRNs, 9R / 3W. RESOLVED; spec updated to match (midcore.rst
    #      `vrf-ports`). 96 x VLEN=256b = 24 kbit of flops, 12 ports.
    #
    # Port count is the dominant area term, so the partition is CANONICAL and
    # 0-based — every reader/writer below cites its port by number, and nothing
    # may add a port without amending this table.
    #
    #   R0  Load/LCB   index vector (indexed loads)
    #   R1  Load/LCB   mask v0
    #   R2  Load/LCB   stale_pvdest  <- undisturbed lanes; see `old-vd`
    #   R3  Store      pvs3 store data (DGEN)
    #   R4  Store      mask v0 AND the store index vector (ONE port, TWO readers:
    #                 VecMaskStream and VecIdxGen — see midcore.rst `vrf-ports`,
    #                 spec-vrf.g8/g19. An earlier revision of this comment listed
    #                 the mask only; the .rst is canonical and lists both.)
    #   R5  CoProc     CII src lane 0
    #   R6  CoProc     CII src lane 1
    #   R7  CoProc     CII src lane 2
    #   R8  CoProc     CII src lane 3
    #   W0  Load/LCB   one write per destination PRN
    #   W1  Load/LCB   second LCB write (Mega dual-port; single-port ties off)
    #   W2  CoProc     CII writeback
    #
    # Both coproc figures are DERIVED from the frozen SV contract, not chosen:
    #   CII_NUM_SRC_REQ = 4 -> R5-R8. The VPU wrapper returns "member k of
    #     {VS1,VS2,VS3,VM} in one dat beat", so all four lanes can be live in the
    #     same cycle. (The pkg's own inline comment still reads "2 VRF read ports
    #     for CII (5,6)" — the VALUE is authoritative, not the comment.)
    #   CII_NUM_DST_WB = 1  -> W2 only. Flagged must-match-the-interface-default:
    #     the relay's type(wb_data) resolves against it. One port suffices because
    #     the coprocessor cannot present two result beats in a cycle.
    #
    # Earlier drafts said 7R/4W, arguing a pull interface "needs 2 reads, not 4".
    # Wrong in both directions: 4 reads, 1 write.
    #
    # Capacity: the RMT maps all 32 architectural vregs at all times regardless
    # of current LMUL, so 32 PRNs are always committed-state. (96 - 32) / 8 = 8
    # LMUL=8 groups in flight; a segmented op takes pvdest + pvtmp (16 PRNs), so
    # at most 4 of those. Tighter than the old 128 — 12 groups -> 8 — so the
    # free-list stall rate is worth watching in the (9e2) LS regression.

  # --- The VRF storage array: one bank, instantiated four times ---------------
  # NEW NODE (v2 amendment). Split out of VecRegFile, which was carrying 38
  # requirements spanning two unrelated concerns: WHO owns which port (a
  # contract, canonical in midcore.rst `vrf-ports`) and HOW the array is built
  # (flops, banks, decoders, read-during-write forwarding).
  #
  # This node is the second one. A vector register splits across 4 banks of
  # VLEN/4 = 64 bits (vrf.f6, f10, f11); each port has its own decoder
  # (vrf.f7); every read port spans all four banks (vrf.f14).
  #
  # Keeping it separate also confines the design's #2 risk. The cross-cutting
  # risk table lists VRF AREA — 96 x 256b = 24 kbit of flops with 12 ports,
  # where port count now dominates the storage term — and the open question is
  # whether a flop-based file survives, or whether this becomes latch- or
  # SRAM-banked. That decision changes THIS node only; the port partition above
  # it is unaffected either way.
  VecRegFileBank:
    kind: module
    source: src/main/nlhdl/vec/regfile/VecRegFileBank.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/regfile/VecRegFileBank.scala
    group: vec_regfile
    reqs: [spec-vrf.f4, spec-vrf.f5, spec-vrf.f6, spec-vrf.f7, spec-vrf.f8, spec-vrf.f10,
           spec-vrf.f11, spec-vrf.f12, spec-vrf.f13, spec-vrf.f14]
    depends_on: [VectorParams, VecTrace]
    # Read-during-write forwarding is REQUIRED, not an optimization (vrf.f8):
    # reads are single-cycle, so a write to the PRN being read in the same cycle
    # must forward. Two write ports never target the same PRN (vrf.f13), which
    # is what lets the write path be a plain per-byte-masked OR rather than a
    # priority mux — assert it.

  VlRegFile:
    kind: module
    source: src/main/nlhdl/vec/regfile/VlRegFile.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/regfile/VlRegFile.scala
