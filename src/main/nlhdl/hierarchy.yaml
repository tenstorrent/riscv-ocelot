    kind: module
    source: src/main/nlhdl/vec/issue/VecGroupReady.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/issue/VecGroupReady.scala
    group: vec_issue
    reqs: [spec-rename.g13, spec-rename.g14, spec-rename.g19, spec-rename.g20, spec-issue.g12,
           spec-issue.g13, spec-issue.g14, spec-issue.g15, spec-issue.g16, spec-issue.g17,
           spec-issue.g18, spec-issue.g33, spec-issue.g34, spec-vrf.e7, spec-vrf.e8,
           spec-vrf.e9, spec-vrf.e10]
    depends_on: [VecBundles, VectorParams, VecTrace]
    # Matches each member PRN against all `numVecWbPorts` group-done ports every
    # cycle (issue.g33). Vector operands are NEVER woken speculatively
    # (vrf.e9) — that policy split is why this is a separate matcher from the
    # slot's scalar-feeder comparators, which DO ride BOOM's speculative
    # load-hit wakeup unchanged (vrf.e2).

  # --- The vector store slot's second grant path ------------------------------
  # NEW NODE (v2 amendment). Also split out of VecIssueSlot. A vector store's
  # issue slot has TWO independently grantable paths, AGEN and DGEN
  # (issue.d10, d13), and must tolerate a long, variable delay between them
  # (issue.d12) because for a SEGMENTED store the data does not exist until the
  # coprocessor half has written pvtmp — steps 1 and 6 of the six-step chain in
  # issue.rst `shared-store-chain`.
  #
  # Held as its own node because it is the one part of the slot with its own
  # sequencing state (two grant bits plus an operand mux) and because it is
  # instantiated ONLY in iq_v_store slots — folding it into VecIssueSlot would
  # put store-only state in the load and ALU slots.
