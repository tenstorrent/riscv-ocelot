           spec-cii.d4, spec-cii.d12, spec-cii.d13, spec-cii.i5, spec-cii.i7, spec-cii.i9,
           spec-cii.i13]
    depends_on: [MicroOp, VecBundles, VectorParams, VecTrace]
    instantiates:
      - { module: VecIssueSlot, instance: slots, count: numEntries }
    # Age-ordered collapsing, grant oldest-ready. An OP.v occupies ONE slot and
    # is granted ONCE, when ALL operands are ready: scalar feeders
    # (base/stride/.vx) on the INT network, `.vf` on FP, `pvl` on the VL
    # network, and vector regs (pvs*, mask pvm) on the vector network.
    #
    # `pnrGate` (IQ_V_ALU only): grant only entries older than rob_pnr_idx.
    # This removes BRANCH-kill from the CII, because is_br/is_jalr set
    # starts_unsafe so the PNR never sweeps past an unresolved branch. It does
    # NOT remove flush recovery — past-PNR is NOT a commit guarantee
    # (rob.scala:436-442: a load's rob_unsafe clears on first address
    # translation while order_fail is discovered later). Hence VecCiiFlush.
    #
    # For IQ_V_LOAD/IQ_V_STORE, grant additionally requires the dispatch-time
    # queue RESERVATION to exist. It always does — it was taken at dispatch —
    # so this is an assertion, not a stall condition. Nothing here may consult a
    # `busy` from VecLsu (see the vec_lsu invariant).

  # D6: gates issue on `stale_pvdest` readiness via a FIFTH VecGroupReady instance
  # (`rdy_vold`) on the IQ_V_LOAD and IQ_V_ALU slots, plus a fifth group in the
  # per-member side channel. stale_pvdest is the PREVIOUS mapping of the destination
  # arch vregs, so its producer is older — and age-ordered issue grants oldest-READY,
  # which does not mean an older producer finished. The LCB pre-loads from it on R2
  # (vta=0/vma=0) and the coprocessor may pull STALE_VD, so both queues can read a
  # BUSY group. An aggregate bit is UNSAFE: stale_pvdest can span up to 8 producers
  # (LMUL=1 writes v0, then LMUL=8 renames v0..v7), so per-member matching is
  # required exactly as for pvs* (rename.g20). Conservative for IQ_V_ALU: the host
  # cannot know whether the VPU will pull STALE_VD and no VPU signal exists, so any
  # CII op with a vector destination waits. New requirement pending in spec-issue g.
  VecIssueSlot:
    kind: module
    source: src/main/nlhdl/vec/issue/VecIssueSlot.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/issue/VecIssueSlot.scala
    group: vec_issue
    # D6 landed: spec-issue.g35-g39 are the stale_pvdest readiness obligations, now real
    # IDs (issue.rst 'The Vector Issue Slot' gained the prose they quote).
    reqs: [spec-core.e13, spec-core.f5, spec-rename.g2, spec-rename.h16, spec-issue.g1,
           spec-issue.g3, spec-issue.g4, spec-issue.g5, spec-issue.g6, spec-issue.g7,
           spec-issue.g8, spec-issue.g9, spec-issue.g10, spec-issue.g11, spec-issue.g19,
           spec-issue.g20, spec-issue.g21, spec-issue.g29, spec-issue.g30, spec-issue.g31,
           spec-issue.g32, spec-issue.f11, spec-issue.f14, spec-issue.f15, spec-issue.h2,
           spec-issue.c11, spec-issue.c14, spec-rob.d12, spec-decode.i6, spec-vrf.e1,
           spec-vrf.e2, spec-vrf.e3, spec-vrf.e5, spec-vrf.e6, spec-lsu.l2, spec-lsu.l5,
           spec-issue.g35, spec-issue.g36, spec-issue.g37, spec-issue.g38, spec-issue.g39]
    depends_on: [MicroOp, VecBundles, VecTrace]
    instantiates:
      # Four identical per-group readiness matchers — one per vector source
      # operand. The slot itself keeps only the scalar-feeder comparators (INT
      # base/stride/.vx, FP .vf, VL pvl), because those ride BOOM's SPECULATIVE
      # load-hit wakeup while vector operands never wake speculatively
      # (vrf.e2 vs vrf.e9). That policy split is the module boundary.
      - { module: VecGroupReady, instance: rdy_vs1, params: { isMask: false } }
      - { module: VecGroupReady, instance: rdy_vs2, params: { isMask: false } }
      - { module: VecGroupReady, instance: rdy_vs3, params: { isMask: false } }
      - { module: VecGroupReady, instance: rdy_vm,  params: { isMask: true  } }
      # D6: the FIFTH matcher, gating on `stale_pvdest` readiness. LOAD and ALU
      # slots only — a store has no vector destination, hence no stale group.
      # Without it, IQ_V_LOAD (whose LCB pre-loads from stale_pvdest on R2 for
      # vta=0/vma=0) and IQ_V_ALU (whose coprocessor may pull STALE_VD) can be
      # granted while that group is still BUSY: stale_pvdest is the PREVIOUS
      # mapping of the destination arch vregs, so its producer is older, and
      # age-ordered issue grants oldest-READY, not oldest-COMPLETE.
      - { module: VecGroupReady, instance: rdy_vold, count: "isStoreSlot ? 0 : 1",
          params: { isMask: false } }
      # Store slots only. `count: 0` in load/ALU slots — this holds store-only
      # sequencing state (two grant bits + the is_shared operand mux) and must
      # not appear in a slot that has no DGEN path.
      - { module: VecStoreDgenPath, instance: dgen_path, count: "isStoreSlot ? 1 : 0" }

  # --- Per-source-group readiness: ONE definition, one instance per operand ---
  # NEW NODE (v2 amendment). Split out of VecIssueSlot, which was carrying 56
  # requirements — too many for one reviewable nlhdl file, and most of them were
  # the same per-member match restated per operand.
  #
  # A vector source operand is a GROUP of up to 8 member PRNs, each with its own
  # busy bit, and it wakes only when its LAST member is ready (rename.g14,
  # issue.g17). That is a per-member match against every group-done port,
  # AND-reduced to one group-ready bit — identical logic for pvs1, pvs2, pvs3
  # and pvm. Define once, instantiate four times.
  #
  # Why this is not a single base comparator (issue.g18): a consumer may read a
  # SUB-RANGE of a producer's in-flight group, so the match has to be per member
  # against the group-done's member-PRN vector, not base-address equality.
