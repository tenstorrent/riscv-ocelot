           spec-rename.h25, spec-vrf.c1, spec-issue.h4, spec-lsu.g6, spec-lsu.g8]
    depends_on: [VectorParams, VecTrace]
    # 64 x ~9b. Kept separate from VecRegFile despite sharing the rename space
    # definition: 64x9b of flops with a handful of ports has nothing structurally
    # in common with 128x256b. Rename logic is shared (VecRenameSpace); storage
    # is not.
    # Written from TWO places: the rename cycle (vsetivli, front-end only) and
    # the ALU EU writeback (vsetvli/vsetvl).

  # ===========================================================================
  # VECTOR LSU
  # ---------------------------------------------------------------------------
  # ===> THE INVARIANT (restated where it is enforced). No module in this group
  #      may hold state scoped to "the current instruction", and no module may
  #      export a `busy` that gates issue. In-flight state lives ONLY in the six
  #      VecElemQueue instances and the LCB's assembly entries.
  #
  # The fill/drain seam is what makes that true, and it is the one boundary a
  # reviewer should check. Address generation is cut BY PIPELINE POSITION, not
  # by the inherited OVI Packer/Skipper/Walker x Load/Store cross-product (six
  # modules, 2110 lines, whose duplication had already caused divergent mask
  # support between the load and store Packers — forcing masked stores onto the
  # slower Skipper as a workaround):
  #
  #   FILL side (before the queue)
  #     VecElemAgen   SSI: one element address per active element  -> *_SSI_ADDR_Q
  #     VecRangeAgen  US:  ONE range entry [base, base+VL*EEW)     -> *_US_ADDR_Q
  #   DRAIN side (after the queue)
  #     VecBeatExpander  US: coalesce elements into D$-width accesses
  #                          JUST-IN-TIME. `addvector` put the Packer on the
  #                          fill side, so nothing coalesced late and every
  #                          access was one 64b beat per element.
  #
  # Direction (load/store) is a PARAMETER, never a separate module. Each agen is
  # instantiated twice so the two directions never arbitrate — the load-priority
  # mux is what silently dropped store grants last time.
  # ===========================================================================
  VecLsu:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecLsu.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecLsu.scala
    group: vec_lsu
    reqs: [spec-core.c10, spec-agen.a1, spec-agen.a2, spec-agen.a3, spec-agen.a6, spec-agen.b1,
           spec-agen.b2, spec-agen.b3, spec-agen.b4, spec-rob.c6, spec-rob.c7, spec-rob.c9,
           spec-rob.d13, spec-rob.d17, spec-rob.e1, spec-rob.e2, spec-rob.e3, spec-rob.e5,
           spec-issue.d2, spec-issue.d4, spec-lsu.a13, spec-lsu.j5, spec-lsu.j7, spec-lsu.j8,
           spec-lsu.j11, spec-lsu.k10, spec-lsu.l1, spec-lsu.l7, spec-lsu.l8, spec-lsu.l9]
    depends_on: [MicroOp, VecBundles, VectorParams, VecTrace]
    instantiates:
      - { module: VecQueueReservation, instance: resv }
      # --- operand read: per-direction, never shared -----------------------
      - { module: VecScalarOperandRead, instance: ld_opnd, params: { isStore: false } }
      - { module: VecScalarOperandRead, instance: st_opnd, params: { isStore: true } }
      # --- mask streaming: ONE per direction, SHARED by both agens ----------
      # ===> HOISTED HERE (amendment). VecMaskStream was originally instantiated
      #      inside VecElemAgen, but that left the UNIT-STRIDE path with no mask
      #      reader at all: spec-agen.e12 requires stage 1 to read the mask for
      #      EVERY access class including unit-stride, and VecRangeAgen has no
      #      mask reader of its own. Duplicating the reader was not an option
      #      either — spec-vrf.g18 requires R1 and R4 to have EXACTLY ONE reader
      #      each. So the streamer sits at this level, one per direction, feeding
      #      both that direction's element agen and its range agen. It owns R1
      #      (load) / R4 (store, shared with the store index) outright.
      - { module: VecMaskStream, instance: ld_msk, params: { isStore: false } }
      - { module: VecMaskStream, instance: st_msk, params: { isStore: true  } }
      # --- fill side -------------------------------------------------------
      - { module: VecElemAgen,  instance: ld_elem_agen,  params: { isStore: false } }
      - { module: VecElemAgen,  instance: st_elem_agen,  params: { isStore: true } }
      - { module: VecRangeAgen, instance: ld_range_agen, params: { isStore: false } }
      - { module: VecRangeAgen, instance: st_range_agen, params: { isStore: true } }
      # --- the six element queues: ONE definition, SIX instances -----------
      # Naming follows the spec: {ld,st}_{SSI,US}_{ADDR,DATA}_Q.
      # isStore has NO default deliberately — defaulting it would silently give a
      # store queue LOAD freeing semantics. hasXlatePass is true only for the two
      # store ADDRESS queues, which take a second pass: execute translates and
      # writes the PA back into the entry, commit-drain reads it again.
      - { module: VecElemQueue, instance: ld_SSI_ADDR_Q, params: { entries: ssiQueueEntries, width: addrWidth,  reserved: true, isStore: false, hasXlatePass: false } }
      - { module: VecElemQueue, instance: st_SSI_ADDR_Q, params: { entries: ssiQueueEntries, width: addrWidth,  reserved: true, isStore: true, hasXlatePass: true } }
      - { module: VecElemQueue, instance: st_SSI_DATA_Q, params: { entries: ssiQueueEntries, width: eLen,       reserved: true, isStore: true, hasXlatePass: false } }
      - { module: VecElemQueue, instance: ld_US_ADDR_Q,  params: { entries: usQueueEntries,  width: rangeWidth, reserved: true, isStore: false, hasXlatePass: false } }
      - { module: VecElemQueue, instance: st_US_ADDR_Q,  params: { entries: usQueueEntries,  width: rangeWidth, reserved: true, isStore: true, hasXlatePass: true } }
      - { module: VecElemQueue, instance: st_US_DATA_Q,  params: { entries: usQueueEntries,  width: vLen,       reserved: true, isStore: true, hasXlatePass: false } }
      # --- drain side ------------------------------------------------------
      - { module: VecBeatExpander, instance: ld_beat, params: { isStore: false } }
      - { module: VecBeatExpander, instance: st_beat, params: { isStore: true } }
      - { module: VecDgen,         instance: dgen }
      - { module: VecLoadCoalescingBuffer, instance: lcb }
      # --- the no-execution path (v2 amendment) ----------------------------
      # A VL=0 or fully-inactive vta=0 OP.v writes its freshly-renamed pvdest
      # group with no memory traffic at all. 13 reqs that had no owner before.
      # Borrows the Load Unit's VRF ports and always LOSES to an active drain.
      - { module: VecGroupCopy,     instance: gcopy }
      # --- shared memory-system plumbing -----------------------------------
      - { module: VecDcacheArbiter, instance: arb }
      # --- memory ordering: three mechanisms, not one (v2 amendment) --------
      # ST->LD search (raises order_fail) / LD->ST forward (returns data) /
      # predicted-overlap hold (waits). Split because they are different
      # mechanisms landing in different phase-G steps, and because one node
      # carrying all of memord was 40+ reqs.
      - { module: VecCrossLsuSnoop, instance: snoop }
      - { module: VecStoreForward,  instance: fwd }
      - { module: VecOrderHold,     instance: hold }
      - { module: VecSquashUnit,    instance: squash }

  VecQueueReservation:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecQueueReservation.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecQueueReservation.scala
    group: vec_lsu
    reqs: [spec-issue.b1, spec-issue.b2, spec-issue.b3, spec-issue.b4, spec-issue.b5,
           spec-issue.b6, spec-issue.b7, spec-issue.b8, spec-issue.c1, spec-lsu.b4,
           spec-lsu.b5, spec-lsu.b14, spec-lsu.b15, spec-lsu.d12, spec-lsu.d13, spec-lsu.j6,
           # D9/D10: the reservation rule split by direction. b18 = the load quantum
           # min(worstCase, ldResvMembers * VLEN/EEW); b19 = the store worst case.
           spec-lsu.b18, spec-lsu.b19,
           # spec-issue.b9 is the same load-quantum obligation stated from the issue side;
           # spec-issue.b2 is now STORE-ONLY (D9/D10 split it by direction).
           spec-issue.b9]
    depends_on: [MicroOp, VecBundles, VectorParams, VecTrace]
    # Claims element-queue capacity IN PROGRAM ORDER AT DISPATCH, sized to the
    # worst-case active element count from EMUL/EEW, releasing the surplus at
    # execute once VL is known. A vector store reserves in BOTH its address and
    # data queue or does not dispatch.
    #
    # This is a CORRECTNESS requirement, not tuning. Opportunistic allocation
    # deadlocks the machine:
    #   1. Older store A's operands aren't ready, so younger B and C are granted
    #      first (age-ordered-READY issue may skip a not-ready older entry) and
    #      fill the queue.
    #   2. A becomes ready, issues, back-pressures at the vAGEN — no room.
    #   3. A cannot finish translating its element set, so A cannot commit.
    #   4. Commit is in-order, so B and C never reach commit-drain and never
    #      free their entries. Nothing moves.
    # Liveness under opportunistic allocation would need
    # depth >= max_elements_per_store * max_in_flight_stores = 64*256 = 16384
    # entries. Sizing cannot fix it; the reservation is what fixes it, because
    # the oldest store always already holds its capacity.
    #
    # Loads do NOT have this failure mode (a load completes out of the LCB
    # without waiting for commit). Loads are reserved in program order for the
    # OTHER reason: it is what makes the queues squashable by pointer rollback.

  VecScalarOperandRead:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecScalarOperandRead.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecScalarOperandRead.scala
    group: vec_lsu
    # spec-agen.d3 was RETIRED — its FP half was unreachable and its integer half named the
    # wrong subject (the vDGEN). Reissued as spec-agen.d16, which names this module's job.
    reqs: [spec-agen.d16, spec-issue.d3, spec-issue.h3, spec-lsu.m1]
    depends_on: [MicroOp, VecBundles, VecTrace]
    # Reads the scalar feeders (base, stride, .vx/.vf) and resolves VL for this
    # direction, and supplies the mask/index group PRNs onward.
    # CLARIFIED: it does NOT itself perform the mask/index VRF reads. Those are
    # per-member reads issued as the element walk advances, so they belong to
    # VecMaskStream (R1/R4) and VecIdxGen (R0/R4), which own the corresponding
    # port requirements. A per-OP.v operand-read stage cannot serialize members. Instantiated PER DIRECTION — `addvector` had a
    # single shared, fire-and-forget VecLSRegRead with a load-priority mux, and
    # when both queues granted in the same cycle the store's grant was silently
    # lost (worked around by making the store not advertise FC_AGEN whenever the
    # load was granting). Two instances remove the arbitration entirely.
    #
    # MUST snoop the INT writeback bus and forward on a same-cycle match. The
    # vector LS is woken speculatively, so this read can fire the same cycle the
    # base GPR's writeback commits; the INT RF is a registered Mem read with no
    # read-during-write bypass, giving a stale base. Masked in most tests by
    # la->use slack, so it will not show up in casual testing.

  VecElemAgen:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecElemAgen.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecElemAgen.scala
    group: vec_lsu
    # D12(3): the six vleff fault/trim reqs (lsu.g1-g4/g9/g10) MOVED to
    # VecRangeAgen. `vle<eew>ff.v` is architecturally UNIT-STRIDE, so its OP.v
    # self-selects into the range agen, never here. Architect-pass mis-allocation.
    reqs: [spec-core.c13, spec-agen.b5, spec-agen.c6, spec-agen.c7, spec-agen.c8,
           spec-agen.c10, spec-agen.c14, spec-agen.c16, spec-agen.c18, spec-agen.c19,
           spec-agen.c20, spec-agen.c24, spec-agen.e2, spec-agen.e6, spec-agen.e7,
           spec-agen.e8, spec-agen.e9, spec-agen.e11, spec-lsu.b11, spec-lsu.f5, spec-lsu.f8,
           spec-lsu.f9, spec-lsu.j1, spec-rob.g13]
    depends_on: [MicroOp, VecBundles, VectorParams, VecTrace]
    instantiates:
      # isStore MUST be forwarded: the child's VRF read port number depends on
      # direction (load reads the index on R0, store reads it on R4).
      - { module: VecIdxGen,     instance: idx, params: { isStore: isStore } }
      # NOTE: VecMaskStream is NOT instantiated here. It was hoisted to VecLsu —
      # see the comment on the `ld_msk`/`st_msk` instances there.
    # FILL side, SSI patterns (strided / indexed / segmented). Emits one element
    # address per ACTIVE element into *_SSI_ADDR_Q. Absorbs the inherited
    # Skipper and Walker: masked-skip and indexed differ only in where the
    # address comes from, not in what they emit.
    #
    # CARRY-OVER — LOOKAHEAD HAZARDS (found by bring-up, not by design; they are
    # not optional and must be described explicitly in the nlhdl):
    #   - Do not start, and do not emit, an element access whose mask bit is not
    #     yet staged. The inherited Skipper's rule was "will not send a packet
    #     (or even start) if the next requires a new mask entry", specifically to
    #     avoid wait states mid-stream.
    #   - Same rule for the index vector: do not start an element access whose
    #     index entry is not yet staged.
    #   - VecIdxGen serializes the index vector into per-element UNSIGNED offsets
    #     (corrected: see the VecIdxGen entry).
    #   - Element counting must complete by TOTAL BYTES (vl << eew), handling a
    #     partial final member. A hardcoded 8-member walk streams phantom
    #     members after a 1-member op and stalls (this was the back-to-back
    #     vector-store data-corruption bug).
    #
    # Retires its element cursor when the last element is pushed. It does NOT
    # wait for D$ responses or completion (see the group invariant).

  VecRangeAgen:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecRangeAgen.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecRangeAgen.scala
    group: vec_lsu
    # D12(3): gained lsu.g1-g4/g9/g10 from VecElemAgen — vleff is unit-stride, so
    # the fault/trim policy belongs to the agen that actually sees it. Element-0
    # fault = normal precise trap with vstart=0; fault at i>0 does NOT trap, VL is
    # trimmed to i, the op completes with what it loaded, nothing else
    # architectural is cleared, and only element-0 raises rob_exception. The
    # trimmed count reaches VlRegFile.W_lsu via lcb.io.vl_wb (VecLsu settled the
    # two candidate producers down to one).
    reqs: [spec-agen.b6, spec-agen.b7, spec-agen.e13, spec-lsu.c3, spec-lsu.c4, spec-lsu.d5,
           spec-lsu.g1, spec-lsu.g2, spec-lsu.g3, spec-lsu.g4, spec-lsu.g9, spec-lsu.g10]
    depends_on: [MicroOp, VecBundles, VectorParams, VecTrace]
    # FILL side, unit-stride. Emits exactly ONE range entry describing
    # [base, base + VL*EEW) into *_US_ADDR_Q. Also covers whole-register
    # (vl1re*/vs1r) and mask (vlm/vsm) accesses, which are contiguous ranges
    # with a fixed length.
    # Because a unit-stride access is a single contiguous byte range, its
    # disambiguation and forwarding are ONE range-overlap check, not per element.

  VecIdxGen:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecIdxGen.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecIdxGen.scala
    group: vec_lsu
    reqs: [spec-agen.c17, spec-agen.c27, spec-agen.c29, spec-vrf.g2]
    depends_on: [VecBundles, VectorParams, VecTrace]
    # Serializes an index vector register group into per-element UNSIGNED
    # (zero-extended) byte offsets.
    # ===> CORRECTED. Earlier revisions of this map and of the plan said SIGNED.
    #      RVV 1.0 indexed offsets are UNSIGNED: spike's VI_LDST_GET_INDEX reads
    #      them as uint8_t/uint16_t/uint32_t/uint64_t. Whisper is the cosim
    #      reference, so sign-extension would diverge on any index whose top EEW
    #      bit is set — and the divergence would look like an addressing bug in
    #      the LSU rather than an extension bug. Keep the extension in ONE named
    #      function so a future correction stays a one-line change.

  VecMaskStream:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecMaskStream.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecMaskStream.scala
    group: vec_lsu
    reqs: [spec-agen.c9, spec-agen.c28, spec-agen.e1, spec-agen.e4, spec-agen.e5,
           spec-agen.e12, spec-agen.e14, spec-vrf.g3, spec-vrf.g8]
    depends_on: [VecBundles, VectorParams, VecTrace]
    # Streams v0 mask bits at element granularity, with the one-entry lookahead
    # the agen's hazard rule depends on.

  VecElemQueue:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecElemQueue.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecElemQueue.scala
    group: vec_lsu
    reqs: [spec-lsu.a5, spec-lsu.b1, spec-lsu.b3, spec-lsu.b6, spec-lsu.b7, spec-lsu.b8,
           spec-lsu.b9, spec-lsu.b10, spec-lsu.c2, spec-lsu.d1, spec-lsu.d2, spec-lsu.d3,
           spec-lsu.d4, spec-lsu.d8, spec-lsu.d11, spec-lsu.i3, spec-lsu.j10, spec-lsu.k7]
    depends_on: [VecBundles, VectorParams, VecTrace]
    # ONE definition, SIX instances. The decoupling structure that makes the
    # group invariant possible: the fill side pushes and retires; the drain side
    # pops independently. Neither knows the other's progress.
    #
    # Requirements:
    #   - RESERVED capacity, claimed at dispatch in program order (`reserved`).
    #   - SQUASHABLE BY POINTER ROLLBACK. On a squash, roll the tail pointer back
    #     to the youngest surviving reservation. This is why loads reserve in
    #     program order even though they have no deadlock exposure.
    #   - Stores RETAIN their translated addresses and data from execute until
    #     commit-drain — they cannot be streamed or freed mid-instruction,
    #     because a store cannot write memory before it commits and every
    #     element's fault must be detected before commit.
    #   - Loads MAY stream: a load whose active element count exceeds its
    #     reservation is drained in waves.

  VecBeatExpander:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecBeatExpander.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecBeatExpander.scala
    group: vec_lsu
    reqs: [spec-agen.b8, spec-agen.c1, spec-agen.c2, spec-agen.c3, spec-agen.c23, spec-lsu.c5,
           spec-lsu.c6, spec-lsu.d6, spec-lsu.f13, spec-lsu.j2, spec-lsu.j3, spec-lsu.k8]
    depends_on: [VecBundles, VectorParams, VecTrace]
    # DRAIN side. Pops a queue entry and issues D$ accesses.
    #   - US range entry  -> coalesce contiguous elements into D$-port-width
    #                        accesses just-in-time. This is where unit-stride
    #                        throughput comes from: 8 x SEW=8 elements in one
    #                        64b access instead of 8 accesses.
    #   - SSI element     -> one access per entry (already element-wise).
    # Beat width is bounded by the D$ port, so a wide vector cache port raises
    # this ceiling; the module must not assume 64b.
    # Runs from queue state only. Holds NO per-instruction state.

  VecDgen:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecDgen.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecDgen.scala
    group: vec_lsu
    reqs: [spec-agen.d1, spec-agen.d2, spec-agen.d4, spec-agen.d5, spec-agen.d6, spec-agen.d7,
           spec-agen.d8, spec-agen.d10, spec-agen.d11, spec-agen.d12, spec-agen.d13,
           spec-agen.d14, spec-agen.d15, spec-vrf.g7, spec-lsu.d7, spec-lsu.d9, spec-lsu.d10,
           spec-issue.d9]
    depends_on: [MicroOp, VecBundles, VectorParams, VecTrace]
    # Reads store data from the source vPRN at EXECUTE time (VRF port R3) into
    # st_*_DATA_Q. Captured this early, the source vPRN needs NO PIN — it frees
    # with the rest of the stale group at commit, because a later writer to the
    # same architectural vreg cannot clobber data that already lives in the queue.
    #
    # For a SHARED instruction the data operand is the pvtmp rendezvous group,
    # not pvs3: `dgen_operand := Mux(uop.is_shared, uop.pvtmp, uop.pvs3)`.
    # Gating DGEN on pvs3 for a shared op reads the wrong group.
    #
    # Completes by TOTAL BYTES (vl << eew), handling a partial final member.

  VecLoadCoalescingBuffer:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecLoadCoalescingBuffer.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecLoadCoalescingBuffer.scala
    group: vec_lsu
    reqs: [spec-lsu.e1, spec-lsu.e2, spec-lsu.e3, spec-lsu.e4, spec-lsu.e5, spec-lsu.e6,
           spec-lsu.e8, spec-lsu.e9, spec-lsu.e10, spec-lsu.e11, spec-lsu.e12, spec-lsu.e13,
           spec-lsu.e14, spec-lsu.e15, spec-lsu.e16, spec-lsu.e17, spec-lsu.e18, spec-lsu.e19,
           spec-lsu.e20, spec-lsu.e21, spec-lsu.e22, spec-lsu.e23, spec-lsu.e24, spec-lsu.e25,
           spec-lsu.f14, spec-lsu.f15, spec-lsu.g7, spec-lsu.j4, spec-vrf.g4, spec-vrf.i5,
           spec-vrf.i6, spec-vrf.i7, spec-rob.d16, spec-lsu.l3, spec-lsu.l4]
    depends_on: [VecBundles, VectorParams, VecTrace]
    # Turns out-of-order, <=ELEN per-element D$ responses into ONE VRF write per
    # destination PRN (W0) and ONE group-done per instruction. Owns the per-group
    # PRN-done count; target is the destination-group size from v_emul/v_seg_nf.
    #
    # UNDISTURBED LANES: for vta=0 / vma=0, inactive-lane data is PRE-LOADED from
    # stale_pvdest on VRF read port R2 before arriving elements are overlaid.
    # Only members that actually contain inactive lanes are pre-loaded, and the
    # pre-load OVERLAPS the load's memory latency.
    # ===> This replaces `addvector`'s serial sCopyRd/sCopyWr prologue, which
    #      copied the whole stale group before placing any beat — two extra
    #      cycles per member, x8 members, in front of every masked or
    #      tail-undisturbed load, on the critical path of the load itself.
    #
    # Per-BYTE write mask (vLen/8 bits), not per 64b lane: a sub-lane write
    # (vlm's ceil(vl/8) bytes, a partial tail) must leave the rest undisturbed.
    #
    # group_done must be driven from the REGISTERED beat, never combinationally
    # from the incoming nop — issue.vec_wakeup -> iss_uops -> decode -> AGEN ->
    # nop -> group_done closes a combinational loop.

  # --- The VL == 0 / fully-inactive destination group copy --------------------
  # NEW NODE (v2 amendment). This mechanism had NO owner anywhere in the
  # previous map, and it is 13 live requirements of `loadstore.rst`, not an edge
  # case to be discovered during bring-up.
  #
  # THE PROBLEM. Only an immediate-AVL vset resolves VL in the front end; for
  # every other form a VL = 0 op still reaches issue, where pvl resolves to 0
  # (lsu.m1). Its pvdest group is already renamed and freshly allocated, and its
  # ROB entry cannot commit until that group is architecturally correct
  # (lsu.m3) — but with VL = 0 the LSU executes no element at all (lsu.m2), so
  # nothing would ever write it. With vta = 0 the new group must equal the OLD
  # value of the architectural vreg group (lsu.m4). Something has to copy
  # stale_pvdest into pvdest with no memory traffic whatsoever.
  #
  # THE SHAPE. One VLEN-wide copy per group member (lsu.m5), completing with a
  # single group-done like any other producer (lsu.m8). It reuses the Load
  # Unit's existing VRF ports and adds NONE (lsu.m6, m7) — which is what makes
  # it compatible with the canonical port table rather than an amendment to it.
  VecGroupCopy:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecGroupCopy.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecGroupCopy.scala
    group: vec_lsu
    reqs: [spec-lsu.m2, spec-lsu.m3, spec-lsu.m4, spec-lsu.m5, spec-lsu.m8, spec-lsu.m9,
           spec-lsu.m10, spec-lsu.m11, spec-lsu.m12, spec-lsu.m13, spec-lsu.m14]
    depends_on: [MicroOp, VecBundles, VectorParams, VecTrace]
    # ===> IT MUST NEVER STEAL BANDWIDTH FROM A REAL LOAD. Because it borrows the
    #      Load Unit's ports, those ports are arbitrated by a STRICT-PRIORITY
    #      mux (lsu.m13) in which an active load drain ALWAYS wins (lsu.m14).
    #      The copy is pure catch-up work with no consumer waiting on latency,
    #      so it is the correct loser. A round-robin here would let a VL=0 op
    #      displace a real element return.
    # ===> SCOPE, and this is the easy mistake: the standalone copy is ONLY for
    #      the no-execution case — VL = 0, or a fully-inactive vta = 0 group
    #      (lsu.m12). The ORDINARY masked / partial-tail case (lsu.m11) is NOT
    #      this module: those inactive lanes are pre-loaded from stale_pvdest on
    #      R2 inside the LCB, overlapped with the load's memory latency (see
    #      VecLoadCoalescingBuffer). Routing the ordinary case through here
    #      would resurrect exactly the serial copy prologue v2 exists to delete.
    # With vta = 1 there is nothing to preserve, so the entry takes the
    # complete-without-execute path and emits its group-done immediately
    # (lsu.m9, m10) — no copy, no VRF traffic.

  VecDcacheArbiter:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecDcacheArbiter.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecDcacheArbiter.scala
    group: vec_lsu
    reqs: [spec-lsu.h1, spec-lsu.h3, spec-lsu.h4, spec-lsu.h5, spec-lsu.h6, spec-lsu.h7,
           spec-lsu.h8, spec-lsu.h9, spec-lsu.h10, spec-lsu.h11, spec-memord.b9,
           spec-memord.b18]
    depends_on: [VecBundles, VectorParams, VecTrace]
    # PRIORITY ROUND-ROBIN with a scalar-priority floor plus anti-starvation,
    # gating the D$ port, the LCAM port, and the TLB port together.
    # ===> NOT `addvector`'s scheme, which appended vector requests LAST in
    #      lsu_sched at LOWEST priority with uses_tlb=false and uses_lcam=false.
    #      That is why vector accesses were both slow and invisible to
    #      disambiguation.
    # Vector element addresses go through the DTLB like any other access —
    # bare-physical addressing is not an option here, because it makes
    # cross-queue disambiguation impossible.
    # `dcacheArbiterMode`: "single" | "dual-dynamic" (Mega, 2 accesses/cycle).

  VecCrossLsuSnoop:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecCrossLsuSnoop.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecCrossLsuSnoop.scala
    group: vec_lsu
    reqs: [spec-memord.a2, spec-memord.a15, spec-memord.a19, spec-memord.a22, spec-memord.b1,
           spec-memord.b2, spec-memord.b3, spec-memord.b4, spec-memord.b5, spec-memord.b8,
           spec-memord.b20,
           # The two-tier search that makes a19 implementable: a26 = the conservative
           # per-STQ-entry address bound (correctness backstop, no false negatives);
           # a27 = the exact comparators over st_US_ADDR_Q plus the SSI snoop window.
           spec-memord.a26, spec-memord.a27]
    depends_on: [MicroOp, VecBundles, VectorParams, VecTrace]
    # BIDIRECTIONAL cross-queue disambiguation: vector element addresses are
    # routed through the LCAM in both directions, so scalar ops see vector
    # addresses and vector ops see scalar addresses.
    #   - US accesses: ONE range-overlap check per instruction.
    #   - SSI accesses: per-element search.
    #   - ST->LD ordering reuses the existing order_fail replay path.
    #   - LD->ST forwarding reads out of the vector store DATA queues.
    # An order-fail replay raises MINI_EXCEPTION_MEM_ORDERING at the ROB head,
    # which can squash past-PNR coprocessor work — see VecCiiFlush.

  # --- LD -> ST forwarding out of the vector store data queues ----------------
  # NEW NODE (v2 amendment). Split out of VecCrossLsuSnoop, which was carrying
  # both directions of cross-queue ordering at once. The two directions are
  # genuinely different mechanisms — one raises order_fail, the other returns
  # DATA — and they land in different plan steps (G1 vs G3).
  #
  # A load address that matches an OLDER vector store must be given that store's
  # data (memord.a21), read out of the st_*_DATA_Q (memord.a15) — the STQ entry
  # holds no vector store data at all.
  VecStoreForward:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecStoreForward.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecStoreForward.scala
    group: vec_lsu
    reqs: [spec-memord.a21, spec-memord.a23, spec-memord.a24, spec-memord.a25, spec-memord.b6,
           spec-memord.b7, spec-memord.b10, spec-memord.b14, spec-memord.b15, spec-memord.b21,
           spec-memord.c21, spec-memord.c22]
    depends_on: [MicroOp, VecBundles, VectorParams, VecTrace]
    # Rules that are easy to get subtly wrong:
    #   - Forward from an older vector store of EITHER class, US or SSI
    #     (memord.a23). Where several already-generated elements of the same SSI
    #     store alias one scalar load, the YOUNGEST matching element supplies
    #     the data (memord.a24) — an older element's value is stale.
    #   - A store element generated AFTER a load has already forwarded, and
    #     aliasing it, must set that load's order_fail through its own ST->LD
    #     search (memord.a25). Forwarding is not a commitment; the replay path
    #     is still the floor.
    #   - VECTOR-TO-VECTOR forwarding is attempted ONLY when both sides are
    #     unit-stride (memord.b14); between two SSI accesses it is not attempted
    #     at all (memord.b10) and the ordering hold covers the case instead
    #     (see VecOrderHold).
    #   - A partial cover replays the load rather than returning half an operand
    #     (memord.b6, b7), exactly as BOOM already does for scalars.
    #   - Forwarding from a US store is qualified by the store's active BYTE
    #     mask (memord.b21). Note the asymmetry with ordering, which is
    #     deliberately mask-OBLIVIOUS (memord.b20, VecCrossLsuSnoop): a
    #     conservative ordering match is safe, a wrong forwarded byte is not.

  # --- The predicted-overlap hold --------------------------------------------
  # NEW NODE (v2 amendment). Six requirements that previously had no owner, and
  # the one part of memory ordering that is neither a search nor a forward.
  #
  # THE CASE. A younger vector load overlaps an older vector store that is still
  # draining, in a combination that does NOT forward — SSI/SSI, or US/SSI. There
  # is no data to hand over, so the load must WAIT until that store's elements
  # have drained and then read the updated line (memord.b11, b12).
  VecOrderHold:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecOrderHold.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecOrderHold.scala
    group: vec_lsu
    reqs: [spec-memord.b11, spec-memord.b12, spec-memord.b13, spec-memord.b16, spec-memord.b17,
           spec-memord.b19]
    depends_on: [MicroOp, VecBundles, VectorParams, VecTrace]
    # Built entirely out of machinery BOOM already has, which is why it is small:
    # the overlap PREDICTION is BOOM's existing memory-dependence predictor
    # (memord.b16) and the hold itself is the younger load's existing per-load
    # store-dependency block pointed at the older vector store entry
    # (memord.b17). No new predictor, no new CAM.
    #   - RELEASE is by the older store's ELEMENT CURSOR completing its active
    #     element set (memord.b19) — not by the store committing, and not by a
    #     timer.
    #   - A held load is not granted the LCAM or the D$ port (memord.b18). That
    #     is a seam with VecDcacheArbiter, which owns the suppression; this
    #     module only decides who is held.
    # ===> NOT A CORRECTNESS MECHANISM, and the distinction matters for how it
    #      is reviewed. The hold is a PERFORMANCE mechanism that avoids a
    #      squash; the order_fail replay path remains the correctness floor for
    #      any load that slips through before the dependence is detected
    #      (memord.b13). A conservative or even a wrong prediction here costs
    #      cycles, never data.
    # ===> AND IT MAY NOT INTRODUCE A DEADLOCK. It holds a YOUNGER load behind an
    #      OLDER store only, so the wait graph follows program order and cannot
    #      cycle. A hold in the other direction would deadlock against the
    #      in-order commit that frees the store's reservation.

  VecSquashUnit:
    kind: module
    source: src/main/nlhdl/vec/lsu/VecSquashUnit.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/lsu/VecSquashUnit.scala
    group: vec_lsu
    reqs: [spec-lsu.f6, spec-lsu.f7, spec-lsu.i1, spec-lsu.i2, spec-lsu.i4, spec-lsu.i5,
           spec-lsu.i6, spec-lsu.i7, spec-lsu.i8, spec-lsu.i9, spec-lsu.i10, spec-memord.c16,
           spec-memord.c17, spec-memord.c18, spec-memord.c19, spec-memord.c20, spec-memord.c23,
           spec-memord.c24, spec-memord.e3, spec-memord.e4, spec-memord.e5]
    depends_on: [MicroOp, VecBundles, VecTrace]
    # Squashes the vector LSU on mispredict and flush: POINTER ROLLBACK on all
    # six element queues plus LCB entry invalidation by ldq_idx.
    # ===> DRAIN-AND-DISCARD IS UNSAFE HERE, and this is the one place the CII's
    #      contract must NOT be copied. The CII can drain killed work harmlessly
    #      because a CII tag is opaque and is not reused until reclaimed. A
    #      squashed vector load's destination PRNs are RECYCLED by the free list
    #      immediately, so a late response draining into a stale pvdest corrupts
    #      whatever now owns that PRN. Squashed element accesses must be dropped
    #      by pointer rollback, not drained.

  # ===========================================================================
  # CII HOST — the BOOM side of the coprocessor interface
  # ===========================================================================
  VecCiiHost:
    kind: module
    source: src/main/nlhdl/vec/cii/VecCiiHost.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/cii/VecCiiHost.scala
    group: vec_cii
    reqs: [spec-core.e18, spec-agen.a7, spec-cii.a1, spec-cii.a2, spec-cii.a4, spec-cii.a5,
           spec-cii.a18, spec-cii.b1, spec-cii.b2, spec-cii.b5, spec-cii.b6, spec-cii.b7,
           spec-cii.b9, spec-cii.c1, spec-cii.c3, spec-cii.c8, spec-cii.c9, spec-cii.f35,
           spec-cii.f36, spec-cii.f37, spec-cii.f39, spec-cii.f43]
    depends_on: [MicroOp, VecBundles, VectorParams, VecTrace]
    instantiates:
      # One node per channel direction. `iss` was added in the v2 amendment:
      # the other three directions each had a module and the Issue direction did
      # not, which left 26 reqs (the whole issue-packet contract) inside the
      # container alongside the BlackBox binding.
      - { module: VecCiiTagTable,      instance: tags }
      - { module: VecCiiIssue,         instance: iss }    # host -> cop  (Issue)
      - { module: VecCiiOperandServer, instance: opnd }   # cop  -> host (Src-Req/Dat)
      - { module: VecCiiWriteback,     instance: wb }     # cop  -> host (Writeback)
      - { module: VecCiiComplete,      instance: done }   # last-beat completion
      - { module: VecCiiFlush,         instance: flush }
      - { module: tt_cii_host_wrap,    instance: coproc, reset: core_rst_n }
    # Binds the SV stack via HasBlackBoxPath pointing at src/main/sv/v4/**
    # DIRECTLY — nothing is copied into src/main/resources/vsrc/.
    # ===> `addvector` copied 7 SV files into resources/vsrc/, ONE OF THEM
    #      SUBMODULE CONTENT (src/main/sv/v4/tt-cii). The premise of v2 is that
    #      the SV is refactored and verified; a stale copy silently falsifies
    #      exactly that premise — you would verify one file and simulate another
    #      with nothing to tell you. Single source of truth, no copies.
    #      A build check must confirm the tt-cii submodule is checked out; if
    #      addPath fights the Chipyard flow, the fallback is a sync step with a
    #      checksum guard that FAILS the build on drift, never a silent copy.
    # Host-side constants are DERIVED from tt_cii_caracal_pkg, never redeclared.

  # --- The Issue channel: tag allocation, the issue packet, credit metering ----
  # NEW NODE (v2 amendment). The previous map decomposed the CII host into
  # TagTable / OperandServer / Writeback / Flush — one node per direction EXCEPT
  # the issue direction, which was left inside VecCiiHost along with the
  # BlackBox binding. That was the asymmetry to fix: the issue path is 26 live
  # requirements, including the whole of the issue-packet contract (cii.k*).
  #
  # On grant it allocates a 4-bit tag, records the side-table entry, and emits
  # the extended Issue packet (cii.d6-d8).
  VecCiiIssue:
    kind: module
    source: src/main/nlhdl/vec/cii/VecCiiIssue.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/cii/VecCiiIssue.scala
    group: vec_cii
    reqs: [spec-cii.c10, spec-cii.c11, spec-cii.c12, spec-cii.c13, spec-cii.c14, spec-cii.d6,
           spec-cii.d7, spec-cii.d9, spec-cii.d10, spec-cii.d11, spec-cii.f24, spec-cii.f27,
           spec-cii.f40, spec-cii.f41, spec-cii.k1, spec-cii.k2, spec-cii.k3, spec-cii.k4,
           spec-cii.k5, spec-cii.k6, spec-cii.k7, spec-cii.k8, spec-cii.k9, spec-cii.k10,
           spec-cii.k11, spec-decode.d7]
    depends_on: [MicroOp, VecBundles, VectorParams, VecTrace, tt_cii_caracal_pkg]
    # THE ISSUE PACKET carries the FULL dynamic vector context, per instruction
    # (cii.k1) — which is what buys the design out of a serializing VCONFIG CSR
    # write to the coprocessor (cii.d9, d10) and lets the VPU hold no
    # cross-instruction configuration state. Field by field, each from a
    # DIFFERENT place, and mixing them up is silent corruption:
    #   insn   32b  the raw RVV word from uop.debug_inst          (cii.k2)
    #   vtype   8b  {vsew,vlmul,vta,vma} from uop.vconfig — the DECODE-time
    #               speculative mirror snapshot, not a CSR read     (cii.k3)
    #   vl      9b  from the VL-RF read of uop.pvl — the RENAMED VL (cii.k4)
    #   vstart  9b  read from the vstart CSR at issue               (cii.k5)
    #   vxrm    2b  from csr.io.vector                              (cii.k8)
    #   frm     3b  from fcsr.frm                                   (cii.k9)
    #   tag     4b  prefix                                          (cii.k10)
    # ===> vstart MUST NOT be forced to 0 (cii.k6) even though hardware never
    #      produces a non-zero vstart (cii.k7): software can write it, and the
    #      VPU honours it by leaving lower elements untouched. Forcing 0 here
    #      would silently corrupt a resumed instruction.
    # src_reuse is driven to 0 on every source (cii.k11); the VPU ignores it and
    # always re-pulls.
    #
    # CREDIT METERING — the reason `fu_types` exists on this node. The adapter
    # advertises fu_types ONLY when a real issue credit is available (cii.c10),
    # from a local mirror of the issue FIFO's occupancy (cii.c11, c12), and that
    # gate is REGISTERED (cii.c13). Accounting must be exact (cii.c14): the CII
    # channels have no ready line (cii.b3), so an over-advertised credit is not
    # back-pressured — it is a dropped instruction.
    # Scalar .vx/.vf operands are captured BY VALUE from the INT/FP bypass at
    # issue into the side-table (cii.f24, f41); the coprocessor can address no
    # register file, so a late read is not available to it.

  VecCiiTagTable:
    kind: module
    source: src/main/nlhdl/vec/cii/VecCiiTagTable.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/cii/VecCiiTagTable.scala
    group: vec_cii
    # spec-cii.f5-f8, f10 arrived here from VecCiiOperandServer via D12 case 3 —
    # the op_id -> PRN mux is emitted in this node's Source-Request resolve.
    reqs: [spec-cii.b8, spec-cii.b11, spec-cii.d8, spec-cii.d16, spec-cii.d17, spec-cii.d18,
           spec-cii.d19, spec-cii.d20, spec-cii.d21, spec-cii.d22, spec-cii.d23, spec-cii.e22,
           spec-cii.e23, spec-cii.e24, spec-cii.f38, spec-cii.f11,
           spec-cii.f5, spec-cii.f6, spec-cii.f7, spec-cii.f8, spec-cii.f10]
    depends_on: [MicroOp, VecBundles, VecTrace]
    # 16 entries (CII_N_TAGS), 4-bit tag (CII_TAG_W). The CII NEVER carries
    # physical register numbers: sources are named by an abstract op_id (source
    # slot) + member offset, and this table maps slot+offset -> PRN.
    # Per tag: rob_idx, pvdest_grp, pvs1/pvs2/pvs3_grp, stale_pvdest_grp, pvm,
    # captured scalar operand, dest-group size, and `killed`.
    # `pvs3_grp` and `stale_pvdest_grp` are stored SEPARATELY and served on
    # separate op_ids — they coincide for RMW arithmetic but must not be merged
    # into one field, or the diverging case becomes unrepresentable
    # (see VecCiiOperandServer).
    # The tag is NOT the rob_idx and NOT an architectural register.

  VecCiiOperandServer:
    kind: module
    source: src/main/nlhdl/vec/cii/VecCiiOperandServer.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/cii/VecCiiOperandServer.scala
    group: vec_cii
    # D12 case 3: spec-cii.f5-f8 and f10 (the op_id -> PRN resolution mapping) were
    # RE-ALLOCATED to VecCiiTagTable, which is where the mux is emitted. This node
    # keeps the OUTCOME of each slot via f4, f9, f12 and vrf.j13/j14.
    reqs: [spec-cii.e13, spec-cii.e14, spec-cii.e15, spec-cii.f1, spec-cii.f2, spec-cii.f3,
           spec-cii.f4, spec-cii.f9,
           spec-cii.f12, spec-cii.f13, spec-cii.f14, spec-cii.f21, spec-cii.f22,
           spec-cii.f23, spec-cii.f31, spec-cii.f32, spec-cii.f33, spec-cii.f34, spec-cii.f44,
           spec-cii.f45, spec-cii.f46, spec-vrf.h7, spec-vrf.i8, spec-vrf.i9, spec-vrf.j13,
           spec-vrf.j14, spec-vrf.j15]
    depends_on: [VecBundles, VecTrace]
    # Services Src-Request -> VRF/scalar read -> Src-Data, in order, on VRF read
    # ports R5-R8 (four lanes, CII_NUM_SRC_REQ = 4).
    # op_id mapping:
    #   CII_SRC_NONE     -> reserved, "no source needed"
    #   CII_SRC_VS1      -> pvs1_grp(offset)
    #   CII_SRC_VS2      -> pvs2_grp(offset)
    #   CII_SRC_VS3      -> pvs3_grp(offset)          explicitly encoded 3rd src
    #   CII_SRC_VM       -> pvm (v0)
    #   CII_SRC_SCALAR   -> the .vx/.vf value captured at issue (no VRF read)
    #   CII_SRC_STALE_VD -> stale_pvdest_grp(offset)  old-vd, for merging
    #
    # ===> RESOLVED. VS3 and STALE_VD are TWO DISTINCT SLOTS naming TWO DISTINCT
    #      GROUPS. MicroOp carries both `pvs3` and `stale_pvdest` as separate
    #      fields, and this module performs NO instruction-dependent
    #      reinterpretation — it serves whichever slot is requested straight from
    #      the side-table. THE COPROCESSOR DECIDES WHAT TO PULL:
    #        - RMW arithmetic (vfmacc.vv vd,vs1,vs2 -> vd += vs1*vs2): the third
    #          source IS old-vd, both name the SAME group, VPU pulls ONE.
    #        - When they differ (masked vadd.vv under vma=0; vslideup untouched
    #          prefix; vcompress tail): VPU pulls BOTH, spending another lane.
    #      An earlier draft had ONE VS3 slot that the HOST resolved to
    #      stale_pvdest "when the instruction encodes no third source". That put
    #      instruction decoding in the host adapter and made the
    #      two-different-groups case UNREPRESENTABLE — no way to obtain pvs3 AND
    #      old-vd for the same instruction.
    #
    # ===> SV DELTA REQUIRED (the one place v2 is not host-only). Slot 6 is a
    #      one-VALUE addition to cii_caracal_srcid_e: the wire type is already
    #      `logic [2:0]`, so 6 and 7 were free and NO payload width changes. But
    #      the VPU decoder must be able to emit it, and the SV currently names
    #      slot 3 `CII_SRC_VS3_VD` ("3rd src / old dest for RMW") with opnd_p2
    #      serving both roles. Coordinate this with the VPU owner.
    #
    # Also see VecCiiFlush: a request for a KILLED tag must still be answered.

  VecCiiWriteback:
    kind: module
    source: src/main/nlhdl/vec/cii/VecCiiWriteback.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/cii/VecCiiWriteback.scala
    group: vec_cii
    reqs: [spec-cii.e16, spec-cii.e17, spec-cii.f42, spec-cii.g1, spec-cii.g3, spec-cii.g4,
           spec-cii.g6, spec-cii.g7, spec-cii.g8, spec-cii.g16, spec-cii.g17, spec-cii.g18,
           spec-cii.g19, spec-cii.g20, spec-cii.g21, spec-cii.g22, spec-cii.i1, spec-cii.i4,
           spec-cii.i8, spec-cii.i10, spec-cii.i11]
    depends_on: [VecBundles, VecTrace]
    # Places writeback beats by wb_status.dst_kind: CII_DST_VEC -> VRF W2 at
    # pvdest_grp(wb_dst_offset); CII_DST_INT -> INT RF (vmv.x.s, vcpop.m,
    # vfirst.m); CII_DST_FP -> FP RF (vfmv.f.s). Accumulates vxsat and fflags.
    # On the beat marked `last`, emits ONE group-done (+ rob clr_bsy).
    # A `last` beat for a killed tag is consumed and its four effects suppressed
    # (no VRF write, no group-done, no rob clear, no CSR side effect).

  # --- Last-beat completion, split from beat placement ------------------------
  # NEW NODE (v2 amendment). Split out of VecCiiWriteback (41 reqs). The seam is
  # the `last` bit: the coprocessor MARKS the final beat of a tag (cii.g9), and
  # the host must NOT infer completion by counting beats (cii.g15) — the
  # Writeback channel deliberately carries no expected-count field (cii.g23).
  #
  # So completion needs almost nothing from placement: one bit on the beat plus
  # the tag's side-table entry. That low coupling is what makes this a clean
  # split, and it is the reason the equivalent split was NOT made in
  # VecLoadCoalescingBuffer — there, assembly and completion share the per-entry
  # byte-valid bitmap, and cutting between them would put a shared counter on a
  # module boundary.
  VecCiiComplete:
    kind: module
    source: src/main/nlhdl/vec/cii/VecCiiComplete.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/cii/VecCiiComplete.scala
    group: vec_cii
    reqs: [spec-cii.e18, spec-cii.e19, spec-cii.e20, spec-cii.e21, spec-cii.g5, spec-cii.g9,
           spec-cii.g10, spec-cii.g11, spec-cii.g12, spec-cii.g13, spec-cii.g14, spec-cii.g15,
           spec-cii.g23, spec-cii.i3, spec-rob.c1, spec-rob.d18, spec-rob.g14, spec-rob.g15,
           spec-rob.g16, spec-issue.d8]
    depends_on: [VecBundles, VecTrace]
    # On the `last` beat of a live vector-destination op it emits, ONCE:
    #   - one VecGroupDone carrying the member-PRN vector   (cii.g10)
    #   - one ROB busy-clear for rob_idx                    (cii.g11)
    #   - the tag free                                      (cii.g12)
    # There is NO per-member ROB completion (cii.g14) — same group-done contract
    # as the LCB, and the reason the ROB needs no per-entry counter.
    # fflags accrue toward commit (cii.g5); vxsat is the sticky saturation bit.
    #
    # ===> ALL FOUR EFFECTS ARE SUPPRESSED FOR A KILLED TAG (cii.g13, e18-e21),
    #      and this is the second half of the drain contract in VecCiiFlush: the
    #      beat is still POPPED and its credit still returned (that is
    #      VecCiiWriteback's cii.e16), but no group-done, no ROB clear, no CSR
    #      side effect. A killed tag is freed on its dropped last beat exactly
    #      like a live one (cii.e21) — the tag lifetime is identical, only the
    #      effects differ. Freeing it early would let it be reallocated before
    #      its beats stop arriving.

  VecCiiFlush:
    kind: module
    source: src/main/nlhdl/vec/cii/VecCiiFlush.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/cii/VecCiiFlush.scala
    group: vec_cii
    reqs: [spec-cii.d5, spec-cii.e1, spec-cii.e2, spec-cii.e3, spec-cii.e4, spec-cii.e5,
           spec-cii.e6, spec-cii.e7, spec-cii.e8, spec-cii.e9, spec-cii.e10, spec-cii.e11,
           spec-cii.e12, spec-cii.e26, spec-cii.e27]
    depends_on: [VecBundles, VecTrace]
    # THE DRAIN-ON-FLUSH CONTRACT. Past-PNR issue removes BRANCH-kill but NOT
    # flush recovery: past-PNR is not a commit guarantee. rob.scala:436-442
    # documents the exact hole — on MINI_EXCEPTION_MEM_ORDERING the failing load
    # "will have been marked safe already", because rob_unsafe clears on the
    # load's first address translation while order_fail is discovered later. So a
    # ROB-head flush (exception, mem-ordering, CSR replay, ERET) CAN squash work
    # the CII has already accepted. Branch mispredicts cannot.
    #
    # Kill scope is ALL in-flight tags, with no age comparator. Flushes always
    # fire at the ROB head, and rob.io.flush.bits carries no rob_idx to compare
    # against (only badvaddr/cause/ftq_idx/pc_lob/edge_inst/is_rvc/flush_typ).
    # Kill-all is therefore both correct and cheaper.
    #
    # ===> THE SRC-DATA BEAT IS MANDATORY. A killed tag's Src-Request MUST still
    #      be answered, with don't-care data. It is NOT valid to ignore the
    #      request and return credit: on the Src-Data channel the HOST IS THE
    #      SENDER and holds no credit to return, and the VPU has no kill line —
    #      so a swallowed request stalls the channel for every SURVIVING
    #      instruction, not just the killed one. Drain with don't-care beats,
    #      then suppress the four effects at writeback.
    #      Do NOT reuse this drain-and-discard pattern in the LSU
    #      (see VecSquashUnit).

  # ===========================================================================
  # SV COPROCESSOR
  # The ONE new SV module (the shim), then the frozen verified stack. Internals
  # are shown so a waveform signal can be located, not because this flow writes
  # them.
  # ===========================================================================
  tt_cii_host_wrap:
    kind: module
    source: src/main/nlhdl/sv/tt_cii_host_wrap.nlhdl.sv
    mode: new
    target_hdl: sv
    output: src/main/sv/v4/generated/tt_cii_host_wrap.sv
    group: coproc
    reqs: [spec-cii.c2, spec-cii.c4, spec-cii.c5, spec-cii.c6, spec-cii.c7]
    reset: core_rst_n
    depends_on: [tt_cii_caracal_pkg]
    instantiates:
      - { module: tt_cii,                  instance: relay }
      - { module: tt_vpu_cii_wrapper_top,  instance: vpu }
    connect:
      ifh: { interface: tt_cii_interface }   # host  <-> relay
      ifc: { interface: tt_cii_interface }   # relay <-> coproc
    # THE ONLY new SV in v2, and it exists for a hard reason: a Chisel BlackBox
    # can bind flat `logic` ports only — not an SV `interface`/`modport`, and not
    # `parameter type` packed-struct ports. tt_vpu_cii_wrapper_top's CII port is
    # `tt_cii_interface.coprocessor cii_intf`, so it cannot be a BlackBox target
    # directly. This module flattens the four channels to lane-packed ports and
    # repacks them into tt_cii_interface structs:
    #
    #   flat host ports <-> ifh(host) --tt_cii relay-- ifc <-> vpu
    #
    # Also the single reset-polarity crossing: Chisel active-HIGH `core_reset` in,
    # active-LOW `core_rst_n` to the SV stack.
    # Port names and directions MUST match the Chisel BlackBox io exactly.
    # `addvector`'s version (203 lines) is a working reference.

  tt_cii:
    kind: module
    blackbox: true
    target_hdl: sv
    output: src/main/sv/v4/tt-cii/src/tt_cii.sv
    group: coproc
    # The credit relay joining the two interface instances. Verified; frozen.
    instantiates:
      - { module: tt_cii_channel, instance: ch_issue }
      - { module: tt_cii_channel, instance: ch_src_req }
      - { module: tt_cii_channel, instance: ch_src_dat }
      - { module: tt_cii_channel, instance: ch_wb }
    ports:
      - { name: clk,         dir: input,  width: 1 }
      - { name: rst_n,       dir: input,  width: 1 }
      - { name: cii_host,    dir: inout,  width: tt_cii_interface }
      - { name: cii_coproc,  dir: inout,  width: tt_cii_interface }

  tt_cii_channel:
    kind: module
    blackbox: true
    target_hdl: sv
    output: src/main/sv/v4/tt-cii/src/tt_cii_channel.sv
    group: coproc
    instantiates:
      - { module: tt_cii_fifo, instance: fifo }
    ports:
      - { name: clk,   dir: input, width: 1 }
      - { name: rst_n, dir: input, width: 1 }
    # Credit-metered channel. One definition, four instances (see tt_cii).

  tt_cii_fifo:
    kind: module
    blackbox: true
    target_hdl: sv
    output: src/main/sv/v4/tt-cii/src/tt_cii_fifo.sv
    group: coproc
    ports:
      - { name: clk,   dir: input, width: 1 }
      - { name: rst_n, dir: input, width: 1 }

  tt_vpu_cii_wrapper_top:
    kind: module
    blackbox: true
    target_hdl: sv
    output: src/main/sv/v4/vpu/tt_vpu_cii_wrapper_top.sv
    group: coproc
    depends_on: [tt_cii_caracal_pkg, tt_briscv_pkg]
    ports:
      - { name: clk,                dir: input,  width: 1 }
      - { name: reset_n,            dir: input,  width: 1 }
      - { name: cii_intf,           dir: inout,  width: tt_cii_interface }
      - { name: debug_wb_vec_valid, dir: output, width: 1 }
      - { name: debug_wb_vec_wdata, dir: output, width: "VLEN * 8" }
      - { name: debug_wb_vec_wmask, dir: output, width: 8 }
    # REFACTORED AND VERIFIED (src/main/sv/v4/vpu/tb/cii_fv_tb.sv plays the host
    # through the real relay and checks per-member writeback, including
    # widening/narrowing where dst EMUL != src EMUL). v2 does not touch it.
    #
    # Facts the host must respect:
    #   - Keeps its vector regfile as a PER-INSTRUCTION CII STAGING BUFFER. The
    #     ARCHITECTURAL vector RF lives in BOOM; the coprocessor is a client of
    #     it through the CII, not its owner.
    #   - Holds per-instruction operand registers opnd_p0/p1/p2 (VS1/VS2/VS3) up
    #     to 8 member beats each, plus opnd_vm. Member index == receive beat
    #     count, so SRC-DATA BEATS MUST ARRIVE IN MEMBER ORDER per source.
    #   - The debug_wb_vec_* ports feed the cosim checker. The Whisper cosim does
    #     NOT deeply compare vector-STORE memory data — a garbage vector store
    #     passes the per-instruction check and is caught only by a later scalar
    #     load-back. A memory-compare hook is a recommended follow-on.
    # Internals (tt_id, tt_vec_top, the int/fp datapath units, tt_vec_regfile)
    # are deliberately NOT transcribed: verified SV, outside this flow's scope.
