    depends_on: [VecBundles, VectorParams, VecTrace]
    # Maps architectural vreg -> physical GROUP (base PRN + size). NO per-PRN
    # LMUL tag table and NO whole-group checker: an earlier draft carried a
    # 32x2b tag table plus comparators to detect non-whole-group reads. Deleted
    # deliberately — atomic group rename makes every read whole-group by
    # construction, so the checker can only ever confirm what the mapper already
    # guarantees, at the cost of 32x2b of state and a comparator tree in the
    # rename critical path.

  VecFreeList:
    kind: module
    source: src/main/nlhdl/vec/rename/VecFreeList.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/rename/VecFreeList.scala
    group: vec_rename
    reqs: [spec-rename.e4, spec-rename.e8, spec-rename.e9, spec-rename.e14, spec-rename.e15,
           spec-rename.f1, spec-rename.f2, spec-rename.f3, spec-rename.f4, spec-rename.f5,
           spec-rename.f6, spec-rename.f7, spec-rename.f8, spec-rename.f9, spec-rename.f10,
           spec-rename.f11, spec-rename.f12, spec-rename.f13, spec-rename.h11, spec-rename.h17,
           spec-rename.h22, spec-vrf.b11, spec-vrf.d7, spec-issue.c3]
    depends_on: [VecBundles, VectorParams, VecTrace]
    # ALL-OR-NOTHING group allocation. A shared instruction needs pvdest AND
    # pvtmp; it allocates both or neither, then stalls. That is the entire
    # forward-progress requirement — no headroom reservation is needed, because
    # rename is in program order, so stalling is safe (hence no
    # `numVecTmpGroups`).
    # Capacity: read `maxRenamableGroups`/`maxRenamableSegGroups` from
    # VectorParams; do NOT recompute. At the 96-PRN default those are 8 and 4
    # ((96-32)/8). An earlier revision said "(128 - 32) / 8 = 12" — the
    # pre-amendment 128-PRN sizing.
    #
    # ===> CLOSED by decision D3 — no parameter change was needed.
    #      rename.f5 fixes `allocWidth = coreWidth*8`, and a SHARED OP.v needs up
    #      to 2*maxGroupSize = 16 distinct PRNs in ONE cycle (pvdest AND pvtmp,
    #      all-or-nothing). At coreWidth == 1 the pool is 8, so such an op could
    #      never allocate — a DEADLOCK, not a stall. **SmallBoom is therefore out
    #      of the vector matrix entirely** (it also cannot elaborate
    #      CompactingDispatcher), so coreWidth >= 2 always and allocWidth >= 16
    #      exactly meets the requirement. The elaboration
    #      `require(allocWidth >= 2*maxGroupSize)` stays as the guard and now
    #      documents WHY Small has no vector config.
    #      The alternative "Small forbids segmented vector LS" was REJECTED as
    #      architecturally invalid: segmented load/store is base RVV 1.0 and
    #      spec-core.a2 requires RVV 1.0, so such a core would be non-conformant.
    #      Perf note: at Medium, allocWidth = 16 and ONE shared OP.v consumes the
    #      entire allocation window, so nothing else in that bundle allocates that
    #      cycle. A stall, not a deadlock.
    # Freeing pvtmp at commit (rename.e9) needs a SECOND dealloc bank beside the
    # stale bank, since commit cannot stall; f12's commitWidth*8 covers the stale
    # bank only.

  VecBusyTable:
    kind: module
