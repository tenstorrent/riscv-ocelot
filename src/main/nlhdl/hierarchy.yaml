  # ===========================================================================
  # VecPipeline — the container. One instantiation in core.scala; everything
  # vector lives below here.
  # ===========================================================================
  VecPipeline:
    kind: module
    source: src/main/nlhdl/vec/VecPipeline.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/VecPipeline.scala
    group: vec
    reqs: [spec-core.a2, spec-core.a3, spec-core.a5, spec-core.a6, spec-core.c9, spec-core.d5,
           spec-core.f6, spec-core.g1, spec-core.g3, spec-core.i3, spec-core.i4, spec-core.i5,
           spec-core.i6, spec-core.i7, spec-core.i8, spec-rename.b10, spec-rename.b11,
           spec-rename.e11, spec-rename.h15, spec-decode.b4, spec-decode.c22, spec-decode.i4,
           spec-vrf.c11, spec-vrf.i4, spec-rob.c5, spec-rob.d10, spec-rob.d11, spec-issue.c9,
