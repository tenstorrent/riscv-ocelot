# =============================================================================
# hierarchy.yaml — Caracal Milestone Plan v2 module map
# =============================================================================
# The authoritative map for the v2 (combined M1+M2) host-side implementation.
# The SV coprocessor (VPU + TT-CII) is REFACTORED AND VERIFIED: it appears here
# as blackboxes so the map can show where a waveform signal comes from, but this
# flow does not rewrite it. v2 changes the BOOM host (Chisel) plus exactly two SV
# nodes:
#   - `tt_cii_host_wrap`     (mode: new)           the flattening shim
#   - `tt_cii_caracal_pkg`   (mode: edit_existing)  ONE added enum value,
#                                                   CII_SRC_STALE_VD = 3'd6
# Everything else SV is blackbox. Note the second one means v2 is NOT strictly
# host-only; it also needs the VPU decoder to emit the new slot, which is outside
# this map and must be coordinated with the VPU owner.
#
# PATH CONVENTION: every `source:`, `output:`, and `target:` path in this file is
# REPO-RELATIVE (from /proj_risc/user_dev/ading/riscv-ocelot), not relative to
# this file. Unambiguous, because targets point outside the nlhdl tree.
#
# GENERATED CHISEL LOCATION: sbt only compiles under `src/main/scala/`, so
# `mode: new` Chisel lands at `src/main/scala/v4/vec/generated/<Module>.scala`
# (package `boom.v4.vec.generated`). This satisfies both sbt and the
# validator's "`output:` under a `generated/` directory" rule.
#
# -----------------------------------------------------------------------------
# WHY v2 EXISTS — the performance failure this map is shaped to prevent
# -----------------------------------------------------------------------------
# The M1+M2 attempt (`origin/Caracal/addvector`, 41 files / ~10.4k lines) was
# functional but serialized. Root cause was STRUCTURAL, not tuning:
# `VecLSU.scala:159` declared module-level `state` + `grp_active` registers and
# line 506 exported `io.busy := grp_active || (state =/= sIdle)`, which gated
# `fu_ready`. ONE FSM, shared by both directions, spanning operand-read → AGEN →
# D$ → completion. Concurrency ceiling of 1 vector memory op machine-wide, by
# construction. Everything else followed from it: the load-priority mux, the
# dropped store grant, the serial sCopyRd/sCopyWr undisturbed-copy prologue, and
# `agen_active` having to OR in `vec_dgen.active`.
#
# ===> INVARIANT (vec_lsu group). No module in the vector LSU may hold state
#      scoped to "the current instruction", and no module may export a `busy`
#      that gates issue. In-flight state lives ONLY in (a) the six element
#      queues, whose capacity was reserved at dispatch in program order, and
#      (b) the LCB's per-PRN assembly entries. `VecElemAgen` keeps an element
#      cursor but retires it the moment the last element is pushed into the
#      queue — it never waits on a D$ response or on completion, so it cannot
#      gate the next instruction. Issue eligibility is purely "is there a
#      reservation", decided at dispatch.
#      This invariant is also a v2 plan ground rule. A violation is reviewable.
#
# -----------------------------------------------------------------------------
# REQUIREMENT CORPUS — what `reqs:` on each node below means
# -----------------------------------------------------------------------------
# src/main/nlhdl/reqs/ holds 1162 live requirements across 10 families, derived
# from the .rst spec by /spec-to-reqs. Every one is allocated to exactly one node
# below (1065) or entered in `reqs_out_of_scope:` with a reason (97).
#
# ALLOCATION IS NOT IMPLEMENTATION. `reqs:` here says "this module OWES this
# obligation". The claim that code SATISFIES it is the requirement-tag comment
# (the "at-req" prefix documented by spec-to-reqs, followed by the ID) placed in
# the nlhdl source and carried into the RTL. The two are separate records on
# purpose: the gap between them is the work outstanding, which is why this file
# is a plan and not a status. As of this amendment nothing is tagged yet — plan
# step R4 is where the citation map is established.
#
# BARE IDS ONLY BELOW. The spec-to-reqs validator greps .yaml files for that tag
# prefix as a literal token, so writing a tagged ID anywhere in this file — even
# inside a comment, even as a counter-example — registers as an implementation
# claim and inflates coverage before a line of RTL exists. That is why the
# paragraph above spells the prefix out in words rather than as itself.
#
# ===> AMENDMENT (this revision) — NINE NODES ADDED, 49 non-blackbox -> 58.
#      The previous map allocated no requirements at all. Reading the corpus
#      against it surfaced three kinds of gap, and each new node names one:
#        1. MECHANISMS WITH NO OWNER. VecGroupCopy (the VL==0 / fully-inactive
#           destination-group copy, 13 reqs) and VecOrderHold (the
#           predicted-overlap hold, 6 reqs) were specified in loadstore.rst and
#           had nowhere to live. These are the ones that would have been
#           discovered during bring-up.
#        2. NODES OVER THE REVIEWABILITY BAR. VecIssueSlot (56), VecRegFile
#           (48), VConfigUnit (44), VecCiiWriteback (41) and VecCrossLsuSnoop
#           (40+) each split along a seam the corpus already draws:
#           VecGroupReady, VecStoreDgenPath, VecRegFileBank, VtypeTable,
#           VecCiiComplete, VecStoreForward.
#        3. A MISSING DIRECTION. The CII host had a node per channel direction
#           except Issue; VecCiiIssue closes that.
#      Three nodes remain over 40 by deliberate choice, and the reason differs:
#      `Rob` (85) and `LSU` (45) are edit_existing, where most reqs are
#      must-not-regress constraints discharged collectively by the edit_scope's
#      out-of-scope list rather than per-line logic; `VecPipeline` (49) is the
#      container, whose reqs are wiring topology and design-wide invariants
#      checked by cross-file inspection (plan step R3), not logic in one file.
#
# -----------------------------------------------------------------------------
# SPEC OF RECORD
# -----------------------------------------------------------------------------
# docs_caracal/src/*.rst. Load-bearing anchors:
#   loadstore.rst  :ref:`ssi-queues` `load-coalesce` `mem-order` `vec-squash`
#                  `elem-progress` `vec-queue-reservation`
#   midcore.rst    :ref:`vrf-ports` `old-vd`
#   cii.rst        :ref:`cii-flush` `cii-operands`
#   frontend.rst   :ref:`vector-csr-ownership` `vset-dual-dest`
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# Defaults: the design is predominantly Chisel, so `scala` is the default target
# and Chisel's implicit reset convention (posedge clk, ACTIVE-HIGH sync reset)
# is the default. SV nodes override both.
# -----------------------------------------------------------------------------
defaults:
  target: scala
  clock: core_clk
  reset: core_reset
  reset_polarity: active_high
  reset_sync: sync

clocks:
  core_clk: { freq_mhz: 1000 }      # single domain; the coprocessor is synchronous

# NOTE: two resets, one domain. Chisel's implicit reset is ACTIVE-HIGH; the SV
# coprocessor stack takes ACTIVE-LOW `reset_n`. The inversion happens exactly
# once, in `tt_cii_host_wrap`. Declared as two named resets so that crossing is
# visible in the map instead of being an undocumented `~reset` in the shim.
resets:
  core_reset: { clock: core_clk, polarity: active_high, sync: sync }  # Chisel
  core_rst_n: { clock: core_clk, polarity: active_low,  sync: sync }  # SV coproc

# -----------------------------------------------------------------------------
# Interfaces
# -----------------------------------------------------------------------------
interfaces:

  # === THE seam of the v2 design ============================================
  # `addvector` added 1101 lines to core.scala, braiding vector wiring line-by-
  # line through scalar wiring. v2 replaces that with ONE explicit bundle. It is
  # deliberately WIDE — a wide named interface is safer than 1101 implicit
  # connections, and enumerating it here is the point, not an accident.
  #
  # Load-bearing detail: the rename inputs are named `ren2_uops`/`dis_fire`, NOT
  # `dec_uops`. The M1 free-list double-free was vector rename running
  # combinationally off `dec_uops`, one cycle AHEAD of the scalar RenameStage's
  # registered ren1→ren2 pipeline, so at dispatch the vec fields reflected the
  # NEXT cycle's (bubble) uop and two ops freed PRN 0. With these port names,
  # wiring `dec_uops` here is visibly wrong at the connection site.
  vec_pipeline_io:
    description: "BoomCore <-> VecPipeline. The complete vector-subsystem seam."
    params:
      - { name: coreWidth,  default: 3 }
      - { name: vLen,       default: 256 }
      - { name: xLen,       default: 64 }
    signals:
      # ---- decode feed (vector decode lives inside VecPipeline) ------------
      - { name: dec_insns,          dir: fwd, width: "32 * coreWidth" }
      - { name: dec_valids,         dir: fwd, width: coreWidth }
      # ADDED (amendment). VConfigUnit requires FIRE, not validity: the vtype
      # mirror must advance only on a lane that actually leaves decode. On a
      # partially-firing bundle, updating on `dec_valids` makes the mirror
      # DOUBLE-ABSORB a vset when the bundle re-presents, so younger uOPs snapshot
      # a vtype that was applied twice.
      - { name: dec_fire,           dir: fwd, width: coreWidth }
      - { name: dec_uops_in,        dir: fwd, width: "MicroOp * coreWidth" }
      - { name: dec_uops_out,       dir: bwd, width: "MicroOp * coreWidth" }
      - { name: dec_vec_illegal,    dir: bwd, width: coreWidth }
      # ---- rename / dispatch lockstep (see note above) ---------------------
      - { name: ren2_uops,          dir: fwd, width: "MicroOp * coreWidth" }
      - { name: ren2_mask,          dir: fwd, width: coreWidth }
      - { name: dis_fire,           dir: fwd, width: coreWidth }
      - { name: dis_ready,          dir: bwd, width: 1 }
      # ADDED (D2). The three vector issue queues are wired NATIVELY from
      # `dispatcher.io.dis_uops(i)` under `CompactingDispatcher`, so per-queue
      # capacity crosses the seam on its own per-lane wires instead of being folded
      # into the single `dis_ready` bit. `dis_ready` now carries the whole-bundle
      # ALLOCATION conditions only (both `alloc_ok`s and `vlsu.dis_ok`).
      # Ordering is {IQ_V_LOAD, IQ_V_STORE, IQ_V_ALU} x coreWidth.
      - { name: dis_vec_valids,     dir: fwd, width: "coreWidth * 3" }
      - { name: dis_vec_ready,      dir: bwd, width: "coreWidth * 3" }
      # ===> ADDED (amendment). THE SEAM HAD NO RETURN PATH FOR THE RENAMED UOP.
      #      `Rob` stores a full MicroOp (rob.scala:364) and VecRenameSpace frees
      #      `stale_pvdest`/`pvtmp` off `commit_uops` — so the vector PRNs MUST be
      #      present in `rob.io.enq_uops`, and nothing carried them back. Consumed
      #      by `rob.io.enq_uops` ONLY: writing it back into `dis_uops` is a
      #      per-field combinational loop, and per-field patching is exactly the
      #      1101-line braiding v2 exists to delete.
      - { name: dis_uops_out,       dir: bwd, width: "MicroOp * coreWidth" }
      # ---- speculation / recovery -----------------------------------------
      - { name: brupdate,           dir: fwd, width: BrUpdateInfo }
      - { name: rob_pnr_idx,        dir: fwd, width: robAddrSz }
      # ADDED (amendment). BOOM's age comparison is 3-arg: IsOlder(a, b, head).
      # `spec-issue.g21`/`e13` say an IQ_V_ALU entry's eligibility is
      # `is_older(rob_idx, rob_pnr_idx)`, which is not computable from the two
      # indices alone — the ROB is circular, so the head is what disambiguates
      # wrap. Without it every pnrGate slot would need its own (wrong) 2-arg
      # comparison and the past-PNR gate would invert across a wrap boundary,
      # letting a YOUNGER-than-PNR op reach the coprocessor. That is precisely
      # the speculation the CII must never see.
      - { name: rob_head_idx,       dir: fwd, width: robAddrSz }
      - { name: rob_flush,          dir: fwd, width: 1 }
      - { name: rob_flush_kill,     dir: fwd, width: 1 }
      # ADDED: VConfigUnit's quiescent-state check (mirror == architectural vtype)
      # is vacuous without it — tying it false silently disables the assertion.
      - { name: rob_empty,          dir: fwd, width: 1 }
      # ---- commit ---------------------------------------------------------
      - { name: commit_valids,      dir: fwd, width: coreWidth }
      - { name: commit_uops,        dir: fwd, width: "MicroOp * coreWidth" }
      - { name: commit_rollback,    dir: fwd, width: 1 }
      # ---- completion back into the ROB (group-done) -----------------------
      # WIDENED to ONE LANE PER PRODUCER (amendment). `vec_clr_bsy` had TWO
      # producers — the LSU/LCB group-done and VecCiiComplete — on a single
      # Valid, and NEITHER can be back-pressured: the CII frees its tag in the
      # same cycle it completes, so a clear lost to arbitration is unrecoverable
      # and the ROB entry never retires. Lanes, not an arbiter.
      #   lane 0 = LCB group-done, lane 1 = VecCiiComplete, lane 2 = VecGroupCopy
      - { name: vec_clr_bsy,        dir: bwd, width: "(robAddrSz + 1) * numVecClrPorts" }
      - { name: vec_clr_unsafe,     dir: bwd, width: "robAddrSz + 1" }
      - { name: vec_xcpt,           dir: bwd, width: VecException }
      # ===> ADDED (amendment). The CSR side effects of vector arithmetic had no
      #      path to commit. `fflags` and `vxsat` accrue per ROB entry and are
      #      applied at COMMIT, not at writeback — pulsing
      #      `csr.io.vector.set_vxsat` at writeback is not flush-safe, since a
      #      past-PNR CII op can still be squashed by a ROB-head flush.
      #      NOTE for the Rob delta: rob.scala:405 asserts
      #      `!rob_fflags(row_idx).valid`, so a vector op must write the existing
      #      per-entry fflags slot ONCE — a second write per entry fires the
      #      assert. That is why a CII scalar-dest writeback must leave
      #      `ExeUnitResp.fflags` invalid and route flags here instead.
      - { name: vec_rob_flags,      dir: bwd, width: "VecRobFlags * numVecClrPorts" }
      # ---- scalar feeders: vector ops read INT/FP for base/stride/.vx/.vf ---
      # WIDENED 3 -> 5 (amendment, in two steps). Four are for the two
      # VecScalarOperandRead instances, each needing TWO concurrent INT reads
      # (base prs1 + stride prs2 in parallel) — serializing base and stride is
      # what forced the single-FSM operand read in the previous attempt.
      # ===> THE FIFTH IS VecCiiIssue's, and an earlier revision of this comment
      #      wrongly said it needed none "because it captures .vx/.vf BY VALUE
      #      from the bypass". `spec-cii.f24` does say "captured from the INT/FP
      #      bypass at issue", but in BOOM the bypass network sits ON TOP OF a
      #      register-file read — it is not a substitute for one. And the CII case
      #      is the worst possible one for a bypass-only capture: IQ_V_ALU is
      #      PAST-PNR gated, so a granted op is OLD, and its scalar producer has
      #      almost always retired and left the bypass network entirely. Capturing
      #      from the bypass alone would read a stale or unrelated value with no
      #      error. `spec-cii.f41` ("delivered by value rather than by address")
      #      is about what crosses the CII, not about how the host obtains it.
      # ===> AND IT MUST BE PER-LANE `Decoupled`, NOT A BARE ADDRESS. BoomCore
      #      found that `iregfile.io.arb_read_reqs` is `Flipped(Decoupled)` and
      #      `PartiallyPortedRF` DENIES by index priority. The INT RF is
      #      deliberately partially ported (numIrfReadPorts = 3 on Medium against
      #      ~10 logical readers), so denial is ROUTINE, not exceptional — and no
      #      placement or affordable port count fixes it, since 5 > 3. Every scalar
      #      EU already holds its address until fire; the vector readers must too,
      #      with the response registered at t+1 off the GRANTED address. A bare
      #      address here would silently read whatever the arbiter granted instead.
      - { name: int_rf_read_req,    dir: bwd, width: "DecoupledReadReq * 5" }
      - { name: int_rf_read_rsp,    dir: fwd, width: "xLen * 5" }
      - { name: int_wakeups,        dir: fwd, width: IntWakeupBus }
      # ===> SPLIT OUT (D2). `IntWakeupBus` was an AGGREGATE of three things --
      #      the wakeup Vec, `child_rebusys` and `squash_grant` -- and D2's first
      #      pass declared only the Vec, dropping the other two. VecPipeline then
      #      found every VecIssueUnit instance declares both as unconditional
      #      inputs, could not compute either (both are BoomCore-internal:
      #      `alu_exe_units.map(_.io_squash_iss).reduce(_||_)`), and tied them to
      #      0/false as "safe defaults". THEY ARE NOT SAFE: `child_rebusys` is
      #      the RETRACTION half of BOOM's speculative wakeup -- VecIssueUnit
      #      uses it to re-mark a slot busy when a speculatively-woken scalar
      #      .vx/.vf feeder's parent load misses. Held at zero the retraction
      #      never arrives and the vector op issues against a stale GPR, with no
      #      assertion anywhere. Both are now their own members, driven by
      #      BoomCore. No FP counterpart exists -- BOOM has no FP analogue.
      - { name: int_child_rebusys,  dir: fwd, width: aluWidth }
      - { name: int_squash_grant,   dir: fwd, width: 1 }
      # ===> ADDED (amendment). `spec-vrf.e4` requires the `.vf` scalar feeder of a
      #      vector slot to be woken on the FP wakeup network, and VecIssueSlot
      #      keeps FP `.vf` comparators — but only `int_wakeups` was declared, so
      #      there was no FP readiness path at all and a `.vf` op could never
      #      become ready. FpPipeline's delta adds no new network: this is a tap of
      #      the EXISTING `io.wakeups`, fanned out by BoomCore.
      - { name: fp_wakeups,         dir: fwd, width: FpWakeupBus }
      # ===> ADDED (amendment). The INT WRITEBACK TAP, carrying {addr, data} per
      #      INT write port — NOT the same thing as `int_wakeups`, which carries
      #      readiness without data. Without this the M1 stale-scalar-base bug is
      #      unfixable: the vector LS is woken speculatively, so
      #      VecScalarOperandRead's INT-RF read can fire the same cycle the base
      #      GPR's writeback commits, and the INT RF is a registered Mem read with
      #      no read-during-write bypass — giving a stale base. The forward needs
      #      the DATA. Width must include the CII scalar-dest write port that
      #      `usingRVV` adds (numVecIrfWritePorts), or a base produced by
      #      `vmv.x.s` is missed. (The CII attach carries no enableVectorArith
      #      sub-gate — owner decision at Phase F; see VecCiiHost.nlhdl.)
      - { name: int_wb_snoop,       dir: fwd, width: "IntWbSnoop * numIrfWritePorts" }
      # D4: back to ONE lane. An earlier revision had two, the second for
      # VecScalarOperandRead's store instance — but `spec-agen.d3`'s FP leg is
      # UNREACHABLE. execution.rst cites `vfmul.vf` as a store DGEN reading an FP
      # scalar; `vfmul.vf` is vector-scalar FP arithmetic dispatched to the CII, not
      # a store. NO RVV store form takes an FP scalar: store data is always `vs3`,
      # and the scalar operands are rs1 (base) / rs2 (stride), both integer.
      # The single remaining reader is VecCiiIssue's `.vf`.
      # Note this also DISSOLVES the A30 fast-wakeup window: IQ_V_ALU is past-PNR
      # gated, so a granted CII op is older than the PNR and its FP producer has
      # genuinely written back — there is no bypass window left to close.
      - { name: fp_rf_read_req,     dir: bwd, width: pregSz }
      - { name: fp_rf_read_rsp,     dir: fwd, width: xLen }
      # ---- scalar-dest writeback (vmv.x.s, vcpop.m, vfirst.m, vfmv.f.s) ----
      - { name: int_wb,             dir: bwd, width: ExeUnitResp }
      - { name: fp_wb,              dir: bwd, width: ExeUnitResp }
      # ---- vector CSR state (OWNED by rocket CSRFile, see frontend.rst) -----
      # ===> CORRECTED (D2). This said `CSRVectorIO`. NO SUCH CLASS EXISTS —
      #      rocket declares the port anonymously as
      #      `val vector = usingVector.option(new Bundle { ... })`
      #      (rocket-chip CSR.scala:310), so there was no name to reference and A2
      #      left the member out rather than declare it wrong. The type is now
      #      `VecCsrRead`, declared in VecBundles: Caracal's READ-DIRECTION view,
      #      carrying only `{vconfig, vstart, vxrm}` — the three output-direction
      #      fields part 8 of VecPipeline says the container consumes. Rocket's
      #      input-direction fields (`set_vconfig`, `set_vstart`, `set_vxsat`,
      #      `set_vs_dirty`) are deliberately ABSENT: they are driven by BoomCore
      #      and the Rob delta, and a bundle with no write path cannot be used to
      #      write architectural vector CSR state, which is what ground rule 9
      #      wants. It uses rocket's own `VConfig` for the field that has a name.
      - { name: csr_vector,         dir: fwd, width: VecCsrRead }
      - { name: csr_frm,            dir: fwd, width: 3 }
      - { name: csr_vs_dirty,       dir: bwd, width: 1 }
      # ---- vset: the dual-destination rule (is_vl_producer) ----------------
      # D8: REPLICATED per ALU EU. `aluWidth == coreWidth` on every tier, so with
      # Small dropped (D3) the matrix is Medium(2)/Large(3)/Mega(4) and aluWidth is
      # NEVER 1 — every config replicates. ALUExeUnit advertises the vset FU on
      # every ALU EU instance and its reject list forbids an id-conditional
      # advertisement, so two vsets can write back in one cycle. Arbitrating is not
      # an option: a single-shot VL wakeup lost to arbitration is a PERMANENT HANG.
      # Cheap here specifically because the VL RF is 64x9b, not 96x256b.
      - { name: vset_resp,          dir: fwd, width: "ExeUnitResp * aluWidth" }
      # WIDENED to 2 LANES, never arbitrated: the ALU `vset` writeback and the
      # `vleff` VL trim are independent producers and neither can be
      # back-pressured. `vsetivli` needs no lane (pvl is born ready).
      - { name: vl_wakeup,          dir: bwd, width: "(vlPregSz + 1) * numVlWakeupPorts" }
      # ADDED: the VL-RF COMMIT READ DATA. rename.h21 requires the architectural
      # `vl` CSR to be written precisely at commit, and decode.i17 forbids any
      # path that carries VL outside the VL register file — so the value must come
      # back across this seam. The read ADDRESS is selected inside VecPipeline from
      # `commit_uops`, so no address member is needed.
      - { name: commit_vl,          dir: bwd, width: "vecVLSz + 1" }
      # ---- memory: the vector LSU's own D$ port + ordering hooks -----------
      - { name: lsu_vec,            dir: bwd, width: VecLsuCoreIO }
      - { name: lsu_fencei_rdy_vec, dir: bwd, width: 1 }
      # ---- debug / trace (ground rule: guarded printf, off by default) -----
      - { name: vec_trace_en,       dir: fwd, width: 1 }
      # Commit-time architectural VRF read for the cosim vector compare. One entry
      # per (commit port, group member); both are zero-length unless
      # enableVecCosimCheck, so a physical build carries neither.
      - { name: debug_read_addr,    dir: fwd, width: "vecPregSz * coreWidth * maxMembers" }
      - { name: debug_read_data,    dir: bwd, width: "vLen * coreWidth * maxMembers" }

  # === Frozen SV interface ==================================================
  # `tt_cii_interface.sv` is AUTHORITATIVE for these signals; this entry exists
  # only so `connect:` resolves and so the four channels are named in the map.
  # Do not treat the widths here as a specification — the SV `parameter type`
  # payloads come from tt_cii_caracal_pkg.
  tt_cii_interface:
    description: >
      Frozen 4-channel credit-metered CII interface (vendored SV, modport
      host/coprocessor). Authoritative source: src/main/sv/v4/tt-cii/src/
      tt_cii_interface.sv. Payload types from tt_cii_caracal_pkg.
    signals:
      - { name: issue,    dir: fwd, width: cii_caracal_issue_req_t }  # host->cop
      - { name: src_req,  dir: bwd, width: cii_caracal_src_req_t }    # cop->host
      - { name: src_dat,  dir: fwd, width: cii_caracal_dat_rsp_t }    # host->cop
      - { name: wb,       dir: bwd, width: cii_caracal_result_t }     # cop->host

top: BoomCore

# =============================================================================
# LIVE REQUIREMENTS THIS MAP DELIBERATELY DOES NOT ALLOCATE
# =============================================================================
# The corpus under src/main/nlhdl/reqs/ holds 1162 live requirements across 10
# families. Every one of them is either in some module's `reqs:` above or in this
# ledger — 1065 allocated, 97 here. An unallocated requirement is an ERROR, not
# an omission, because it is the one failure the rest of the flow cannot see: it
# is never written into an nlhdl file, never tagged, and therefore never missed.
# A reason is something a reviewer can disagree with; silence is not.
#
# Note what is NOT in here. "Must be unchanged from BOOM v4" is ledgered only
# where NO node targets the file in question, so nothing this flow writes could
# ever carry the tag. Where such a requirement lands on a file that IS an
# `edit_existing` target, it is ALLOCATED to that node instead: its
# `<|begin_edit_scope|>` out-of-scope / must-not-regress list is exactly the
# artifact that discharges it, and that is a claim worth tagging.
# =============================================================================
reqs_out_of_scope:

  # --- unmodified-frontend (6 live reqs) ---
  - reqs: [spec-core.b1, spec-core.e1, spec-core.e2, spec-core.e3, spec-core.e4, spec-decode.a2]
    reason: >
      Front-end fetch, TAGE prediction and the pre-decode path are untouched:
      no node in this map targets v4/ifu/**, so nothing this flow writes can
      carry a tag. Discharged by gate (f), usingRVV=false bit-identical to
      pre-Caracal v4.

  # --- unmodified-scalar-rename (18 live reqs) ---
  - reqs: [spec-core.e7, spec-rename.a8, spec-rename.a9, spec-rename.c2, spec-rename.c3,
