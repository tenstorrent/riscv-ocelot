  # ===========================================================================
  # RENAME — one parameterized space, two instances (see VecPipeline)
  # ===========================================================================
  VecRenameSpace:
    kind: module
    source: src/main/nlhdl/vec/rename/VecRenameSpace.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/rename/VecRenameSpace.scala
    group: vec_rename
    reqs: [spec-rename.a1, spec-rename.a2, spec-rename.a3, spec-rename.a4, spec-rename.a5,
           spec-rename.a6, spec-rename.a7, spec-rename.a11, spec-rename.b1, spec-rename.b2,
           spec-rename.b3, spec-rename.d1, spec-rename.e1, spec-rename.e3, spec-rename.e5,
           spec-rename.e13, spec-rename.e16, spec-rename.h5, spec-rename.h9, spec-rename.h10,
           spec-rename.h26, spec-rename.i2, spec-rename.i3, spec-rename.i4, spec-rename.i12,
           spec-rename.i13, spec-decode.c21, spec-decode.c24, spec-decode.i2, spec-decode.i3,
           spec-decode.i5, spec-decode.i8, spec-decode.i9]
    depends_on: [MicroOp, VecBundles, VectorParams, VecTrace]
    instantiates:
      - { module: VecMapTable,  instance: maptable }
      - { module: VecFreeList,  instance: freelist }
      - { module: VecBusyTable, instance: busytable }
    # LOCKSTEP CONTRACT (the M1 free-list double-free). This module allocates on
    # `dis_fire` off `ren2_uops`, in lockstep with the scalar RenameStage's
    # registered ren1->ren2 pipeline. It must NOT be driven combinationally from
    # `dec_uops` — doing so runs it one cycle ahead, and at dispatch the vec
    # fields reflect the NEXT cycle's (bubble) uop.
    #
    # `freeDiscipline` and `wakeupKind` are kept as EXPLICIT parameters rather
    # than derived from maxGroupSize, because the two instances genuinely differ:
    #   stale_group   + group_done : vector space. Frees the whole stale_pvdest
    #                                group at commit; wakes on one group-done
    #                                event carrying the member-PRN vector.
    #   committed_ptr + ready_bit  : VL space. Frees the outgoing committed
    #                                pointer (no stale_pvl exists); wakes as a
    #                                plain readiness bit, value read at execute.
    # Deriving these from group size would silently couple two unrelated design
    # decisions. Keep them named.
    #
    # TIMING RISK — the top timing risk in this design. Atomic group rename does
    # up to `coreWidth * 8` PRN allocations per cycle. Run a timing spike on
    # this module BEFORE the rename integration step lands; if the vector side
    # loses, the whole core's rename stage pays.

  VecMapTable:
    kind: module
    source: src/main/nlhdl/vec/rename/VecMapTable.nlhdl.scala
    mode: new
    output: src/main/scala/v4/vec/generated/rename/VecMapTable.scala
    group: vec_rename
    reqs: [spec-core.h4, spec-rename.a10, spec-rename.d2, spec-rename.d3, spec-rename.d4,
