  - id: spec-lsu.f5
    kind: function
    statement: >
      fault_elem must be latched on the first fault.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: elem-progress
      heading: "Per-Element Progress Tracking and Precise Exceptions"
      quote: >
        ``fault_elem`` — the index of the **oldest** faulting element, latched on the first
