  # --- m: the VL == 0 group copy ----------------------------------------------

  - id: spec-lsu.m1
    kind: function
    statement: >
      For every form other than immediate-AVL a VL = 0 op must reach issue, where pvl
      resolves to 0.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        For all other forms VL is not known at decode (it is renamed into the VL register
        file), so a ``VL = 0`` op reaches issue, where ``pvl`` resolves to 0.

  - id: spec-lsu.m2
    kind: function
    statement: >
      With VL = 0 the LSU must not execute any element.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        With ``VL = 0`` **no element is active**, so nothing executes

  - id: spec-lsu.m3
    kind: function
    statement: >
      The freshly-allocated pvdest group must be made architecturally correct before the
      entry can commit.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        but the freshly-allocated ``pvdest``
        group still has to be made architecturally correct before the entry can commit, because
        a new physical group was renamed for it.

  - id: spec-lsu.m4
    kind: function
    statement: >
      With vta = 0 the new destination group must equal the old value of the architectural
      vreg group.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        **Tail-undisturbed (``vta = 0``).** The new destination group must equal the **old**
        value of the architectural vreg group.

  - id: spec-lsu.m5
    kind: function
    statement: >
      The OP.v must perform a group copy of pvdest from stale_pvdest, one VLEN-wide copy per
      group member.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        The ``OP.v`` performs a **group copy** ``pvdest ← stale_pvdest`` —
        up to ``EMUL`` whole-register ``VLEN``-wide copies, one per group member, reading the
        stale group and writing the new group.

  - id: spec-lsu.m6
    kind: structure
    statement: >
      The group copy must reuse the Load Unit's VRF ports.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        This reuses the **Load Unit's VRF ports** (``R``/``W`` on the Load
        path, which are idle when no load is draining), so it adds **no new VRF ports**

  - id: spec-lsu.m7
    kind: structure
    statement: >
      The group copy must add no new VRF ports.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        This reuses the **Load Unit's VRF ports** (``R``/``W`` on the Load
        path, which are idle when no load is draining), so it adds **no new VRF ports**

  - id: spec-lsu.m8
    kind: function
    statement: >
      The group copy must complete with a single group-done.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        The copy completes with a single **group-done** (:ref:`group-done-wb`), exactly
        like a real load, so the ROB/Busy-Table/wakeup path is unchanged.

  - id: spec-lsu.m9
    kind: function
    statement: >
      With vta = 1 the VL = 0 entry must take the squash or complete-without-execute path.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        **Tail-agnostic (``vta = 1``).** The tail may hold any value, so no copy is required;
        the entry takes the squash / complete-without-execute path and emits its group-done
        immediately.

  - id: spec-lsu.m10
    kind: function
    statement: >
      With vta = 1 the VL = 0 entry must emit its group-done immediately.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        **Tail-agnostic (``vta = 1``).** The tail may hold any value, so no copy is required;
        the entry takes the squash / complete-without-execute path and emits its group-done
        immediately.

  - id: spec-lsu.m11
    kind: function
    statement: >
      On every masked or partial-tail vector op the inactive element lanes of the destination
      must be preserved or filled per vta/vma.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        on every masked or partial-tail vector op the inactive element lanes of the destination
        must be preserved or filled per ``vta``/``vma``.

  - id: spec-lsu.m12
    kind: function
    statement: >
      The standalone group copy must be used only for the no-execution VL = 0 or
      fully-inactive vta = 0 case.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        The standalone group
        copy above is therefore needed only for the no-execution ``VL = 0`` / fully-inactive
        ``vta = 0`` case.
    notes: >
      For loads the LCB already fills inactive byte lanes before its single VRF write
      (spec-lsu.e8, spec-lsu.e9); for arithmetic the CII coprocessor merges the undisturbed
      lanes itself, which is spec-cii's.

  # Load Unit VRF port arbitration, resolved 2026-07-31.

  - id: spec-lsu.m13
    kind: structure
    statement: >
      The Load Unit's VRF ports must be arbitrated by a strict-priority mux.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        The Load Unit's VRF ports are arbitrated by a **strict-priority mux**: an active load
        drain always wins, and the group copy takes the ports only in a cycle when no drain is
        using them.
    notes: >
      Resolved 2026-07-31. The spec states there is no anti-starvation counter, because
      liveness is structural: the VL = 0 op holds a ROB entry and commit is in program order,
      so a steady stream of younger loads fills the ROB, dispatch stalls, in-flight drains
      finish, and the ports fall idle. That absence is not written as a separate requirement,
      for the same reason the retired spec-lsu.b12 was — no RTL implements the absence of a
      mechanism. The contrast the spec draws is with the D$ lane (group h), which carries
      scalar traffic and therefore does need a bounded round-robin guarantee.

  - id: spec-lsu.m14
    kind: function
    statement: >
      An active load drain must always win the Load Unit's VRF ports over the group copy.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-vl-zero
      heading: "VL == 0"
      quote: >
        an active load
        drain always wins, and the group copy takes the ports only in a cycle when no drain is
        using them.

  - id: spec-lsu.e20
    kind: structure
    statement: >
      The LCB must track byte presence with a per-entry byte-valid bitmap bounded by the
      active-element set the load vAGEN selected.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: load-coalesce
      heading: "Load Coalescing Buffer"
      quote: >
        When **all active bytes** of a destination PRN are present (tracked by a per-entry
        byte-valid bitmap, bounded by the active-element set the load vAGEN selected), the LCB issues a
        **single** VRF write on ``W0`` for that PRN.
    notes: >
      Supersedes the retired spec-lsu.e7, whose bound was an independently evaluated
      active-element mask.

  - id: spec-lsu.e21
    kind: function
    statement: >
      The LCB must not re-derive which elements are active.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: load-coalesce
      heading: "Load Coalescing Buffer"
      quote: >
        The LCB **must not re-derive which elements are active**: it
        consumes the **same mask-derived element cursor** as ``ld_vAGEN_1`` (see :ref:`vector-agen`), so
        the bytes it waits for are exactly the bytes the AGEN generated accesses for and a masked-off
        element is never counted as outstanding.

  - id: spec-lsu.e22
    kind: interface
    statement: >
      The LCB must consume the same mask-derived element cursor as ld_vAGEN_1.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: load-coalesce
      heading: "Load Coalescing Buffer"
      quote: >
        The LCB **must not re-derive which elements are active**: it
        consumes the **same mask-derived element cursor** as ``ld_vAGEN_1`` (see :ref:`vector-agen`), so
        the bytes it waits for are exactly the bytes the AGEN generated accesses for and a masked-off
        element is never counted as outstanding.
    notes: >
      The cursor is owned by AGEN (spec-agen.e10) and shared with both consumers
      (spec-agen.e11); the store-side counterpart is spec-agen.d12.

  - id: spec-lsu.e23
    kind: function
    statement: >
      A masked-off element must never be counted as outstanding by the LCB.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: load-coalesce
      heading: "Load Coalescing Buffer"
      quote: >
        The LCB **must not re-derive which elements are active**: it
        consumes the **same mask-derived element cursor** as ``ld_vAGEN_1`` (see :ref:`vector-agen`), so
        the bytes it waits for are exactly the bytes the AGEN generated accesses for and a masked-off
        element is never counted as outstanding.

  # LCB entry allocation, resolved 2026-07-31.

  - id: spec-lsu.e24
    kind: function
    statement: >
      An assembly entry must be allocated for a destination PRN before any element access for
      that PRN is issued to the D$.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: load-coalesce
      heading: "Load Coalescing Buffer"
      quote: >
        **Entries are allocated before the accesses that fill them.** An assembly entry is
        allocated for a destination PRN *before* any element access for that PRN is issued to
        the D$
    notes: >
      Allocating ahead of the request is what makes a response for an unallocated PRN
      unreachable, so the LCB never has to back-pressure a D$ response — which it could not do
      safely, since a blocked response holds an MSHR against the drain that would free the
      entry. A consequence, stated by the spec but not a separate obligation, is that LCB depth
      is a memory-level-parallelism knob rather than a correctness parameter.

  - id: spec-lsu.e25
    kind: function
    statement: >
      The load drain must stall at the arbiter when no assembly entry is free.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: load-coalesce
      heading: "Load Coalescing Buffer"
      quote: >
        if no entry is free the load drain stalls at the arbiter (:ref:`dcache-arbiter`).
    notes: >
      The arbiter itself is group h.

