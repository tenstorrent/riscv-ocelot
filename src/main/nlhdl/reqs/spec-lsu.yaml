      quote: >
        A **priority round-robin arbiter** grants the lane(s) each cycle:

  - id: spec-lsu.h4
    kind: function
    statement: >
      Scalar memory ops must carry a higher base priority than vector drains.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: dcache-arbiter
      heading: "D$ Interface Arbiter"
      quote: >
        **Priority floor.** Scalar memory ops carry a higher base priority than vector drains,
        so a burst of vector element accesses never indefinitely blocks a scalar load/store.

  - id: spec-lsu.h5
    kind: function
    statement: >
      A burst of vector element accesses must never indefinitely block a scalar load/store.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: dcache-arbiter
      heading: "D$ Interface Arbiter"
      quote: >
        **Priority floor.** Scalar memory ops carry a higher base priority than vector drains,
        so a burst of vector element accesses never indefinitely blocks a scalar load/store.

  - id: spec-lsu.h6
    kind: timing
    statement: >
      A round-robin pointer must guarantee each contending requestor at least one grant every
      4 cycles.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: dcache-arbiter
      heading: "D$ Interface Arbiter"
      quote: >
        **Round-robin anti-starvation.** Among requestors of equal priority, and to bound how
        long a lower-priority requestor can wait, a round-robin pointer guarantees each
        contending requestor at least one grant every *4* cycles.
    notes: >
      Both directions of the guarantee follow from this bound: a long vector drain yields the
      lane periodically so scalar traffic makes progress, and a steady scalar stream still lets
      the vector drain advance. The spec left the bound as an unbound *N* until 2026-07-31, when
      it was fixed at 4 cycles; via spec-lsu.h9 the same policy gates the shared LCAM and TLB
      ports, so this is the only starvation bound in the family.

  - id: spec-lsu.h7
    kind: function
    statement: >
      With lsuWidth of 2 the arbiter must grant up to two of the pending requests per cycle.
    source:
