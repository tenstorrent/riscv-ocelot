retired:

  - id: spec-lsu.b12
    statement: >
      Liveness of the vector store path must be provided by the program-order reservation rather than by queue sizing.
    retired_because: >
      The argument of the danger block rather than its mandate. What the block mandates is spec-lsu.b4 (reserve in program order at dispatch) and spec-lsu.b5 (do not claim opportunistically at execute); this entry stated only why b4 exists. The four-step deadlock is retained in notes.

  - id: spec-lsu.b13
    statement: >
      The SSI queue depth must be treated as a published architectural limit.
    retired_because: >
      A documentation obligation ("Depth is now a published architectural limit"), untaggable in RTL. The substance survives as spec-lsu.b2 (512-entry default) and spec-lsu.b14 (depth bounds in-flight ops).

  - id: spec-lsu.c1
    statement: >
      Unit-stride address generation must require only a base address, VL and EEW to generate all addresses.
    retired_because: >
      A semantic property of the unit-stride access class ("only require a base address, VL, and EEW"), introduced as motivation for the optimisation. The obligations it motivates are spec-lsu.c2, c3 and c4.

  - id: spec-lsu.k11
    statement: >
      LargeBoomV4Config or MegaBoomV4Config must be used for acceptable vector throughput.
    retired_because: >
      Integrator guidance on which config to instantiate, with an undefined predicate ("acceptable vector throughput"). The config-dependent structural obligations are spec-lsu.a12, a13 and h2.

  - id: spec-lsu.k4
    statement: >
      Vector memory bandwidth must be bounded by the scalar D$ port width rather than by VLEN.
    retired_because: >
      The conclusion of a sentence beginning "Because the cache and its request interface are unchanged" - entailed by spec-lsu.k1 and k3, with no RTL that can satisfy or violate it. The 64/128 bits-per-cycle figures are retained in notes.

  - id: spec-lsu.k6
    statement: >
      A single VLEN of 256 destination register must take at least four D$ beats.
    retired_because: >
      Arithmetic (VLEN/ELEN) stated by the spec as a consequence, not an obligation. Nothing implements it.

  - id: spec-lsu.k9
    statement: >
      Unit-stride accesses must still be capped at the lsuWidth times ELEN bandwidth.
    retired_because: >
      The same bandwidth cap as spec-lsu.k5 restated for one access class, from an explanatory contrast ("the Packer reduces address-generation cost, not cache-port width").

  - id: spec-lsu.l6
    statement: >
      Segmented load/store must be the only instruction that uses an intermediate temp vector group in the VRF.
    retired_because: >
      The quote says segmented load/store "is the only instruction that currently uses" pvtmp; this statement dropped "currently", converting a scoping observation about today's instruction set into a universal negative no RTL artifact can discharge. The real obligations are spec-lsu.l7 and l9.

  - id: spec-lsu.e7
    statement: >
      The LCB must track byte presence with a per-entry byte-valid bitmap bounded by the
      active-element mask.
    retired_because: >
      loadstore.rst §"Load Coalescing Buffer" was amended on 2026-07-31 so the LCB consumes the
      load vAGEN's mask-derived element cursor instead of evaluating the active-element mask
      itself, removing the second mask evaluation on the load path. The bitmap is now bounded by
      the AGEN-selected active-element set. Superseded by spec-lsu.e20.

