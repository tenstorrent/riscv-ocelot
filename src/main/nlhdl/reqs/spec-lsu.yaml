  - id: spec-lsu.f6
    kind: function
    statement: >
      fault_elem must not be carried to the ROB.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: elem-progress
      heading: "Per-Element Progress Tracking and Precise Exceptions"
      quote: >
        It is a **stop signal and a debug/perf counter only** — it is *not* carried to the ROB
        and *not* written to ``vstart``.

  - id: spec-lsu.f7
    kind: function
    statement: >
      fault_elem must not be written to vstart.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: elem-progress
      heading: "Per-Element Progress Tracking and Precise Exceptions"
      quote: >
        It is a **stop signal and a debug/perf counter only** — it is *not* carried to the ROB
        and *not* written to ``vstart``.

  - id: spec-lsu.f8
    kind: function
    statement: >
      Element accesses must fire the TLB and LCAM in element order.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: elem-progress
      heading: "Per-Element Progress Tracking and Precise Exceptions"
      quote: >
        Element accesses **fire** (TLB + LCAM) in element order, so a fault at element ``k``
        is always detected before any element ``> k`` fires.
    notes: >
      Element responses return out of order across MSHRs, so "nothing beyond k has been
      written" is explicitly not an invariant this design maintains, and does not need to be.

  - id: spec-lsu.f9
    kind: function
    statement: >
      On a fault the entry must stop advancing.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: elem-progress
      heading: "Per-Element Progress Tracking and Precise Exceptions"
      quote: >
        **On a fault the entry stops advancing and the instruction traps with ``vstart = 0``,
        restarting from the beginning.**

  - id: spec-lsu.f10
    kind: function
    statement: >
      On a fault the instruction must trap with vstart = 0.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: elem-progress
      heading: "Per-Element Progress Tracking and Precise Exceptions"
      quote: >
        **On a fault the entry stops advancing and the instruction traps with ``vstart = 0``,
        restarting from the beginning.**

  - id: spec-lsu.f11
    kind: function
    statement: >
      On a fault the instruction must restart from the beginning.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: elem-progress
      heading: "Per-Element Progress Tracking and Precise Exceptions"
      quote: >
        **On a fault the entry stops advancing and the instruction traps with ``vstart = 0``,
        restarting from the beginning.**
    notes: >
      Legal because nothing was written architecturally: pvdest is a fresh physical group a
      non-committing instruction never installs, and stores drain to the cache only
      post-commit. Loads are idempotent, so the cost is re-draining elements 0..k-1.

  - id: spec-lsu.f12
    kind: function
    statement: >
      A faulting vector load/store must not resume at vstart = k.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: elem-progress
      heading: "Per-Element Progress Tracking and Precise Exceptions"
      quote: >
        **Do not resume at ``vstart = k``.**
    notes: >
      From this section's warning block. Because the faulting instruction's pvdest group is
      reclaimed to the free list on the exception, elements 0..k-1 are not architecturally
      visible, so resuming at k would leave them holding pre-instruction values while RVV
      requires loaded data — silent corruption on any page-crossing gather.

  # Element accesses outstanding when a fault is latched, resolved 2026-07-31.

  - id: spec-lsu.f13
    kind: function
    statement: >
      An element access still outstanding when a fault is latched must be allowed to return.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: elem-progress
      heading: "Per-Element Progress Tracking and Precise Exceptions"
      quote: >
        **Element accesses still outstanding when the fault is latched need no cancellation.**
        Because accesses fire in element order, no access beyond ``fault_elem`` was ever
        issued, so the only outstanding accesses are for elements below it. Those are left to
        return and are dropped exactly as on a branch squash
    notes: >
      No cancellation path is required. The fire-in-element-order invariant (spec-lsu.f8)
      means nothing beyond fault_elem was ever issued, so the only outstanding accesses are
      for elements below the stop point.

  - id: spec-lsu.f14
    kind: function
    statement: >
      A trap must invalidate the faulting load's LCB assembly entry by its owning ``ldq_idx``.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: elem-progress
      heading: "Per-Element Progress Tracking and Precise Exceptions"
      quote: >
        the trap invalidates the load's LCB assembly entry by its owning ``ldq_idx``, so a late
        response has nowhere to land (:ref:`vec-squash`).
    notes: >
      This is the branch-squash mechanism of spec-lsu.i7 reused on the exception path, so the
      two flush sources share one invalidation rule rather than each having its own.

  - id: spec-lsu.f15
    kind: function
    statement: >
      A late LCB write for a faulting load must be impossible rather than merely harmless.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: elem-progress
      heading: "Per-Element Progress Tracking and Precise Exceptions"
      quote: >
        the faulting instruction's ``pvdest`` group is reclaimed to the free list, so a late
        LCB write must be made **impossible**, not merely harmless.
    notes: >
      The PRN-recycling hazard of the vec-squash danger block applies unchanged on the
      exception path: the reclaimed pvdest group is reallocated within a few cycles, so a late
      VLEN-wide write would corrupt a live, unrelated destination.

