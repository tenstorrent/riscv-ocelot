      anchor: dcache-arbiter
      heading: "D$ Interface Arbiter"
      quote: >
        The same policy gates the **shared LCAM** and **TLB** ports, since a vector element
        stream consumes those resources at the same rate it consumes D$ bandwidth.

  - id: spec-lsu.h10
    kind: function
    statement: >
      The D$ lane, the LCAM port and the TLB port must all be released back to scalar on the
      round-robin boundary.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: dcache-arbiter
      heading: "D$ Interface Arbiter"
      quote: >
        All three (D$ lane, LCAM port, TLB port) are released back to scalar on the
        round-robin boundary so no single vector ``OP.v`` can monopolize disambiguation or
        translation.

  - id: spec-lsu.h11
    kind: function
    statement: >
      A single vector OP.v must not be able to monopolize disambiguation or translation.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: dcache-arbiter
      heading: "D$ Interface Arbiter"
      quote: >
        All three (D$ lane, LCAM port, TLB port) are released back to scalar on the
        round-robin boundary so no single vector ``OP.v`` can monopolize disambiguation or
        translation.

  # --- i: squash by pointer rollback ------------------------------------------

  - id: spec-lsu.i1
    kind: function
    statement: >
      IQ_V_LOAD and IQ_V_STORE must issue speculatively without gating on the PNR.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-squash
      heading: "Squashing the in-flight vector LSU"
      quote: >
        Unlike ``IQ_V_ALU``, ``IQ_V_LOAD``/``IQ_V_STORE`` issue **speculatively** — they do
        not gate on the PNR — so a vector memory ``OP.v`` can be mid-drain when a branch
        mispredicts.

  - id: spec-lsu.i2
    kind: function
    statement: >
      On a mispredict each element queue's tail must be rolled back to the branch's
      reservation index.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-squash
      heading: "Squashing the in-flight vector LSU"
      quote: >
        a mispredict **rolls the tail back to the branch's reservation
        index**, exactly as |boom| rolls ``stq_tail``.

  - id: spec-lsu.i3
    kind: structure
    statement: >
      Each element queue's occupied region must be program-ordered.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-squash
      heading: "Squashing the in-flight vector LSU"
      quote: >
        because capacity is reserved in **program order** at dispatch
        (:ref:`vec-queue-reservation`), each queue's occupied region is program-ordered

  - id: spec-lsu.i4
    kind: function
    statement: >
      Killed element-queue entries must vanish with no per-entry compare.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-squash
      heading: "Squashing the in-flight vector LSU"
      quote: >
        Killed entries vanish with no per-entry compare, and the reservations are released in
        the same event.

  - id: spec-lsu.i5
    kind: function
    statement: >
      The reservations must be released in the same event as the rollback.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-squash
      heading: "Squashing the in-flight vector LSU"
      quote: >
        Killed entries vanish with no per-entry compare, and the reservations are released in
        the same event.

  - id: spec-lsu.i6
    kind: function
    statement: >
      An in-progress stage-1 vAGEN crack must be killed on brupdate or exception.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-squash
      heading: "Squashing the in-flight vector LSU"
      quote: >
        **Stage-1 vAGEN** — the in-progress crack is killed on ``brupdate``/``exception`` like
        any pipeline stage.

  - id: spec-lsu.i7
    kind: function
    statement: >
      LCB assembly entries must be invalidated by their owning ldq_idx.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-squash
      heading: "Squashing the in-flight vector LSU"
      quote: >
        **Load Coalescing Buffer** — assembly entries are invalidated by owning ``ldq_idx``;

  - id: spec-lsu.i8
    kind: function
    statement: >
      A late element response for a rolled-back ldq_idx must be dropped.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-squash
      heading: "Squashing the in-flight vector LSU"
      quote: >
        a rolled-back ``ldq_idx`` is dead, so a late element response has nowhere to land and
        is dropped, the same shape as |boom| dropping a response for an invalidated LDQ entry.

  - id: spec-lsu.i9
    kind: function
    statement: >
      The vector LSU must not use drain-and-discard on a squash.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-squash
      heading: "Squashing the in-flight vector LSU"
      quote: >
        **Drain-and-discard is not an option here**, even though it is exactly what the CII
        does (:ref:`cii-flush`).
    notes: >
      From this section's danger block. On a mispredict the killed load's pvdest group returns
      to the free list through br_alloc_lists and those PRNs are reallocated within a few
      cycles, so a late LCB write would land a full VLEN register into a live, unrelated
      destination. The CII can drain harmlessly only because its tags are not recycled.

  - id: spec-lsu.i10
    kind: structure
    statement: >
      The vector LSU squash must use pointer rollback rather than per-entry br_mask and
      IsKilledByBranch.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-squash
      heading: "Squashing the in-flight vector LSU"
      quote: >
        |caracal| chooses pointer rollback; the price is that reservation depth now bounds
        vector-load MLP (:ref:`ssi-queues`).
    notes: >
      The alternative the spec rejects is per-entry br_mask + IsKilledByBranch on every
      element-queue and LCB entry, which preserves free-running load streaming and full MLP
      but puts maxBrCount bits and kill logic on ~1000 entries.

  # --- j: the vector load and store algorithms --------------------------------

  - id: spec-lsu.j1
    kind: function
    statement: >
      On issue a vector load must drain per-element addresses from the ld_SSI_ADDR_Q.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-load-algo
      heading: "Vector Loads Algorithm"
      quote: >
        when the load issues out of the issue queue it drains addresses from the
        ``ld_SSI_ADDR_Q`` (per element, precomputed by stage 1 vAGEN)

  - id: spec-lsu.j2
    kind: function
    statement: >
      For a unit-stride load the stage 2 Packer must run over the single ld_US_ADDR_Q nOP.v
      to generate element addresses.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-load-algo
      heading: "Vector Loads Algorithm"
      quote: >
        or, for unit-stride, runs the
        stage 2 Packer over the single ``ld_US_ADDR_Q`` ``nOP.v`` to generate element addresses
        just-in-time.

  - id: spec-lsu.j3
    kind: function
    statement: >
      Each element access fire must perform the TLB, D$ and LCAM lookups together.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-load-algo
      heading: "Vector Loads Algorithm"
      quote: >
        for each element access the arbiter (:ref:`dcache-arbiter`) grants a D$ lane; the fire
        does TLB + D$ + LCAM together (``will_fire_load_agen_exec``).

  - id: spec-lsu.j4
    kind: function
    statement: >
      elem_done must advance as element responses are assembled.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-load-algo
      heading: "Vector Loads Algorithm"
      quote: >
        ``elem_done`` advances; a fault latches ``fault_elem`` (:ref:`elem-progress`).

  - id: spec-lsu.j5
    kind: structure
    statement: >
      The vector load path must be identical to the scalar load path apart from the vector
      queue drain, LCB coalescing and per-element progress tracking.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-load-algo
      heading: "Vector Loads Algorithm"
      quote: >
        Identical to scalar **loads** other than draining addresses from the dedicated vector
        queues, coalescing in the LCB, and per-element progress tracking.

  - id: spec-lsu.j6
    kind: function
    statement: >
      A vector store's surplus reservation must be released at execute once VL is read from
      the VL RF.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-store-algo
      heading: "Vector Stores Algorithm"
      quote: >
        The surplus is released at execute once ``VL`` is
        read from the VL RF.

  - id: spec-lsu.j7
    kind: function
    statement: >
      A vector store's execute stage must perform the TLB and LCAM lookups only.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-store-algo
      heading: "Vector Stores Algorithm"
      quote: >
        **Execute (translate + order-check)** — drains addresses from ``st_SSI_ADDR_Q`` /
        ``st_US_ADDR_Q`` and does **TLB + LCAM** only.

  - id: spec-lsu.j8
    kind: function
    statement: >
      All of a store's active element addresses must be translated pre-commit.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-store-algo
      heading: "Vector Stores Algorithm"
      quote: >
        **All active element addresses are translated
        pre-commit** so that any page/access fault is detected and reported precisely
        **before** the store commits

  - id: spec-lsu.j9
    kind: function
    statement: >
      A store must become eligible to drain to the stq_execute_queue only once the ROB
      retires it.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-store-algo
      heading: "Vector Stores Algorithm"
      quote: >
        **Commit** — when the ROB retires the store its committed flag is set; only then is it
        eligible to drain to the ``stq_execute_queue``.

  - id: spec-lsu.j10
    kind: interface
    statement: >
      Store data must be taken from the st_US_DATA_Q for unit-stride and from the
      st_SSI_DATA_Q per element otherwise.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-store-algo
      heading: "Vector Stores Algorithm"
      quote: >
        Store data is taken from ``st_US_DATA_Q`` (whole-``vPRN``, sliced by
        the Packer) or ``st_SSI_DATA_Q`` (per element).

  - id: spec-lsu.j11
    kind: structure
    statement: >
      The vector store path must be identical to the scalar store path apart from the vector
      queue drains and the pre-commit translation of the whole active element range.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vec-store-algo
      heading: "Vector Stores Algorithm"
      quote: >
        Identical to scalar stores other than draining address and data from the dedicated
        vector queues and the pre-commit translation of the whole active element range.

  # --- k: memory subsystem and the bandwidth ceiling --------------------------

  - id: spec-lsu.k1
    kind: structure
    statement: >
      The memory subsystem must remain unchanged from BOOM v4.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-subsystem
      heading: "Memory SubSystem"
      quote: >
        The memory subsystem remains unchanged from BOOMv4 — the D$ Interface Arbiter
        (:ref:`dcache-arbiter`) sits *outside* the cache and presents the same ``dmem.req``
        interface.

  - id: spec-lsu.k2
    kind: structure
    statement: >
      The D$ interface arbiter must sit outside the cache.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-subsystem
      heading: "Memory SubSystem"
      quote: >
        The memory subsystem remains unchanged from BOOMv4 — the D$ Interface Arbiter
        (:ref:`dcache-arbiter`) sits *outside* the cache and presents the same ``dmem.req``
        interface.

  - id: spec-lsu.k3
    kind: interface
    statement: >
      The D$ interface arbiter must present the same dmem.req interface.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-subsystem
      heading: "Memory SubSystem"
      quote: >
        The memory subsystem remains unchanged from BOOMv4 — the D$ Interface Arbiter
        (:ref:`dcache-arbiter`) sits *outside* the cache and presents the same ``dmem.req``
        interface.

  - id: spec-lsu.k5
    kind: interface
    statement: >
      Each dmem.req lane must carry at most one element per cycle.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vector-bw-ceiling
      heading: "Vector memory bandwidth ceiling"
      quote: >
        Each ``dmem.req`` lane carries at most one element
        (``≤ ELEN`` = 64 bits) per cycle, and there are ``lsuWidth`` lanes — **1 on Medium, 2 on
        Large/Mega**.

  - id: spec-lsu.k7
    kind: function
    statement: >
      SSI accesses must drain one element per granted lane.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vector-bw-ceiling
      heading: "Vector memory bandwidth ceiling"
      quote: >
        **SSI** (strided / indexed / segmented) accesses drain **one element per granted
        lane**, and that lane is shared with scalar memory ops through the priority round-robin
        arbiter

  - id: spec-lsu.k8
    kind: function
    statement: >
      The Packer must coalesce contiguous bytes up to the lane width.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vector-bw-ceiling
      heading: "Vector memory bandwidth ceiling"
      quote: >
        the Packer coalesces contiguous bytes up to the lane width
        and the LCAM does one range check

  - id: spec-lsu.k10
    kind: structure
    statement: >
      The design must reuse the scalar cache port rather than building a VLEN-wide vector
      cache interface.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: vector-bw-ceiling
      heading: "Vector memory bandwidth ceiling"
      quote: >
        |caracal| reuses the scalar cache port rather than
        building a ``VLEN``-wide vector cache interface.
    notes: >
      A wider or line-granular vector cache port is explicitly out of scope in this spec and
      named as the highest-leverage follow-on if vector memory bandwidth proves limiting.

  - id: spec-lsu.l1
    kind: structure
    statement: >
      For a segmented load the pvtmp group must be the destination of the LSU half.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-segmented-load
      heading: "Segmented Load"
      quote: >
        The ``pvtmp`` group is the **destination** of the LSU half and the **source** of the
        coprocessor half.

  - id: spec-lsu.l2
    kind: function
    statement: >
      The LSU half of a segmented load must issue when its address operands are ready.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-segmented-load
      heading: "Segmented Load"
      quote: >
        The LSU issues when its address operands are ready, reads memory, and writes the
        loaded data into the ``pvtmp`` group in the VRF (treating ``pvtmp`` as an ordinary
        vector destination).

  - id: spec-lsu.l3
    kind: function
    statement: >
      The LSU half of a segmented load must write the loaded data into the pvtmp group in the
      VRF.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-segmented-load
      heading: "Segmented Load"
      quote: >
        The LSU issues when its address operands are ready, reads memory, and writes the
        loaded data into the ``pvtmp`` group in the VRF (treating ``pvtmp`` as an ordinary
        vector destination).

  - id: spec-lsu.l4
    kind: function
    statement: >
      The LSU half must treat pvtmp as an ordinary vector destination.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-segmented-load
      heading: "Segmented Load"
      quote: >
        The LSU issues when its address operands are ready, reads memory, and writes the
        loaded data into the ``pvtmp`` group in the VRF (treating ``pvtmp`` as an ordinary
        vector destination).

  - id: spec-lsu.l5
    kind: interface
    statement: >
      The pvtmp group-done must wake the coprocessor's IQ slot on the vector wakeup network.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-segmented-load
      heading: "Segmented Load"
      quote: >
        ``pvtmp``'s group-done on the vector wakeup network wakes the coprocessor's IQ slot.
    notes: >
      The consumer side — the coprocessor reading pvtmp, transposing, and writing pvdest — is
      spec-cii's, from midcore.rst §"Segmented Store" and cii.rst.

  - id: spec-lsu.l7
    kind: function
    statement: >
      A segmented load/store must be split into two halves.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-segmented-ls
      heading: "Segmented Load Stores (Shared Instruction)"
      quote: >
        These instructions are marked is_shared, and split into two halves.
    notes: >
      The is_shared marking itself is a decode obligation, mined as spec-decode.b1 and
      spec-decode.b2.

  - id: spec-lsu.l8
    kind: function
    statement: >
      The LSU half of a shared instruction must move the data to or from memory.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-segmented-ls
      heading: "Segmented Load Stores (Shared Instruction)"
      quote: >
        One half is executed by the load store unit to move data to/from memory, and the other
        half by the co-processor to transpose the data; they hand off through ``pvtmp``.

  - id: spec-lsu.l9
    kind: interface
    statement: >
      The two halves of a shared instruction must hand off through pvtmp.
    source:
      file: docs_caracal/src/case_study.rst
      anchor: case-segmented-ls
      heading: "Segmented Load Stores (Shared Instruction)"
      quote: >
        One half is executed by the load store unit to move data to/from memory, and the other
