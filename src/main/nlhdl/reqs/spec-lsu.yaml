family: lsu
description: >
  The vector path through the unified LSU: element and store-data queues, the load
  coalescing buffer, per-element progress and fault-only-first, D$ arbitration, and
  squash by pointer rollback.
spec_sources:
  - docs_caracal/src/loadstore.rst
  - docs_caracal/src/case_study.rst
  - docs_caracal/src/midcore.rst

groups:
  a: the unified LSU — structure and usingRVV gating
  b: the SSI element queues and program-order reservation
  c: the unit-stride queue and just-in-time expansion
  d: the store data queues
  e: the load coalescing buffer
  f: per-element progress and precise exceptions
  g: fault-only-first (vleff)
  h: D$, LCAM and TLB arbitration
  i: squash by pointer rollback
  j: the vector load and store algorithms
  k: memory subsystem and the bandwidth ceiling
  l: segmented load/store — the LSU half
  m: the VL == 0 group copy

reqs:

  # --- a: the unified LSU -----------------------------------------------------

  - id: spec-lsu.a1
    kind: structure
    statement: >
      The LSU must extend the BOOM load/store unit to support both scalar and vector
      load/stores.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        A major feature of |caracal| is that it extends the |boom| Load Store Unit to support
        scalar and vector load stores. We call this the Unified Load Store Unit.

  - id: spec-lsu.a2
    kind: structure
    statement: >
      With usingRVV disabled the underlying BOOM LSU must be left untouched.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        If the ``usingRVV`` parameter is disabled the underlying |boom| LSU is essentially
        untouched.

  - id: spec-lsu.a3
    kind: structure
    statement: >
      With usingRVV enabled the vector address and data queues must be initialized.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        When enabled, several vector address and data queues are initialized.

  - id: spec-lsu.a4
    kind: structure
    statement: >
      A vector load/store OP.v must be allocated a single entry in the existing LDQ or STQ.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        Vector load/store ``OP.v``'s are still allocated to the existing STQ and LDQ as a
        **single entry**, using largely the same dispatch-stage logic.

  - id: spec-lsu.a5
    kind: structure
    statement: >
      The design must provide separate vector address and data queues to buffer the effective
      nOP.v memory operations.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        we allocate separate vector address and data queues to buffer those effective
        ``nOP.v`` memory operations.
    notes: >
      The spec's stated reason is to prevent the primary STQ and LDQ from being polluted by
      many vector memory operations and impacting scalar load/store performance.

  - id: spec-lsu.a6
    kind: interface
    statement: >
      A vector LDQ or STQ entry must read its effective address or store data from the
      separate address and data queues rather than from a uOP.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        When a vector LDQ or STQ entry becomes ready for execution, it reads the effective
        address or store data from the separate address and data queues, rather than from a
        uOP as is the case with scalar load stores.

  - id: spec-lsu.a7
    kind: function
    statement: >
      The conditions under which a vector LDQ or STQ entry becomes eligible to drain must be
      the same as for a scalar entry.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        The conditions that allow a vector LDQ or STQ entry to become eligible to drain are
        the same as scalar.

  - id: spec-lsu.a8
    kind: function
    statement: >
      A draining entry must drain all of the element accesses it owns in program and element
      order.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        Here **atomic** means an entry drains *all* of the element accesses it owns in program
        / element order without another op interleaving at that entry.

  - id: spec-lsu.a9
    kind: function
    statement: >
      An entry that is draining must not be interleaved with another op at that entry.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        Here **atomic** means an entry drains *all* of the element accesses it owns in program
        / element order without another op interleaving at that entry.

  - id: spec-lsu.a10
    kind: function
    statement: >
      A faulting vector load/store must commit no elements.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        It **is** all-or-nothing with respect to architectural state: a faulting load/store
        commits **no** elements, traps with ``vstart = 0``, and restarts the whole instruction
        from element 0
    notes: >
      This section's warning block records that earlier drafts said the opposite — that a
      faulting load/store commits the elements before the fault and records vstart. That
      model is not implementable here: the faulting OP.v's pvdest group is a fresh group a
      non-committing instruction never installs, and it is reclaimed to the free list on the
      exception. The trap and restart obligations are spec-lsu.f10 and spec-lsu.f11.

  - id: spec-lsu.a11
    kind: interface
    statement: >
      Element accesses must contend for the shared D$ port through the arbiter.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        The element accesses themselves contend for the shared D$ port through the arbiter in
        :ref:`dcache-arbiter`, so a vector drain does **not** monopolize the cache.

  - id: spec-lsu.a12
    kind: structure
    statement: >
      On LargeBoomV4Config or MegaBoomV4Config the LSU must allow two memory operations to
      be issued per cycle.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        For ``LargeBoomV4Config`` or ``MegaBoomV4Config`` we take advantage of the dual-port
        L1 D$ interface and allow 2 memory operations to be issued per cycle; the vector
        address and data queues are ``2 x nOP.v`` wide to allow 2 concurrent element accesses.

  - id: spec-lsu.a13
    kind: structure
    statement: >
      On those configurations the vector address and data queues must be 2 x nOP.v wide.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        For ``LargeBoomV4Config`` or ``MegaBoomV4Config`` we take advantage of the dual-port
        L1 D$ interface and allow 2 memory operations to be issued per cycle; the vector
        address and data queues are ``2 x nOP.v`` wide to allow 2 concurrent element accesses.

  - id: spec-lsu.a14
    kind: structure
    statement: >
      The vector queues must be named following the {ld,st}_{SSI,US}_{ADDR,DATA}_Q
      convention.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        Queue-naming convention. Vector queues are named ``{ld,st}_{SSI,US}_{ADDR,DATA}_Q``

  - id: spec-lsu.a15
    kind: structure
    statement: >
      The vector queue set must comprise ld_SSI_ADDR_Q, st_SSI_ADDR_Q, st_SSI_DATA_Q,
      ld_US_ADDR_Q, st_US_ADDR_Q and st_US_DATA_Q.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: lsu-unified
      heading: "The Unified Load/Store Unit (LSU)"
      quote: >
        ``ld_SSI_ADDR_Q``, ``st_SSI_ADDR_Q``, ``st_SSI_DATA_Q``, ``ld_US_ADDR_Q``,
        ``st_US_ADDR_Q``, ``st_US_DATA_Q``.
    notes: >
      The enumeration has no load data queues, consistent with loads completing through the
      LCB (spec-lsu.e1) rather than through a data queue.

  # --- b: SSI element queues and program-order reservation --------------------

  - id: spec-lsu.b1
    kind: structure
    statement: >
      The SSI queues must hold the effective addresses calculated for strided, indexed and
      segmented load/stores.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        This class of vector (SSI) queues holds effective addresses calculated for strided,
        indexed, and segmented load stores.

  - id: spec-lsu.b2
    kind: structure
    statement: >
      The SSI queues' default parameterized size must be 512 entries.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        Because the SSI queues hold essentially element-wise memory addresses, their default
        parameterized size is quite big at 512 entries.

  - id: spec-lsu.b3
    kind: interface
    statement: >
      The ld_SSI_ADDR_Q and st_SSI_ADDR_Q must receive calculated effective addresses from
      the stage 1 vAGENs.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        The ``ld_SSI_ADDR_Q`` and ``st_SSI_ADDR_Q`` receive calculated effective addresses
        from the stage 1 vAGENs.

  - id: spec-lsu.b4
    kind: function
    statement: >
      SSI queue capacity must be reserved in program order at dispatch.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        **Capacity is reserved in program order at dispatch** (:ref:`vec-queue-reservation`),
        not claimed opportunistically at execute. That is a correctness requirement, not a
        tuning choice:
    notes: >
      Loads are reserved in program order for a different reason than stores: per this
      section's note they have no deadlock failure mode, and program-order reservation is
      what makes the queue squashable by pointer rollback (spec-lsu.i2).

  - id: spec-lsu.b5
    kind: function
    statement: >
      SSI queue capacity must not be claimed opportunistically at execute.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        **Capacity is reserved in program order at dispatch** (:ref:`vec-queue-reservation`),
        not claimed opportunistically at execute. That is a correctness requirement, not a
        tuning choice:

  - id: spec-lsu.b6
    kind: function
    statement: >
      A store must hold its full active address set pre-commit.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        **Stores must hold their full active address set pre-commit.**

  - id: spec-lsu.b7
    kind: function
    statement: >
      A store's translated addresses must be retained in st_SSI_ADDR_Q from execute until
      commit-drain.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        So a store's translated addresses are **retained in ``st_SSI_ADDR_Q`` from execute
        until commit-drain**

  - id: spec-lsu.b8
    kind: function
    statement: >
      A store's translated addresses must not be streamed or freed mid-instruction.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        they cannot be streamed/freed mid-instruction.

  - id: spec-lsu.b9
    kind: function
    statement: >
      Every element's fault must be detected before the store commits.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        A store cannot write memory until it commits, and every element's fault must be
        detected *before* commit (precise exceptions).

  - id: spec-lsu.b10
    kind: function
    statement: >
      A load must complete out of the Load Coalescing Buffer without gating on commit.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        A load completes out of the Load Coalescing Buffer (:ref:`load-coalesce`) and does not
        gate on commit, so the ``ld_SSI_ADDR_Q`` may be drained in waves and a load whose
        active element count exceeds its reservation is streamed through it.

  - id: spec-lsu.b11
    kind: function
    statement: >
      A load whose active element count exceeds its reservation must be streamed through the
      ld_SSI_ADDR_Q.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        A load completes out of the Load Coalescing Buffer (:ref:`load-coalesce`) and does not
        gate on commit, so the ``ld_SSI_ADDR_Q`` may be drained in waves and a load whose
        active element count exceeds its reservation is streamed through it.
    notes: >
      That the ld_SSI_ADDR_Q *may* be drained in waves is an allowance, not an obligation, so
      it is not a separate requirement.

  - id: spec-lsu.b14
    kind: function
    statement: >
      The SSI queue depth must bound the number of in-flight vector memory ops.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        Because reservation happens at dispatch against the worst-case element count, queue
        depth directly bounds in-flight vector memory ops

  - id: spec-lsu.b15
    kind: structure
    statement: >
      At the default depth the SSI queues must bound in-flight worst-case vector stores to
      two.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        512 entries ÷ 256 worst-case elements = **2** worst-case stores in flight.
    notes: >
      The worst-case single-instruction element count at VLEN=256 is ~256 element accesses
      (SEW=8 x LMUL=8 = 256; segmented NF*EMUL <= 8 also caps at 256).

  # Minimum queue depth, resolved 2026-07-31.

  - id: spec-lsu.b16
    kind: structure
    statement: >
      Each element-granular queue must be at least ``VLEN`` elements deep.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        **Minimum depth is a liveness constraint, not a tuning choice.** Each element-granular
        queue — ``ld_SSI_ADDR_Q``, ``st_SSI_ADDR_Q`` and ``st_SSI_DATA_Q`` — must be at least
        the worst-case single-instruction active element count, which is ``VLEN`` elements
        (``SEW=8`` × ``LMUL=8``; segmented ``NF*EMUL ≤ 8`` reaches the same bound).
    notes: >
      The queues covered are ld_SSI_ADDR_Q, st_SSI_ADDR_Q and st_SSI_DATA_Q. VLEN elements is
      the worst-case single-instruction active element count, not a chosen figure. Below the
      floor a single store can never complete its dispatch reservation, so it never issues,
      never commits, and nothing behind it frees — the same wedge as the section's danger
      block, reached by undersizing rather than by opportunistic allocation. The unit-stride
      queues are exempt because they hold one nOP.v per instruction rather than one per
      element (spec-lsu.c2); that exemption is a scope statement, not a separate obligation.
      Distinct from spec-lsu.b2, which states the 512-entry default: this is the floor the
      default must clear.

  - id: spec-lsu.b17
    kind: structure
    statement: >
      The minimum-depth floor must be checked at elaboration.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: ssi-queues
      heading: "Strided, Segmented, Indexed Queue"
      quote: >
        This is checked at elaboration.

  # --- c: the unit-stride queue ----------------------------------------------

  - id: spec-lsu.c2
    kind: structure
    statement: >
      A separate ld_US_ADDR_Q and st_US_ADDR_Q must hold the unit-stride transactions.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: us-queue
      heading: "Unit-Strided Queue"
      quote: >
        Thus we have a separate ``ld_US_ADDR_Q`` and ``st_US_ADDR_Q`` to hold these
        transactions.

  - id: spec-lsu.c3
    kind: function
    statement: >
      A unit-stride load/store must generate only a single nOP.v from the stage 1 vAGENs.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: us-queue
      heading: "Unit-Strided Queue"
      quote: >
        Unlike the SSI queues, a unit-stride load/store need only generate a **single**
        ``nOP.v`` from the stage 1 vAGENs that describes the whole contiguous range
        ``[base, base + VL*EEW)``.
    notes: >
      execution.rst states the same obligation from the generator side; it is mined there as
      spec-agen.b6.

  - id: spec-lsu.c4
    kind: interface
    statement: >
      That single nOP.v must describe the whole contiguous range [base, base + VL*EEW).
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: us-queue
      heading: "Unit-Strided Queue"
      quote: >
        Unlike the SSI queues, a unit-stride load/store need only generate a **single**
        ``nOP.v`` from the stage 1 vAGENs that describes the whole contiguous range
        ``[base, base + VL*EEW)``.

  - id: spec-lsu.c5
    kind: structure
    statement: >
      A second Packer-based AGEN unit must fire when a unit-strided STQ or LDQ entry is
      activated.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: us-queue
      heading: "Unit-Strided Queue"
      quote: >
        A second Packer-based AGEN unit fires when a unit-strided STQ/LDQ entry is activated
        and expands that single ``nOP.v`` into per-element D$ accesses *just-in-time*.

  - id: spec-lsu.c6
    kind: timing
    statement: >
      That second AGEN unit must expand the single nOP.v into per-element D$ accesses
      just-in-time.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: us-queue
      heading: "Unit-Strided Queue"
      quote: >
        A second Packer-based AGEN unit fires when a unit-strided STQ/LDQ entry is activated
        and expands that single ``nOP.v`` into per-element D$ accesses *just-in-time*.
    notes: >
      The one-range-overlap disambiguation this section refers to is stated in full by
      §"Memory Ordering and Disambiguation" and is mined under spec-memord.

  # --- d: the store data queues ----------------------------------------------

  - id: spec-lsu.d1
    kind: structure
    statement: >
      A separate st_SSI_DATA_Q and st_US_DATA_Q must buffer the vector store data.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: store-data-queue
      heading: "Store Data Queue"
      quote: >
        a separate ``st_SSI_DATA_Q`` and ``st_US_DATA_Q`` buffer the store data.

  - id: spec-lsu.d2
    kind: structure
    statement: >
      Vector store data must not be held in the STQ entry.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: store-data-queue
      heading: "Store Data Queue"
      quote: >
        Instead of holding the store data in the STQ entry, which would not be feasible for
        vector data, a separate ``st_SSI_DATA_Q`` and ``st_US_DATA_Q`` buffer the store data.

  - id: spec-lsu.d3
    kind: structure
    statement: >
      The st_SSI_DATA_Q entry width must be one element, ELEN or 64 bits.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: store-data-queue
      heading: "Store Data Queue"
      quote: >
        The ``st_SSI_DATA_Q`` entry width is one element (``ELEN``, 64 bits);

  - id: spec-lsu.d4
    kind: structure
    statement: >
      The st_US_DATA_Q entry width must be a full VLEN, 256 bits.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: store-data-queue
      heading: "Store Data Queue"
      quote: >
        the ``st_US_DATA_Q`` entry width is a full ``VLEN`` (256 bits), so a unit-stride store
        reads its entire source ``vPRN`` in one access and the Packer slices out per-element
        data at drain.

  - id: spec-lsu.d5
    kind: function
    statement: >
      A unit-stride store must read its entire source vPRN in one access.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: store-data-queue
      heading: "Store Data Queue"
      quote: >
        the ``st_US_DATA_Q`` entry width is a full ``VLEN`` (256 bits), so a unit-stride store
        reads its entire source ``vPRN`` in one access and the Packer slices out per-element
        data at drain.

  - id: spec-lsu.d6
    kind: function
    statement: >
      The Packer must slice out the per-element store data at drain.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: store-data-queue
      heading: "Store Data Queue"
      quote: >
        the ``st_US_DATA_Q`` entry width is a full ``VLEN`` (256 bits), so a unit-stride store
        reads its entire source ``vPRN`` in one access and the Packer slices out per-element
        data at drain.

  - id: spec-lsu.d7
    kind: timing
    statement: >
      The store data must be read from the source vPRN at DGEN, at execute time.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: store-data-queue
      heading: "Store Data Queue"
      quote: >
        The store data is **read from the source ``vPRN`` at DGEN (execute time)** and held in
        the data queue until the post-commit drain.

  - id: spec-lsu.d8
    kind: function
    statement: >
      The store data must be held in the data queue until the post-commit drain.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: store-data-queue
      heading: "Store Data Queue"
      quote: >
        The store data is **read from the source ``vPRN`` at DGEN (execute time)** and held in
        the data queue until the post-commit drain.

  - id: spec-lsu.d9
    kind: structure
    statement: >
      The source vPRN of a vector store must not need a pin.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: store-data-queue
      heading: "Store Data Queue"
      quote: >
        Because the data is captured this early, the source ``vPRN`` needs **no pin** — it
        frees with the rest of the stale group at commit

  - id: spec-lsu.d10
    kind: function
    statement: >
      The source vPRN must free with the rest of the stale group at commit.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: store-data-queue
      heading: "Store Data Queue"
      quote: >
        Because the data is captured this early, the source ``vPRN`` needs **no pin** — it
        frees with the rest of the stale group at commit
    notes: >
      Safe because a later writer to the same architectural vreg cannot clobber an in-flight
      store's data, which already lives in the data queue.

  - id: spec-lsu.d11
    kind: function
    statement: >
      The st_SSI_DATA_Q must hold a full store's active element data pre-commit.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: store-data-queue
      heading: "Store Data Queue"
      quote: >
        The cost is that, like the SSI address queue, the ``st_SSI_DATA_Q`` must hold a full
        store's active element data pre-commit.

  - id: spec-lsu.d12
    kind: function
    statement: >
      The st_SSI_DATA_Q must be reserved in program order at dispatch on the same terms as
      the address queue.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: store-data-queue
      heading: "Store Data Queue"
      quote: >
        It is therefore **reserved in program order at dispatch on exactly the same terms as
        the address queue** (:ref:`vec-queue-reservation`) and for the same reason

  - id: spec-lsu.d13
    kind: function
    statement: >
      A vector store must not dispatch until it has reserved capacity in both queues.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: store-data-queue
      heading: "Store Data Queue"
      quote: >
        A vector store reserves capacity in *both* queues or does not dispatch.

  # --- e: the load coalescing buffer ------------------------------------------

  - id: spec-lsu.e1
    kind: structure
    statement: >
