  # --- i: segmented load/store — the CII half ---------------------------------

  - id: spec-cii.i1
    kind: function
    statement: >
      For a segmented load the CII must transpose pvtmp into pvdest.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-segmented
      heading: "Segmented load/store"
      quote: >
        A segment load/store is a two-half operation: the LSU writes an intermediate ``pvtmp``
        group and the CII transposes ``pvtmp`` → ``pvdest``.

  - id: spec-cii.i2
    kind: function
    statement: >
      An is_shared instruction must wait for a group-done from both halves.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-segmented
      heading: "Segmented load/store"
      quote: >
        Such ``is_shared`` instructions wait
        for a group-done from **both** halves (the ROB's "other half pending" flag).
    notes: >
      The ROB-side flag itself is specified by midcore.rst §"Completion tracking" and belongs
      to spec-rob; this entry records the CII-side obligation.

  - id: spec-cii.i3
    kind: function
    statement: >
      The CII's transpose group-done must be the second half of a segmented load.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-segmented
      heading: "Segmented load/store"
      quote: >
        The CII's
        transpose group-done is the second half; with it wired, full segmented LS — deferred in
        Milestone 1 — completes.

  - id: spec-cii.i4
    kind: function
    statement: >
      For a segmented store the CII must write the pvtmp group.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-segmented
      heading: "Segmented load/store"
      quote: >
        For a segmented **store** the roles reverse (the CII writes ``pvtmp``, the LSU reads it as store
        data)
    notes: >
      The LSU-reads-pvtmp half of the same sentence is spec-lsu's obligation.

  - id: spec-cii.i5
    kind: function
    statement: >
      The coprocessor half of a segmented store must not be granted until the LSU half has
      translated its address set.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-segmented
      heading: "Segmented load/store"
      quote: >
        and the coprocessor half cannot be granted until the LSU half has already translated its
        address set — a six-step serial chain documented in :ref:`shared-store-chain`.

  - id: spec-cii.i6
    kind: interface
    statement: >
      A segmented store's DGEN wakeup must be muxed onto pvtmp rather than pvs3.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-segmented
      heading: "Segmented load/store"
      quote: >
        the store's DGEN wakeup must be muxed onto ``pvtmp`` rather than ``pvs3``

  - id: spec-cii.i7
    kind: structure
    statement: >
      IQ_V_ALU must not be a head-only FIFO.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-segmented
      heading: "Segmented load/store"
      quote: >
        ``IQ_V_ALU`` must not be a head-only FIFO, or that chain would stall every younger vector arithmetic
        op behind it.

  - id: spec-cii.i8
    kind: structure
    statement: >
      For a segmented store the pvtmp group must be the destination of the coprocessor half.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-segmented-store
      heading: "Segmented Store"
      quote: >
        Roles reverse: the ``pvtmp`` group is the **destination** of the coprocessor half and the **source**
        of the LSU half.

  - id: spec-cii.i9
    kind: function
    statement: >
      The coprocessor half of a segmented store must issue when its source operands are ready.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-segmented-store
      heading: "Segmented Store"
      quote: >
        The coprocessor issues when its source operands are ready, transposes the data, and writes it into
        the ``pvtmp`` group in the VRF.

  - id: spec-cii.i10
    kind: function
    statement: >
      The coprocessor half of a segmented store must transpose the data.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-segmented-store
      heading: "Segmented Store"
      quote: >
        The coprocessor issues when its source operands are ready, transposes the data, and writes it into
        the ``pvtmp`` group in the VRF.

  - id: spec-cii.i11
    kind: function
    statement: >
      The coprocessor half of a segmented store must write the transposed data into the pvtmp
      group in the VRF.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-segmented-store
      heading: "Segmented Store"
      quote: >
        The coprocessor issues when its source operands are ready, transposes the data, and writes it into
        the ``pvtmp`` group in the VRF.

  - id: spec-cii.i12
    kind: interface
    statement: >
      The pvtmp group-done must wake the store issue-queue slot.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-segmented-store
      heading: "Segmented Store"
      quote: >
        ``pvtmp``'s group-done wakes the store IQ slot.
    notes: >
      The LSU half then reads pvtmp from the VRF as its store data and writes memory once the
      ROB entry commits; that half is spec-lsu's.

  # How the coprocessor half learns the LSU half has translated, resolved 2026-08-01.

  - id: spec-cii.i13
    kind: function
    statement: >
      The coprocessor half of a segmented store must become eligible through the same
      per-entry past-PNR gate as every other CII op.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-segmented
      heading: "Segmented load/store"
      quote: >
        The LSU
        half's AGEN clears ``unsafe`` on the shared ROB entry, the PNR advances past it, and the
        half sitting in ``IQ_V_ALU`` becomes eligible under the same per-entry past-PNR gate
        every other CII op passes — steps 2 to 4 of that chain.
    notes: >
      Resolved 2026-08-01: no new mechanism. The gate itself is spec-cii.d2/d3 and the
      six-step chain is issue.rst §shared-store-chain. The spec states there is no
      translation-complete signal and that the handoff is not a pvtmp group-done — for a store
      the CII writes pvtmp and the LSU reads it, so that group-done (spec-cii.i12) is produced
      by the very half that would be waiting on it. Neither absence is written as a
      requirement.

