retired:

  - id: spec-cii.a17
    statement: >
      The tt_CII interface must be extensible for custom instructions.
    retired_because: >
      A design-goals list item ("Extensible interface for custom instructions") - aspirational, with no RTL that can be shown to satisfy or fail it.

  - id: spec-cii.d15
    statement: >
      Vector arithmetic, reduction and permutation OP.v's must be issued from IQ_V_ALU in program order over the CII.
    retired_because: >
      The statement obligated program-order issue from IQ_V_ALU, which spec-cii.d2 (age-ordered collapsing), d3 (per-entry past-PNR gate) and i7 (must not be a head-only FIFO) all forbid, and which execution.rst contradicts within itself - line 174 says "in program order" while line 365 says the per-instruction packet "permits IQ_V_ALU to issue age-ordered rather than in program order". Retired as a wrong obligation pending an author ruling on the source contradiction; the in-order VPU property is spec-cii.a1 and d14.

  - id: spec-cii.f28
    statement: >
      VRF port numbering must be 0-based.
    retired_because: >
      A documentation convention from a draft-correction paragraph ("Ports are 0-based"), not an RTL obligation. The port assignments themselves are spec-cii.f25 and f26.

  - id: spec-cii.h3
    statement: >
      The VPU's integer and floating-point execution datapaths must be left largely unchanged.
    retired_because: >
      A scoping statement about implementation effort ("left largely unchanged"), unverifiable as written.

  - id: spec-cii.j4
    statement: >
      No additional cross-unit memory-ordering machinery must be required beyond the LSU's.
    retired_because: >
      The paragraph's conclusion ("so no additional cross-unit memory-ordering machinery is required beyond the LSU's"). A theorem about the design, not an obligation on it; spec-cii.j3 carries the ordering obligation.

