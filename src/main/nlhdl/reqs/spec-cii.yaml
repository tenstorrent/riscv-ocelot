family: cii
description: >
  Vector arithmetic offload over the TT-CII coprocessor interface: channels and
  credits, the host bridge, issue, the flush/kill contract, operand delivery, and
  result writeback.
spec_sources:
  - docs_caracal/src/cii.rst
  - docs_caracal/src/execution.rst
  - docs_caracal/src/midcore.rst

groups:
  a: offload scope, the four channels, and interface parameters
  b: the credit protocol and the tag
  c: the host bridge — Chisel to SystemVerilog
  d: issue from IQ_V_ALU
  e: flush recovery and the kill contract
  f: operand delivery — pull, slots, and VRF read ports
  g: result writeback and completion
  h: the VPU (coprocessor) side
  i: segmented load/store — the CII half
  j: ordering with memory operations
  k: the instruction issue packet

reqs:

  # --- a: offload scope, the four channels, interface parameters ---------------
  #
  # The chapter-title section carries no enclosing anchor: `.. _cii:` sits *after* the
  # heading, so a1-a3 cite heading only.

  - id: spec-cii.a1
    kind: structure
    statement: >
      Vector arithmetic must execute on an in-order vector unit attached through the
      Tenstorrent Custom Instruction Interface.
    source:
      file: docs_caracal/src/cii.rst
      heading: "Vector Arithmetic and the CII Coprocessor"
      quote: >
        |caracal| executes vector *arithmetic* on an in-order vector unit attached through the
        **Tenstorrent Custom Instruction Interface (TT-CII)** — a loosely-coupled coprocessor
        interface.

  - id: spec-cii.a2
    kind: structure
    statement: >
      Only the arithmetic OP.v stream must be offloaded to the CII.
    source:
      file: docs_caracal/src/cii.rst
      heading: "Vector Arithmetic and the CII Coprocessor"
      quote: >
        Vector *loads and stores* stay in the unified LSU (see :doc:`loadstore`); only
        the arithmetic ``OP.v`` stream is offloaded to the CII.

  - id: spec-cii.a3
    kind: interface
    statement: >
      Both the host and the coprocessor must bind to the Caracal parameterization in
      tt_cii_caracal_pkg.svh.
    source:
      file: docs_caracal/src/cii.rst
      heading: "Vector Arithmetic and the CII Coprocessor"
      quote: >
        ``tt_cii_caracal_pkg.svh`` (the |caracal| parameterization — **the contract both
        sides bind to**).

  - id: spec-cii.a4
    kind: structure
    statement: >
      The CII must be reached over four unidirectional, credit-metered channels.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        The CII is a loosely-coupled coprocessor reached over **four unidirectional,
        credit-metered channels** (each a ``tt_cii_channel`` credit FIFO, default depth 16).

  - id: spec-cii.a5
    kind: structure
    statement: >
      Each channel must be a tt_cii_channel credit FIFO with a default depth of 16.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        The CII is a loosely-coupled coprocessor reached over **four unidirectional,
        credit-metered channels** (each a ``tt_cii_channel`` credit FIFO, default depth 16).

  - id: spec-cii.a6
    kind: interface
    statement: >
      The Issue channel must carry {tag[4], instr[32], vtype{sew,lmul,vta,vma}, vl, vstart,
      vxrm, frm, src_reuse_hint[3]} from host to CII.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        ``{tag[4], instr[32], vtype{sew,lmul,vta,vma}, vl, vstart, vxrm, frm, src_reuse_hint[3]}``

  - id: spec-cii.a7
    kind: structure
    statement: >
      NUM_INST_ISSUE must be 1.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        ``NUM_INST_ISSUE=1``

  - id: spec-cii.a8
    kind: interface
    statement: >
      The Src-Request channel must carry {tag[4], op_id[3], op_offset[3]} from CII to host.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        ``{tag[4], op_id[3], op_offset[3]}``
    notes: >
      Widths reconciled against the frozen SV on 2026-07-31: tt_cii_caracal_pkg.svh defines
      cii_caracal_srcid_t as logic [2:0] and cii_caracal_offset_t as CII_MEMBER_W =
      $clog2(CII_MAX_MEMBERS) = 3 b. The 3-bit op_id is what makes STALE_VD = 6 encodable
      (spec-cii.f10); the previously stated [8] widths matched neither.

  - id: spec-cii.a9
    kind: structure
    statement: >
      NUM_SRC_REQ must be 4.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        *pull* model; ``NUM_SRC_REQ=4``

  - id: spec-cii.a10
    kind: interface
    statement: >
      The Src-Data channel must carry {data[VLEN]} from host to CII.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        ``{data[VLEN]}``

  - id: spec-cii.a11
    kind: structure
    statement: >
      NUM_SRC_DAT_RSP must be 4.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        host answers **in request order**; ``NUM_SRC_DAT_RSP=4``

  - id: spec-cii.a12
    kind: interface
    statement: >
      The Writeback channel must carry {tag[4], wb_data[VLEN], wb_dst_offset[3], wb_wr_en,
      wb_status[9]} from CII to host.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        ``{tag[4], wb_data[VLEN], wb_dst_offset[3], wb_wr_en, wb_status[9]}``
    notes: >
      Widths reconciled against the frozen SV on 2026-07-31. tt_cii_caracal_pkg.svh defines
      cii_caracal_wb_status_t as {last, dst_kind[2], vxsat, fflags[5]} = 9 b, so ``last`` sits
      inside wb_status rather than beside it, and cii_caracal_offset_t is CII_MEMBER_W =
      $clog2(CII_MAX_MEMBERS) = 3 b. The previous ``wb_status[6], last`` could not hold its own
      contents. The field list itself is spec-cii.g19.

  - id: spec-cii.a13
    kind: structure
    statement: >
      NUM_DST_WB must be 1.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        tagged, may return out-of-order; ``NUM_DST_WB=1``
    notes: >
      That writeback beats *may* return out of order is an allowance, not an obligation, so it
      is not a separate requirement; the correlation obligation is spec-cii.b7.

  - id: spec-cii.a14
    kind: interface
    statement: >
      The Issue packet must extend the generic tt_cii_interface.sv struct with vtype, vl and
      vxrm.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        |caracal| extends two of the generic ``tt_cii_interface.sv`` packet structs: the
        **Issue** packet carries ``vtype``/``vl``/``vxrm`` (the SV has no CSR channel, and a
        32-bit RVV instruction does not encode vtype)
    notes: >
      Both extensions are coordinated changes shared by the host adapter and the VPU
      coprocessor.

  - id: spec-cii.a15
    kind: interface
    statement: >
      The Writeback packet must extend the generic struct with a last bit marking the final
      beat of a tag.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        and the **Writeback** packet carries a ``last`` bit
        marking the final beat of a ``tag`` (the generic struct has no end-of-transaction
        marker).

  - id: spec-cii.a16
    kind: structure
    statement: >
      The operand and result buses must be VLEN wide, 256 b by default.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        Operand and result buses are ``VLEN`` wide (256 b default).

  - id: spec-cii.a18
    kind: function
    statement: >
      The coprocessor must drive all register-file reads and writes indirectly through the
      host, using abstract operand slots and member offsets rather than register numbers.
    source:
      file: docs_caracal/src/execution.rst
      anchor: vector-execution
      heading: "Tenstorrent Custom Instruction Interface (tt_CII)"
      quote: >
        The coprocessor drives all register-file reads and writes **indirectly**, through the
        host, using abstract operand slots and member offsets — never register numbers (see
        :ref:`cii-prn-arn`).

  - id: spec-cii.a19
    kind: structure
    statement: >
      MAX_MEMBERS must be 8.
    source:
      file: docs_caracal/src/execution.rst
      anchor: vector-execution
      heading: "Channel overview"
      quote: >
        ``MAX_MEMBERS = 8`` (EMUL ≤ m8)
    notes: >
      The VLEN and XLEN/ELEN values in the same parameter list are machine-wide and are mined
      under spec-decode (a8, a9); the lane counts restate spec-cii.a7/a9/a11/a13.

  # --- b: the credit protocol and the tag -------------------------------------

  - id: spec-cii.b1
    kind: interface
    statement: >
      A channel sender must hold a free-running credit counter.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        Handshake is credit-based: a sender holds a free-running credit counter and stalls at
        zero — there is no ``ready`` line.

  - id: spec-cii.b2
    kind: interface
    statement: >
      A channel sender must stall at zero credits.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        Handshake is credit-based: a sender holds a free-running credit counter and stalls at
        zero — there is no ``ready`` line.

  - id: spec-cii.b3
    kind: interface
    statement: >
      The CII channels must have no ready line.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        Handshake is credit-based: a sender holds a free-running credit counter and stalls at
        zero — there is no ``ready`` line.

  - id: spec-cii.b4
    kind: structure
    statement: >
      The tag must be 4 bits wide with 16 in flight, parameterized by ciiTagBits.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        **Tag width is 4 bits (16 in-flight), one parameter ``ciiTagBits``.**

  - id: spec-cii.b5
    kind: structure
    statement: >
      An LMUL register group must be one transaction identified by its tag.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        An ``LMUL`` register group is
        **one transaction** identified by its ``tag``

  - id: spec-cii.b6
    kind: interface
    statement: >
      Individual group members must be selected by op_offset on an operand pull and by
      wb_dst_offset on a writeback.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        individual group members are selected by
        ``op_offset`` (operand pull) and ``wb_dst_offset`` (writeback).

  - id: spec-cii.b7
    kind: interface
    statement: >
      Results must be correlated back to the issuing instruction by tag.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-interface
      heading: "The interface"
      quote: >
        The CII is variable-latency
        and may complete internally out of order — results are correlated back to the issuing
        instruction by ``tag``.
    notes: >
      TT-CII is its own four-channel protocol, not a CVXIF variant, even though the
      verification tree references CV-X-IF.

  - id: spec-cii.b8
    kind: structure
    statement: >
      The relay between host and coprocessor must be pure latency pipes with no buffering.
    source:
      file: docs_caracal/src/execution.rst
      anchor: vector-execution
      heading: "Channel overview"
      quote: >
        The relay between host and coprocessor is pure latency pipes with no buffering;

  - id: spec-cii.b9
    kind: interface
    statement: >
      Each channel's receiver must own the FIFO and return one credit per pop.
    source:
      file: docs_caracal/src/execution.rst
      anchor: vector-execution
      heading: "Channel overview"
      quote: >
        each channel's **receiver** owns the FIFO and returns one credit per pop.
    notes: >
      This asymmetry is what makes the killed-tag Src-Data beat mandatory rather than
      creditable — see the danger block behind spec-cii.e14.

  - id: spec-cii.b10
    kind: interface
    statement: >
      The coprocessor must echo the tag on every request and writeback beat.
    source:
      file: docs_caracal/src/execution.rst
      anchor: vector-execution
      heading: "Channel overview"
      quote: >
        allocated by the
        host at issue and echoed by the
        coprocessor on every request/writeback beat.

  - id: spec-cii.b11
    kind: structure
    statement: >
      The tag must index the host's per-tag side-table.
    source:
      file: docs_caracal/src/execution.rst
      anchor: vector-execution
      heading: "Channel overview"
      quote: >
        It indexes the host's per-tag **side-table**
    notes: >
      The field list given here differs from the one in cii.rst §"Issue: from ``IQ_V_ALU`` to
      the CII" (spec-cii.d8). No requirement is written from either list's contents — see the
      open question on side-table membership.

  - id: spec-cii.b12
    kind: function
    statement: >
      The coprocessor must treat the tag as an identifier only.
    source:
      file: docs_caracal/src/execution.rst
      anchor: vector-execution
      heading: "Channel overview"
      quote: >
        The coprocessor treats the tag as an identifier only; it never inspects its
        contents.

  - id: spec-cii.b13
    kind: function
    statement: >
      The coprocessor must never inspect the side-table contents.
    source:
      file: docs_caracal/src/execution.rst
      anchor: vector-execution
      heading: "Channel overview"
      quote: >
        The coprocessor treats the tag as an identifier only; it never inspects its
        contents.

  # --- c: the host bridge -----------------------------------------------------

  - id: spec-cii.c1
    kind: structure
    statement: >
      The CII interface, its credit relay and the VPU must be SystemVerilog while the core is
      Chisel.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        |caracal|'s core is Chisel; the CII interface, its credit relay, and the VPU are
        SystemVerilog.

  - id: spec-cii.c2
    kind: structure
    statement: >
      A thin SV flatten wrapper must join the Chisel core to the SystemVerilog CII.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        So the two are joined by a thin SV
        flatten wrapper
    notes: >
      Required because a Chisel BlackBox can only bind flat Bits ports — not an SV
      interface/modport port, and not ports typed by parameter-type packed structs, which is
      exactly what tt_cii_interface and the VPU use.

  - id: spec-cii.c3
    kind: interface
    statement: >
      The Chisel host adapter VecCiiHost must drive a flat four-channel bundle to a BlackBox.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        the Chisel host adapter (``VecCiiHost``) drives a **flat** four-channel
        bundle to a ``BlackBox``

  - id: spec-cii.c4
    kind: function
    statement: >
      The wrapper must repack flat signals to and from structs.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        and the wrapper repacks flat ⇄ structs and hides the interface,
        the credit relay, and the VPU coprocessor inside.

  - id: spec-cii.c5
    kind: structure
    statement: >
      The wrapper must hide the interface, the credit relay and the VPU coprocessor inside
      itself.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        and the wrapper repacks flat ⇄ structs and hides the interface,
        the credit relay, and the VPU coprocessor inside.

  - id: spec-cii.c6
    kind: structure
    statement: >
      The Chisel side must see only the flat host-channel wires.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        Everything SystemVerilog — the ``tt_cii`` credit relay and the VPU — lives **inside**
        the ``BlackBox``; the Chisel side sees only the flat host-channel wires.

  - id: spec-cii.c7
    kind: function
    statement: >
      The wrapper must pack the flat iss_* inputs into cii_h.iss_data[0] and unpack req_data
      and wb_data back to flat outputs.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        The wrapper packs the
        flat ``iss_*`` inputs into ``cii_h.iss_data[0]`` (a ``cii_caracal_issue_req_t``) and unpacks
        ``req_data``/``wb_data`` back to flat outputs.

  - id: spec-cii.c8
    kind: interface
    statement: >
      The tag must label every req and wb beat end to end.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        The ``tag`` threads end to end: it labels
        every ``req`` and ``wb`` beat, and ``VecCiiHost`` keys its side-table on it (operand-pull →
        PRN, result placement, and ``clr_rob`` on the ``last`` beat).

  - id: spec-cii.c9
    kind: structure
    statement: >
      VecCiiHost must key its side-table on the tag.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        The ``tag`` threads end to end: it labels
        every ``req`` and ``wb`` beat, and ``VecCiiHost`` keys its side-table on it (operand-pull →
        PRN, result placement, and ``clr_rob`` on the ``last`` beat).

  - id: spec-cii.c10
    kind: function
    statement: >
      The adapter must advertise fu_types only when a real issue credit is available.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        Because ``IQ_V_ALU``'s grant is fire-and-forget (a ``Valid`` with no ``ready``), the adapter
        must advertise ``fu_types`` **only** when a real issue credit is available

  - id: spec-cii.c11
    kind: structure
    statement: >
      The adapter must mirror the issue FIFO's occupancy in a local credit counter.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        it mirrors the
        issue FIFO's occupancy in a local credit counter (``+1`` per returned ``iss_credit``, ``−1``
        per issued beat) and gates ``fu_types`` on it.

  - id: spec-cii.c12
    kind: function
    statement: >
      The adapter must gate fu_types on that local credit counter.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        it mirrors the
        issue FIFO's occupancy in a local credit counter (``+1`` per returned ``iss_credit``, ``−1``
        per issued beat) and gates ``fu_types`` on it.

  - id: spec-cii.c13
    kind: structure
    statement: >
      The fu_types gate must be registered.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        The gate is registered — a combinational
        ``fu_types → grant → iss_valid`` path would form a loop

  - id: spec-cii.c14
    kind: function
    statement: >
      The issue credit accounting must be exact.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-host-bridge
      heading: "Host bridge: Chisel ↔ SystemVerilog"
      quote: >
        so the credit accounting must be
        exact and never advertise at zero credits.

  # --- d: issue from IQ_V_ALU -------------------------------------------------

  - id: spec-cii.d1
    kind: structure
    statement: >
      Vector arithmetic must dispatch to IQ_V_ALU.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-issue
      heading: "Issue: from ``IQ_V_ALU`` to the CII"
      quote: >
        Vector arithmetic dispatches to ``IQ_V_ALU`` (:doc:`issue`), which is **age-ordered
        collapsing with a per-entry past-PNR gate**

  - id: spec-cii.d2
    kind: structure
    statement: >
      IQ_V_ALU must be age-ordered collapsing with a per-entry past-PNR gate.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-issue
      heading: "Issue: from ``IQ_V_ALU`` to the CII"
      quote: >
        Vector arithmetic dispatches to ``IQ_V_ALU`` (:doc:`issue`), which is **age-ordered
        collapsing with a per-entry past-PNR gate**
    notes: >
      The queue's own structure is also specified by issue.rst and will be mined under
      spec-issue; this entry records the obligation the CII contract depends on.

  - id: spec-cii.d3
    kind: function
    statement: >
      An IQ_V_ALU entry must become eligible only once it is past the PNR.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-issue
      heading: "Issue: from ``IQ_V_ALU`` to the CII"
      quote: >
        every entry becomes eligible only once it is **past the PNR**, so each
        op handed to the CII is individually non-speculative, RoCC-style.

  - id: spec-cii.d4
    kind: function
    statement: >
      Each op handed to the CII must be individually non-speculative.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-issue
      heading: "Issue: from ``IQ_V_ALU`` to the CII"
      quote: >
        every entry becomes eligible only once it is **past the PNR**, so each
        op handed to the CII is individually non-speculative, RoCC-style.

  - id: spec-cii.d5
    kind: structure
    statement: >
      The design must not implement the speculative rename model with a shadow table and
      cv0-cv31 copy registers.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-issue
      heading: "Issue: from ``IQ_V_ALU`` to the CII"
      quote: >
        |caracal| therefore does **not**
        implement the speculative *rename* model from ``interface_details.adoc`` (its shadow table and
        ``cv0–cv31`` copy registers)

  - id: spec-cii.d6
    kind: function
    statement: >
      On grant the host adapter must allocate a 4-bit tag.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-issue
      heading: "Issue: from ``IQ_V_ALU`` to the CII"
      quote: >
        allocates a 4-bit ``tag`` and emits the **extended Issue packet**
        (:ref:`cii-issue-packet`) on the
        Issue channel, and

  - id: spec-cii.d7
    kind: function
    statement: >
      On grant the host adapter must emit the extended Issue packet on the Issue channel.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-issue
      heading: "Issue: from ``IQ_V_ALU`` to the CII"
      quote: >
        allocates a 4-bit ``tag`` and emits the **extended Issue packet**
        (:ref:`cii-issue-packet`) on the
        Issue channel, and

  - id: spec-cii.d8
