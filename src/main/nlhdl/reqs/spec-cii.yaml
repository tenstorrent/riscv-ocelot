  # Source-Data lane ordering and duplicate reads, resolved 2026-08-01.

  - id: spec-cii.f44
    kind: interface
    statement: >
      Source-Requests arriving in the same cycle must be ordered by ascending lane index.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-operands
      heading: "Register operand delivery (VRF read ports)"
      quote: >
        That order is **global across all four lanes**, not per lane: Source-Requests
        arriving in the same cycle are ordered by **ascending lane index**
    notes: >
      This is the intra-cycle tie-break that makes spec-cii.f22's "exact order the requests
      arrived" well defined across four lanes. The order is global, not per lane.

  - id: spec-cii.f45
    kind: interface
    statement: >
      Source-Data beats returned in one cycle must occupy ascending lane indices in the global
      request order.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-operands
      heading: "Register operand delivery (VRF read ports)"
      quote: >
        and the Source-Data beats
        returned in a cycle occupy ascending lane indices in that same order, so the global
        sequence is ``(cycle, lane)`` lexicographic.
    notes: >
      The return-side half of spec-cii.f44, giving a (cycle, lane) lexicographic global
      sequence. The spec's stated reason is that this is what lets the Source-Data payload stay
      a bare data[VLEN] carrying no tag and no op_id — the coprocessor identifies each beat by
      its position in the sequence.

  - id: spec-cii.f46
    kind: function
    statement: >
      The host must perform one read per lane when two Source-Request lanes name the same
      member in the same cycle.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-operands
      heading: "Register operand delivery (VRF read ports)"
      quote: >
        **Two lanes may name the same member in the same cycle, and the host simply reads it
        twice.** Nothing coalesces the duplicate.
    notes: >
      The case is reachable: vadd.vv v1, v2, v2 renames both sources to a single PRN. It is
      free because each Src-Request lane owns its own read port under the static partition,
      which is the same property that guarantees the host never stalls on a VRF port.

