  # Repeated flushes during a drain, resolved 2026-08-01.

  - id: spec-cii.e26
    kind: function
    statement: >
      The ``killed`` bit must be idempotent under repeated flushes.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-kill-contract
      heading: "The kill contract"
      quote: >
        **``killed`` is idempotent.** A second flush arriving while a tag is still draining sets
        ``killed`` on every live entry again, which changes nothing for an entry that already
        carries it.
    notes: >
      The consequences the spec draws are covered elsewhere: the drain continues uninterrupted
      and the tag is still freed on its last beat (spec-cii.e21) however many flushes
      intervened. The spec also states there is no re-initialization on the second flush and no
      per-tag flush counter; those absences are not written as requirements, since no RTL
      implements the absence of a mechanism.

  - id: spec-cii.e27
    kind: function
    statement: >
      The ``killed`` bit must be cleared only when the tag is allocated.
    source:
      file: docs_caracal/src/cii.rst
      anchor: cii-kill-contract
      heading: "The kill contract"
      quote: >
        The bit and the side-table state that routes the drain are never cleared while the tag
        is live — ``killed`` is cleared only when the tag is allocated
    notes: >
      Distinct from spec-cii.e22, which requires the bit and its routing state to survive a
      flush; this fixes the only point at which the bit may be cleared.

