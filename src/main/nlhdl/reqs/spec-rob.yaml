retired:

  - id: spec-rob.d6
    statement: >
      A shared instruction's ROB entry must clear rob_bsy only when both the LSU group-done
      and the coprocessor group-done have arrived.
    retired_because: >
      Named "the LSU group-done", which does not exist for a segmented store: that half writes no
      VRF, so it signals lsu_clr_bsy rather than a group-done. midcore.rst §"Completion tracking"
      was corrected on 2026-08-03 to say "both halves' completion events". Superseded by
      spec-rob.d15, with the per-half event types as spec-rob.d16, d17 and d18.

  - id: spec-rob.d9
    statement: >
      A segmented store's two halves must complete in the order LSU then CII.
    retired_because: >
      midcore.rst "Completion tracking" was corrected on 2026-07-31: the note now reads
      "CII-then-LSU for a segmented store", resolving the contradiction with the
      producer-then-consumer rule (spec-rob.d7) and with the following paragraph, which names
      the coprocessor as the pvtmp producer for a store. Superseded by spec-rob.d14.

# All four open questions recorded against this family were resolved on 2026-08-03:
#
#   segmented store's busy-clear order -> the LSU half defers its completion until after DGEN has
#     read pvtmp, so the order is CII-then-LSU as spec-rob.d7/d14 require. The event is
#     lsu_clr_bsy, not a group-done, because that half writes no VRF. c6/c7 scoped to non-shared
#     stores, spec-rob.c9 issued; d6 retired and spec-rob.d15-d18 issued.
#   when the other-half-pending flag is set -> at dispatch on is_shared, cleared on the second
#     completion; the same-cycle case is unreachable because the consumer half is woken by the
#     producer's group-done. spec-rob.d19-d21.
#   what clears rob_unsafe for a store   -> one group-safe on the last LCAM check, and a shared
#     instruction needs only the LSU half's. spec-rob.e5, e6. Requiring a second would close the
#     same cycle resolved as spec-issue.d16-d18.
#   how many stale-PRN slots per entry   -> MAX_MEMBERS = 8, on every entry; spec-rob.f5, f6.
