#
#   "front-end extended" vs "unchanged" -> prose reworded to name decode/rename; the fetch
#     front-end is unchanged, as the subsystem table and the per-stage list both already said.
#   scalar modification set closed?     -> CLOSED WITHOUT ENUMERATING. The premise was stale:
#     spec-core.a1, which made every unstated change a violation, was already retired on
#     2026-07-31 as an unbounded negative universal with no tag site. Equivalence is covered
#     stage by stage in group e and by the per-stage status lines, so no separate list was added.
#   13 stages vs ten stage groups       -> the standalone count was struck. The premise was also
#     part stale: spec-core.a9, the greyed-figure requirement, was already retired as
#     uncheckable. What survived was arithmetic — a six-stage fetch plus nine back-end groups is
#     not 13 — and no verifiable replacement number was substituted. spec-core.a5/a6 re-quoted.
#   "granted once" per OP.v or slot?    -> per issue slot per execution path; f3/f4 retired,
#     spec-core.f10-f14 issued.
#   atomicity of a mid-group fault      -> architectural atomicity; spec-core.i9, i10
#   what holds the pvtmp binding        -> the OP.v's pvtmp MicroOp field; spec-core.h8
