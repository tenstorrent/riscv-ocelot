  # another family's chapter text are not given core IDs, and the pointer is recorded in
  # the notes of the nearest core requirement. Not given IDs here, by term:
  #   Scheduler (age-ordered collapsing, IQ_V_ALU past-PNR gate) -> issue, spec-cii.d2/d3
  #   past-PNR (IQ_V_ALU grants only past-PNR entries)           -> spec-cii.d3
  #   group-done producers (LCB / CII last beat)                 -> spec-lsu.e15, spec-cii
  #   stale_pvdest (only source of undisturbed lanes, pvdest is
  #     always a fresh group, distinct from pvs3)                -> vrf, spec-lsu.e9/e10,
  #                                                                  spec-cii.f10/f17/f18
  #   pvtmp allocation and reclaim                               -> rename
  #   shared instruction hand-off through pvtmp                  -> spec-lsu.l9
  #   LCB (VLEN-wide assembly, one write per PRN)                -> spec-lsu's e group
  #   is_vl_producer (orthogonal to dst_rtype, dual destination) -> spec-decode.c16/c18
  #   VCFG mirror (speculative, snapshotted, vill poisoning)     -> spec-decode's g/h groups
  #   reservation (program-order dispatch, worst-case sizing)    -> spec-lsu, issue
  #   AGEN / DGEN (FC_AGEN, FC_DGEN, per-element addresses)      -> spec-agen
  #   RMT (ARN-to-PRN mapping) is a definition with no obligation.
  - file: docs_caracal/src/glossary.rst
    heading: "Glossary"
    anchor: glossary-terms
    reqs: [spec-core.c1, spec-core.c2, spec-core.c3, spec-core.c4, spec-core.c5,
           spec-core.c6, spec-core.c7, spec-core.c8, spec-core.c9, spec-core.c10,
           spec-core.c11, spec-core.c12, spec-core.c13,
           spec-core.f2, spec-core.f10, spec-core.f11, spec-core.f5,
           spec-core.f6, spec-core.f7, spec-core.f8,
           spec-core.g1, spec-core.g2, spec-core.g3,
           spec-core.h1, spec-core.h2, spec-core.h3, spec-core.h4, spec-core.h5,
           spec-core.h6, spec-core.h7,
           spec-core.h8, spec-core.f12, spec-core.f13, spec-core.f14]

  # execution.rst: core owns exactly one section there, per families.yaml.
  - file: docs_caracal/src/execution.rst
    heading: "The Execution Pipelines"
    anchor: execution-pipelines
    reqs: [spec-core.i1, spec-core.i2, spec-core.i3, spec-core.i4, spec-core.i5,
           spec-core.i6, spec-core.i7, spec-core.i8,
           spec-core.i9, spec-core.i10]

retired:

  - id: spec-core.f3
    statement: >
      An OP.v must occupy one issue slot.
    retired_because: >
      False for a shared instruction, which occupies two. The glossary sentence was scoped to
      non-shared ops on 2026-08-03, resolving the open question on whether "one slot / granted
      once" was per OP.v or per issue slot. Superseded by spec-core.f10.

  - id: spec-core.f4
    statement: >
      An OP.v must be granted exactly once.
    retired_because: >
      The grant is per issue slot per execution path, not per OP.v — a shared instruction is
      granted twice, and a vector store slot's AGEN and DGEN paths are independently grantable.
      Resolved on 2026-08-03. Superseded by spec-core.f11, with the two exceptions stated as
      spec-core.f12 and f13 and the underlying invariant as spec-core.f14.

  - id: spec-core.a1
    statement: >
      Caracal must not modify the existing BOOM micro-architecture except where this specification specifically mentions otherwise.
    retired_because: >
      The quote is a .. note:: instructing the reader how to read the document ("the reader should assume that Caracal does not modify the existing BOOM micro-architecture"). Converting "the reader should assume X" into "the design must X" is a different proposition, and the result is an unbounded negative universal with no tag site - as this family's own open question conceded. Retired by decision on 2026-07-31. The checkable equivalence content is spec-core.b1, b4, b7 and the per-stage e group.

  - id: spec-core.a9
    statement: >
      The pipeline stages shown greyed in the pipeline figure must be bit-identical to BOOM v4.
    retired_because: >
      The referent exists only inside a PNG figure ("the pipeline stages shown greyed"), so the requirement is not checkable from the text. This family had already recorded that in an open question. The per-stage equivalence obligations are enumerated in group e.

  - id: spec-core.b2
    statement: >
      The decode and rename stages must be extended from BOOM v4 to support RVV.
    retired_because: >
      A summary-table status label ("Decode / Rename | Extended") with no failure mode - no RTL can violate "must be extended". The statement also asserted "to support RVV" and "from BOOM v4", neither of which is in the quoted cell. Substance is owned by spec-decode and spec-rename.

  - id: spec-core.b3
    statement: >
      The integer execution subsystem must be extended under usingRVV.
    retired_because: >
      A summary-table status label ("Integer execution | Extended") with no failure mode. The mechanisms are spec-decode.c11, c14, c15, c16 and c18.

  - id: spec-core.b5
    statement: >
      Caracal must add a new vector (RVV) execution subsystem.
    retired_because: >
      A summary-table status label ("Load/Store Unit | Extended") with no failure mode. Substance is owned by spec-lsu.

  - id: spec-core.b6
    statement: >
      The load/store unit must be extended from BOOM v4.
    retired_because: >
      A summary-table status label ("Vector (RVV) execution | New") with no failure mode. Substance is owned by spec-cii and spec-agen.

  - id: spec-core.f1
    statement: >
      Caracal must have a single issue stage.
    retired_because: >
      The quote is the glossary definition of the term "Scheduler" ("Caracal's single issue stage") - a term gloss, not an obligation, and BOOM v4 already has a single issue stage. The normative form is spec-issue.e5, from issue.rst: "Caracal does not add a second issue stage".

  - id: spec-core.f9
    statement: >
      The design must not treat past-PNR status as a commit guarantee.
    retired_because: >
      The quote is a .. warning:: about a machine property ("Past-PNR is not a commit guarantee"), whose second sentence is a "can" allowance. The statement names no subject that can be tagged. The obligation it points at is the CII drain-on-flush contract, spec-cii group e.

