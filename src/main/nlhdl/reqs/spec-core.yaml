  # --- f: the single scheduler and the PNR safety model ------------------------

  - id: spec-core.f2
    kind: structure
    statement: >
      The scalar issue queues must be unchanged from BOOM.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        |caracal|'s **single** issue stage. The scalar queues
        (``IQ_MEM``/``IQ_UNQ``/``IQ_ALU``/``IQ_FP``) are unchanged from |boom|;

  - id: spec-core.f10
    kind: structure
    statement: >
      A non-shared OP.v must occupy one issue slot.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        A **non-shared** :term:`OP.v` occupies **one**
        slot, and each slot is granted **once**, when
        **all** of its operands are ready
    notes: >
      Supersedes the retired spec-core.f3, which stated this of every OP.v. Matches
      spec-issue.e6, which has carried the non-shared qualifier from the start.

  - id: spec-core.f11
    kind: function
    statement: >
      Each issue slot must be granted once.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        A **non-shared** :term:`OP.v` occupies **one**
        slot, and each slot is granted **once**, when
        **all** of its operands are ready
    notes: >
      Supersedes the retired spec-core.f4, which stated the grant as per-OP.v. Resolved on
      2026-08-03: "granted once" is per issue slot per execution path. The two cases that make
      the distinction matter are spec-core.f12 and f13.

  - id: spec-core.f12
    kind: function
    statement: >
      Each of a shared instruction's two issue slots must be granted once.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        a :term:`shared instruction` occupies **two** slots and each is granted
        once
    notes: >
      That a shared instruction occupies two slots is spec-core.h1; this is the grant rule for
      them.

  - id: spec-core.f13
    kind: function
    statement: >
      A vector store slot's AGEN and DGEN paths must be independently grantable.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        a vector **store** slot's AGEN and DGEN paths are **independently grantable** — for
        a segmented store, hundreds of cycles apart (see :ref:`shared-store-chain`).
    notes: >
      Stated from the glossary here; issue.rst states the same obligation in the
      segmented-store chain, which is spec-issue group d. Mined in both because the glossary
      sentence is what makes "granted once" unambiguous.

  - id: spec-core.f14
    kind: structure
    statement: >
      An OP.v must be allocated and selected once, with no second issue stage.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        The invariant the
        phrase names is that an ``OP.v`` is allocated and selected **once**, with no second issue
        stage and no second priority-encoder select.
    notes: >
      This is the invariant "granted once" was reaching for. The same obligation is
      spec-issue.e5 from issue.rst; both are kept because each chapter states it normatively.

  - id: spec-core.f5
    kind: function
    statement: >
      An OP.v must be granted only when all of its operands are ready.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        A **non-shared** :term:`OP.v` occupies **one**
        slot, and each slot is granted **once**, when
        **all** of its operands are ready — scalar feeders (base/stride/``.vx``) on the integer
        network, ``pvl`` on the VL network, and vector registers (``pvs*``, mask ``pvm``) on the
        vector network.
    notes: >
      The three wakeup networks the readiness is tracked on are named in the quote; the
      networks themselves are owned by the issue, vrf and decode families. spec-cii.d12
      states the same grant rule for IQ_V_ALU.

  - id: spec-core.f6
    kind: interface
    statement: >
      Only the IQ_V_* queues must connect to the vector wakeup network.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        Only the ``IQ_V_*`` queues connect to the vector wakeup network.

  - id: spec-core.f7
    kind: function
    statement: >
      The PNR must never sweep past an unresolved branch.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        ``is_br``/``is_jalr`` set ``starts_unsafe``,
        so the PNR never sweeps past an unresolved branch.
    notes: >
      spec-cii.e3 draws the CII-specific consequence (no in-flight tag is ever younger than
      an unresolved branch); this is the machine-wide invariant it depends on.

  - id: spec-core.f8
    kind: function
    statement: >
      A uop with is_br or is_jalr set must set starts_unsafe.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        ``is_br``/``is_jalr`` set ``starts_unsafe``,
        so the PNR never sweeps past an unresolved branch.

  - id: spec-core.g1
    kind: function
    statement: >
      A vector producer must emit exactly one group-done event per OP.v.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        The **single** completion event a vector producer emits per ``OP.v``, carrying the completing
        destination group's full **member-PRN vector**.
    notes: >
      This is the machine-wide completion contract that follows from one ROB entry per OP.v
      (spec-core.c6). Its two producers are owned elsewhere: the LCB after the last
      destination PRN lands (spec-lsu.e15) and the CII on the writeback beat marked last
      (spec-cii's g group).

  - id: spec-core.g2
    kind: interface
    statement: >
      A group-done event must carry the completing destination group's full member-PRN vector.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        The **single** completion event a vector producer emits per ``OP.v``, carrying the completing
        destination group's full **member-PRN vector**.
    notes: >
      spec-lsu.e16 states the same for the LCB's instance of the event; this is the obligation
      on every producer.

  - id: spec-core.g3
    kind: interface
    statement: >
      One group-done event must drive the ROB's single-shot rob_bsy clear, the vector
      Busy-Table clear and the vector wakeup network at once.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        One event drives all three consumers at once: the ROB's single-shot ``rob_bsy``
        clear, the vector Busy-Table clear, and the vector wakeup network.
    notes: >
      One idea — a single event with three fanouts, not three events. The consumers'
      behaviour is owned by rob, rename and vrf in midcore.rst.

  # --- h: shared instructions and the pvtmp rendezvous ------------------------

  - id: spec-core.h1
    kind: structure
    statement: >
      pvtmp must be an ordinary VRF group.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        It is an
        **ordinary VRF group** — no separate temp register file — with a real busy lifetime, reclaimed
        on mispredict and freed at commit alongside ``stale_pvdest``.
    notes: >
      That the vector mapper allocates it, and that it is reclaimed on mispredict and freed at
      commit, are rename-family obligations in midcore.rst §"CII Shared Instruction Mapping".

  - id: spec-core.h2
    kind: structure
    statement: >
      The design must not contain a separate temp register file for pvtmp.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        It is an
        **ordinary VRF group** — no separate temp register file — with a real busy lifetime, reclaimed
        on mispredict and freed at commit alongside ``stale_pvdest``.

  - id: spec-core.h3
    kind: function
    statement: >
      pvtmp must have a real busy lifetime in the vector busy table.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        It is an
        **ordinary VRF group** — no separate temp register file — with a real busy lifetime, reclaimed
        on mispredict and freed at commit alongside ``stale_pvdest``.

  - id: spec-core.h4
    kind: function
    statement: >
      pvtmp must never be installed in the vector RMT.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        Never installed in the vector
        RMT, so no architectural read can alias it.
    notes: >
      That no architectural read can then alias it is the consequence the obligation buys, not
      a second obligation.

  - id: spec-core.h5
    kind: structure
    statement: >
      A shared instruction must occupy a single ROB entry.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        An ``OP.v`` marked ``is_shared`` that needs **two** execution resources: one issue slot in
        ``IQ_V_ALU`` (coprocessor half) and one in ``IQ_V_LOAD``/``IQ_V_STORE`` (LSU half), but a
        **single** ROB entry.

  - id: spec-core.h6
    kind: structure
    statement: >
      A shared instruction must occupy one IQ_V_ALU issue slot and one IQ_V_LOAD or
      IQ_V_STORE issue slot.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        An ``OP.v`` marked ``is_shared`` that needs **two** execution resources: one issue slot in
        ``IQ_V_ALU`` (coprocessor half) and one in ``IQ_V_LOAD``/``IQ_V_STORE`` (LSU half), but a
        **single** ROB entry.
    notes: >
      The spec states that segmented load/store is currently the only shared instruction;
      that is scope, not an obligation to reject others.

  - id: spec-core.h7
    kind: function
    statement: >
      The two halves of a shared instruction must always complete
      producer-half-then-consumer-half.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        The halves hand off through :term:`pvtmp` and always complete producer-half-then-consumer-half.
    notes: >
      That the halves hand off through pvtmp is already spec-lsu.l9; the general write/read
      direction is spec-core.i7/i8. This entry is the completion-order obligation only.

  # Where the pvtmp-to-PRN binding lives, resolved 2026-08-03.

  - id: spec-core.h8
    kind: structure
    statement: >
      The pvtmp-to-PRN binding must be held in the ``OP.v``'s ``pvtmp`` ``MicroOp`` field.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        The binding is held in the ``OP.v``'s own **``pvtmp`` ``MicroOp`` field**, written by the
        vector mapper at rename.
    notes: >
      Resolved 2026-08-03: the question was what holds the binding given that pvtmp is never
      installed in the vector RMT (spec-core.h5). Both halves derive from one uop and one ROB
      entry, so each half's issue slot carries the member PRNs directly and no RMT entry is
      needed. The mapper-side allocation is spec-rename group e.

  # --- i: the three vector execution streams (execution.rst) ------------------

  - id: spec-core.i1
    kind: structure
    statement: >
      Caracal must not modify any BOOM execution pipeline.
    source:
      file: docs_caracal/src/execution.rst
      anchor: execution-pipelines
      heading: "The Execution Pipelines"
      quote: >
        |caracal| does not modify any |boom| execution pipeline, scalar execution is untouched.

  - id: spec-core.i2
    kind: structure
    statement: >
      Scalar execution must be untouched.
    source:
      file: docs_caracal/src/execution.rst
      anchor: execution-pipelines
      heading: "The Execution Pipelines"
      quote: >
        |caracal| does not modify any |boom| execution pipeline, scalar execution is untouched.
    notes: >
      Read against spec-core.b3: the integer ALU EU's vset extension is the one stated
      exception to scalar-execution equivalence, and it is bit-identical to BOOM with usingRVV
      off (spec-decode.c15).

  - id: spec-core.i3
    kind: structure
    statement: >
      The execution of vector instructions must be split into three streams: vector
      arithmetic/reduction/permutation, vector loads, and vector stores.
    source:
      file: docs_caracal/src/execution.rst
      anchor: execution-pipelines
      heading: "The Execution Pipelines"
      quote: >
        The execution of vector instructions is split into 3 streams:
        1. Vector Arithmetic, Reduction, Permutation
        2. Vector Loads
        3. Vector Stores

  - id: spec-core.i4
    kind: function
    statement: >
      A vector OP.v must always execute atomically.
    source:
      file: docs_caracal/src/execution.rst
      anchor: execution-pipelines
      heading: "The Execution Pipelines"
      quote: >
        Vector instruction OP.v's may execute out-of-order relative to program order, but must always execute atomically
        and in element order.
    notes: >
      That an OP.v *may* execute out-of-order relative to program order is an allowance, not
      an obligation, so it is not a requirement of its own.

  - id: spec-core.i5
    kind: function
    statement: >
      A vector OP.v must always execute in element order.
    source:
      file: docs_caracal/src/execution.rst
      anchor: execution-pipelines
      heading: "The Execution Pipelines"
      quote: >
        Vector instruction OP.v's may execute out-of-order relative to program order, but must always execute atomically
        and in element order.
    notes: >
      spec-lsu.a8 and spec-lsu.f8 state the memory-path instances of element order; this is
      the obligation on all three streams.

  - id: spec-core.i6
    kind: structure
    statement: >
      A shared instruction must require more than one execution unit to activate.
    source:
      file: docs_caracal/src/execution.rst
      anchor: execution-pipelines
      heading: "The Execution Pipelines"
      quote: >
        Shared instructions require more than 1 EU to activate and hand off intermediate results
        through a temp vector group (``pvtmp``) in the VRF — one half writes it, the other reads it.

  - id: spec-core.i7
    kind: interface
    statement: >
      The producer half of a shared instruction must write the pvtmp vector group in the VRF.
    source:
      file: docs_caracal/src/execution.rst
      anchor: execution-pipelines
      heading: "The Execution Pipelines"
      quote: >
        Shared instructions require more than 1 EU to activate and hand off intermediate results
        through a temp vector group (``pvtmp``) in the VRF — one half writes it, the other reads it.
    notes: >
      The per-case producers are owned elsewhere: the LSU half writes pvtmp for a segmented
      load (spec-lsu.l3) and the coprocessor half writes it for a segmented store
      (spec-cii.i11).

  - id: spec-core.i8
    kind: interface
    statement: >
      The consumer half of a shared instruction must read the pvtmp vector group from the VRF.
    source:
      file: docs_caracal/src/execution.rst
      anchor: execution-pipelines
      heading: "The Execution Pipelines"
      quote: >
        Shared instructions require more than 1 EU to activate and hand off intermediate results
        through a temp vector group (``pvtmp``) in the VRF — one half writes it, the other reads it.

  # What atomicity means for a mid-group fault, resolved 2026-08-03.

  - id: spec-core.i9
    kind: function
    statement: >
      No partial result of an ``OP.v`` must ever be architecturally visible.
    source:
      file: docs_caracal/src/execution.rst
      anchor: execution-pipelines
      heading: "The Execution Pipelines"
      quote: >
        **Atomically means architecturally atomic**, not that an ``OP.v``'s element accesses are
        indivisible. No partial result of an ``OP.v`` is ever architecturally visible.
    notes: >
      Resolved 2026-08-03. This defines the atomicity spec-core.i5 requires, which previously
      rested on text in another chapter. Atomicity is architectural, not per-access: element
      accesses below a fault point do fire and their responses do land in the LCB.

  - id: spec-core.i10
    kind: function
    statement: >
      An ``OP.v`` whose element stream faults mid-group must restart the whole instruction with
      ``vstart = 0``.
    source:
      file: docs_caracal/src/execution.rst
      anchor: execution-pipelines
      heading: "The Execution Pipelines"
      quote: >
        ``pvdest`` is a *fresh* physical group that a
        non-committing instruction never installs in ``com_map_table``, so the trap discards those
        responses
        and restarts the whole instruction with ``vstart = 0`` (see :ref:`elem-progress`).
    notes: >
      Stated here as what makes spec-core.i9 hold for the mid-group fault case. The mechanism
      is spec-lsu group f (elem-progress); the fresh-group premise is spec-rename group d.

