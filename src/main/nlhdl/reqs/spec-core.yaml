family: core
description: >
  Machine-wide invariants: the usingRVV gate and BOOM-v4 equivalence, the uOP model
  (one uOP per instruction, no cracking), and the vector-CSR delegation boundary.
spec_sources:
  - docs_caracal/src/overview.rst
  - docs_caracal/src/glossary.rst
  - docs_caracal/src/execution.rst

groups:
  a: the fork — BOOM v4 equivalence, RVV scope, and the usingRVV gate
  b: per-subsystem status of the overview table (unchanged / extended / new / delegated)
  c: the uOP model — one uOP per instruction, one ROB entry per OP.v, no frontend cracking
  d: architectural-state ownership — vtype, precise vector state, and the VRF
  e: per-stage pipeline attachment and per-stage BOOM v4 equivalence
  f: the single scheduler and the PNR safety model
  g: the group-done completion model
  h: shared instructions and the pvtmp rendezvous
  i: the three vector execution streams

reqs:

  # --- a: the fork, RVV scope, and the usingRVV gate ---------------------------

  - id: spec-core.a2
    kind: function
    statement: >
      Caracal must support RVV 1.0.
    source:
      file: docs_caracal/src/overview.rst
      anchor: boom-relationship
      heading: "Relationship to BOOMv4 and Chipyard"
      quote: >
        |caracal| is a fork of BOOMv4 [5/20/2026] with a clean-slate re-architecture to
        support RVV 1.0 and OOO vector load/store.
    notes: >
      The parameter envelope this is realized in (VLEN = 256, ELEN = 64, the supported SEW and
      LMUL sets) is mined by spec-decode from frontend.rst §"Vector (RVV) Decode".

  - id: spec-core.a3
    kind: function
    statement: >
      Caracal must support out-of-order vector load/store.
    source:
      file: docs_caracal/src/overview.rst
      anchor: boom-relationship
      heading: "Relationship to BOOMv4 and Chipyard"
      quote: >
        |caracal| is a fork of BOOMv4 [5/20/2026] with a clean-slate re-architecture to
        support RVV 1.0 and OOO vector load/store.
    notes: >
      The mechanism — element/store-data queues, the LCB, D$ arbitration and squash by
      pointer rollback — is owned by spec-lsu; this is the machine-wide obligation that such a
      path exist at all.

  - id: spec-core.a4
    kind: interface
    statement: >
      Caracal must remain compatible with the Chipyard ecosystem.
    source:
      file: docs_caracal/src/overview.rst
      anchor: boom-relationship
      heading: "Relationship to BOOMv4 and Chipyard"
      quote: >
        |caracal| remains compatible with the Chipyard ecosystem, allowing it to be used as a
        drop-in core for Chipyard SoC designs and simulations.
    notes: >
      Drop-in use in Chipyard SoC designs and simulations is the stated consequence of the
      obligation, not a second obligation.

  - id: spec-core.a5
    kind: structure
    statement: >
      Caracal must keep BOOM v4's out-of-order pipeline intact.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        |caracal| keeps |boom| v4's out-of-order pipeline intact and threads
        a vector path through it.
    notes: >
      The "13-stage" figure was struck from overview.rst on 2026-08-03: the chapter's own stage
      enumeration gives a six-stage fetch front-end plus nine back-end groups, which is not 13,
      and no verifiable replacement count was substituted. The obligation is unchanged — the
      pipeline is BOOM v4's, kept intact. Which stages are bit-identical is now checkable from
      the per-stage status lines, group e.

  - id: spec-core.a6
    kind: structure
    statement: >
      Caracal must thread the vector path through that same pipeline.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        |caracal| keeps |boom| v4's out-of-order pipeline intact and threads
        a vector path through it.
    notes: >
      Read with spec-core.a5: the vector path is added to the existing pipeline rather than
      lengthening it or running beside it.

  - id: spec-core.a7
    kind: structure
    statement: >
      Every vector feature must be gated on the usingRVV core parameter.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Everything is gated on the ``usingRVV`` core parameter
        (``common/parameters.scala``), so with vectors disabled the core elaborates as
        stock |boom| v4.

  - id: spec-core.a8
    kind: structure
    statement: >
      With vectors disabled the core must elaborate as stock BOOM v4.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Everything is gated on the ``usingRVV`` core parameter
        (``common/parameters.scala``), so with vectors disabled the core elaborates as
        stock |boom| v4.
    notes: >
      The per-unit instances of this gate are mined by their owning families —
      spec-decode.c14/c15 for the integer ALU's vset extension and spec-lsu.a2/a3 for the
      LSU. This is the whole-core obligation the per-unit ones must add up to.

  - id: spec-core.b1
    kind: structure
    statement: >
      The front-end fetch and branch-prediction unit must be unchanged from BOOM v4.
    source:
      file: docs_caracal/src/overview.rst
      anchor: boom-relationship
      heading: "Relationship to BOOMv4 and Chipyard"
      quote: >
        * - Front-end (fetch, BPU)
          - Unchanged
    notes: >
      Restated per-stage as spec-core.e1/e2 (six-stage front-end and TAGE predictor) and, for
      the fetch stage alone, by spec-decode.a2 from frontend.rst §"Instruction Fetch".

  - id: spec-core.b4
    kind: structure
    statement: >
      The FP execution subsystem must be unchanged from BOOM v4.
    source:
      file: docs_caracal/src/overview.rst
      anchor: boom-relationship
      heading: "Relationship to BOOMv4 and Chipyard"
      quote: >
        * - FP execution
          - Unchanged
    notes: >
      Restated per-stage as part of spec-core.e18 (the FPU is an untouched BOOM v4 functional
      unit).

  - id: spec-core.b7
    kind: structure
    statement: >
      The memory system must be unchanged from BOOM v4.
    source:
      file: docs_caracal/src/overview.rst
      anchor: boom-relationship
      heading: "Relationship to BOOMv4 and Chipyard"
      quote: >
        * - Memory system
          - Unchanged
    notes: >
      loadstore.rst §"Memory SubSystem" is owned by spec-lsu, which mines what the vector
      path may assume of the unchanged memory system.

  - id: spec-core.b8
    kind: structure
    statement: >
      Vector architectural CSR state must be delegated rather than implemented in Caracal.
    source:
      file: docs_caracal/src/overview.rst
      anchor: boom-relationship
      heading: "Relationship to BOOMv4 and Chipyard"
      quote: >
        * - Vector architectural CSR state
          - Delegated.
    notes: >
      This is the row-level status only. The boundary itself is mined by spec-decode from
      frontend.rst §"Vector architectural state: ownership boundary": delegation to
      rocket-chip's CSRFile under usingVector (g1), access through csr.io.vector (g2), the
      CSRFile's ownership of vtype/vill, vl, vstart, vxrm, vxsat, vcsr and vlenb (g3),
      mstatus.VS dirty tracking (g4), the VS=Off illegal-instruction gate (g5) and Caracal
      owning only the speculative VCFG vtype mirror and the VL register file (g6). No core ID
      duplicates them.

  # --- c: the uOP model -------------------------------------------------------

  - id: spec-core.c1
    kind: function
    statement: >
      The Caracal decoder must emit exactly one uOP per instruction.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        The |caracal| decoder is single-cycle combinational and emits
        exactly **one** uOP per instruction; it performs no cracking or micro-op
        expansion, so a vector instruction is also a single uOP
    notes: >
      That the decoder is single-cycle combinational is mined by spec-decode.a4 from
      frontend.rst; this family holds the machine-wide uOP model that the rest of the
      pipeline (rename, ROB, issue) is entitled to assume.

  - id: spec-core.c2
    kind: function
    statement: >
      The Caracal decoder must perform no cracking or micro-op expansion.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        The |caracal| decoder is single-cycle combinational and emits
        exactly **one** uOP per instruction; it performs no cracking or micro-op
        expansion, so a vector instruction is also a single uOP

  - id: spec-core.c3
    kind: function
    statement: >
      A vector instruction must be decoded into a single uOP.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        The |caracal| decoder is single-cycle combinational and emits
        exactly **one** uOP per instruction; it performs no cracking or micro-op
        expansion, so a vector instruction is also a single uOP

  - id: spec-core.c4
    kind: structure
    statement: >
      An OP.v must be a uOP with is_vec set that carries the vector-specific MicroOp fields.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        A **vector** uOP — a uOP with ``is_vec`` set, carrying the vector-specific
        ``MicroOp`` fields (``pvs1/pvs2/pvs3``, mask ``pvm``, ``v_eew``/``v_emul``,
        and the ``vconfig`` snapshot).

  - id: spec-core.c5
    kind: function
    statement: >
      A single OP.v must represent an entire LMUL/EMUL vector-register group.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        A single OP.v represents an entire
        ``LMUL``/``EMUL`` vector-register group and occupies **one** ROB entry — it
        is not cracked into one uop per destination register at decode.

  - id: spec-core.c6
    kind: structure
    statement: >
      A single OP.v must occupy exactly one ROB entry.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        A single OP.v represents an entire
        ``LMUL``/``EMUL`` vector-register group and occupies **one** ROB entry — it
        is not cracked into one uop per destination register at decode.
    notes: >
      The ROB-side consequences — group-done completion tracking, commit and precise vector
      exceptions — are owned by the rob family in midcore.rst. This is the entry-count
      invariant they rest on.

  - id: spec-core.c7
    kind: function
    statement: >
      An OP.v must not be cracked into one uop per destination register at decode.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        A single OP.v represents an entire
        ``LMUL``/``EMUL`` vector-register group and occupies **one** ROB entry — it
        is not cracked into one uop per destination register at decode.

  - id: spec-core.c8
    kind: function
    statement: >
      Caracal must perform no frontend cracking.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        |caracal| performs **no frontend cracking**: an
        :term:`OP.v` stays a single uOP through decode/rename/ROB/issue and is only
        expanded into nOP.v inside the Vector LS AGEN.
    notes: >
      Broader than spec-decode.a6, which forbids cracking in the decoder alone: this forbids
      it anywhere in the frontend and through rename, ROB and issue.

  - id: spec-core.c9
    kind: function
    statement: >
      An OP.v must stay a single uOP through decode, rename, ROB and issue.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        |caracal| performs **no frontend cracking**: an
        :term:`OP.v` stays a single uOP through decode/rename/ROB/issue and is only
        expanded into nOP.v inside the Vector LS AGEN.

  - id: spec-core.c10
    kind: function
    statement: >
      An OP.v must be expanded into nOP.v only inside the Vector LS AGEN.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        |caracal| performs **no frontend cracking**: an
        :term:`OP.v` stays a single uOP through decode/rename/ROB/issue and is only
        expanded into nOP.v inside the Vector LS AGEN.
    notes: >
      What the AGEN does with that licence — cracking into element-granularity nOP.v, per-EMUL
      cracking, packer/skipper/walker — is owned by spec-agen (a2, a3). This is the
      exclusivity clause: nowhere else may expand an OP.v.

  - id: spec-core.c11
    kind: structure
    statement: >
      The MicroOp element and segment cursor fields v_split_first, v_split_last, v_split_idx
      and v_split_total must be nOP.v-scoped.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        The ``MicroOp`` element/segment
        cursor fields (``v_split_first/last/idx/total``) are therefore **nOP.v-scoped** —
        inert on the OP.v itself and populated only when the AGEN emits element accesses.
    notes: >
      The spec adds that they are *not* frontend-cracker state, which is the same obligation
      seen from the other side.

  - id: spec-core.c12
    kind: function
    statement: >
      The element and segment cursor fields must be inert on the OP.v itself.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        The ``MicroOp`` element/segment
        cursor fields (``v_split_first/last/idx/total``) are therefore **nOP.v-scoped** —
        inert on the OP.v itself and populated only when the AGEN emits element accesses.

  - id: spec-core.c13
    kind: function
    statement: >
      The element and segment cursor fields must be populated only when the AGEN emits
      element accesses.
    source:
      file: docs_caracal/src/glossary.rst
      anchor: glossary-terms
      heading: "Glossary"
      quote: >
        The ``MicroOp`` element/segment
        cursor fields (``v_split_first/last/idx/total``) are therefore **nOP.v-scoped** —
        inert on the OP.v itself and populated only when the AGEN emits element accesses.

  - id: spec-core.c14
    kind: structure
    statement: >
      Vector ops must allocate ROB entries through the same path as scalar ops.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Vector ops allocate ROB entries through the same path as scalar ops.

  - id: spec-core.c15
    kind: function
    statement: >
      Vector uops must commit in program order through the same head-pointer and exception
      machinery as scalar ops.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        so vector uop's commit
        in program order through the same head-pointer/exception machinery as scalar
        ops.

  # --- d: architectural-state ownership ---------------------------------------

  - id: spec-core.d1
    kind: structure
    statement: >
      VTYPE must not be renamed.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        ``VTYPE`` is **not** renamed — it rides the VCFG ``vtype`` mirror / ``VConfig`` snapshot.
    notes: >
      The mirror and the per-uop VConfig snapshot themselves are owned by spec-decode
      (frontend.rst §"VCFG Mirror Recovery"); this is the negative obligation that no VTYPE
      rename space exists. VL, by contrast, *is* renamed — spec-decode.i1.

  - id: spec-core.d2
    kind: function
    statement: >
      Precise vector state must be recovered on a redirect or exception from the per-uop
      vconfig snapshot.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Precise vector state (``vtype``/``vl``) is recovered on redirect/exception via
        the per-uop ``vconfig`` snapshot rather than a separate rollback path.

  - id: spec-core.d3
    kind: structure
    statement: >
      The design must not contain a separate rollback path for precise vector state.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Precise vector state (``vtype``/``vl``) is recovered on redirect/exception via
        the per-uop ``vconfig`` snapshot rather than a separate rollback path.
    notes: >
      Recovery of the speculative VCFG mirror from the committed VCFG shadow
      (spec-decode.h10) is not such a path — it restores a speculative mirror, not
      architectural state.

  - id: spec-core.d4
    kind: structure
    statement: >
      The coprocessor must not own the vector register file.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        the coprocessor reads and writes it
        through the CII as a client — it does not own it.
    notes: >
      spec-cii.h5 states the positive half from cii.rst — the architectural VRF lives in the
      host — and the CII read/write mechanism (operand pull, writeback) is spec-cii's f and g
      groups. This is the ownership boundary itself.

  - id: spec-core.d5
    kind: structure
    statement: >
      BOOM must remain the out-of-order scalar host and scheduler for RVV arithmetic executed
      on the attached in-order coprocessor.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        BOOM remains the OoO scalar host, scheduler, and VRF owner, while RVV
        arithmetic executes on the attached in-order coprocessor.
    notes: >
      The spec calls this "the core architectural divergence". The VRF-ownership half of the
      same sentence is spec-core.d4.

  # --- e: per-stage attachment and per-stage equivalence ----------------------
  #
  # All of group e cites §"The Caracal Pipeline". Each stage paragraph states what stays
  # identical to BOOM v4 and where the vector path attaches; the vector mechanisms
  # themselves belong to the stage's own family and are cross-referenced in notes.

  - id: spec-core.e1
    kind: structure
    statement: >
      The six-stage front-end must be identical to BOOM v4.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Identical to |boom| v4. The six-stage front-end (next-PC select, I$ access,
        I$ response, fetch-buffer enqueue, BPD redirect, deliver-to-core) and the
        TAGE-based branch predictor are untouched

  - id: spec-core.e2
    kind: structure
    statement: >
      The TAGE-based branch predictor must be untouched.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Identical to |boom| v4. The six-stage front-end (next-PC select, I$ access,
        I$ response, fetch-buffer enqueue, BPD redirect, deliver-to-core) and the
        TAGE-based branch predictor are untouched

  - id: spec-core.e3
    kind: function
    statement: >
      The front-end must not distinguish vector instructions from other instructions before
      decode.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        vector instructions are ordinary
        32-bit (or RVC-expanded) words and are not distinguished until decode.

  - id: spec-core.e4
    kind: function
    statement: >
      The fetch stages must neither read nor write vector state.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        No
        vector state is read or written here.

  - id: spec-core.e5
    kind: structure
    statement: >
      The scalar decoders must be unchanged.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Extended. The scalar decoders are unchanged;
    notes: >
      Everything else in the Decode paragraph — VDecode and the v_legal gate, the new vector
      MicroOp fields, the VCFG vtype mirror, vsetivli being front-end only, and vsetvl's
      is_unique/flush_on_commit marking — is mined by spec-decode from frontend.rst.

  - id: spec-core.e6
    kind: interface
    statement: >
      Decode must set the iq_type routing bits for the vector issue queues.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Decode also sets the ``iq_type`` routing bits for the
        new vector issue queues (``IQ_V_LOAD/IQ_V_STORE/IQ_V_ALU``, widened in
        ``common/consts.scala``).
    notes: >
      Paired with spec-core.e11: iq_type is the only thing dispatch is allowed to route on,
      so it must be complete at decode.

  - id: spec-core.e7
    kind: structure
    statement: >
      The scalar integer and FP map tables, free lists and busy tables must be the BOOM v4
      design unchanged.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        The scalar integer/FP map tables, free lists, and busy tables are
        the |boom| v4 design **unchanged** — integer rename is not modified.
    notes: >
      The spec restates the same obligation as "integer rename is not modified"; that is not
      a second requirement.

  - id: spec-core.e8
    kind: structure
    statement: >
      Caracal must add a third register class, RT_VEC.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        |caracal| adds a
        third register class — ``RT_VEC`` (``common/consts.scala``) — and a vector physical
        register file (``numVecPhysRegs``, default 96) renamed alongside INT and FP, mapping the
        logical ``lvs*/lvd/lvm`` specifiers to physical ``pvs*/pvdest/pvm``.
    notes: >
      The vector physical register file itself — its size, its map table and the
      logical-to-physical mapping quoted here — is owned by the rename and vrf families in
      midcore.rst. RT_VEC is mined here because it is a machine-wide encoding that the ROB
      (spec-core.e23) and writeback also carry.

  - id: spec-core.e9
    kind: structure
    statement: >
      Caracal must reuse BOOM v4's dispatcher unchanged.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Reuses |boom| v4's dispatcher unchanged.

  - id: spec-core.e10
    kind: function
    statement: >
      Dispatch must route uops purely on the iq_type bits set in decode.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Dispatch routes purely on the
        ``iq_type`` bits set in decode, so vector uop's fall into the vector issue queues
        with no vector-specific dispatch logic.

  - id: spec-core.e11
    kind: structure
    statement: >
      Dispatch must contain no vector-specific logic.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Dispatch routes purely on the
        ``iq_type`` bits set in decode, so vector uop's fall into the vector issue queues
        with no vector-specific dispatch logic.
    notes: >
      Element-queue capacity reservation happens at dispatch but is not dispatch logic in
      this sense; it is owned by spec-lsu and the issue family.

  - id: spec-core.e12
    kind: structure
    statement: >
      The age-ordered issue-unit logic must be reused.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Extended. The age-ordered issue-unit logic is reused; |caracal| instantiates
        additional vector issue queues
    notes: >
      The three vector queues, their age-ordered collapsing behaviour and the IQ_V_ALU
      per-entry past-PNR eligibility gate are owned by the issue family (issue.rst) and, for
      the CII side, by spec-cii.d2/d3.

  - id: spec-core.e13
    kind: structure
    statement: >
      The issue stage must widen only the queue set and operand-readiness tracking to cover
      vector physical registers.
    source:
      file: docs_caracal/src/overview.rst
      anchor: caracal-pipeline
      heading: "The Caracal Pipeline"
      quote: >
        Only the queue set and operand-readiness tracking are widened to
        cover vector physical registers.

  - id: spec-core.e14
    kind: structure
    statement: >
