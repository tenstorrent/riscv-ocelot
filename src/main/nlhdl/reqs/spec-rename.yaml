      That every VL producer allocates a fresh VL PRN and writes the VL RF is spec-decode.i2
      and spec-decode.i3, so it is not restated here.

  - id: spec-rename.h12
    kind: structure
    statement: >
      The VL busy table must have one bit per VL PRN.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        **Busy table** — one bit per PRN; set on allocation, cleared by the producer's VL
        writeback.

  - id: spec-rename.h13
    kind: function
    statement: >
      A VL busy bit must be set on allocation of its PRN.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        one bit per PRN; set on allocation
    notes: >
      ``vsetivli`` is the exception the spec calls out: its VL value is written to
      ``VL_RF[pvl]`` in the rename cycle and no busy bit is set, so its ``pvl`` is born ready —
      spec-decode.c4 and spec-decode.c5.

  - id: spec-rename.h14
    kind: function
    statement: >
      A VL busy bit must be cleared by the producer's VL writeback.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        cleared by the producer's VL
        writeback.
    notes: >
      Who produces the value differs by form: ``vsetvli``/``vsetvl`` compute VL on an integer
      ALU EU whose writeback targets the VL RF (spec-decode group c), and ``vleff`` writes the
      trimmed VL on completion (spec-lsu group g).

  - id: spec-rename.h15
    kind: structure
    statement: >
      The design must contain a dedicated VL wakeup network.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        **Wakeup network** — a dedicated ``VL`` network

  - id: spec-rename.h16
    kind: interface
    statement: >
      Vector issue slots must match pvl on the VL wakeup network.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        vector issue slots match ``pvl`` on it (see the
        Vector Issue Slot).
    notes: >
      Every VL producer sets the ``is_vl_producer`` bit and a register-sourced ``vset`` has two
      destinations in two rename spaces; that dual-destination rule, its writeback fan-out, the
      two busy bits set at rename and the two free paths run at commit are spec-decode.c16
      through c25.

  - id: spec-rename.h17
    kind: function
    statement: >
      At commit of a VL producer the outgoing committed VL pointer must be freed.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        at commit of a VL producer the **outgoing committed pointer is freed**

  - id: spec-rename.h18
    kind: structure
    statement: >
      A VL producer uop must not carry a per-uop stale VL field.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        (no
        per-uop stale field is needed: the single-entry committed map table already holds the
        PRN this producer displaces)
    notes: >
      This is the VL-space counterpart of the vector ``stale_pvdest`` Vec (spec-rename.d5): the
      single-entry committed VL map table already holds the displaced PRN, so no stale field is
      carried in the uop.

  - id: spec-rename.h19
    kind: structure
    statement: >
      The committed VL map table must be a single entry.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        the single-entry committed map table already holds the
        PRN this producer displaces

  - id: spec-rename.h20
    kind: function
    statement: >
      At commit of a VL producer the committed VL pointer must be advanced to the new PRN.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        the committed pointer is advanced to the new PRN

  - id: spec-rename.h21
    kind: function
    statement: >
      At commit of a VL producer the architectural vl CSR must be written precisely.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        and the architectural
        ``vl`` CSR is written (precise).

  - id: spec-rename.h22
    kind: function
    statement: >
      Wrong-path VL producers must be reclaimed by the VL free list's branch machinery.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        Wrong-path producers are reclaimed by the free list's branch
        machinery, as usual.

  - id: spec-rename.h23
    kind: interface
    statement: >
      Every vector EU must read VL from VL_RF indexed by pvl.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        **EU read ports** — every vector EU reads ``VL`` from ``VL_RF[pvl]``
    notes: >
      That the vector EU reads VL from the VL RF at execute is spec-decode.i7; this requirement
      adds only the ``pvl`` indexing. Reading ``vtype`` from the uOP's ``VConfig`` snapshot is
      spec-decode group d.

  - id: spec-rename.h24
    kind: structure
    statement: >
      A vset's read of its integer AVL source must not touch integer rename.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        Reading the integer ``AVL`` source is an ordinary integer RF **read** — it does not
        touch integer
        rename.
    notes: >
      That a ``vset`` with ``rd != x0`` also writes ``rd`` as a normal integer destination is
      part of the dual-destination rule, spec-decode.c16 through c25.

  - id: spec-rename.h25
    kind: function
    statement: >
      Vector consumers must read VL only from the VL register file.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        but vector consumers read VL only from ``VL_RF``.
    notes: >
      The delivery path itself — every younger vector uOP carrying the current ``pvl`` read
      from the VL map table at rename as an implicit operand — is spec-decode.i5.

  # VL free-list exhaustion, resolved 2026-08-01.

  - id: spec-rename.h26
    kind: function
    statement: >
      A VL producer that finds no free VL PRN must stall at rename.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vl-vtype-rename
      heading: "VL Rename"
      quote: >
        **A producer that finds no free VL PRN stalls at rename**, exactly as an ``OP.v`` short
        of vector PRNs does (:ref:`cii-shared-mapping`), and is deadlock-free for the same
        reason: rename is in program order, so older producers keep committing and freeing the
        pointer each displaces, and the oldest producer is never the one that starves.
    notes: >
      Resolved 2026-08-01. The deadlock-freedom argument is the one spec-rename.e16's section
      gives for the vector free list, reused: in-order rename means the oldest producer never
      starves. The spec also records that the 64 entries can genuinely be exhausted, the live
      count being one committed pointer plus one per in-flight producer, so any ROB deeper than
      63 can reach this stall. That is an observation about sizing, not a separate obligation.

  # --- i: branch snapshots and rollback ---------------------------------------

  - id: spec-rename.i1
    kind: timing
    statement: >
      Branch snapshots must be taken on the ren_br_tags event in the rename cycle.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        branch snapshots** — taken on the ``ren_br_tags`` event
        this cycle.

  - id: spec-rename.i2
    kind: function
    statement: >
      The vector RMT must be snapshotted on the same ren_br_tags event as the scalar RMT.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        they are
        snapshotted on the **same ``ren_br_tags`` event** as the scalar RMT

  - id: spec-rename.i3
    kind: function
    statement: >
      The VL map table must be snapshotted on the same ren_br_tags event as the scalar RMT.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        Since the vector RMT, the VL map table, and the
        :ref:`VCFG mirror <vector-rvv-decode>` all update in the *same* cycle as the scalar
        RMT, they are
        snapshotted on the **same ``ren_br_tags`` event** as the scalar RMT
    notes: >
      That the VL map table is branch-snapshotted per ``br_tag`` at all is spec-decode.i8; the
      obligation here is that it happens on the scalar RMT's event. The VCFG mirror's
      per-``br_tag`` snapshot is spec-decode group h.

  - id: spec-rename.i4
    kind: structure
    statement: >
      The design must not contain a delayed-br_tag snapshot path.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        there is **no** delayed-``br_tag``
        path.

  - id: spec-rename.i5
    kind: function
    statement: >
      On brupdate.b2.mispredict the vector RMT must restore from br_snapshots(br_tag).
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        On ``brupdate.b2.mispredict`` the vector RMT / VL map table / VCFG mirror restore from
        ``br_snapshots(br_tag)`` / ``vcfg_snapshots(br_tag)`` in lockstep with the scalar RMT

  - id: spec-rename.i6
    kind: function
    statement: >
      The vector RMT and VL map table restores must be indexed by the same br_tag as the
      scalar RMT restore.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        in lockstep with the scalar RMT, all indexed by
        the same ``br_tag``.
    notes: >
      That the VL map table is restored on a mispredict at all is spec-decode.i9; the
      obligation here is lockstep with the scalar RMT under one ``br_tag``.

  - id: spec-rename.i7
    kind: timing
    statement: >
      The RMT rollback on a branch mispredict must complete in a single cycle.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: snapshots
      heading: "Checkpoint RMT Snapshots"
      quote: >
        BOOM implements a branch snapshot mechanism to roll back the RMT upon branch mispredicts
        in a
        single cycle.

  - id: spec-rename.i8
    kind: structure
    statement: >
      A copy of the speculative scalar RMTs must be taken per outstanding branch, up to
      maxBrCount entries.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: snapshots
      heading: "Checkpoint RMT Snapshots"
      quote: >
        A copy of the speculative scalar RMTs is taken per outstanding branch
        (upto maxBrCount entries).

  - id: spec-rename.i9
    kind: structure
    statement: >
      The vector mapper must reuse BOOM's branch snapshot mechanism.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: snapshots
      heading: "Checkpoint RMT Snapshots"
      quote: >
        We will reuse this mechanism for the vector mapper.

  - id: spec-rename.i10
    kind: structure
    statement: >
      The vector mapper must hold one speculative vector RMT snapshot per outstanding branch,
      up to maxBrCount.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: snapshots
      heading: "Checkpoint RMT Snapshots"
      quote: >
        The vector mapper takes a snapshot of the speculative vector RMT on the same event the
        scalar
        RMT is branch-snapshotted (per outstanding branch, up to maxBrCount).

  - id: spec-rename.i11
    kind: structure
    statement: >
      The vector mapper must not take periodic snapshots of the vector RMT.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: snapshots
      heading: "Checkpoint RMT Snapshots"
      quote: >
        There is no periodic
        snapshot — the per-ARN map table needs no fragmentation-recovery walk.
    notes: >
      The stated reason is that the per-ARN map table needs no fragmentation-recovery walk,
      which is spec-rename.d12.

  - id: spec-rename.i12
    kind: function
    statement: >
      A branch-mispredict recovery must flush only state younger than the branch.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: snapshots
      heading: "Checkpoint RMT Snapshots"
      quote: >
        * - Branch mispredict
          - ``br_snapshots(br_tag)``
          - 1 cycle, only flushes younger-than-branch

  - id: spec-rename.i13
    kind: function
    statement: >
      An exception or pipeline flush recovery must flush everything in flight.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: snapshots
      heading: "Checkpoint RMT Snapshots"
      quote: >
        * - Exception / pipeline flush
          - ``com_map_table``
          - 1 cycle, flushes everything in flight
    notes: >
      The recovery source is the ``com_map_table`` copy, spec-rename.c6, and its single-cycle
      cost is spec-rename.c7.

  # The recovery table's "Normal" row, resolved 2026-08-01.

  - id: spec-rename.i15
    kind: function
    statement: >
      In normal operation the vector RMT must advance through its remap requests.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: snapshots
      heading: "Checkpoint RMT Snapshots"
      quote: >
        * - Normal
          - ``map_table``
          - the vector RMT advances through its remap requests
    notes: >
      Reissues the substance of the retired spec-rename.i14 under a fresh ID. That entry was
      retired because the row named ``remap_table``, a structure defined nowhere in the
      chapter, and never named the vector RMT — so the statement supplied both the subject and
      the meaning of "advance". The row was corrected on 2026-08-01 to name ``map_table``, the
      speculative RMT of §"Rename Map Table (RMT)" (spec-rename.c1), and to name its subject,
      so the obligation is now dictated rather than implied.

