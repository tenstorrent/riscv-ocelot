      Resolved 2026-08-01, correcting this section's "the integer ``pvl`` read", which
      contradicted §"VL Rename". The spec's reason is that VL is renamed into its own register
      space, so pvl indexes VL_RF and has exactly one busy bit. The VL busy table itself is
      spec-rename group h; the read that includes this bit is spec-rename.g12.

