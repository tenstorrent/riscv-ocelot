family: rename
description: >
  Vector and VL renaming: map tables, free lists, busy tables, branch snapshots, and
  pvtmp allocation for shared instructions.
spec_sources:
  - docs_caracal/src/midcore.rst

groups:
  a: single-stage rename — structure and scalar/vector parallelism
  b: the rename→dispatch boundary — the atomic reservation actions
  c: the speculative and committed rename map tables
  d: the vector map table, group mapping, and stale-group capture
  e: CII shared-instruction mapping — the pvtmp temp group
  f: the vector free list
  g: the vector busy table, group readiness, and group-done
  h: the VL rename space — map table, free list, busy table, wakeup, commit
  i: branch snapshots and rollback

reqs:

  # --- a: single-stage rename — structure and parallelism ----------------------

  - id: spec-rename.a1
    kind: structure
    statement: >
      The Rename Stage must rename vector registers in a single pipeline stage.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-rename
      heading: "The Rename Stage"
      quote: >
        The Rename Stage is extended to support vector register renaming in a **single pipeline
        stage**.

  - id: spec-rename.a2
    kind: timing
    statement: >
      For a vector instruction the scalar rename and the vector group rename must run in
      parallel in the same cycle.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-rename
      heading: "The Rename Stage"
      quote: >
        For a vector instruction the scalar (INT/FP) rename and the vector group rename run
        **in parallel in the same cycle** — they target independent register spaces, free
        lists, and busy tables, so neither depends on the other for a given ``OP.v``.
    notes: >
      The consequence the spec draws — "the combined rename cycle is therefore the *max* of the
      scalar and vector-group rename latencies, not their sum" — is rationale for this
      requirement, not a separate obligation; the unbounded timing budget it leaves behind is
      recorded in open_questions.

  - id: spec-rename.a3
    kind: structure
    statement: >
      The vector rename must use register spaces, free lists and busy tables independent of
      those used by the scalar rename.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-rename
      heading: "The Rename Stage"
      quote: >
        they target independent register spaces, free lists, and busy tables, so neither
        depends on the other for a given ``OP.v``

  - id: spec-rename.a4
    kind: function
    statement: >
      For a given OP.v the scalar rename and the vector group rename must each complete
      without depending on the other.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-rename
      heading: "The Rename Stage"
      quote: >
        so neither depends on the other for a given ``OP.v``

  - id: spec-rename.a5
    kind: structure
    statement: >
      The design must not contain a separate vector-mapping pipeline stage.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-rename
      heading: "The Rename Stage"
      quote: >
        There is **no** separate vector-mapping pipeline stage and **no** 1-cycle-delayed
        pipeline register

  - id: spec-rename.a6
    kind: structure
    statement: >
      The rename stage must not contain a 1-cycle-delayed pipeline register.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-rename
      heading: "The Rename Stage"
      quote: >
        There is **no** separate vector-mapping pipeline stage and **no** 1-cycle-delayed
        pipeline register

  - id: spec-rename.a7
    kind: timing
    statement: >
      The whole dispatch group, scalar and vector, must emerge from rename together in one
      cycle.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-rename
      heading: "The Rename Stage"
      quote: >
        the whole dispatch group (scalar and vector) emerges from rename together, in one
        cycle.

  - id: spec-rename.a8
    kind: structure
    statement: >
      The scalar side of rename must be unchanged from the original BOOM implementation.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-rename
      heading: "The Rename Stage"
      quote: >
        On the scalar side the original |boom| implementation is unchanged

  - id: spec-rename.a9
    kind: function
    statement: >
      The integer rename_stage and fp_rename_stage must rename scalar destinations and sources
      to INT/FP PRNs for vector uops as well as for scalar uops.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-rename
      heading: "The Rename Stage"
      quote: >
        the integer ``rename_stage`` and
        ``fp_rename_stage`` still rename scalar destinations/sources to INT/FP PRNs for both
        scalar and vector uops (e.g. a vector load's base/stride, a ``.vx``/``.vf`` operand)

  - id: spec-rename.a10
    kind: function
    statement: >
      The vector mapper must rename lvd, lvs* and lvm to pvdest, pvs* and pvm.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-rename
      heading: "The Rename Stage"
      quote: >
        the vector
        mapper renames the vector group (``lvd``/``lvs*``/``lvm`` → ``pvdest``/``pvs*``/``pvm``)

  - id: spec-rename.a11
    kind: timing
    statement: >
      The VL mapper must rename VL into the VL register file in parallel with the vector
      mapper's group rename.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: midcore-rename
      heading: "The Rename Stage"
      quote: >
        In parallel, the vector
        mapper renames the vector group (``lvd``/``lvs*``/``lvm`` → ``pvdest``/``pvs*``/``pvm``)
        and the VL
        mapper renames VL into the VL register file.
    notes: >
      That VL is renamed into a dedicated VL register file rather than the integer RF is
      spec-decode.i1; younger vector uOPs carrying ``pvl`` as an implicit operand and reading
      VL from the VL RF at execute are spec-decode.i5 and spec-decode.i7, so neither is
      duplicated here.

  # --- b: the rename→dispatch boundary ----------------------------------------

  - id: spec-rename.b1
    kind: timing
    statement: >
      Rename must not insert a 1-cycle bubble between the scalar and vector halves of a
      dispatch group.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        the whole dispatch group reaches
        dispatch together — there is no cross-group skew to reconcile, no 1-cycle bubble, and
        no delayed pipeline register.

  - id: spec-rename.b2
    kind: timing
    statement: >
      The rename→dispatch boundary must complete all of its reservation actions in the single
      rename cycle.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        Everything the rename→dispatch boundary does happens atomically, in program
        order, in that single cycle:
    notes: >
      The `.. warning::` in this section recommends a timing spike on the vector mapper plus
      busy table before Milestone 1 Step 4 lands. That was ruled NON-NORMATIVE on 2026-07-31 —
      it is engineering analysis to be done before a decision, not RTL behaviour — so no
      requirement is written for it. The unbounded budget it describes is an open question.

  - id: spec-rename.b3
    kind: function
    statement: >
      The rename→dispatch boundary must perform its reservation actions in program order.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        Everything the rename→dispatch boundary does happens atomically, in program
        order, in that single cycle:

  - id: spec-rename.b4
    kind: structure
    statement: >
      Rename must allocate exactly one ROB entry per OP.v.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        **ROB allocation** — one entry per uop (one per ``OP.v``), reserved in program order
        for the whole group, exactly as in |boom|.
    notes: >
      The internal behaviour of that single ROB entry — completion tracking, commit, exceptions
      — belongs to the `rob` family; this requirement is only the rename-side allocation. The
      in-program-order property is spec-rename.b3.

  - id: spec-rename.b5
    kind: structure
    statement: >
      Each vector load or store OP.v must claim a single LDQ or STQ entry.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        every memory uop, including each vector load/store ``OP.v`` (a
        **single** LDQ or STQ entry), claims its slot at the in-order ``ldq_tail`` /
        ``stq_tail`` this cycle

  - id: spec-rename.b6
    kind: timing
    statement: >
      Every memory uop must claim its queue slot at the in-order ldq_tail or stq_tail in the
      rename cycle.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        claims its slot at the in-order ``ldq_tail`` /
        ``stq_tail`` this cycle

  - id: spec-rename.b7
    kind: interface
    statement: >
      Rename must write ldq_idx or stq_idx into the OP.v as its program-age stamp for
      cross-queue disambiguation.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        with ``ldq_idx``/``stq_idx`` written into the ``OP.v`` as the program-age stamp for
        cross-queue disambiguation.

  - id: spec-rename.b8
    kind: structure
    statement: >
      The LDQ or STQ entry of a vector memory OP.v must not hold that OP.v's per-element
      addresses or data.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        The per-element addresses/data are produced later at the Vector LS
        AGEN/DGEN (they live in the SSI/US queues, not the LDQ/STQ entry); only the *slot* is
        reserved here.

  - id: spec-rename.b9
    kind: timing
    statement: >
      br_tag allocation must be taken on the ren_br_tags event in the rename cycle.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        **``br_tag`` allocation and branch snapshots** — taken on the ``ren_br_tags`` event
        this cycle.

  - id: spec-rename.b10
    kind: timing
    statement: >
      Every uop, scalar and vector, must write its issue-queue slot in the rename cycle.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        **Issue-queue slot write** — every uop (scalar and vector) writes its IQ slot this
        cycle; no uop lags its group-mates.

  - id: spec-rename.b11
    kind: timing
    statement: >
      A uop must not lag its group-mates in writing its issue-queue slot.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        no uop lags its group-mates.

  # --- c: the speculative and committed rename map tables ---------------------

  - id: spec-rename.c1
    kind: structure
    statement: >
      Caracal must always keep the Committed RMT enabled.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        The Committed RMT is an optional feature, which we will always keep enabled in
        |caracal|.

  - id: spec-rename.c2
    kind: function
    statement: >
      The speculative map_table must be updated at rename time as physical destinations are
      allocated.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        This is the working table updated at rename time as physical destinations are
        allocated.

  - id: spec-rename.c3
    kind: interface
    statement: >
      Source operands must be read from the speculative map_table as map_resps.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        Source operands are read from it (``map_resps``).

  - id: spec-rename.c4
    kind: function
    statement: >
      The com_map_table must be updated only by committed uops.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        Updated only by committed uop's (driven from the ROB via ``com_remap_reqs``).

  - id: spec-rename.c5
    kind: interface
    statement: >
      The com_map_table's updates must be driven from the ROB via com_remap_reqs.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        driven from the ROB via ``com_remap_reqs``

  - id: spec-rename.c6
    kind: function
    statement: >
      On an exception the com_map_table must be copied to the speculative map_table.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        When an exception occurs, the ``com_map_table`` is copied to the speculative
        ``map_table``.

  - id: spec-rename.c7
    kind: timing
    statement: >
      The map_table rollback on an exception must complete as a single-cycle copy.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        thus instead of a ROB 1 entry/cycle walk back a single cycle copy is all that is
        needed to roll back the ``map_table``.
    notes: >
      Correctness rests on the com_map_table holding the most recent correct state before the
      trapping instruction, which is spec-rename.c4.

  - id: spec-rename.c8
    kind: structure
    statement: >
      The map_table rollback must not use a ROB one-entry-per-cycle walk back.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        instead of a ROB 1 entry/cycle walk back a single cycle copy is all that is
        needed

  # --- d: the vector map table, group mapping, stale-group capture -------------

  - id: spec-rename.d1
    kind: structure
    statement: >
      The vector mapper must extend the existing RenameStage implementation.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        The vector mapper extends the existing RenameStage implementation to support vector
        renaming.

  - id: spec-rename.d2
    kind: function
    statement: >
      The vector mapper must map vector registers atomically per LMUL/EMUL group.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        The vector mapper implements atomic LMUL/EMUL based vector register mapping.
    notes: >
      "The mapper *may* rename and allocate up to LMUL=8 PRNs for a single vdest" is an
      allowance as written, so it is not a requirement here; the 8-PRN width obligations are
      spec-rename.f3, f10 and g8. Removing vector uOP cracking and reducing ROB entries is
      rationale. The mapper's need for ``vtype``/``EMUL`` at decode is covered by
      spec-decode.d3/d4 and the ``vsetvl`` ``is_unique`` serialization by spec-decode group e.

  - id: spec-rename.d3
    kind: function
    statement: >
      The vector mapper must read the old stale vdest group when renaming a vector
      destination.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        The Vector Mapper should also get the old stale vdest group and update the OP.v
        ``stale_pvdest`` field
    notes: >
      This note is worded with **should**. It was ruled A REAL REQUIREMENT on 2026-07-31,
      because spec-lsu.e9, spec-cii.f10 and midcore §old-vd all depend on ``stale_pvdest``
      existing — it is the only source of undisturbed lanes in the machine. Do not re-litigate.

  - id: spec-rename.d4
    kind: function
    statement: >
      The vector mapper must write the stale vdest group into the OP.v stale_pvdest field.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        update the OP.v
        ``stale_pvdest`` field — a ``Vec`` of up to ``EMUL`` stale PRNs, not a single reg,
        since a vector dest renames a whole group.
    notes: >
      Mined as a must under the 2026-07-31 ruling recorded on spec-rename.d3. It is what lets
      commit free the entire stale group (spec-rename.f12) and what feeds tail-undisturbed
      handling.

  - id: spec-rename.d5
    kind: structure
    statement: >
      The OP.v stale_pvdest field must be a Vec of up to EMUL stale PRNs rather than a single
      register.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        a ``Vec`` of up to ``EMUL`` stale PRNs, not a single reg, since a vector dest renames
        a whole group
    notes: >
      Mined as a must under the 2026-07-31 ruling recorded on spec-rename.d3.

  - id: spec-rename.d6
    kind: timing
    statement: >
      The stale-group capture must happen in the single rename cycle, in parallel with scalar
      rename.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        This stale-group capture happens in the single rename cycle, in parallel with scalar
        rename (see :ref:`rename-stage`).
    notes: >
      Mined as a must under the 2026-07-31 ruling recorded on spec-rename.d3.

  - id: spec-rename.d7
    kind: structure
    statement: >
      The vector map table must store one PRN per architectural vreg.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        The vector map table stores **one PRN per architectural vreg**

  - id: spec-rename.d8
    kind: function
    statement: >
      An EMUL-wide read of the vector map table must return the group's current mappings
      directly.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        so an ``EMUL``-wide read returns the
        group's current mappings directly

  - id: spec-rename.d9
    kind: function
    statement: >
      An EMUL-wide read of the vector map table must be correct under arbitrary fragmentation.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        is correct under **arbitrary fragmentation**

  - id: spec-rename.d10
    kind: structure
    statement: >
      The vector mapper must not contain a contiguous-run allocator.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        That single
        property is what makes the mapper simple: no contiguous-run allocator, no whole-group
        validity check, and no fragmentation-recovery walk.

  - id: spec-rename.d11
    kind: structure
    statement: >
      The vector mapper must not contain a whole-group validity check.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        no contiguous-run allocator, no whole-group
        validity check, and no fragmentation-recovery walk.

  - id: spec-rename.d12
    kind: structure
    statement: >
      The vector mapper must not contain a fragmentation-recovery walk.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        and no fragmentation-recovery walk.
    notes: >
      §"Checkpoint RMT Snapshots" restates this ("the per-ARN map table needs no
      fragmentation-recovery walk") as the reason there is no periodic snapshot
      (spec-rename.i11).

  - id: spec-rename.d13
    kind: structure
    statement: >
      The vector mapper must not implement the LMUL TAG Whole Vector Group Checker.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rmt
      heading: "Rename Map Table (RMT)"
      quote: >
        **Removed: the "LMUL TAG Whole Vector Group Checker."** Earlier drafts added a 32×2-bit
        per-ARN tag table plus combinational whole-group comparators for every valid base ARN
        at each LMUL. It has been deleted, for two reasons:
    notes: >
      A negative structural obligation: neither the 32×2-bit per-ARN tag table nor the
      combinational whole-group comparators may be built. The spec's two reasons are that the
      structure gated nothing (a FALSE result needed no exception and no recovery, since a
      per-ARN map table is always whole-group correct — spec-rename.d7/d9) and that its test
      was wrong anyway (eight independent LMUL=1 writes classify as "fragmented"). Deleting it
      also removes a wide comparator tree from the single-cycle rename path. A per-ARN
      "last-write ``EMUL``" performance counter is offered as an optional cheaper substitute —
      an allowance, not an obligation.

  - id: spec-rename.d14
    kind: interface
    statement: >
      The vector mapper must write v_emul into the OP.v in the rename cycle.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: rename-stage
      heading: "Single-stage rename: reservation and dispatch-group atomicity"
      quote: >
        the vector group (``pvdest``/``pvs*``/``pvm`` + the ``EMUL`` ``stale_pvdest``
        group + ``v_emul``) from the vector mapper, and ``pvl`` from the VL mapper — all in
        the same cycle.

  # --- e: CII shared-instruction mapping — the pvtmp temp group ----------------

  - id: spec-rename.e1
    kind: structure
    statement: >
      A shared vector instruction must be allocated PRNs as a normal instruction is.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        Shared vector instructions are allocated PRNs and a single ROB entry as normal
        instructions.

  - id: spec-rename.e2
    kind: structure
    statement: >
      A shared vector instruction must be allocated a single ROB entry.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        Shared vector instructions are allocated PRNs and a single ROB entry as normal
        instructions.

  - id: spec-rename.e3
    kind: function
    statement: >
      When the vector mapper sees is_shared it must allocate a second vector group as the
      intermediate temp group.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        when the vector mapper sees ``is_shared`` it allocates a **second vector group —
        the intermediate temp group — from the main vector free list**

  - id: spec-rename.e4
    kind: structure
    statement: >
      The intermediate temp group must be allocated from the main vector free list.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        the intermediate temp group — from the main vector free list

  - id: spec-rename.e5
    kind: function
    statement: >
      The vector mapper must write the temp group's PRNs into the OP.v pvtmp field.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        and writes its PRNs into the
        ``OP.v``'s ``pvtmp`` field (up to ``EMUL`` members)

  - id: spec-rename.e6
    kind: structure
    statement: >
      The OP.v pvtmp field must hold up to EMUL members.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        ``pvtmp`` field (up to ``EMUL`` members)

  - id: spec-rename.e7
    kind: function
    statement: >
      The temp group must have a real busy lifetime.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        The temp group is an ordinary VRF group: it
        has a real busy lifetime

  - id: spec-rename.e8
    kind: function
    statement: >
      The temp group must be reclaimed on a branch mispredict through br_alloc_lists.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        is reclaimed on branch-mispredict through ``br_alloc_lists``

  - id: spec-rename.e9
    kind: function
    statement: >
      The temp group must be freed at commit alongside the stale vdest group.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        is
        **freed at commit** alongside the stale vdest group.

  - id: spec-rename.e10
    kind: structure
    statement: >
      The temp group must not be installed in the vector RMT.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        It is not installed in the vector RMT, so no
        architectural read can alias it.
    notes: >
      The stated purpose is that no architectural read can alias the temp group.

  - id: spec-rename.e11
    kind: function
    statement: >
      The two halves of a shared instruction must rendezvous through the temp group in the
      VRF.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        The two halves rendezvous entirely through this temp group in the
        VRF — one half writes it as a destination, the other reads it as a source

  - id: spec-rename.e12
    kind: interface
    statement: >
      The temp group must use the same busy-table and group-done machinery as any other vector
      operand.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        using the same
        busy-table / group-done machinery as any vector operand (see :ref:`group-done wakeup
        <group-done>`).

  - id: spec-rename.e13
    kind: function
    statement: >
      An OP.v that cannot allocate its vector group must stall at rename.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        Rename is in program
        order, so an ``OP.v`` that cannot allocate simply stalls at rename while every older
        instruction continues to commit and free its stale group — the oldest op is never the
        one that starves.
    notes: >
      The spec states that **no free-list headroom reservation is required for forward
      progress**; that is a statement that a structure is unnecessary, not an obligation to
      omit one, so it is recorded here rather than mined. A segmented load/store consuming two
      groups (``pvdest`` + ``pvtmp``, up to 16 PRNs total) and thereby back-pressuring dispatch
      is described consequence, not a separate requirement.

  - id: spec-rename.e14
    kind: function
    statement: >
      The allocation of pvdest and pvtmp must be all-or-nothing.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        The actual requirement is narrower and must be stated explicitly: allocation of
        ``pvdest`` + ``pvtmp`` is **all-or-nothing**.

  - id: spec-rename.e15
    kind: function
    statement: >
      A segmented op must never take a partial vector group and wait for the remainder.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        A segmented op must never take a partial group and wait for the remainder,
        because those held PRNs cannot be freed until it commits
    notes: >
      Held partial PRNs cannot be freed until the op commits, which is the deadlock the spec
      names.

  # Stall granularity on a failed allocation, resolved 2026-08-01.

  - id: spec-rename.e16
    kind: function
    statement: >
      A failed allocation must stall the whole dispatch group.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: cii-shared-mapping
      heading: "CII Shared Instruction Mapping"
      quote: >
        **A failed allocation stalls the whole dispatch group**, not just the failing ``OP.v``:
        no uop in the bundle renames that cycle, and the bundle retries intact on the next.
    notes: >
      Resolved 2026-08-01. No uop in the bundle renames that cycle and the bundle retries
      intact on the next; that is the same obligation stated twice, not a second one. The spec
      chooses the coarse rule deliberately: it is trivially order-preserving, needs no per-lane
      stall mask, and keeps the atomic rename to dispatch actions of spec-rename groups a and b
      from ever being applied to a partially renamed bundle. The cost is dispatch bandwidth,
      since older group-mates re-attempt each retry cycle.

