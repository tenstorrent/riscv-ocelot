retired:

  - id: spec-issue.c10
    statement: >
      The LSU half of a segmented load must be selected for issue only when all of its vector
      source operands are available.
    retired_because: >
      issue.rst §"Segmented Load" and midcore.rst §"Segmented Load" gave two different wakeup
      conditions for the same half. Resolved on 2026-08-01 in favour of midcore.rst's address
      operands, which is narrower: the LSU half never reads pvs3, so gating on all vector
      sources couples it to an operand it does not use. issue.rst was reworded to name the set.
      Superseded by spec-issue.c14.

  - id: spec-issue.i1
