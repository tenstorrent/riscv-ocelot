  - id: spec-issue.g21
    kind: interface
    statement: >
      An IQ_V_ALU entry's eligibility must be request && is_older(rob_idx, rob_pnr_idx).
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        For **``IQ_V_ALU``** each entry additionally gates on being non-speculative (RoCC-style), so its
        eligibility is ``request && is_older(rob_idx, rob_pnr_idx)`` — a **per-entry** gate, applied to every
        slot rather than only to the head, see the Issue/Scheduling Stage.
    notes: >
      That the gate is per-entry and applied to every slot rather than only to the head is
      spec-cii.d2 and spec-cii.i7. That IQ_V_LOAD/IQ_V_STORE do not gate on the PNR — vector
      memory may issue speculatively, with the LSU handling ordering/replay and stores writing
      memory only post-commit — is spec-lsu.i1.

  - id: spec-issue.g22
    kind: structure
    statement: >
      For vector stores the existing mem-slot AGEN/DGEN split must be extended.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        For vector **stores** the existing mem-slot AGEN/DGEN split is extended: the
        data-generation (DGEN) path is gated on the vector store-data operand (matched on
        the vector network) rather than on ``prs2`` as in the scalar mem slot.

  - id: spec-issue.g23
    kind: function
    statement: >
      A vector store slot's DGEN path must be gated on the vector store-data operand matched
      on the vector wakeup network.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        the
        data-generation (DGEN) path is gated on the vector store-data operand (matched on
        the vector network) rather than on ``prs2`` as in the scalar mem slot.

  - id: spec-issue.g24
    kind: function
    statement: >
      A vector store slot's DGEN path must not be gated on prs2.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        the
        data-generation (DGEN) path is gated on the vector store-data operand (matched on
        the vector network) rather than on ``prs2`` as in the scalar mem slot.

  - id: spec-issue.g25
    kind: interface
    statement: >
      The DGEN gated operand must be selected by is_shared.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        **The gated operand is
        selected by ``is_shared``:**

  - id: spec-issue.g26
    kind: interface
    statement: >
      The DGEN operand must be pvtmp when is_shared is set and pvs3 otherwise.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        dgen_operand := Mux(uop.is_shared, uop.pvtmp, uop.pvs3)

  - id: spec-issue.g27
    kind: function
    statement: >
      DGEN must not be gated unconditionally on pvs3.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        Gating DGEN unconditionally on ``pvs3`` is **incorrect for a segmented store**, and earlier drafts
        did exactly that.
    notes: >
      From the section's `.. warning::`. For a segmented store pvs3 is the coprocessor half's
      source group and is ready long before the transpose has run, so waking DGEN on pvs3
      reads pvtmp before it is written and stores garbage.

  - id: spec-issue.g28
    kind: function
    statement: >
      DGEN must wake on pvtmp's group-done whenever is_shared is set.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        DGEN must wake on ``pvtmp``'s group-done whenever ``is_shared`` is set.
    notes: >
      spec-cii.i6 records the same obligation from cii.rst §"Segmented load/store"; this entry
      is the slot-side statement, carried by the warning block in issue.rst.

  - id: spec-issue.g29
    kind: function
    statement: >
      The mask pvm's busy bit must participate in request only when the OP.v is masked.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        The mask ``pvm`` is read conditionally — its busy bit only participates in ``request`` when
        the OP.v is masked (encoded ``vm`` bit clear).

  - id: spec-issue.g30
    kind: function
    statement: >
      An unmasked OP.v must leave pvm don't-care.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        Unmasked ops leave ``pvm`` don't-care so a
        stale mask preg is never waited on.

  - id: spec-issue.g31
    kind: function
    statement: >
      A stale mask physical register must never be waited on.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        Unmasked ops leave ``pvm`` don't-care so a
        stale mask preg is never waited on.

  # The deselected DGEN operand, and the match-port budget. Both resolved 2026-08-01.

  - id: spec-issue.g32
    kind: function
    statement: >
      ``pvs3``'s busy bit must be excluded from ``vector_operands_ready`` for the LSU half when
      ``is_shared`` is set.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        **The deselected operand's busy bit does not participate.** When ``is_shared`` is set,
        ``pvs3``'s busy bit is **excluded** from ``vector_operands_ready`` for the LSU half —
        that half never reads ``pvs3``, which is the *coprocessor* half's source group.
    notes: >
      Resolved 2026-08-01. Same shape as the pvm rule (spec-issue.g30/g31): the mux selects the
      operand and only the selected one is waited on. Keeping pvs3 in the readiness term would
      work today only because it is ready long before the transpose runs, which would turn a
      timing accident into a correctness dependence.

  - id: spec-issue.g33
    kind: structure
    statement: >
      A vector slot must match each source-group member PRN against all ``numVecWbPorts``
      group-done ports each cycle.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        **The match-port budget.** A vector slot matches each of its up-to-``EMUL`` member PRNs
        per source group against **all ``numVecWbPorts`` group-done ports** each cycle, every
        port carrying up to ``MAX_MEMBERS`` PRNs
    notes: >
      Resolved 2026-08-01. The width is not free: the vector wakeup network is numVecWbPorts
      wide (midcore.rst §"Busy Table", spec-rename.g25), so a slot matching fewer ports could
      miss a group-done. The resulting comparator count per source group is
      EMUL x numVecWbPorts x MAX_MEMBERS, which the spec records as the reason the per-member
      match dominates slot area. No number is asserted here beyond the parameters the spec names.

  - id: spec-issue.g34
    kind: structure
    statement: >
      A vector slot must match ``pvl`` against one VL wakeup port.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        plus **one** VL wakeup port for ``pvl``.

  # --- h: VL delivery to issue -------------------------------------------------

  - id: spec-issue.h1
    kind: interface
    statement: >
      pvl must be woken on the VL wakeup network as a plain readiness wakeup.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-vl-delivery
      heading: "VL delivery"
      quote: >
        ``pvl`` is woken on the **VL** wakeup network like
        any operand — a plain readiness wakeup, no value capture in the slot
    notes: >
      That VL is a source operand in its own register space, always renamed into the VL RF,
      with no decode-time VL value, is spec-decode group i (i1, i5). That vtype is not an
      issue operand is spec-issue.g7.

  - id: spec-issue.h2
    kind: structure
    statement: >
      The issue slot must not capture the VL value.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-vl-delivery
      heading: "VL delivery"
      quote: >
        a plain readiness wakeup, no value capture in the slot

  - id: spec-issue.h3
    kind: function
    statement: >
      The VL value must be read from the VL RF at execute, when the Vector AGEN cracks the
      OP.v into element accesses.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-vl-delivery
      heading: "VL delivery"
      quote: >
        and the value is read from the
        VL RF at execute, when the Vector AGEN cracks the ``OP.v`` into element accesses.
    notes: >
      spec-decode.i7 records the read-at-execute obligation from frontend.rst; what issue.rst
      adds is that the read happens at Vector AGEN element cracking.

  - id: spec-issue.h4
    kind: function
    statement: >
      For a vsetivli the VCFG must write the VL RF in the front-end.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-vl-delivery
      heading: "VL delivery"
      quote: >
        **vsetivli**: VL is immediate — the VCFG writes the VL RF in the front-end (no EU); ``pvl`` may
        already be ready when the consumer dispatches.
    notes: >
      That pvl *may* already be ready when the consumer dispatches is an allowance. That a
      vsetivli occupies no back-end issue slot or execution unit is already mined in
      spec-decode.

  - id: spec-issue.h5
    kind: interface
    statement: >
      The integer ALU's VL writeback must target the VL RF.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-vl-delivery
      heading: "VL delivery"
      quote: >
        the ALU's VL writeback targets the VL RF and wakes ``pvl``.
    notes: >
      That vsetvli/vsetvl execute on an integer ALU EU, are woken by rs1/rs2 on the integer
      network, and that vsetvl is additionally is_unique are all already mined in spec-decode.

  - id: spec-issue.h6
    kind: interface
    statement: >
      The integer ALU's VL writeback must wake pvl.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-vl-delivery
      heading: "VL delivery"
      quote: >
        the ALU's VL writeback targets the VL RF and wakes ``pvl``.

  # --- i: single-stage scheduling invariants ----------------------------------

  - id: spec-issue.g35
    kind: function
    statement: >
      An IQ_V_LOAD or IQ_V_ALU entry must not be granted until its stale_pvdest group is ready.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        An ``IQ_V_LOAD`` or ``IQ_V_ALU`` entry must
        therefore not be granted until its ``stale_pvdest`` group is ready.
    notes: >
      stale_pvdest is an IMPLICIT source: no source field of the instruction names it, but an
      IQ_V_LOAD reads it for the LCB's R2 undisturbed-lane pre-load under vta=0/vma=0, and an
      IQ_V_ALU reads it whenever the coprocessor pulls the STALE_VD slot. Age-ordered issue does
      not make this redundant — the queues grant the oldest READY entry, not the oldest COMPLETE
      one — and the failure is silent, since the preserved lanes would instead hold whatever the
      free list last left in that PRN.

  - id: spec-issue.g36
    kind: interface
    statement: >
      A vector issue slot must match stale_pvdest against the vector wakeup network.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        It is matched on the **vector**
        wakeup network exactly as ``pvs1``/``pvs2``/``pvs3``/``pvm`` are.
    notes: >
      No new network is added; stale_pvdest rides the existing vector wakeup network on the same
      terms as the encoded source groups.

  - id: spec-issue.g37
    kind: structure
    statement: >
      An IQ_V_STORE slot must not carry a stale_pvdest matcher.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        ``IQ_V_STORE`` carries no such
        matcher: a store has no vector destination, so it has no stale group.

  - id: spec-issue.g38
    kind: structure
    statement: >
      The stale_pvdest readiness match must be per member rather than a single aggregate busy bit.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        A single aggregate busy
        bit cannot express "waiting on the third of eight", and one group-done cannot clear it
        correctly.
    notes: >
      stale_pvdest may span up to MAX_MEMBERS producers — an LMUL=1 OP.v writing v0 followed by an
      LMUL=8 OP.v renaming v0-v7 gives a stale group installed by up to eight instructions. Same
      argument as the per-member matching required for pvs* (spec-issue.g18).

  - id: spec-issue.g39
    kind: function
    statement: >
      Every IQ_V_ALU entry with a vector destination must wait on stale_pvdest readiness.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Vector Issue Slot"
      quote: >
        Every ``IQ_V_ALU`` entry with a
        vector destination must therefore wait on ``stale_pvdest`` readiness, including the ops that
        will never pull it.
    notes: >
      Deliberately conservative: whether the coprocessor pulls STALE_VD is the VPU decoder's
      decision, the issue packet carries no hint of it, and no back-channel exists. The host cannot
      narrow the gate, so it waits for every vector-destination CII op.

