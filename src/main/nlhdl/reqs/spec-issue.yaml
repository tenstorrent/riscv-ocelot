  - id: spec-issue.e11
    kind: function
    statement: >
      IQ_V_LOAD and IQ_V_STORE must grant the oldest ready entry.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Issue/Scheduling Stage"
      quote: >
        they grant the
        **oldest *ready*** entry and may skip a not-ready older entry (out-of-order issue among ready ops).
    notes: >
      Skipping a not-ready older entry is an allowance, not a separate obligation. The spec's
      justification is that the V-LSU is out-of-order.

  - id: spec-issue.e12
    kind: function
    statement: >
      IQ_V_ALU must grant the oldest ready entry.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Issue/Scheduling Stage"
      quote: >
        Like the other queues
        it grants the **oldest *ready*** entry, but an entry is only *eligible* once it is **past the PNR** —
        its ROB entry is older than ``rob.io.rob_pnr_idx``
    notes: >
      IQ_V_ALU being age-ordered collapsing with a per-entry past-PNR gate, entries being
      eligible only past the PNR, and IQ_V_ALU not being a head-only FIFO are spec-cii.d2,
      spec-cii.d3 and spec-cii.i7; they are not duplicated here. The stated cost — a vector
      arithmetic op cannot start until older branches resolve and older loads disambiguate —
      is rationale.

  - id: spec-issue.e13
    kind: interface
    statement: >
      An IQ_V_ALU entry's past-PNR eligibility must be evaluated by comparing its ROB entry
      against rob.io.rob_pnr_idx.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Issue/Scheduling Stage"
      quote: >
        but an entry is only *eligible* once it is **past the PNR** —
        its ROB entry is older than ``rob.io.rob_pnr_idx``

  - id: spec-issue.e14
    kind: structure
    statement: >
      The vector issue logic must not impose program-order issue on IQ_V_ALU.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Issue/Scheduling Stage"
      quote: >
        The VPU being in-order means it processes **one instruction
        at a time**; it does *not* require **program-order issue**, because rename has already resolved
        every register dependence before an op crosses the CII.
    notes: >
      The note block's three candidate justifications for program order are each shown not to
      require it: vtype/vl/vstart/vxrm ride the per-instruction issue packet (spec-cii.d9,
      spec-cii.d10), vxsat/fflags are accumulated at commit in ROB order, and tags are opaque
      with results already permitted to return out of order (spec-cii.a13). That squashed
      IQ_V_ALU entries are dropped before they issue is spec-cii.d13, and that ops already
      accepted by the CII can still be squashed by a ROB-head flush is spec-cii's flush
      group.

