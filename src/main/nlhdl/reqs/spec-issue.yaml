family: issue
description: >
  Vector dispatch and scheduling: program-order element-queue reservation, the vector
  issue queues and slots, wakeup networks, and VL delivery to issue.
spec_sources:
  - docs_caracal/src/issue.rst

groups:
  a: the dispatch stage — position, routing, and what changed from BOOM
  b: vector element-queue reservation at dispatch
  c: shared (segmented) instruction dispatch and the pvtmp rendezvous
  d: the segmented-store dependency chain
  e: issue-queue structure and selection policy
  f: wakeup-network connectivity
  g: the vector issue slot
  h: VL delivery to issue
  i: single-stage scheduling invariants

reqs:

  # --- a: the dispatch stage --------------------------------------------------

  - id: spec-issue.a1
    kind: structure
    statement: >
      The dispatch stage must sit between rename and the issue queues.
    source:
      file: docs_caracal/src/issue.rst
      anchor: dispatch-stage
      heading: "Dispatch Stage"
      quote: >
        In |boom|, dispatch is the pipeline stage that sits between rename and the issue queues —
        it is the last in-order stage before instructions go out-of-order.
    notes: >
      Stated of |boom|; this section also states that Caracal's dispatch stage is
      "essentially unchanged from |boom|" (spec-issue.a5), so the property is inherited.

  - id: spec-issue.a2
    kind: structure
    statement: >
      The dispatch stage must be the last in-order stage before instructions go
      out-of-order.
    source:
      file: docs_caracal/src/issue.rst
      anchor: dispatch-stage
      heading: "Dispatch Stage"
      quote: >
        In |boom|, dispatch is the pipeline stage that sits between rename and the issue queues —
        it is the last in-order stage before instructions go out-of-order.
    notes: >
      This is the property the rest of the chapter depends on: program-order element-queue
      reservation (spec-issue.b3) is possible only in an in-order stage.

  - id: spec-issue.a3
    kind: function
    statement: >
      The dispatch stage must route each instruction into the appropriate issue queue.
    source:
      file: docs_caracal/src/issue.rst
      anchor: dispatch-stage
      heading: "Dispatch Stage"
      quote: >
        This stage routes the
        instruction into the appropriate IQ and reserves the LDQ/STQ slot in program order, which
        only the in-order dispatch stage can do.

  - id: spec-issue.a4
    kind: function
    statement: >
      The dispatch stage must reserve the LDQ/STQ slot in program order.
    source:
      file: docs_caracal/src/issue.rst
      anchor: dispatch-stage
      heading: "Dispatch Stage"
      quote: >
        This stage routes the
        instruction into the appropriate IQ and reserves the LDQ/STQ slot in program order, which
        only the in-order dispatch stage can do.

  - id: spec-issue.a5
    kind: structure
    statement: >
      The dispatch stage must otherwise be unchanged from BOOM.
    source:
      file: docs_caracal/src/issue.rst
      anchor: dispatch-stage
      heading: "Dispatch Stage"
      quote: >
        The dispatch stage is essentially unchanged from
        |boom| except modified to support vector op-codes and routing into the new ``IQ_V_*`` queues.

  - id: spec-issue.a6
    kind: structure
    statement: >
      The dispatch stage must be modified to support vector op-codes.
    source:
      file: docs_caracal/src/issue.rst
      anchor: dispatch-stage
      heading: "Dispatch Stage"
      quote: >
        The dispatch stage is essentially unchanged from
        |boom| except modified to support vector op-codes and routing into the new ``IQ_V_*`` queues.

  - id: spec-issue.a7
    kind: function
    statement: >
      The dispatch stage must route vector op-codes into the new IQ_V_* queues.
    source:
      file: docs_caracal/src/issue.rst
      anchor: dispatch-stage
      heading: "Dispatch Stage"
      quote: >
        The dispatch stage is essentially unchanged from
        |boom| except modified to support vector op-codes and routing into the new ``IQ_V_*`` queues.

  # --- b: vector element-queue reservation at dispatch ------------------------

  - id: spec-issue.b1
    kind: function
    statement: >
      Dispatch must reserve capacity in the vector element queues for a vector memory OP.v
      alongside the LDQ/STQ slot.
    source:
      file: docs_caracal/src/issue.rst
      anchor: vec-queue-reservation
      heading: "Vector element-queue reservation (in program order)"
      quote: >
        Dispatch acquires one more thing for a vector memory ``OP.v``: **capacity in the vector element
        queues**, reserved in program order alongside the LDQ/STQ slot.
    notes: >
      The program-order-at-dispatch discipline itself is spec-lsu.b4/b5 (address queue) and
      spec-lsu.d12 (store-data queue); what this entry records is the issue-side obligation
      that the element-queue reservation is acquired in the same in-order dispatch action as
      the LDQ/STQ slot.

  - id: spec-issue.b2
    kind: function
    statement: >
      A vector store must not dispatch unless its address and data queues have room for its
      worst-case active element count.
    source:
      file: docs_caracal/src/issue.rst
      anchor: vec-queue-reservation
      heading: "Vector element-queue reservation (in program order)"
      quote: >
        **A vector store** may not dispatch unless its address queue AND its data queue have room
        for its **worst-case active element count**, computed from ``EMUL`` and ``EEW``
    notes: >
      NARROWED TO STORES by decision D9/D10; the load half is now spec-issue.b9. The previous
      wording applied the worst-case rule to both directions, which made the load-streaming clause
      spec-lsu.b11 unreachable, since worstCase = EMUL * VLEN/EEW = VLMAX >= VL >= active count.
      The store rule cannot be relaxed: the four-step deadlock argument in loadstore.rst
      `ssi-queues` depends on the oldest store already holding its full capacity.
      The data-queue half is also spec-lsu.d13.

  - id: spec-issue.b3
    kind: function
    statement: >
      Dispatch must compute a vector memory OP.v's worst-case active element count from EMUL
      and EEW.
    source:
      file: docs_caracal/src/issue.rst
      anchor: vec-queue-reservation
      heading: "Vector element-queue reservation (in program order)"
      quote: >
        for its **worst-case active element count**, computed from ``EMUL`` and ``EEW`` — both
        known at decode
    notes: >
      Both EMUL and EEW are known at decode, so the count needs no VL. The parenthesised
      worked example (SEW=8, LMUL=8 at VLEN=256 giving 256 elements) is illustrative; the
      per-configuration element count itself is spec-lsu.b15.

  - id: spec-issue.b9
    kind: function
    statement: >
      A vector load must reserve min(worstCase, ldResvMembers * VLEN/EEW) element-queue entries at
      dispatch.
    source:
      file: docs_caracal/src/issue.rst
      anchor: vec-queue-reservation
      heading: "Vector element-queue reservation (in program order)"
      quote: >
        **A vector load** reserves ``min(worstCase, ldResvMembers * VLEN/EEW)`` entries, with
        ``ldResvMembers`` defaulting to **4**, and streams the remainder in waves.
    notes: >
      Added by decision D9/D10 as the load half of the split described in spec-issue.b2. The
      default of 4 is stated by the spec, so it is part of the requirement. A load reserves for
      squashability, not deadlock avoidance — it completes out of the LCB without gating on commit
      — so it has no deadlock exposure to protect. The same obligation is stated from the LSU side
      as spec-lsu.b18, and the store counterpart as spec-lsu.b19.

  - id: spec-issue.b4
    kind: function
    statement: >
      The unused portion of a vector memory OP.v's element-queue reservation must be released
      at execute once VL is read from the VL RF.
    source:
      file: docs_caracal/src/issue.rst
      anchor: vec-queue-reservation
      heading: "Vector element-queue reservation (in program order)"
      quote: >
        At execute, once ``VL`` is read from the VL RF, the
        **unused portion of the reservation is released**.
    notes: >
      The two properties this section says program-order reservation buys — deadlock freedom
      for stores and squashability by pointer rollback — are rationale here and are mined in
      spec-lsu (deadlock freedom under §"Strided, Segmented, Indexed Queue"; pointer rollback,
      the program-ordered occupied region, and the absence of a per-entry br_mask as
      spec-lsu.i2/i3 and the pointer-rollback choice).

  # Reconciling the release with the program-ordered tail, resolved 2026-08-01.

  - id: spec-issue.b5
    kind: function
    statement: >
      The Vector AGEN must perform the release of the unused reservation.
    source:
      file: docs_caracal/src/issue.rst
      anchor: vec-queue-reservation
      heading: "Vector element-queue reservation (in program order)"
      quote: >
        **The release is tail-only.** The Vector AGEN — the stage that reads ``VL`` — may return
        the unused portion **only while the reserving ``OP.v``'s region is still the youngest in
        that queue**, in which case the release simply moves the tail pointer back.
    notes: >
      Resolved 2026-08-01: the question was both which structure performs the release and how a
      mid-queue release could coexist with one program-ordered tail. The answer to the first is
      the Vector AGEN, because it is the stage that reads VL (spec-issue.b4).

  - id: spec-issue.b6
    kind: function
    statement: >
      The unused reservation must be released only while the reserving ``OP.v``'s region is the
      youngest in that queue.
    source:
      file: docs_caracal/src/issue.rst
      anchor: vec-queue-reservation
      heading: "Vector element-queue reservation (in program order)"
      quote: >
        may return
        the unused portion **only while the reserving ``OP.v``'s region is still the youngest in
        that queue**, in which case the release simply moves the tail pointer back.
    notes: >
      The release moves the tail pointer back. The spec records the cost honestly: under a
      stream of vector memory ops the release usually cannot fire, so the worst-case
      reservation rather than VL is what bounds in-flight vector memory.

  - id: spec-issue.b7
    kind: function
    statement: >
      Unused entries must stay held and free in order when a younger ``OP.v`` has already
      reserved past them.
    source:
      file: docs_caracal/src/issue.rst
      anchor: vec-queue-reservation
      heading: "Vector element-queue reservation (in program order)"
      quote: >
        If any younger ``OP.v`` has already reserved
        past it, the unused entries stay held and are freed in order with the rest of the region.

  - id: spec-issue.b8
    kind: function
    statement: >
      A mid-queue release must not be permitted.
    source:
      file: docs_caracal/src/issue.rst
      anchor: vec-queue-reservation
      heading: "Vector element-queue reservation (in program order)"
      quote: >
        A
        mid-queue release is **not** permitted: it would punch a hole in the occupied region and
        break the program-ordered-tail invariant
    notes: >
      The invariant it would break is squashability by pointer rollback, spec-lsu group i.

  # --- c: shared (segmented) instruction dispatch and the pvtmp rendezvous -----

  - id: spec-issue.c1
    kind: function
    statement: >
      A shared instruction's multiple execution resources must be acquired at dispatch time.
    source:
      file: docs_caracal/src/issue.rst
      anchor: cii-shared-sched
      heading: "CII Shared Instruction Scheduling"
      quote: >
        In the single-stage scheme this is
        handled at **dispatch time**: when a segmented load or store is renamed by the vector mapper,
        it is dispatched to BOTH the CII IQ/coprocessor and its own Load/Store path.
    notes: >
      That shared instructions are marked is_shared by the Decoder is spec-decode group b.

  - id: spec-issue.c2
    kind: function
    statement: >
      A segmented load or store must be dispatched to both the CII IQ/coprocessor and its own
      load/store path.
    source:
      file: docs_caracal/src/issue.rst
      anchor: cii-shared-sched
      heading: "CII Shared Instruction Scheduling"
      quote: >
        In the single-stage scheme this is
        handled at **dispatch time**: when a segmented load or store is renamed by the vector mapper,
        it is dispatched to BOTH the CII IQ/coprocessor and its own Load/Store path.

  - id: spec-issue.c3
    kind: function
    statement: >
      A shared instruction's pvdest and pvtmp groups must be allocated all-or-nothing.
    source:
      file: docs_caracal/src/issue.rst
      anchor: cii-shared-sched
      heading: "CII Shared Instruction Scheduling"
      quote: >
        Its ``pvdest`` and
        ``pvtmp`` groups are allocated **all-or-nothing**
    notes: >
      Rationale: a partially allocated shared op would hold PRNs it cannot free until commit.
      The allocation itself is specified by midcore.rst §"CII Shared Instruction Mapping" and
      belongs to the rename family (not yet extracted); this entry records the dispatch-side
      gate that issue.rst states.

  - id: spec-issue.c4
    kind: structure
    statement: >
      Shared handling must apply only to vector load/store.
    source:
      file: docs_caracal/src/issue.rst
      anchor: cii-shared-sched
      heading: "CII Shared Instruction Scheduling"
      quote: >
        A shared vector
        *arithmetic* instruction does not apply — the coprocessor fully manages its own
        resources — so shared handling applies only to vector load/store.
    notes: >
      Rationale for the exclusion: the coprocessor fully manages its own resources for a
      vector arithmetic op, so no second execution resource is dispatched.

  - id: spec-issue.c5
    kind: structure
    statement: >
      The two halves of a shared instruction must occupy two issue slots.
    source:
      file: docs_caracal/src/issue.rst
      anchor: cii-shared-sched
      heading: "CII Shared Instruction Scheduling"
      quote: >
        The two halves occupy two issue slots but share **one ROB entry**, which stays busy until both
        halves report

  - id: spec-issue.c6
    kind: structure
    statement: >
      The two halves of a shared instruction must share one ROB entry.
    source:
      file: docs_caracal/src/issue.rst
      anchor: cii-shared-sched
      heading: "CII Shared Instruction Scheduling"
      quote: >
        The two halves occupy two issue slots but share **one ROB entry**, which stays busy until both
        halves report

  - id: spec-issue.c7
    kind: function
    statement: >
      A shared instruction's ROB entry must stay busy until both halves report.
    source:
      file: docs_caracal/src/issue.rst
      anchor: cii-shared-sched
      heading: "CII Shared Instruction Scheduling"
      quote: >
        The two halves occupy two issue slots but share **one ROB entry**, which stays busy until both
        halves report

  - id: spec-issue.c8
    kind: structure
    statement: >
      The other-half-pending state of a shared instruction must be tracked by a 1-bit flag
      rather than by a counter.
    source:
      file: docs_caracal/src/issue.rst
      anchor: cii-shared-sched
      heading: "CII Shared Instruction Scheduling"
      quote: >
        tracked by the ROB's **1-bit "other half pending" flag** (see the ROB
        Completion-tracking section), not a counter.
    notes: >
      The flag lives in the ROB and is specified by midcore.rst §"Completion tracking"; that
      belongs to the rob family (not yet extracted). Mined here because issue.rst states it as
      part of the dispatch-time shared-instruction scheme.

  - id: spec-issue.c9
    kind: function
    statement: >
      The two halves of a shared instruction must rendezvous on the pvtmp group in the VRF.
    source:
      file: docs_caracal/src/issue.rst
      anchor: cii-shared-sched
      heading: "CII Shared Instruction Scheduling"
      quote: >
        The halves rendezvous on the ``pvtmp`` group in the
        VRF (allocated by the vector mapper, see CII Shared Instruction Mapping): the producer writes it as
        a destination and the consumer reads it as a source, woken by ``pvtmp``'s group-done on the vector
        wakeup network like any vector operand.
    notes: >
      The producer-writes / consumer-reads halves are mined per half elsewhere:
      spec-lsu.l1/l3/l9 for a segmented load and spec-cii.i8/i11 for a segmented store. The
      group-done broadcast is spec-lsu.l5 and the slot wakeup is spec-cii.i12.

  - id: spec-issue.c14
    kind: function
    statement: >
      The LSU half of a segmented load must be selected for issue when the scalar base and
      stride, the index vector for indexed forms, ``pvm`` when masked, and ``pvl`` are ready.
    source:
      file: docs_caracal/src/issue.rst
      anchor: cii-shared-sched
      heading: "Segmented Load"
      quote: >
        2. The LSU is selected for issue when its **address operands** are ready — the scalar
           base and stride, the index vector for indexed forms, ``pvm`` when the op is masked,
           and ``pvl``.
    notes: >
      Supersedes the retired spec-issue.c10, whose condition ("all of its vector source
      operands") was resolved on 2026-08-01 in favour of midcore.rst's narrower address-operand
      wording. spec-lsu.l2 states the same wakeup generally, from midcore.rst §"Segmented
      Load"; this requirement adds the operand set, which that section does not enumerate. Step
      1 of this list — the LSU treating pvtmp as its destination group and writing the loaded
      data into it — is spec-lsu.l1/l3/l4.

  - id: spec-issue.c11
    kind: interface
    statement: >
      The pvtmp group-done must wake the coprocessor half of a segmented load.
    source:
      file: docs_caracal/src/issue.rst
      anchor: cii-shared-sched
      heading: "Segmented Load"
      quote: >
        3. ``pvtmp``'s group-done wakes the coprocessor, which reads ``pvtmp``, transposes, and writes
        ``pvdest``.
    notes: >
      The coprocessor-side read, transpose and pvdest write are spec-cii.i1; the group-done
      broadcast itself is spec-lsu.l5.

  - id: spec-issue.c12
    kind: interface
    statement: >
      The pvtmp group-done must wake the store issue-queue slot's DGEN path.
    source:
      file: docs_caracal/src/issue.rst
      anchor: cii-shared-sched
      heading: "Segmented Store"
      quote: >
        2. ``pvtmp``'s group-done wakes the store IQ slot's **DGEN** path (not AGEN — see below).
    notes: >
      spec-cii.i12 records the same wakeup from midcore.rst without distinguishing DGEN from
      AGEN; the DGEN-not-AGEN distinction is issue.rst's contribution. Step 1 of this list
      (the coprocessor writing the transposed data into pvtmp) is spec-cii.i8/i10/i11, and
      step 3 (the LSU reading pvtmp and writing memory once committed) is spec-lsu.

  - id: spec-issue.c13
    kind: interface
    statement: >
      The pvtmp group-done must not wake the store issue-queue slot's AGEN path.
    source:
      file: docs_caracal/src/issue.rst
      anchor: cii-shared-sched
      heading: "Segmented Store"
      quote: >
        2. ``pvtmp``'s group-done wakes the store IQ slot's **DGEN** path (not AGEN — see below).
    notes: >
      AGEN must already have run before pvtmp exists at all — see the segmented-store
      dependency chain, spec-issue.d1.

  # --- d: the segmented-store dependency chain --------------------------------

  - id: spec-issue.d1
    kind: function
    statement: >
      The implementation must respect the six-step segmented-store dependency chain.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        The two halves of a segmented store are not independent: the coprocessor half cannot start until the
        LSU half has *already* run its address path. The full chain is six steps, and it must be respected by
        the implementation:
    notes: >
      The "coprocessor half cannot start until the LSU half has run its address path" half of
      the quote is spec-cii.i5. d2-d9 below break the chain into its individual steps.

  - id: spec-issue.d2
    kind: function
    statement: >
      The LSU half of a segmented store must run AGEN as the first step of the chain.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        1. LSU half AGEN                (needs base GPR, + index vector, + mask — all from older producers)

  - id: spec-issue.d3
    kind: function
    statement: >
      The LSU half's AGEN must source its base GPR, index vector and mask from producers older
      than the segmented store.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        every operand step 1 depends on comes
        from an instruction *older* than the segmented store
    notes: >
      "From an older producer" is NOT by itself sufficient for the base GPR, and reading it as
      sufficient produced a real bug (vector addresses computed from the previous tenant of the
      base physical register; TLMonitor AcquireBlock to a non-cacheable address on
      ms3p5_pureload / ms4_vle64 / edge_ls_gen, rob.scala:620 on ms2p5_loadblock / stress_seg).
      iq_v_load and iq_v_store are NOT past-PNR gated, so an older producer may still be
      unwritten at the grant: a BYPASSABLE INT wakeup means the producer's integer regfile write
      has NOT YET LANDED, and it can land after the read response. VecScalarOperandRead therefore
      holds a hinted lane until it OBSERVES that write on int_wb_snoop, rather than assuming any
      particular distance -- bypass_hint is a "is the write pending?" predicate, never a latency
      constant. See the "stale scalar base forward" section of
      nlhdl/vec/lsu/VecScalarOperandRead.nlhdl.scala and the retraction of VecPipeline decision
      D4. Checked by VecScalarOperandRead's bypassHintUnhonored assertion.

  - id: spec-issue.d4
    kind: function
    statement: >
      The LSU half of a segmented store must signal group-safe after its AGEN step.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        2. → group-safe / clr_unsafe    (lsu.scala:1443, on do_st_search)
    notes: >
      lsu.scala:1443 and do_st_search are cited as the existing BOOM mechanism that carries
      this step, not as a Caracal-specific structure.

  - id: spec-issue.d5
    kind: function
    statement: >
      The PNR must advance past a segmented store's ROB entry only after its LSU half has
      signalled group-safe.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        2. → group-safe / clr_unsafe    (lsu.scala:1443, on do_st_search)
        3. → PNR advances past this ROB entry

  - id: spec-issue.d6
    kind: function
    statement: >
      The coprocessor half of a segmented store must become PNR-eligible in IQ_V_ALU only
      after the PNR has advanced past its ROB entry.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        3. → PNR advances past this ROB entry
        4. → coprocessor half becomes PNR-eligible in IQ_V_ALU and is granted

  - id: spec-issue.d7
    kind: function
    statement: >
      The coprocessor half of a segmented store must be granted from IQ_V_ALU once it is
      PNR-eligible.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        4. → coprocessor half becomes PNR-eligible in IQ_V_ALU and is granted

  - id: spec-issue.d8
    kind: function
    statement: >
      The coprocessor half of a segmented store must emit group-done after writing pvtmp.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        5. → coprocessor transposes, writes pvtmp, emits group-done
    notes: >
      The transpose and the pvtmp write themselves are spec-cii.i10 and spec-cii.i11.

  - id: spec-issue.d9
    kind: function
    statement: >
      The LSU half's DGEN must read pvtmp as store data as the last step of the chain.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        6. → LSU half DGEN reads pvtmp as store data

  - id: spec-issue.d10
    kind: structure
    statement: >
      AGEN and DGEN of the same issue slot must be independently grantable.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        **AGEN and DGEN of the same issue slot must be independently grantable, in that order, separated by
        a long and variable delay** (steps 1 and 6 can be hundreds of cycles apart).

  - id: spec-issue.d11
    kind: function
    statement: >
      AGEN of an issue slot must be granted before DGEN of that slot.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        **AGEN and DGEN of the same issue slot must be independently grantable, in that order, separated by
        a long and variable delay** (steps 1 and 6 can be hundreds of cycles apart).

  - id: spec-issue.d12
    kind: timing
    statement: >
      An issue slot must tolerate a long and variable delay between its AGEN grant and its
      DGEN grant.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        **AGEN and DGEN of the same issue slot must be independently grantable, in that order, separated by
        a long and variable delay** (steps 1 and 6 can be hundreds of cycles apart).
    notes: >
      The spec bounds the delay only informally ("hundreds of cycles"), so no cycle count is
      stated as a requirement.

  - id: spec-issue.d13
    kind: structure
    statement: >
      An issue slot must not treat AGEN and DGEN as a single grant.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        The slot cannot treat
        AGEN+DGEN as a single grant.

  - id: spec-issue.d14
    kind: function
    statement: >
      The segmented-store dependency chain must contain no circular wait.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        - **There is no circular wait**, so the chain cannot deadlock

  - id: spec-issue.d15
    kind: function
    statement: >
      The coprocessor half's PNR eligibility must depend only on its own store's address
      translation.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        the coprocessor half's PNR eligibility
        depends only on its own store's address translation. It is a long serial chain, not a cycle.
    notes: >
      This section closes by deriving from the chain that IQ_V_ALU must not be a head-only
      FIFO; that obligation is already spec-cii.i7 and is not duplicated here.

  # What makes the shared ROB entry pass the PNR, resolved 2026-08-01.

  - id: spec-issue.d16
    kind: structure
    statement: >
      A shared ROB entry must carry one ``rob_unsafe`` bit.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        **What makes the shared ROB entry pass the PNR.** The entry carries **one**
        ``rob_unsafe`` bit, and the LSU half's first address translation clearing it is
        **sufficient** — nothing waits on the coprocessor half.

  - id: spec-issue.d17
    kind: function
    statement: >
      The LSU half's first address translation clearing ``rob_unsafe`` must be sufficient to
      advance the PNR past a shared ROB entry.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        the LSU half's first address translation clearing it is
        **sufficient** — nothing waits on the coprocessor half.
    notes: >
      Resolved 2026-08-01. Gating the PNR on both halves being safe would close the cycle the
      section denies: the coprocessor half cannot issue until the PNR passes the entry.

  - id: spec-issue.d18
    kind: function
    statement: >
      The PNR must treat a ROB entry with a half still un-issued no differently from any other
      safe entry.
    source:
      file: docs_caracal/src/issue.rst
      anchor: shared-store-chain
      heading: "The segmented-store dependency chain"
      quote: >
        The PNR tracks the resolution of *speculation*, not completion, so a ROB entry with
        a half still un-issued is treated no differently from any other safe entry; completion is
        what the ROB's "other half pending" flag tracks, separately.
    notes: >
      The separation the spec relies on: the PNR tracks resolution of speculation, completion
      is tracked by the ROB's "other half pending" flag (spec-issue.c8).

