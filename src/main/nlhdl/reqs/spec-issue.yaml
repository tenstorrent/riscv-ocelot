      anchor: issue-sched-stage
      heading: "The Issue/Scheduling Stage"
      quote: >
        **``IQ_MEM``/``IQ_UNQ``/``IQ_ALU``/``IQ_FP`` and ``IQ_V_LOAD``/``IQ_V_STORE``** reuse |boom|'s
        **age-ordered collapsing** Issue Queue and its priority-encoder select unchanged

  - id: spec-issue.e10
    kind: structure
    statement: >
      Those six queues must reuse BOOM's priority-encoder select unchanged.
    source:
      file: docs_caracal/src/issue.rst
      anchor: issue-sched-stage
      heading: "The Issue/Scheduling Stage"
      quote: >
        **``IQ_MEM``/``IQ_UNQ``/``IQ_ALU``/``IQ_FP`` and ``IQ_V_LOAD``/``IQ_V_STORE``** reuse |boom|'s
