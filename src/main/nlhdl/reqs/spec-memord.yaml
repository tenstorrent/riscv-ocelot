      memory-dependency predictor exists to avoid.

  # --- d: the past-PNR consequence for the CII ---------------------------------

  - id: spec-memord.d1
    kind: function
    statement: >
      The design must not rely on the assumption that an instruction past the PNR will commit.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: order-fail-replay
      heading: "Ordering-Violation Replay"
      quote: >
        **This path is what breaks the "past-PNR ⇒ will commit" assumption for the CII.** A
        load's ``rob_unsafe`` bit is cleared on its **first address translation**
        (``lsu.scala:1443``), but ``order_fail`` is only discovered later — so the PNR sweeps
        past the load, vector arithmetic ops issue to the coprocessor, and the flush above
        then squashes them.
    notes: >
      Evidence, not separate obligations: a load's ``rob_unsafe`` bit is cleared on its first
      address translation (``lsu.scala:1443``) while ``order_fail`` is discovered later, and
      |boom| documents the same at ``rob.scala:438-441``. Extending ``order_fail`` to
      cross-queue vector/scalar matches makes this more frequent than in baseline |boom|, not
      less. The coprocessor-side contract that handles the resulting squash is
      :ref:`cii-flush` — spec-cii group e, especially spec-cii.e1 and spec-cii.e2 — and is not
      restated here.

