family: memord
description: >
  Memory ordering between the vector and scalar paths: bidirectional cross-queue
  disambiguation, ordering-violation replay, and fences.
spec_sources:
  - docs_caracal/src/loadstore.rst

groups:
  a: cross-queue disambiguation — routing vector addresses into the LCAM in both directions
  b: search granularity — US range-overlap vs SSI per-element, and the SSI/SSI hold
  c: the ordering-violation replay mechanism
  d: the past-PNR consequence for the CII
  e: order-fail of a vector load
  f: fences and the fencei_rdy extension

reqs:

  # --- a: cross-queue disambiguation, both directions --------------------------

  - id: spec-memord.a1
    kind: interface
    statement: >
      The design must explicitly route vector addresses through the disambiguation
      machinery.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        The scalar LCAM (which searches the LDQ/STQ entries) therefore does not see them by
        default, so |caracal| explicitly routes vector addresses through the disambiguation
        machinery so RVWMO ordering between scalar and vector memory ops is maintained in
        **both** directions:
    notes: >
      The premise is that vector load/store element addresses live in the SSI/US address
      queues, **not** in the scalar STQ, so the scalar LCAM does not see them by default. The
      queues themselves are obligations of spec-lsu groups b–d, not restated here.

  - id: spec-memord.a2
    kind: function
    statement: >
      RVWMO ordering between scalar and vector memory ops must be maintained in both
      directions.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        The scalar LCAM (which searches the LDQ/STQ entries) therefore does not see them by
        default, so |caracal| explicitly routes vector addresses through the disambiguation
        machinery so RVWMO ordering between scalar and vector memory ops is maintained in
        **both** directions:

  - id: spec-memord.a3
    kind: function
    statement: >
      Each vector store address presented for execute must be searched against the LDQ.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **ST→LD ordering.** Each vector store address presented
        for execute is searched against the LDQ — both scalar LDQ entries and in-flight vector
        loads — exactly as a scalar store addr-gen drives the LCAM.

  - id: spec-memord.a4
    kind: function
    statement: >
      The LDQ search for a vector store address must cover both scalar LDQ entries and
      in-flight vector loads.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **ST→LD ordering.** Each vector store address presented
        for execute is searched against the LDQ — both scalar LDQ entries and in-flight vector
        loads — exactly as a scalar store addr-gen drives the LCAM.

  - id: spec-memord.a5
    kind: interface
    statement: >
      A vector store address must drive the LCAM exactly as a scalar store addr-gen does.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **ST→LD ordering.** Each vector store address presented
        for execute is searched against the LDQ — both scalar LDQ entries and in-flight vector
        loads — exactly as a scalar store addr-gen drives the LCAM.

  - id: spec-memord.a6
    kind: function
    statement: >
      A vector store address match on a younger, already-executed load must set that load's
      ``order_fail``.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        A match on a younger, already-executed load sets that load's ``order_fail`` and
        replays it.

  - id: spec-memord.a7
    kind: function
    statement: >
      A vector store address match on a younger, already-executed load must replay that load.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        A match on a younger, already-executed load sets that load's ``order_fail`` and
        replays it.
    notes: >
      The replay mechanism itself is group c; this requirement is only that the cross-queue
      match triggers it.

  - id: spec-memord.a12
    kind: structure
    statement: >
      Memory-dependency speculation must reuse |boom|'s existing predictor.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        Memory-dependency speculation (a load issuing past a store whose address is not yet
        known) reuses |boom|'s existing predictor and ordering-violation replay path, now
        extended to fire on the cross-queue matches above.
    notes: >
      Memory-dependency speculation is defined here as a load issuing past a store whose
      address is not yet known.

  - id: spec-memord.a13
    kind: structure
    statement: >
      Memory-dependency speculation must reuse |boom|'s existing ordering-violation replay
      path.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        Memory-dependency speculation (a load issuing past a store whose address is not yet
        known) reuses |boom|'s existing predictor and ordering-violation replay path, now
        extended to fire on the cross-queue matches above.

  - id: spec-memord.a14
    kind: function
    statement: >
      The ordering-violation replay path must be extended to fire on the cross-queue
      scalar/vector matches.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        Memory-dependency speculation (a load issuing past a store whose address is not yet
        known) reuses |boom|'s existing predictor and ordering-violation replay path, now
        extended to fire on the cross-queue matches above.

  - id: spec-memord.a15
    kind: interface
    statement: >
      Forwarded vector store data must be read from the st_*_DATA_Q.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        A match on an older vector store forwards that store's data, read from the
        ``st_*_DATA_Q`` (which already holds the store data, captured at DGEN).
    notes: >
      Supersedes the retired spec-memord.a10. The store data queues themselves are spec-lsu
      group d; the data is captured at DGEN per spec-lsu.d7. Re-quoted on 2026-07-31 when the
      forwarding bullet became load-initiated; the obligation is unchanged.

  # The direction of the forwarding search, resolved 2026-07-31.

  - id: spec-memord.a18
    kind: function
    statement: >
      Each load address presented for execute must be searched against the scalar STQ.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **ST→LD forwarding.** Forwarding is **load-initiated**: each load address presented
        for execute is searched against both the scalar STQ and the vector store address
        queues, exactly as a scalar load drives the LCAM today.
    notes: >
      Supersedes the retired spec-memord.a16/a17. The spec's stated reason for making
      forwarding load-initiated is that a store's own search cannot forward, because a load
      that has not yet executed has no address to match against.

  - id: spec-memord.a19
    kind: function
    statement: >
      Each load address presented for execute must be searched against the vector store
      address queues.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **ST→LD forwarding.** Forwarding is **load-initiated**: each load address presented
        for execute is searched against both the scalar STQ and the vector store address
        queues, exactly as a scalar load drives the LCAM today.

  - id: spec-memord.a20
    kind: interface
    statement: >
      A load address must drive the LCAM exactly as a scalar load does today.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        each load address presented for execute is searched against both the scalar STQ and
        the vector store address queues, exactly as a scalar load drives the LCAM today.
    notes: >
      The store-side counterpart is spec-memord.a5.

  - id: spec-memord.a21
    kind: function
    statement: >
      A load-address match on an older vector store must forward that store's data to the
      load.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        A match on an older vector store forwards that store's data, read from the
        ``st_*_DATA_Q`` (which already holds the store data, captured at DGEN).
    notes: >
      Which store/load class pairs are eligible is spec-memord.a23 (scalar loads) and
      spec-memord.b14 (vector loads).

  - id: spec-memord.a22
    kind: structure
    statement: >
      A vector store address queue entry must not be presented to the LCAM until its
      corresponding ``st_*_DATA_Q`` entry is valid.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **A vector store address is withheld from disambiguation until its data is captured.**
        An address queue entry is not presented to the LCAM until its corresponding
        ``st_*_DATA_Q`` entry is valid, so a forwarding match can never hit a store whose data
        has not yet been captured.
    notes: >
      Resolved 2026-07-31. This is what makes the data-pending case unreachable: rather than
      blocking or replaying a load whose matched store has no captured data, the design keeps
      the address out of the LCAM until DGEN has run.

  # Which store/load class pairs forward — scalar consumer side, resolved 2026-07-31.

  - id: spec-memord.a23
    kind: function
    statement: >
      The design must forward to a scalar load from an older vector store of either the US or
      the SSI class.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **Scalar load from a vector store.** Permitted for both US and SSI stores.
    notes: >
      This is deliberately wider than the vector-consumer rule (spec-memord.b14), which
      forwards only US to US. The spec's stated reason is that a scalar load costs at most one
      replay, so it forwards, whereas a multi-element vector load is held instead.

  - id: spec-memord.a24
    kind: function
    statement: >
      Where several already-generated elements of the same SSI store alias a scalar load, the
      youngest matching element must supply the forwarded data.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        Where several already-generated elements of the same SSI store alias the load, the
        **youngest matching element** supplies the data.

  - id: spec-memord.a25
    kind: function
    statement: >
      A store element generated after a scalar load has forwarded, and aliasing that load,
      must set the load's ``order_fail`` through that element's own ST→LD ordering search.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        A store element generated *later* that aliases the load is caught by that element's
        own ST→LD ordering search, which sets the load's ``order_fail``
    notes: >
      Forwarding to a scalar load from a partially-resolved SSI store is speculative; the spec
      names the replay path (:ref:`order-fail-replay`) as the correctness floor for that
      speculation. The floor itself is spec-memord.b13.

  # --- b: search granularity, and the store/load hold --------------------------

  - id: spec-memord.b1
    kind: structure
    statement: >
      A US access must be treated as the contiguous byte range ``[base, base + VL*EEW)``.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **Unit-stride (US): one range check, not per element.** A US access is the contiguous
        byte range ``[base, base + VL*EEW)``.

  - id: spec-memord.b2
    kind: function
    statement: >
      The LCAM comparison for US loads/stores must be a range-overlap test of the whole US
      range against each queue entry's address.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        The LCAM comparison for US loads/stores is a **range-overlap** test of that whole
        range against each queue entry's address, performed once when the US entry executes —
        rather than expanding to per-element searches.

  - id: spec-memord.b3
    kind: timing
    statement: >
      The US range-overlap test must be performed once when the US entry executes.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        The LCAM comparison for US loads/stores is a **range-overlap** test of that whole
        range against each queue entry's address, performed once when the US entry executes —
        rather than expanding to per-element searches.

  - id: spec-memord.b4
    kind: function
    statement: >
      The US LCAM comparison must not expand to per-element searches.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        The LCAM comparison for US loads/stores is a **range-overlap** test of that whole
        range against each queue entry's address, performed once when the US entry executes —
        rather than expanding to per-element searches.
    notes: >
      The spec's stated reason is that the range check is both cheaper than per-element
      expansion and sufficient.

  - id: spec-memord.b5
    kind: function
    statement: >
      Any overlap anywhere in the US range must trigger the ordering/forwarding action.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        any overlap anywhere in the range triggers the ordering/forwarding action.
    notes: >
      The US range check is masking-agnostic: it is a folded test of [base, base + VL*EEW)
      computed once at execute from base/VL/EEW arithmetic, so it is not narrowed by AGEN
      suppressing masked-off accesses. The masked-store forwarding hazard this raised was
      resolved on 2026-07-31 by splitting the two paths: the range test stays mask-oblivious
      for ordering (spec-memord.b20), where over-approximation costs only a replay, while
      forwarding is qualified by the store's active byte mask (spec-memord.b21). The SSI path
      never had the hazard, because a masked-off element generates no nOP.v and so no
      per-element search.

  - id: spec-memord.b6
    kind: function
    statement: >
      A forwarding overlap that only partially covers the load must be handled like any
      partial-forward case in |boom|.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        For forwarding, an overlap that only partially covers the load is handled like any
        partial-forward case in |boom| — replay if the covering store data cannot fully
        satisfy the load.

  - id: spec-memord.b7
    kind: function
    statement: >
      A partially covering forward must replay the load when the covering store data cannot
      fully satisfy it.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        For forwarding, an overlap that only partially covers the load is handled like any
        partial-forward case in |boom| — replay if the covering store data cannot fully
        satisfy the load.

  - id: spec-memord.b8
    kind: function
    statement: >
      SSI accesses must search the LCAM per element ``nOP.v`` as they drain.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **Strided / Indexed / Segmented (SSI): per element.** Scattered addresses cannot be
        range-folded, so SSI accesses search the LCAM per element ``nOP.v`` as they drain.
    notes: >
      The spec's stated reason is that scattered addresses cannot be range-folded. The
      obligation that element accesses fire in element order is spec-lsu group f.

  - id: spec-memord.b9
    kind: interface
    statement: >
      The per-element SSI LCAM searches must contend for the shared LCAM through the same
      arbiter that gates the D$ port.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        These per-element searches contend for the shared LCAM through the same arbiter that
        gates the D$ port (:ref:`dcache-arbiter`), so they cannot starve scalar
        disambiguation.
    notes: >
      The arbiter itself and its anti-starvation guarantee — that these searches cannot starve
      scalar disambiguation — are obligations of spec-lsu group h and are not restated here.

  - id: spec-memord.b10
    kind: function
    statement: >
      Store-to-load forwarding must not be attempted between two SSI accesses.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        In the three other combinations — US store → SSI load, SSI store → US load, SSI store
        → SSI load — forwarding is not attempted
    notes: >
      The spec's stated reason is that an SSI store generates its element addresses
      incrementally, one ``nOP.v`` at a time through the arbiter, so until the store has
      resolved all its active elements a younger load cannot know whether a not-yet-generated
      store element aliases it, nor which store element holds the youngest byte for an aliased
      address; forwarding a whole vector load from a partially-resolved scatter is therefore
      unsafe. Re-quoted on 2026-07-31 when the rule was generalized from SSI/SSI to the three
      non-forwarding combinations; the SSI/SSI obligation this requirement states is unchanged
      and the general rule is spec-memord.b14.

  - id: spec-memord.b11
    kind: function
    statement: >
      The design must hold a younger vector load that overlaps an older in-flight vector store
      until that store completes, in every combination that does not forward.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        In all three, |caracal| instead **holds** the younger vector load that overlaps the
        older in-flight vector store until that store completes (all its elements drain), then
        lets the load read the updated cache line.
    notes: >
      Widened on 2026-07-31 from SSI store / SSI load to all three non-forwarding
      combinations, resolving the mixed US/SSI gap. The widening is what closes the replay
      livelock: a non-forwarding overlap that only order-failed would re-fail on every replay
      until the older store committed and drained. Where both are SSI the two element streams
      also share the LCAM / D$ port through the arbiter, so the spec observes that the pair
      then executes effectively serially.

  - id: spec-memord.b12
    kind: function
    statement: >
      The held vector load must read the updated cache line once all of the older store's
      elements have drained.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        In all three, |caracal| instead **holds** the younger vector load that overlaps the
        older in-flight vector store until that store completes (all its elements drain), then
        lets the load read the updated cache line.
    notes: >
      Widened on 2026-07-31 alongside spec-memord.b11.

  - id: spec-memord.b13
    kind: function
    statement: >
      The ordering-violation replay path must remain the correctness floor when a load slips
      through before the dependence is detected.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        The ordering-violation replay path (:ref:`order-fail-replay`) remains the correctness
        floor if a load slips through before the dependence is detected
    notes: >
      The hold of spec-memord.b11 is an optimization on top of this floor: the spec describes
      it as converting a multi-element replay storm into one clean serialization when the
      overlap is known or predicted.

  # Which store/load class pairs forward — vector consumer side, resolved 2026-07-31.

  - id: spec-memord.b14
    kind: function
    statement: >
      Vector-to-vector store-to-load forwarding must be attempted only when both the store and
      the load are unit-stride.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        Vector-to-vector store-to-load forwarding is attempted **only** for a US store to a US
        load.
    notes: >
      Supersedes the retired spec-memord.a17 and resolves the mixed US/SSI gap. The three
      non-forwarding combinations take the hold of spec-memord.b11 instead. The spec gives two
      distinct reasons: for an SSI store the partially-resolved scatter makes forwarding
      unsafe, while for a US store to an SSI load the forward is safe in principle and is
      declined only because a per-element load would have to range-check and slice every
      element against the store's US range.

  # The hold mechanism, resolved 2026-07-31.

  - id: spec-memord.b15
    kind: function
    statement: >
      An overlap must be treated as known when the LCAM matches an already-generated store
      element address, or the store's US range, against the load's address.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **Known** — an LCAM match between an already-generated store element address (or the
        store's US range) and the load's address.

  - id: spec-memord.b16
    kind: structure
    statement: >
      Overlap prediction for the hold must use |boom|'s existing memory-dependence predictor.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **Predicted** — |boom|'s existing memory-dependence predictor, the same one reused for
        memory-dependency speculation below.
    notes: >
      The same predictor is reused for memory-dependency speculation generally
      (spec-memord.a12); this requirement is its use as the predicted trigger for the hold.

  - id: spec-memord.b17
    kind: structure
    statement: >
      The hold must use the younger load's existing per-load store-dependency block on the
      older vector store entry.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **Held by** — the younger load's existing per-load store-dependency block on the older
        vector store entry
    notes: >
      The spec states that no new queue or state is added. That absence is not stated as a
      separate requirement, for the same reason the retired spec-memord.f4 was: no line of RTL
      implements the absence of a mechanism.

  - id: spec-memord.b18
    kind: function
    statement: >
      A held load must not be granted the LCAM or D$ port by the arbiter.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        the held load is simply not granted the LCAM / D$ port by the arbiter
        (:ref:`dcache-arbiter`).
    notes: >
      The arbiter itself is spec-lsu group h.

  - id: spec-memord.b19
    kind: function
    statement: >
      The hold must be released when the older store entry's element cursor completes its
      active element set.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **Released by** — that store entry's element cursor completing its active element set,
        i.e. the store's drain, after which the load reads the updated cache line.
    notes: >
      The element cursor itself is spec-lsu group f.

  # Masked elements versus the US range test, resolved 2026-07-31.

  - id: spec-memord.b20
    kind: function
    statement: >
      The US range-overlap test must remain mask-oblivious for ordering.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        The range test is deliberately **mask-oblivious for ordering**: it over-approximates,
        and a false positive costs only a replay.
    notes: >
      Over-approximation is safe on the ordering path because a false positive costs only a
      replay. It is not safe on the forwarding path, which is why spec-memord.b21 qualifies it
      there.

  - id: spec-memord.b21
    kind: function
    statement: >
      Forwarding from a US store must be qualified by the store's active byte mask.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: mem-order
      heading: "Memory Ordering and Disambiguation"
      quote: >
        **Forwarding is mask-qualified** — bytes belonging to inactive (masked-off or tail)
        elements of the store are never forwarded, and if the store's active bytes cannot
        fully cover the load the partial-forward rule above applies.
    notes: >
      Resolves the masked-store forwarding hazard recorded against spec-memord.b5. When the
      active bytes cannot fully cover the load the existing partial-forward rule applies —
      spec-memord.b6 and spec-memord.b7 — so no separate obligation is written for that case.

  # --- c: the ordering-violation replay mechanism ------------------------------

  - id: spec-memord.c1
    kind: function
    statement: >
      The design must recover from an ordering violation using |boom|'s existing
      ordering-violation path.
    source:
      file: docs_caracal/src/loadstore.rst
      anchor: order-fail-replay
      heading: "Ordering-Violation Replay"
      quote: >
        |caracal| recovers with |boom|'s existing ordering-violation path — the same
        squash-and-refetch machinery a branch mispredict uses — **not** a selective replay of
        just the load and its dependents.
    notes: >
      The trigger is a store's address search — scalar addr-gen, or a vector store's US range
      or SSI per-element search — matching a younger, already-executed load that has
      speculated past the store and may have read stale data.

  - id: spec-memord.c2
    kind: structure
    statement: >
