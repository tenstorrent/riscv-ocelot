retired:

  - id: spec-memord.a16
    statement: >
      A store-address match on a younger not-yet-executed scalar load must forward the vector
      store's data to that load.
    retired_because: >
      loadstore.rst "Memory Ordering and Disambiguation" was corrected on 2026-07-31: the
      2026-07-31 rewrite had made the store the searcher while keeping the load-initiated
      search targets, so it named the scalar STQ as a target and required a match against a
      load that has no address yet. Forwarding is now load-initiated. Superseded by
      spec-memord.a18, a19 and a21.

  - id: spec-memord.a17
    statement: >
      A store-address match on a younger not-yet-executed vector load must forward the data
      when both the store and the load are unit-stride.
    retired_because: >
      Same 2026-07-31 correction as spec-memord.a16 — the search direction was wrong. The
      surviving obligation, that vector-to-vector forwarding is US-to-US only, is reissued as
      spec-memord.b14.

  - id: spec-memord.a11
    statement: >
      Scalar load/store versus scalar store/load disambiguation must be unchanged from |boom|.
    retired_because: >
      A scope statement ("Scalar LD/ST vs. scalar ST/LD. Unchanged from BOOM."). Nothing is added, so nothing can be tagged; better recorded as a note on spec-memord.a3.

  - id: spec-memord.f12
    statement: >
      Fence ordering must be established before the fence enters the machine.
    retired_because: >
      Marked by the spec's own connective as a derived consequence ("Ordering is therefore established before the fence ever enters the machine"). A theorem about the design, not an obligation on it.

  - id: spec-memord.f13
    statement: >
      Every vector store older than a dispatching fence must already have committed.
    retired_because: >
      Marked by the spec's own connective as a derived consequence ("at dispatch the ROB is empty, so every older vector store has already committed").

  - id: spec-memord.f4
    statement: >
      The design must order vector memory ops at fences without adding any mechanism.
    retired_because: >
      The rationale half of its sentence ("without adding any mechanism"). No line of RTL implements the absence of a mechanism; the obligation is spec-memord.f5.

  - id: spec-memord.a8
    statement: >
      A load address must be searched against the scalar STQ.
    retired_because: >
      loadstore.rst "Memory Ordering and Disambiguation" was rewritten on 2026-07-31. LD-to-ST
      forwarding does not exist in Caracal, and the bullet that specified it was replaced by a
      second ST-to-LD bullet, so no load-initiated search of store queues remains in the spec.

  - id: spec-memord.a9
    statement: >
      A load address must be searched against the vector store address queues.
    retired_because: >
      loadstore.rst "Memory Ordering and Disambiguation" was rewritten on 2026-07-31. LD-to-ST
      forwarding does not exist in Caracal, and the bullet that specified it was replaced by a
      second ST-to-LD bullet, so no load-initiated search of store queues remains in the spec.

  - id: spec-memord.a10
    statement: >
      Forwarded vector store data must be read from the ``st_*_DATA_Q`` rather than from a
      scalar STQ data field.
    retired_because: >
      The "not from a scalar STQ data field" clause was dropped in the 2026-07-31 rewrite of
      loadstore.rst "Memory Ordering and Disambiguation". The surviving obligation, that
      forwarded data comes from st_*_DATA_Q, is reissued as spec-memord.a15.

