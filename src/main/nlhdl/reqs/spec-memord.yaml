        ``vec_lsu_empty`` asserts when **all** vector LSU state is empty: the four address
        queues (``ld_SSI_ADDR_Q``, ``st_SSI_ADDR_Q``, ``ld_US_ADDR_Q``, ``st_US_ADDR_Q``), both
        store data queues (``st_SSI_DATA_Q``, ``st_US_DATA_Q``), and the Load Coalescing Buffer
        (:ref:`load-coalesce`).
    notes: >
      The LCB is spec-lsu group e. The spec's stated reason for the conservative definition is
      that the wait happens at dispatch with the ROB already empty, so the drain is bounded;
      the deadlock in the section's danger block came from waiting at the ROB head, not from
      the breadth of the condition.

