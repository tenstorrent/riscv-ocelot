  # What the mirror poison does and does not gate, resolved 2026-08-01.

  - id: spec-decode.g12
    kind: function
    statement: >
      The mirror poison must gate vtype-dependent uOPs only.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-csr-ownership
      heading: "Vector architectural state: ownership boundary"
      quote: >
        The poison gates **vtype-dependent** uOPs only.
    notes: >
      Resolved 2026-08-01. The complement is spec-decode.g13; the trap obligation for
      vtype-dependent uOPs is spec-decode.g6.

  - id: spec-decode.g13
    kind: function
    statement: >
      A whole-register move, load or store must decode and execute normally while the mirror is
      poisoned.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-csr-ownership
      heading: "Vector architectural state: ownership boundary"
      quote: >
        A **whole-register** move, load or store
        (``vmv<n>r.v``, ``vl<n>r.v``, ``vs<n>r.v``) decodes and executes normally while the mirror is
        poisoned, because it takes its ``EMUL`` from the ``NREG`` field of its own encoding rather than
        from the mirror
    notes: >
      The spec's reason is that EMUL comes from the encoding's NREG field, so the
      garbage-sized-PRN-group hazard the poison exists to prevent cannot arise. It also records
      that this keeps vector state restorable after a vill, which is what these instructions are
      for; that is rationale, not a separate obligation.

  # --- h: VCFG mirror snapshot and recovery -----------------------------------

  - id: spec-decode.h1
    kind: function
    statement: >
      The speculative VCFG mirror must be updated in program order as vset* uOPs decode.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        The VCFG mirror is **speculative decode-time state**: it is updated in program order
        as ``vset*`` uop's decode, and every younger vector uop snapshots its ``vtype`` into
        its ``vconfig``.

  - id: spec-decode.h2
    kind: structure
    statement: >
      The VCFG mirror must have the same recovery machinery as the rename map table.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        The mirror therefore needs the **same recovery machinery as the RMT**, not just the
        RMT itself.

  - id: spec-decode.h3
    kind: structure
    statement: >
      The design must contain a speculative VCFG mirror holding the working vtype copy
      updated at decode.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        **Speculative VCFG mirror** — the working ``vtype`` copy updated at decode.

  - id: spec-decode.h4
    kind: structure
    statement: >
      The design must contain a committed VCFG shadow.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        **Committed VCFG shadow** — updated **only** by the ROB when a ``vset*`` uop commits
        (the same retire event that writes the architectural ``vtype`` CSR; ``vl`` is
        committed via the VL register file's commit path).

  - id: spec-decode.h5
    kind: function
    statement: >
      The committed VCFG shadow must be updated only by the ROB when a vset* uOP commits.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        **Committed VCFG shadow** — updated **only** by the ROB when a ``vset*`` uop commits
        (the same retire event that writes the architectural ``vtype`` CSR; ``vl`` is
        committed via the VL register file's commit path).

  - id: spec-decode.h6
    kind: structure
    statement: >
      The design must contain a maxBrCount-deep per-br_tag snapshot array of the speculative
      VCFG mirror.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        **Per-``br_tag`` snapshot** — on the same ``ren_br_tags`` allocation event that
        snapshots the scalar/vector RMTs, the speculative mirror is snapshotted into a
        ``maxBrCount``-deep array (≈9 bits/entry — ``vtype`` only — small).

  - id: spec-decode.h7
    kind: timing
    statement: >
      The speculative VCFG mirror must be snapshotted on the same ren_br_tags allocation
      event that snapshots the scalar and vector RMTs.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        **Per-``br_tag`` snapshot** — on the same ``ren_br_tags`` allocation event that
        snapshots the scalar/vector RMTs, the speculative mirror is snapshotted into a
        ``maxBrCount``-deep array (≈9 bits/entry — ``vtype`` only — small).

  - id: spec-decode.h8
    kind: function
    statement: >
      On a branch mispredict the speculative VCFG mirror must be restored from
      vcfg_snapshots(br_tag).
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        * - Branch mispredict - ``vcfg_snapshots(br_tag)`` - 1 cycle, restores the speculative
        mirror in lockstep with the RMT restore

  - id: spec-decode.h9
    kind: timing
    statement: >
      The branch-mispredict restore of the speculative VCFG mirror must complete in one
      cycle, in lockstep with the RMT restore.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        * - Branch mispredict - ``vcfg_snapshots(br_tag)`` - 1 cycle, restores the speculative
        mirror in lockstep with the RMT restore

  - id: spec-decode.h10
    kind: function
    statement: >
      On an exception or pipeline flush the speculative VCFG mirror must be restored from the
      committed VCFG shadow.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        * - Exception / pipeline flush - committed VCFG shadow - 1 cycle, parallel to
        ``map_table := com_map_table``

  - id: spec-decode.h11
    kind: timing
    statement: >
      The flush restore of the speculative VCFG mirror must complete in one cycle, in
      parallel with map_table := com_map_table.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        * - Exception / pipeline flush - committed VCFG shadow - 1 cycle, parallel to
        ``map_table := com_map_table``

  - id: spec-decode.h12
    kind: function
    statement: >
      The per-br_tag VCFG snapshot must be sourced from the branch's carried vconfig.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        The per-``br_tag`` snapshot is therefore sourced from the **branch's carried
        ``vconfig``** — the nearest-preceding-``vset`` value from the per-lane prefix select —
        captured on the same ``ren_br_tags`` event as the RMT snapshots, so it reflects all
        ``vset*`` updates older than the branch in program order without any
        delayed-``br_tag`` path.

  - id: spec-decode.h13
    kind: structure
    statement: >
      The per-br_tag VCFG snapshot must not require a delayed-br_tag path.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        The per-``br_tag`` snapshot is therefore sourced from the **branch's carried
        ``vconfig``** — the nearest-preceding-``vset`` value from the per-lane prefix select —
        captured on the same ``ren_br_tags`` event as the RMT snapshots, so it reflects all
        ``vset*`` updates older than the branch in program order without any
        delayed-``br_tag`` path.

  # What the per-br_tag snapshot contains, resolved 2026-08-01.

  - id: spec-decode.h14
    kind: structure
    statement: >
      The per-``br_tag`` VCFG snapshot must contain ``vlmul[2:0]``, ``vsew[2:0]``, ``vta``,
      ``vma`` and ``vill``.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        Those nine bits are
        ``vlmul[2:0]``, ``vsew[2:0]``, ``vta``, ``vma`` and **``vill``**
    notes: >
      Resolved 2026-08-01. The nine bits were already stated as the snapshot size
      (spec-decode.h8); this enumerates them. The count is what settled the question: eight
      config bits plus vill is exactly nine.

  - id: spec-decode.h15
    kind: structure
    statement: >
      The poison flag must be a field of the mirrored ``vtype`` rather than a bit beside it.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vcfg-recovery
      heading: "VCFG Mirror Recovery (speculative vtype)"
      quote: >
        the poison flag is a *field of
        the mirrored ``vtype``*, not a bit beside it, so it is snapshotted and restored with the rest and
        needs no recovery path of its own.
    notes: >
      Consistent with the ownership table, which assigns rocket's CSRFile "vtype including
      vill" (spec-decode.g1) — the mirror shadows the same field. That the poison therefore
      needs no recovery path of its own is a consequence, not a separate obligation: the
      snapshot and restore obligations are spec-decode.h9 and h11.

  # --- i: VL renaming and delivery -------------------------------------------

  - id: spec-decode.i1
    kind: structure
    statement: >
      VL must be renamed into a dedicated VL register file rather than the integer register
      file.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        VL is renamed into a dedicated **VL register file**, not the integer RF

  - id: spec-decode.i2
    kind: function
    statement: >
      A VL-producing instruction must allocate a fresh VL PRN.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        A VL-producing instruction allocates a fresh ``VL`` PRN, writes the new VL value into
        the VL RF, and broadcasts ``pvl`` on the VL wakeup network.

  - id: spec-decode.i3
    kind: function
    statement: >
      A VL-producing instruction must write the new VL value into the VL register file.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        A VL-producing instruction allocates a fresh ``VL`` PRN, writes the new VL value into
        the VL RF, and broadcasts ``pvl`` on the VL wakeup network.

  - id: spec-decode.i4
    kind: interface
    statement: >
      A VL-producing instruction must broadcast pvl on the VL wakeup network.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        A VL-producing instruction allocates a fresh ``VL`` PRN, writes the new VL value into
        the VL RF, and broadcasts ``pvl`` on the VL wakeup network.

  - id: spec-decode.i5
    kind: interface
    statement: >
      Every younger vector uOP must carry the current pvl from the VL map table as an
      implicit operand.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        Every younger vector uOP carries the current ``pvl`` (from the VL map table at rename)
        as an implicit operand, woken on the **VL** wakeup network and read from the VL RF by
        the vector EU at execute.

  - id: spec-decode.i6
    kind: function
    statement: >
      Every younger vector uOP must be woken on the VL wakeup network.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        Every younger vector uOP carries the current ``pvl`` (from the VL map table at rename)
        as an implicit operand, woken on the **VL** wakeup network and read from the VL RF by
        the vector EU at execute.

  - id: spec-decode.i7
    kind: interface
    statement: >
      The vector execution unit must read VL from the VL register file at execute.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        Every younger vector uOP carries the current ``pvl`` (from the VL map table at rename)
        as an implicit operand, woken on the **VL** wakeup network and read from the VL RF by
        the vector EU at execute.

  - id: spec-decode.i8
    kind: structure
    statement: >
      The VL map table must be branch-snapshotted per br_tag.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        The VL map table is branch-snapshotted per ``br_tag`` and restored on mispredict, so a
        vset on a squashed path does not corrupt the VL mapping of the surviving path.

  - id: spec-decode.i9
    kind: function
    statement: >
      The VL map table must be restored on a branch mispredict.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        The VL map table is branch-snapshotted per ``br_tag`` and restored on mispredict, so a
        vset on a squashed path does not corrupt the VL mapping of the surviving path.

  - id: spec-decode.i10
    kind: function
    statement: >
      For a vsetvli with rs1 == x0 and rd != x0, VL must be VLMAX computed from vtype.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        ``rs1 == x0, rd != x0`` → VL = VLMAX; the producer computes VLMAX from ``vtype`` and
        writes the VL RF (no decode-time fast path).

  - id: spec-decode.i11
    kind: function
    statement: >
      For a vsetvli with rs1 == x0 and rd == x0, VL must be kept unchanged.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        ``rs1 == x0, rd == x0`` → **keep VL unchanged**; *not* a VL producer, so the VL map
        table is left untouched and younger uOPs keep the existing ``pvl``.

  - id: spec-decode.i12
    kind: function
    statement: >
      For a vsetvli with rs1 == x0 and rd == x0, the VL map table must be left untouched.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        ``rs1 == x0, rd == x0`` → **keep VL unchanged**; *not* a VL producer, so the VL map
        table is left untouched and younger uOPs keep the existing ``pvl``.

  - id: spec-decode.i13
    kind: function
    statement: >
      A vsetvli with rs1 == x0 and rd == x0 whose vtype changes VLMAX must set vill.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        **Reserved case:** using this form with a ``vtype`` whose ``SEW``/``LMUL`` ratio
        changes ``VLMAX`` is a reserved encoding per RVV 1.0 §6.2; |caracal| sets ``vill``

  - id: spec-decode.i14
    kind: function
    statement: >
      A vsetvli with rd == x0 that changes VL must still allocate a VL PRN to hold VL.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        Otherwise (``rd == x0`` with a VL change) a VL PRN is still allocated to hold VL.

  - id: spec-decode.i15
    kind: function
    statement: >
      Every VL-producing case must set the is_vl_producer bit.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        Every producing case sets the ``is_vl_producer`` bit described in
        :ref:`the dual-destination rule <vset-dual-dest>`; the
        non-producing case above leaves it clear.

  - id: spec-decode.i16
    kind: function
    statement: >
      The non-producing vsetvli case must leave the is_vl_producer bit clear.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        Every producing case sets the ``is_vl_producer`` bit described in
        :ref:`the dual-destination rule <vset-dual-dest>`; the
        non-producing case above leaves it clear.

  - id: spec-decode.i17
    kind: structure
    statement: >
      There must be no statically-known-VL path that bypasses the VL register file.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        In every producing case VL is written to the VL RF and read back via ``pvl`` — there
        is no statically-known-VL path that bypasses the VL RF.

  - id: spec-decode.i18
    kind: interface
    statement: >
      Vector consumers must read VL only from the VL register file.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vl-delivery
      heading: "VL delivery — VL lives in its own register file"
      quote: >
        In all producing cases, when ``rd != x0`` the ``vset`` also writes ``rd`` as an
        ordinary integer destination (normal, unmodified integer rename); vector consumers
        read VL only from the VL RF.

