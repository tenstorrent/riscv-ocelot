  - id: spec-decode.g5
    kind: function
    statement: >
      The rocket CSRFile must implement the VS=Off illegal-instruction gate.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-csr-ownership
      heading: "Vector architectural state: ownership boundary"
      quote: >
        **``mstatus.VS``/``sstatus.VS``** — dirty tracking on any write to vector state, plus
