family: decode
description: >
  The frontend: fetch-stage equivalence to BOOM v4, RVV opcode decode, vset handling,
  the speculative VCFG vtype mirror and its recovery, VL renaming and delivery, and
  vector-CSR access legality.
spec_sources:
  - docs_caracal/src/frontend.rst

groups:
  a: decoder structure, machine parameters, and BOOM-v4 equivalence
  b: shared-instruction (is_shared) decoding
  c: where each vset executes, and the dual-destination rule
  d: the speculative VCFG vtype mirror and EMUL derivation
  e: vsetvl serialization
  f: explicit vector-CSR accesses
  g: vector architectural state ownership boundary
  h: VCFG mirror snapshot and recovery
  i: VL renaming and delivery

reqs:

  # --- a: decoder structure, machine parameters, BOOM-v4 equivalence ----------

  - id: spec-decode.a1
    kind: structure
    statement: >
      The frontend must include two stages, an instruction fetch stage and a decoder.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: frontend-stages
      heading: "The Frontend Stages"
      quote: >
        The frontend includes 2 stages the Instruction Fetch and Decoder. Nominally the IF
        should consume 5 cycles and the Decoder 1 cycle, with support for super-scalar issue.
    notes: >
      The nominal 5-cycle fetch / 1-cycle decode figures in the quoted sentence were ruled
      non-normative on 2026-07-31 — "nominally ... should" describes the inherited BOOM v4
      pipeline depth rather than imposing a new obligation, so no timing requirement is
      recorded from them. Super-scalar decode is captured as a must by spec-decode.a5.

  - id: spec-decode.a2
    kind: structure
    statement: >
      The instruction fetch stage must be unchanged from BOOM v4.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: frontend-fetch
      heading: "Instruction Fetch"
      quote: >
        The Instruction fetch stage is unchanged from BOOMv4.

  - id: spec-decode.a3
    kind: function
    statement: >
      The decoder must decode the RVV 1.0 instruction opcodes.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "Vector (RVV) Decode"
      quote: >
        The Decoder is extended to support RVV1.0 instruction opcodes.

  - id: spec-decode.a4
    kind: structure
    statement: >
      The decoder must be a single-cycle combinational module that produces the decoded uOP
      packet bundle.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "Vector (RVV) Decode"
      quote: >
        The decoder itself is single cycle combinational module which produces the decoded
        uOP packet bundle.

  - id: spec-decode.a5
    kind: structure
    statement: >
      The decoder must maintain parameterizable super-scalar decode support.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "Vector (RVV) Decode"
      quote: >
        For |caracal|, parameterizable super-scalar decoder support is also maintained.

  - id: spec-decode.a6
    kind: function
    statement: >
      The decoder must not perform any instruction cracking or micro-op expansion.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "Vector (RVV) Decode"
      quote: >
        The decoder does not perform any cracking or micro-op expansion; all instructions,
        including vector instructions, are decoded into a single uOP.

  - id: spec-decode.a7
    kind: function
    statement: >
      The decoder must decode every instruction, including every vector instruction, into a
      single uOP.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "Vector (RVV) Decode"
      quote: >
        The decoder does not perform any cracking or micro-op expansion; all instructions,
        including vector instructions, are decoded into a single uOP.

  - id: spec-decode.a8
    kind: structure
    statement: >
      VLEN must be 256.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "Vector (RVV) Decode"
      quote: >
        * - VLEN - 256

  - id: spec-decode.a9
    kind: structure
    statement: >
      ELEN must be 64.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "Vector (RVV) Decode"
      quote: >
        * - ELEN - 64

  - id: spec-decode.a10
    kind: structure
    statement: >
      The supported SEW values must be 8, 16, 32 and 64.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "Vector (RVV) Decode"
      quote: >
        * - Supported SEW(s) - 8, 16, 32, 64

  - id: spec-decode.a11
    kind: structure
    statement: >
      The supported LMUL values must be 1/8, 1/4, 1/2, 1, 2, 4 and 8, subject to VLMAX >= 1.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "Vector (RVV) Decode"
      quote: >
        ``1/8, 1/4, 1/2, 1, 2, 4, 8`` — subject to ``VLMAX ≥ 1``.

  - id: spec-decode.a12
    kind: function
    statement: >
      A vtype whose SEW/LMUL combination gives VLMAX = VLEN*LMUL/SEW < 1 must set vill.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "Vector (RVV) Decode"
      quote: >
        A ``vtype`` whose ``SEW``/``LMUL`` combination gives ``VLMAX = VLEN*LMUL/SEW < 1``
        is **reserved** and sets ``vill``

  - id: spec-decode.a13
    kind: function
    statement: >
      A vtype with SEW greater than ELEN must set vill.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "Vector (RVV) Decode"
      quote: >
        ``SEW > ELEN`` and the reserved ``vlmul=3'b100`` encoding likewise set ``vill``.

  - id: spec-decode.a14
    kind: function
    statement: >
      The reserved vlmul=3'b100 encoding must set vill.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "Vector (RVV) Decode"
      quote: >
        ``SEW > ELEN`` and the reserved ``vlmul=3'b100`` encoding likewise set ``vill``.

  # --- b: shared-instruction (is_shared) decoding -----------------------------

  - id: spec-decode.b1
    kind: function
    statement: >
      The decoder must mark as is_shared every instruction that requires shared resources
      between the vector load/store unit and the vector coprocessor.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "CII Shared Instruction Decoding"
      quote: >
        Certain instructions may require shared resources between the vector load store units
        and the vector co-processor. These instructions are marked as *is_shared* by the
        Decoder and require special handling.

  - id: spec-decode.b2
    kind: function
    statement: >
      The decoder must mark only segmented load/store instructions as is_shared.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "CII Shared Instruction Decoding"
      quote: >
        Currently the only instruction type that will be marked *is_shared* is the segmented
        load store.

  - id: spec-decode.b3
    kind: function
    statement: >
      The decoder must mark only RVV 1.0 instructions as is_shared.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "CII Shared Instruction Decoding"
      quote: >
        Shared instructions are only applicable to RVV1.0 instructions as only the CII
        attached co-processor may want to read intermediate results from the LSU and
        vice-versa.

  - id: spec-decode.b4
    kind: structure
    statement: >
      A shared instruction must hand off its partial results between the LSU and the
      coprocessor through an intermediate temp vector group pvtmp.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "CII Shared Instruction Decoding"
      quote: >
        The primary differentiator for shared instructions is their use of an intermediate
        temp vector group (``pvtmp``, allocated in the VRF by the vector mapper) to hand off
        partial results between the LSU and Co-processor.
    notes: >
      Allocation of pvtmp is a rename-stage obligation and is left to spec-rename, which
      mines midcore.rst §"CII Shared Instruction Mapping". This requirement covers only the
      decode-visible fact that the handoff goes through pvtmp.

  # --- c: where each vset executes, and the dual-destination rule -------------

  - id: spec-decode.c1
    kind: function
    statement: >
      The VCFG must resolve vsetivli at decode in a single cycle.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        Only ``vsetivli`` is **front-end only**: both VTYPE and AVL are immediate, so the VCFG
        resolves it at decode in a single cycle — updating the ``vtype`` mirror and computing
        ``VL = min(uimm, VLMAX)`` — with **no back-end issue slot or EU**.

  - id: spec-decode.c2
    kind: function
    statement: >
      The VCFG must compute a vsetivli's VL as min(uimm, VLMAX).
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        Only ``vsetivli`` is **front-end only**: both VTYPE and AVL are immediate, so the VCFG
        resolves it at decode in a single cycle — updating the ``vtype`` mirror and computing
        ``VL = min(uimm, VLMAX)`` — with **no back-end issue slot or EU**.

  - id: spec-decode.c3
    kind: structure
    statement: >
      A vsetivli must not occupy a back-end issue slot or execution unit.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        Only ``vsetivli`` is **front-end only**: both VTYPE and AVL are immediate, so the VCFG
        resolves it at decode in a single cycle — updating the ``vtype`` mirror and computing
        ``VL = min(uimm, VLMAX)`` — with **no back-end issue slot or EU**.

  - id: spec-decode.c4
    kind: timing
    statement: >
      A vsetivli's computed VL must be written to VL_RF[pvl] in the rename cycle, not at
      decode.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        The computed VL is written to ``VL_RF[pvl]`` in the **rename** cycle, not at decode

  - id: spec-decode.c5
    kind: function
    statement: >
      A vsetivli's VL-register-file write must set no busy bit.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        The write sets **no** busy bit — a ``vsetivli``'s ``pvl`` is *born ready*, so a
        dependent vector uOP in the same or the next dispatch group never waits on it.

  - id: spec-decode.c6
    kind: structure
    statement: >
      A vsetivli's ROB entry must be dispatched non-busy.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        Because the uop has no writeback, its ROB entry is dispatched **non-busy** and commits
        as soon as it reaches the head (where it writes the architectural ``vtype``/``vl`` and
        the committed VCFG shadow).

  - id: spec-decode.c7
    kind: structure
    statement: >
      A vsetvli or vsetvl must execute on an integer ALU execution unit.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        ``vsetvli`` (register AVL) and ``vsetvl`` (register VTYPE and AVL) **execute on an
        integer ALU EU**, because their VL (and ``vsetvl``'s VTYPE) depends on a runtime
        register value.

  - id: spec-decode.c8
    kind: structure
    statement: >
      A vsetvli or vsetvl must be dispatched to a scalar integer issue queue.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        They are dispatched to a scalar integer issue queue and woken by ``rs1`` (and ``rs2``
        for ``vsetvl``) on the **integer** wakeup network like any integer op

  - id: spec-decode.c9
    kind: function
    statement: >
      A vsetvli must be woken by rs1, and a vsetvl by rs1 and rs2, on the integer wakeup
      network.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        They are dispatched to a scalar integer issue queue and woken by ``rs1`` (and ``rs2``
        for ``vsetvl``) on the **integer** wakeup network like any integer op

  - id: spec-decode.c10
    kind: function
    statement: >
      The integer ALU must compute a register-sourced vset's VL as min(rs1, VLMAX).
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        the ALU reads the source(s) from the integer RF/bypass, computes
        ``VL = min(rs1, VLMAX)`` (and VTYPE for ``vsetvl``), and on writeback **targets the VL
        RF** and drives the **VL wakeup network** (``pvl``).

  - id: spec-decode.c11
    kind: function
    statement: >
      The integer ALU must compute VTYPE for a vsetvl.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        the ALU reads the source(s) from the integer RF/bypass, computes
        ``VL = min(rs1, VLMAX)`` (and VTYPE for ``vsetvl``), and on writeback **targets the VL
        RF** and drives the **VL wakeup network** (``pvl``).

  - id: spec-decode.c12
    kind: function
    statement: >
      When rd is not x0 the integer ALU must additionally write rd in the integer register
      file for a register-sourced vset.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        When ``rd != x0`` the ALU additionally writes ``rd`` in the integer RF as normal.

  - id: spec-decode.c13
    kind: structure
    statement: >
      The design must not add a dedicated VCFG wakeup network.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        No dedicated VCFG wakeup network is added — a register-sourced vset consumes the
        integer network and produces on the VL network.

  - id: spec-decode.c14
    kind: structure
    statement: >
      The integer-ALU VL/VTYPE compute and VL-RF writeback extension must be gated by
      usingRVV.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        This integer-ALU extension (VL/VTYPE compute + VL-RF writeback) is **gated by
        ``usingRVV``**: with the switch off, the ALU is bit-identical to |boom| v4.

  - id: spec-decode.c15
    kind: structure
    statement: >
      With usingRVV off the integer ALU must be bit-identical to BOOM v4.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        This integer-ALU extension (VL/VTYPE compute + VL-RF writeback) is **gated by
        ``usingRVV``**: with the switch off, the ALU is bit-identical to |boom| v4.

  - id: spec-decode.c16
    kind: structure
    statement: >
      A register-sourced vset must have two destinations in two independent rename spaces,
      pdst in the integer register file and pvl in the VL register file.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vset-dual-dest
      heading: "VSET Special Handling"
      quote: >
        A register-sourced ``vset`` is **not** an ordinary integer-ALU uop: it has **two
        destinations in two independent rename spaces** — ``pdst`` in the integer RF and
        ``pvl`` in the VL RF.

  - id: spec-decode.c17
    kind: interface
    statement: >
      A register-sourced vset must write the new vl value to rd.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vset-dual-dest
      heading: "VSET Special Handling"
      quote: >
        What makes this cheap is that ``rd`` receives the *new* ``vl``, so both destinations
        take the **same value** off one result bus.

  - id: spec-decode.c18
    kind: structure
    statement: >
      The MicroOp must carry an is_vl_producer bit that is orthogonal to dst_rtype.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vset-dual-dest
      heading: "VSET Special Handling"
      quote: >
        a **new ``is_vl_producer`` bit** on the ``MicroOp``, orthogonal to ``dst_rtype``;

  - id: spec-decode.c19
    kind: interface
    statement: >
      Writeback must fan out to the integer register file when dst_rtype === RT_FIX.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vset-dual-dest
      heading: "VSET Special Handling"
      quote: >
        writeback fans out to the integer RF when ``dst_rtype === RT_FIX`` **and** to the VL
        RF when ``is_vl_producer``;

  - id: spec-decode.c20
    kind: interface
    statement: >
      Writeback must fan out to the VL register file when is_vl_producer is set.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vset-dual-dest
      heading: "VSET Special Handling"
      quote: >
        writeback fans out to the integer RF when ``dst_rtype === RT_FIX`` **and** to the VL
        RF when ``is_vl_producer``;

  - id: spec-decode.c21
    kind: function
    statement: >
      Rename must set both busy bits for a register-sourced vset, integer busy for pdst and
      VL busy for pvl.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vset-dual-dest
      heading: "VSET Special Handling"
      quote: >
        rename sets **both** busy bits — integer busy for ``pdst``, VL busy for ``pvl`` — and
        both wakeup networks fire;

  - id: spec-decode.c22
    kind: function
    statement: >
      Both wakeup networks must fire for a register-sourced vset.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vset-dual-dest
      heading: "VSET Special Handling"
      quote: >
        rename sets **both** busy bits — integer busy for ``pdst``, VL busy for ``pvl`` — and
        both wakeup networks fire;

  - id: spec-decode.c23
    kind: function
    statement: >
      Commit must free a register-sourced vset's stale integer pdst through the normal
      integer free path.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vset-dual-dest
      heading: "VSET Special Handling"
      quote: >
        commit runs **both** free paths — the stale integer ``pdst`` through the normal path,
        and the outgoing committed VL pointer through the VL path.

  - id: spec-decode.c24
    kind: function
    statement: >
      Commit must free a register-sourced vset's outgoing committed VL pointer through the VL
      free path.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vset-dual-dest
      heading: "VSET Special Handling"
      quote: >
        commit runs **both** free paths — the stale integer ``pdst`` through the normal path,
        and the outgoing committed VL pointer through the VL path.

  - id: spec-decode.c25
    kind: interface
    statement: >
      dst_rtype must keep its unmodified integer meaning end to end.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vset-dual-dest
      heading: "VSET Special Handling"
      quote: >
        ``dst_rtype`` therefore keeps its unmodified integer meaning end to end, which is what
        "integer rename is not modified" actually requires.

  - id: spec-decode.c26
    kind: function
    statement: >
      A vsetivli must be renamed like any other VL producer, with no decode-time VL fast
      path.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        **vsetivli** has an immediate VTYPE and AVL: VTYPE updates the VCFG mirror at decode,
        and the computed VL (``min(AVL, VLMAX)``) is written to the VL register file and
        renamed (``pvl``) like any VL producer — there is no decode-time VL fast path.

  # VL-RF write-port arbitration, resolved 2026-08-01.

  - id: spec-decode.c27
    kind: structure
    statement: >
      VL-RF write ports must be statically partitioned rather than arbitrated.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        **VL-RF write ports are statically partitioned, not arbitrated**, so this rename-cycle
        write never contends with a writeback.
    notes: >
      Resolved 2026-08-01. Same discipline as the VRF (spec-vrf's port partition). The spec's
      stated reason it matters: the ALU and LSU writeback paths have no back-pressure line, so
      a producer that could stall on a VL-RF port would have nowhere to hold the write.

  - id: spec-decode.c28
    kind: structure
    statement: >
      The VL RF must provide one write port per producer class.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        There is one write port per producer class: the **rename-side** port,
        replicated per rename lane because one dispatch bundle may hold several ``vsetivli``; the
        **integer-ALU writeback** port for ``vsetvli``/``vsetvl``; and the **LSU writeback** port for
        ``vleff``'s trimmed VL.
    notes: >
      The three producer classes are the rename-side vsetivli write (spec-decode.c9), the
      integer-ALU writeback for vsetvli/vsetvl, and the LSU writeback for vleff. The spec notes
      the ports are nearly free because the VL RF is 64 entries of about 9 bits; that sizing is
      spec-rename group h.

  - id: spec-decode.c29
    kind: structure
    statement: >
      The rename-side VL-RF write port must be replicated per rename lane.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        the **rename-side** port,
        replicated per rename lane because one dispatch bundle may hold several ``vsetivli``
    notes: >
      Needed because a single dispatch bundle may hold several vsetivli, each allocating its own
      pvl and each write being readable by a uop between them in the bundle.

  # --- d: the speculative VCFG vtype mirror and EMUL derivation ---------------

  - id: spec-decode.d1
    kind: interface
    statement: >
      Every uOP emitted by the decoder must contain the calculated EMUL of the instruction.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        Thus all uOP's emitted by the decoder must contain the calculated EMUL of the
        instruction.

  - id: spec-decode.d2
    kind: structure
    statement: >
      The design must contain a Vector Config Unit.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        We introduce a new unit called **Vector Config Unit**.

  - id: spec-decode.d3
    kind: structure
    statement: >
      The VCFG must keep a local copy of the VTYPE value set by a vset instruction.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        The VCFG keeps a local copy of the **VTYPE** value set by a vset instruction, so that
        dependent, subsequent instructions can derive ``EMUL`` and snapshot ``vtype`` into the
        uOP at decode.

  - id: spec-decode.d4
    kind: function
    statement: >
      The decoder must snapshot vtype into the uOP at decode.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        The VCFG keeps a local copy of the **VTYPE** value set by a vset instruction, so that
        dependent, subsequent instructions can derive ``EMUL`` and snapshot ``vtype`` into the
        uOP at decode.

  - id: spec-decode.d5
    kind: structure
    statement: >
      The VCFG must not mirror vl.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        The VCFG
        mirrors only ``vtype`` — it does **not** mirror ``vl``
    notes: >
      Re-quoted on 2026-08-01 when "(plus vector performance counters)" was struck from the
      sentence. No counter was ever named, owned, or given a recovery story, and none is
      referenced elsewhere; the VCFG is exactly the vtype mirror. The obligation this
      requirement states is unchanged.

  - id: spec-decode.d6
    kind: interface
    statement: >
      The decoder must not snapshot vstart, vxrm or vxsat into the uOP.
    source:
      file: docs_caracal/src/frontend.rst
