    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-csr-ownership
      heading: "Vector architectural state: ownership boundary"
      quote: >
        a ``vill``-setting ``vset`` must mark the mirror invalid so every younger
        vtype-dependent vector uOP raises illegal-instruction **at decode**, rather than
        allocating a garbage-sized PRN group.

  - id: spec-decode.g10
    kind: function
    statement: >
      A vsetivli or vsetvli must poison the VCFG mirror directly at decode from its immediate
      vtype.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-csr-ownership
      heading: "Vector architectural state: ownership boundary"
      quote: >
        For ``vsetivli``/``vsetvli`` the vtype is immediate, so ``vill`` is known at decode
        and poisons the mirror directly
    notes: >
      The vsetvl half of the same sentence needs no extra mechanism because flush_on_commit
