  # --- e: vsetvl serialization -----------------------------------------------

  - id: spec-decode.e1
    kind: function
    statement: >
      A vsetvl must serialize against younger vector uOPs.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        this is why **vsetvli** (VTYPE immediate, EMUL known at decode) need not serialize,
        while **vsetvl** (VTYPE from a register) must.
    notes: >
      The same sentence permits vsetvli not to serialize; that is an allowance, not an
      obligation, so it is not a separate requirement. The reason vsetvl must serialize is
      that the vector mapper needs VTYPE to derive EMUL and allocate the correct number of
      vector PRNs per group.

  - id: spec-decode.e2
    kind: structure
    statement: >
      The design must not rely on is_unique alone to order the vtype mirror against younger
      decode.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        It stalls ``vsetvl`` until all **older** instructions have retired. It says nothing
        about **younger** ones, which dispatch on the very next cycle while ``vsetvl`` is
        still in the ALU.
    notes: >
      From the section's warning block. The failure it rules out is silent group mis-sizing:
      a younger vector uOP decoding against a stale vtype mirror derives the wrong EMUL, and
      because no misprediction is involved the vcfg_snapshots(br_tag) recovery never fires.

  - id: spec-decode.e3
    kind: function
    statement: >
      A vsetvl must be decoded as is_unique.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        |caracal| therefore marks ``vsetvl`` **both ``is_unique`` and ``flush_on_commit``**

  - id: spec-decode.e4
    kind: function
    statement: >
      A vsetvl must be decoded as flush_on_commit.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        |caracal| therefore marks ``vsetvl`` **both ``is_unique`` and ``flush_on_commit``**
    notes: >
      The spec accepts the resulting cost — a drain and a refetch — because vsetvl is not a
      common instruction form.

  - id: spec-decode.e5
    kind: function
    statement: >
      The ALU execution unit must not write the speculative vtype mirror.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-rvv-decode
      heading: "VSET Special Handling"
      quote: >
        The ALU EU **does not write the speculative ``vtype`` mirror**.

  # --- f: explicit vector-CSR accesses ---------------------------------------

  - id: spec-decode.f1
    kind: function
    statement: >
      Every explicit vector-CSR access must be decoded as is_unique.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-csr-explicit
      heading: "Explicit vector-CSR accesses"
      quote: >
        Every **explicit** vector-CSR access — any ``csrr``/``csrw``/``csrrw``-family
        instruction targeting ``vstart``, ``vxrm``, ``vxsat``, ``vcsr``, ``vl``, ``vtype``, or
        ``vlenb`` — is decoded as ``is_unique``, and every such **write** is additionally
        ``flush_on_commit``.

  - id: spec-decode.f2
    kind: function
    statement: >
      Every explicit vector-CSR write must additionally be decoded as flush_on_commit.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-csr-explicit
      heading: "Explicit vector-CSR accesses"
      quote: >
        Every **explicit** vector-CSR access — any ``csrr``/``csrw``/``csrrw``-family
        instruction targeting ``vstart``, ``vxrm``, ``vxsat``, ``vcsr``, ``vl``, ``vtype``, or
        ``vlenb`` — is decoded as ``is_unique``, and every such **write** is additionally
        ``flush_on_commit``.
    notes: >
      Both bits are required: is_unique makes a read return the committed value, but only
      flush_on_commit makes a write take effect before a younger uOP observes it, since
      younger uops dispatch one cycle behind the unique one.

  - id: spec-decode.f3
    kind: interface
    statement: >
      The vector CSRs must assert io.csr_decode.write_flush in the CSRFile.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-csr-explicit
      heading: "Explicit vector-CSR accesses"
      quote: >
        so the requirement is that the vector CSRs assert ``io.csr_decode.write_flush`` in the
        ``CSRFile``

  - id: spec-decode.f4
    kind: function
    statement: >
      Implicit vector-CSR updates must be committed precisely.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-csr-explicit
      heading: "Explicit vector-CSR accesses"
      quote: >
        Implicit updates are unaffected and use their normal paths: ``vtype``/``vl`` from
        ``vset``, ``vstart`` set on a trap, and the sticky ``vxsat`` accumulated by the
        coprocessor — all committed precisely.
    notes: >
      The individual implicit paths named in the quote belong to other families — vstart on
      a trap to spec-lsu, the sticky vxsat accumulation to spec-cii. This requirement covers
      only the precise-commit obligation common to all of them.

