#
#   vill in the VCFG snapshot -> a field of the mirrored vtype; spec-decode.h14, h15. The
#     stated ~9 bits settled it: vlmul[2:0] + vsew[2:0] + vta + vma is eight, plus vill is nine.
#   poison vs vtype-agnostic ops -> whole-register moves/loads/stores run; spec-decode.g12, g13
#   VL-RF write ports         -> statically partitioned, one per producer class;
#     spec-decode.c27-c29
#   "vector performance counters" -> struck from frontend.rst. No counter was named, owned, or
#     given a recovery story, and none is referenced elsewhere, so the phrase was removed rather
#     than specified. spec-decode.d5 was re-quoted; its obligation is unchanged. If vector
#     performance counters are wanted later they are not speculative decode state and do not
#     belong in the VCFG mirror.
