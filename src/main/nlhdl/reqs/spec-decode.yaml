    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-csr-ownership
      heading: "Vector architectural state: ownership boundary"
      quote: >
        The **speculative VCFG ``vtype`` mirror** (decode-stage, branch-snapshotted) and the
        **VL register file** (:ref:`vl-vtype-rename`). Neither is architectural state; both
        are recovered from the committed shadow / committed VL pointer.

  - id: spec-decode.g8
    kind: function
    statement: >
      A vill-setting vset must mark the VCFG mirror invalid.
    source:
      file: docs_caracal/src/frontend.rst
      anchor: vector-csr-ownership
      heading: "Vector architectural state: ownership boundary"
      quote: >
        a ``vill``-setting ``vset`` must mark the mirror invalid so every younger
