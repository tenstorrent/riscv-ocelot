retired:
  - id: spec-agen.d3
    statement: >
      The store vDGEN must read scalar source operands from the FP/INT register file.
    retired_because: >
      execution.rst "Vector DGEN" was corrected under decision D4 and now states that st_vdgen
      reads the vector register file ONLY. The old text cited ``vfmul.vf`` as an example of a
      store DGEN reading an FP scalar, but ``vfmul.vf`` is vector-scalar floating-point
      arithmetic dispatched to the CII and is not a store; no RVV store form takes an FP scalar
      operand at all. The integer half was also mis-attributed: a store's ``rs1`` base and
      ``rs2`` stride are read by st_vagen_1, not by st_vdgen. Both the subject and the register
      file were wrong, so this is retired rather than narrowed. Superseded by spec-agen.d16.

  - id: spec-agen.e3
    statement: >
      The stage 1 Skipper and Walker and the stage 2 US Packer must each read v0 through
      their unit's VRF mask read port.
    retired_because: >
      Having the stage 2 Packer read the VRF gives the load mask port two concurrent readers, a
      US OP.v in stage 2 and an SSI OP.v in stage 1, which midcore.rst §"Port assignment" cannot
      serve because ports are statically partitioned and never arbitrated. Resolved on
      2026-08-03: stage 1 performs the read for every access class and the mask travels with the
      US nOP.v. Superseded by spec-agen.e12 and e13.

  - id: spec-agen.c12
    statement: >
      The Skipper must be used instead of the Packer when a mask is present.
    retired_because: >
      The Packer/Skipper boundary is unit-stride versus not, not masked versus unmasked. As
      written it left an unmasked non-indexed strided access matching no generator's rule, which
      is the open question resolved on 2026-08-03. Superseded by spec-agen.c24.

  - id: spec-agen.c15
    statement: >
      The Walker must serve as the general element-by-element fallback.
    retired_because: >
      Resolved the other way on 2026-08-03. The Walker's per-element offset comes from the index
      interface, and a non-indexed access has no index vector to drive it, so the Skipper is the
      non-indexed generator. execution.rst §"Walker" now says so explicitly. Superseded by
      spec-agen.c25.

  - id: spec-agen.e10
    statement: >
      The mask-derived element cursor must be the single owner of which elements survive.
    retired_because: >
      A design principle ("the mask-derived element cursor must be the single owner of which elements survive") with no distinguishable RTL to tag. The checkable content is spec-agen.e11 (both consumers use the cursor rather than re-evaluating the mask) and spec-agen.e6/e7.

  - id: spec-agen.c4
    statement: >
      The Packer must still fetch masked-off lanes and flag them.
    retired_because: >
      execution.rst "Vector AGEN" gained an explicit mask rule on 2026-07-31 requiring both AGEN
      stages to read the vector mask and suppress address generation for masked-off elements, and
      the Packer bullet was amended to match. Fetching and flagging is now the bobtail behaviour
      the reused unit must be extended away from. Superseded by spec-agen.c23.

  - id: spec-agen.d9
    statement: >
      Each effective address must correspond to one consecutive element of the vPRN.
    retired_because: >
      execution.rst §"Vector DGEN" was amended on 2026-07-31 once AGEN began applying the vector
      mask (spec-agen.e2, e6): with masked-off elements suppressed, the generated addresses are a
      subset of the element stream and no longer correspond to consecutive vPRN elements. The
      DGEN now shares the AGEN's mask-derived element cursor. Superseded by spec-agen.d10, with
      the unmasked case preserved as spec-agen.d15.

# The three questions originally recorded against this family were resolved on 2026-08-03:
#   store-side selection rules -> identical, selection is by access class; spec-agen.c26
#   unmasked non-indexed strided -> the Skipper; c12/c15 retired, spec-agen.c24/c25 issued
#   where the load index/mask are read -> ld_vAGEN_1 on R0/R1; spec-agen.c27-c29
#
# The two VRF port-sharing questions filed here on 2026-08-03 were resolved the same day, once
# the vrf family took up its own open questions against the same port table:
#   store R4 serving mask and index -> sufficient; the mask is read once per OP.v and latched
#     while index members are read as the walk advances, so the two never need one cycle.
#     spec-agen.e14, spec-vrf.g19.
#   R1 with two readers -> stage 1 performs the mask read for every access class including
#     unit-stride, and the mask travels with the US nOP.v; the stage 2 Packer does not read the
#     VRF. spec-agen.e3 retired, spec-agen.e12/e13 issued, spec-vrf.g18.
