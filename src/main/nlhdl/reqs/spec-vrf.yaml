        **9R / 3W** at ``lsuWidth = 2``.
    notes: >
      Supersedes the retired spec-vrf.g12, which stated 9R/3W unconditionally. The 9R/3W figure
      is spec-vrf.g23. The 9R/3W default port count in §"The Vector Register File"
      (spec-vrf.f2/f3) is therefore the lsuWidth = 2 case.

