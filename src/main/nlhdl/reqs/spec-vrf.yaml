family: vrf
description: >
  Vector and VL register files: port assignment and budget, bypass network,
  speculative wakeups, and undisturbed-lane sourcing from stale_pvdest.
spec_sources:
  - docs_caracal/src/midcore.rst

groups:
  a: register-file sizing and physical-register parameterization
  b: vector-PRN capacity as a published architectural limit
  c: where VL, VTYPE and the vector mask live
  d: the vector bypass network and pvtmp in the main VRF
  e: speculative-wakeup policy, split by operand class
  f: VRF construction — flops, banks, ports and read forwarding
  g: the canonical 0-based VRF port assignment
  h: the frozen SV constants behind the coprocessor's ports
  i: undisturbed lanes always come from stale_pvdest
  j: pvs3 versus stale_pvdest, and what the coprocessor pulls

reqs:

  # --- a: register-file sizing and parameterization -----------------------------

  - id: spec-vrf.a1
    kind: structure
    statement: >
      Caracal must make the number of physical registers parameterizable.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        |caracal| shall be configured to support an performant number of physical registers via
        parameterization.
    notes: >
      The per-file default counts the parameterization must ship with are spec-vrf.a2 through
      spec-vrf.a5.

  - id: spec-vrf.a2
    kind: structure
    statement: >
      The integer register file must provide 32 architectural registers with a default of 128
      physical registers.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        * - Register file
        - Architectural regs
        - Physical regs (default)
        * - Integer (INT)
        - 32
        - 128

  - id: spec-vrf.a3
    kind: structure
    statement: >
      The floating-point register file must provide 32 architectural registers with a default of
      128 physical registers.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        * - Floating-point (FP)
        - 32
        - 128
    notes: >
      The third column is "Physical regs (default)" per the table header quoted in spec-vrf.a2.

  - id: spec-vrf.a4
    kind: structure
    statement: >
      The vector register file must provide 32 architectural registers with a default of 96
      physical registers.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        * - Vector (VEC)
        - 32
        - 96
    notes: >
      §"The Vector Register File" restates the 96-PRN default beside the port counts; the port
      obligations are spec-vrf.f1 through spec-vrf.f3. What the 96 implies for in-flight groups is
      spec-vrf.b1 through spec-vrf.b7.

  - id: spec-vrf.a5
    kind: structure
    statement: >
      The VL register file must provide 1 architectural register with a default of 64 physical
      registers.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        * - VL
        - 1
        - 64
    notes: >
      That VL is renamed into its own register file with its own map table, free list and busy
      table is mined by sibling families — spec-decode.i1 and the rename family — so only the
      sizing row is a vrf requirement. Where the VL value is *not* held is spec-vrf.c1.

  # --- b: vector-PRN capacity as a published architectural limit ----------------

  - id: spec-vrf.b2
    kind: structure
    statement: >
      32 of the 96 vector PRNs must always be held by the committed map table.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        32 of the 96
        vector PRNs are always held by the committed map table

  - id: spec-vrf.b3
    kind: structure
    statement: >
      The RMT must map all 32 architectural vector registers at all times, regardless of the
      current LMUL.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        the RMT maps all 32 architectural vregs
        at all times, regardless of the current ``LMUL``
    notes: >
      Stated here as the basis of the capacity derivation; the RMT's own structure and update rules
      are mined by the rename family from §"Rename Map Table (RMT)".

  - id: spec-vrf.b4
    kind: structure
    statement: >
      An LMUL=8 OP.v must take 8 vector PRNs at once.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        an ``LMUL=8`` ``OP.v`` takes 8 at once

  - id: spec-vrf.b6
    kind: structure
    statement: >
      A segmented op must take two vector groups — pvdest plus pvtmp, 16 PRNs.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        a segmented op takes two
        groups (``pvdest`` + ``pvtmp``, 16 PRNs)

  - id: spec-vrf.c1
    kind: structure
    statement: >
      The VL value must not be held in the integer register file.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        The VL value is therefore **not** held in the integer
        RF
    notes: >
      The VL rename space itself — its own map table with maxBrCount snapshots, free list, busy
      table, wakeup network, commit logic and read ports to every vector EU — is mined by
      spec-decode.i1 and the rename family. Its sizing row is spec-vrf.a5.

  - id: spec-vrf.c2
    kind: structure
    statement: >
      A vset's rd GPR write when ``rd != x0`` must be a separate, ordinary integer destination.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        ``vset``'s ``rd`` GPR write (when ``rd != x0``) is a separate, ordinary integer destination and
        is the only integer-RF interaction, leaving integer rename unchanged.

  - id: spec-vrf.c3
    kind: structure
    statement: >
      The vset rd GPR write must be the only integer-register-file interaction of the vector path.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        ``vset``'s ``rd`` GPR write (when ``rd != x0``) is a separate, ordinary integer destination and
        is the only integer-RF interaction, leaving integer rename unchanged.

  - id: spec-vrf.c4
    kind: structure
    statement: >
      Integer rename must be left unchanged.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        ``vset``'s ``rd`` GPR write (when ``rd != x0``) is a separate, ordinary integer destination and
        is the only integer-RF interaction, leaving integer rename unchanged.

  - id: spec-vrf.c5
    kind: structure
    statement: >
      VTYPE must not be renamed.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        ``VTYPE`` is **not** renamed —
        it is held in the VCFG ``vtype`` mirror and carried to the EU in the per-uOP ``VConfig`` snapshot
        (no VTYPE register file).

  - id: spec-vrf.c6
    kind: structure
    statement: >
      VTYPE must be held in the VCFG vtype mirror.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        it is held in the VCFG ``vtype`` mirror and carried to the EU in the per-uOP ``VConfig`` snapshot
    notes: >
      The mirror's speculative update and recovery rules are mined by spec-decode from
      frontend.rst §"VCFG Mirror Recovery (speculative vtype)"; the obligation here is only that
      the mirror, not a register file, is where VTYPE lives.

  - id: spec-vrf.c7
    kind: interface
    statement: >
      VTYPE must be carried to the execution unit in the per-uOP VConfig snapshot.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        it is held in the VCFG ``vtype`` mirror and carried to the EU in the per-uOP ``VConfig`` snapshot

  - id: spec-vrf.c8
    kind: structure
    statement: >
      Caracal must contain no VTYPE register file.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        (no VTYPE register file).

  - id: spec-vrf.c9
    kind: structure
    statement: >
      Caracal must contain no dedicated mask register file.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        |caracal|/|boom| has no dedicated mask **register file**; Vector mask is treated
        like any other vector register, with masking semantics handled in the execution units.

  - id: spec-vrf.c10
    kind: structure
    statement: >
      A vector mask must be treated like any other vector register.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        Vector mask is treated
        like any other vector register, with masking semantics handled in the execution units.

  - id: spec-vrf.c11
    kind: function
    statement: >
      Masking semantics must be handled in the execution units.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        with masking semantics handled in the execution units.

  - id: spec-vrf.b11
    kind: function
    statement: >
      An ``OP.v`` that finds too few free vector PRNs must stall at rename.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "The Register Files and Bypass Network"
      quote: >
        **Nothing enforces the bound explicitly** — it is a consequence of free-list capacity, not a
        credit. At the bound an ``OP.v`` simply finds too few free PRNs and **stalls at rename**, under the
        ordinary all-or-nothing allocation rule (see :ref:`cii-shared-mapping`).
    notes: >
      Resolved 2026-08-03: the in-flight bound of 8 LMUL=8 groups is derived from free-list
      capacity, not enforced by a credit check. The spec states there is no group-credit counter
      and that none should be added, since it would duplicate state the free list holds; that
      absence is not written as a requirement. The rename stall itself is spec-rename.e16 and
      the all-or-nothing rule is spec-rename group e.

  # --- d: the vector bypass network and pvtmp in the main VRF -------------------

  - id: spec-vrf.d1
    kind: structure
    statement: >
      Caracal must implement a vector-pipeline bypass network equivalent to BOOM's integer and FP
      operand forwarding network.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "Vector Bypass Network"
      quote: >
        |boom| supports a full operand forwarding bypass network for the integer and FP pipeline. |caracal|
        implements the equivalent bypass network for the vector pipeline.
    notes: >
      BOOM's existing integer/FP network is cited as the reference point, not as a Caracal
      obligation on its own.

  - id: spec-vrf.d2
    kind: structure
    statement: >
      Caracal must contain no separate temporary register file.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "Vector Bypass Network"
      quote: >
        There is **no separate temporary
        register file**

  - id: spec-vrf.d3
    kind: structure
    statement: >
      Intermediate results for shared instructions must live in the main VRF as the pvtmp group.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "Vector Bypass Network"
      quote: >
        intermediate results for shared instructions live in the main VRF as the
        ``pvtmp`` group

  - id: spec-vrf.d4
    kind: structure
    statement: >
      Every vector execution unit must address pvtmp exactly as it addresses any other vector PRN.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "Vector Bypass Network"
      quote: >
        every vector EU
        addresses ``pvtmp`` exactly as it addresses any other vector PRN

  - id: spec-vrf.d5
    kind: function
    statement: >
      pvtmp reads and writes must go through the existing vector register machinery.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "Vector Bypass Network"
      quote: >
        reads, writes, busy/wakeup, and
        branch/commit reclaim all go through the existing vector register machinery.

  - id: spec-vrf.d6
    kind: function
    statement: >
      pvtmp busy tracking and wakeup must go through the existing vector register machinery.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "Vector Bypass Network"
      quote: >
        reads, writes, busy/wakeup, and
        branch/commit reclaim all go through the existing vector register machinery.
    notes: >
      pvtmp's group-done wakeup of the consuming half of a shared instruction is mined by the
      producer-side families from §"Segmented Load" (lsu) and §"Segmented Store" (cii).

  - id: spec-vrf.d7
    kind: function
    statement: >
      pvtmp branch and commit reclaim must go through the existing vector register machinery.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: regfiles-bypass
      heading: "Vector Bypass Network"
      quote: >
        reads, writes, busy/wakeup, and
        branch/commit reclaim all go through the existing vector register machinery.

  # --- e: speculative-wakeup policy, split by operand class --------------------

  - id: spec-vrf.e1
    kind: structure
    statement: >
      The speculative-wakeup policy must be split by operand class.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: spec-wakeups
      heading: "Speculative Wakeups"
      quote: >
        With the single unified issue stage there is no separate scalar/vector scheduling stage to steer
        speculative wakeups to, so the policy is split by **operand class** instead:
    notes: >
      The split is forced by the single unified issue stage: there is no separate scalar/vector
      scheduling stage to steer speculative wakeups to.

  - id: spec-vrf.e2
    kind: function
    statement: >
      Scalar feeders of a vector slot must participate in BOOM's existing speculative load-hit
      wakeup unchanged.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: spec-wakeups
      heading: "Speculative Wakeups"
      quote: >
        **Scalar feeders of a vector slot** (base/stride on the integer network, the ``.vf`` scalar on
        the FP network) participate in |boom|'s existing **speculative load-hit wakeup** unchanged.

  - id: spec-vrf.e3
    kind: structure
    statement: >
      The base and stride feeders of a vector slot must be woken on the integer wakeup
      network.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: spec-wakeups
      heading: "Speculative Wakeups"
      quote: >
        (base/stride on the integer network, the ``.vf`` scalar on
        the FP network)
    notes: >
      Scope narrowed to base and stride on 2026-08-03, when VL was removed from this bullet.
      **This reverses the 2026-07-31 ruling** recorded here, which held that a pvl consumer is
      speculatively woken on a scalar load hit and so follows the scalar speculation policy.
      That conflated two consumers: when a vsetvli takes its AVL from a scalar load it is the
      *vset* that is speculatively woken, as an ordinary integer consumer, while the younger
      vector op's pvl waits on the vset's VL writeback. No pvl consumer is ever woken by a load
      hit, so the VL network needs no re-busy machinery. The 2026-07-31 note also flagged that
      "VL on the integer network" contradicted VL having its own network; that phrasing is now
      corrected too. The VL wakeup policy is spec-vrf.e6.

  - id: spec-vrf.e4
    kind: interface
    statement: >
      The ``.vf`` scalar feeder of a vector slot must be woken on the FP wakeup network.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: spec-wakeups
      heading: "Speculative Wakeups"
      quote: >
        the ``.vf`` scalar on
        the FP network

  - id: spec-vrf.e5
    kind: function
    statement: >
      A vector uOP waiting on a scalar-load result must be woken speculatively just like any
      integer or FP consumer.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: spec-wakeups
      heading: "Speculative Wakeups"
      quote: >
        A vector
        uOP waiting on a scalar-load result is woken speculatively just like any integer/FP consumer

  - id: spec-vrf.e6
    kind: function
    statement: >
      A speculatively woken vector uOP must be re-busied through the same machinery if the load
      later misses.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: spec-wakeups
      heading: "Speculative Wakeups"
      quote: >
        and is
        re-busied through the same machinery if the load later misses.

  - id: spec-vrf.e7
    kind: function
    statement: >
      Vector operands must wake only on actual completion.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: spec-wakeups
      heading: "Speculative Wakeups"
      quote: >
        **Vector operands** (``pvs*``, ``pvm`` on the vector wakeup network) wake only on **actual
        completion**, not speculatively.
    notes: >
      Rationale: a vector-load producer completes via the Load Coalescing Buffer after a long,
      variable, streaming latency and a vector-arithmetic producer completes in program order over
      the CII, so neither has the fixed short load-use latency that makes speculation profitable;
      waking on real writeback also avoids adding re-busy/replay machinery to the vector network
      and the vector issue slots.

  - id: spec-vrf.e8
    kind: interface
    statement: >
      The pvs* and pvm operands must be woken on the vector wakeup network.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: spec-wakeups
      heading: "Speculative Wakeups"
      quote: >
        (``pvs*``, ``pvm`` on the vector wakeup network)

  - id: spec-vrf.e9
    kind: function
    statement: >
      Vector operands must never be woken speculatively.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: spec-wakeups
      heading: "Speculative Wakeups"
      quote: >
        wake only on **actual
        completion**, not speculatively.

  - id: spec-vrf.e10
    kind: function
    statement: >
      ``pvl`` must wake on actual completion rather than speculatively.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: spec-wakeups
      heading: "Speculative Wakeups"
      quote: >
        **``pvl``** wakes on **actual completion**, on its own **VL** wakeup network — *not* on the integer
        network and *not* speculatively.
    notes: >
      Resolved 2026-08-03, and this REVERSES the 2026-07-31 ruling formerly recorded on
      spec-vrf.e3, which placed VL in the speculative load-hit class. That ruling conflated two
      consumers: a vsetvli fed by a scalar load is itself speculatively woken as an ordinary
      integer consumer, while the younger vector op's pvl waits on the vset's VL writeback. The
      spec's reason no VL producer suits speculation: vsetivli's pvl is born ready,
      vsetvli/vsetvl have deterministic integer-ALU latency, and vleff publishes its trimmed VL
      only after a long variable vector-load stream. So the VL network needs no re-busy or
      replay machinery.

  # --- f: VRF construction ------------------------------------------------------

  - id: spec-vrf.f1
    kind: structure
    statement: >
      The vector physical register file must be parameterizable.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        The vector physical register file will be parameterizable with default support for
        96 PRNs, **9 Read Ports, and 3 Write Ports**
    notes: >
      The 96-PRN default is spec-vrf.a4, from the sizing table in §"The Register Files and Bypass
      Network".

  - id: spec-vrf.f2
    kind: structure
    statement: >
      The VRF must provide 9 read ports by default.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        default support for
        96 PRNs, **9 Read Ports, and 3 Write Ports** (see :ref:`vrf-ports` for the canonical
        port assignment)
    notes: >
      Which unit owns which read port is spec-vrf.g2 through spec-vrf.g10.

  - id: spec-vrf.f3
    kind: structure
    statement: >
      The VRF must provide 3 write ports by default.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        default support for
        96 PRNs, **9 Read Ports, and 3 Write Ports** (see :ref:`vrf-ports` for the canonical
        port assignment)
    notes: >
      Which unit owns which write port is spec-vrf.g20, spec-vrf.g21, spec-vrf.g9 and spec-vrf.g11.

  - id: spec-vrf.f4
    kind: structure
    statement: >
      The VRF must be implemented using standard cell flip flops.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        The vector register file (VRF) will be
        implemented using standard cell flip flops, with a banked architecture.
    notes: >
      This is the binding implementation choice. The §"The Register Files and Bypass Network"
      clause asking that an area/timing estimate be produced before committing to flops rather
      than a latch/SRAM-based banked file was ruled non-normative on 2026-07-31 — see
      spec-vrf.f4.

  - id: spec-vrf.f5
    kind: structure
    statement: >
      The VRF must use a banked architecture.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        implemented using standard cell flip flops, with a banked architecture.

  - id: spec-vrf.f6
    kind: structure
    statement: >
      A vector register must split across 4 banks of 64 (VLEN/4) bits.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        A vector register
        will split across 4 banks of 64 (VLEN/4) bits.

  - id: spec-vrf.f7
    kind: structure
    statement: >
      Each VRF port must have its own decoder.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        This each port will have its own
        decoder and support forwarding for single cycle reads, if a write port writes
        to the same PRN.

  - id: spec-vrf.f8
    kind: timing
    statement: >
      Each VRF port must support forwarding for single cycle reads when a write port writes to the
      same PRN.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        support forwarding for single cycle reads, if a write port writes
        to the same PRN.

  - id: spec-vrf.f9
    kind: structure
    statement: >
      The VRF must be initialized only by the usingRVV switch.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        The VRF is only initialized by the usingRVV switch.

  - id: spec-vrf.f10
    kind: structure
    statement: >
      The VRF bank count must be fixed at 4.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        **Bank count is fixed at 4 and bank width is ``VLEN/4``**; the array is
        ``numVecPhysRegisters × VLEN``.
    notes: >
      Resolved 2026-08-03. The 64 b, 96 x 256 b and 24 kbit figures are the VLEN = 256 instances
      of these formulas, not independent constants.

  - id: spec-vrf.f11
    kind: structure
    statement: >
      The VRF bank width must be ``VLEN/4``.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        **Bank count is fixed at 4 and bank width is ``VLEN/4``**; the array is
        ``numVecPhysRegisters × VLEN``.

  - id: spec-vrf.f12
    kind: structure
    statement: >
      The VRF array must be ``numVecPhysRegisters × VLEN``.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        the array is
        ``numVecPhysRegisters × VLEN``.

  - id: spec-vrf.f13
    kind: structure
    statement: >
      Two write ports must never target the same PRN.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        **Two write ports never target the same PRN.** Every PRN is the destination of exactly one
        producer, and rename always allocates a *fresh* group, so ``W0``/``W1`` (the LCB's lanes, one write
        per destination PRN) and ``W2`` (the coprocessor) can never name the same register
    notes: >
      Resolved 2026-08-03. Holds for shared instructions too, where one half writes pvtmp and
      the other pvdest — two distinct groups. The spec states no write arbitration or priority
      is required; that absence is not written as a separate requirement.

  - id: spec-vrf.f14
    kind: structure
    statement: >
      Every VRF read port must span all four banks.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vector-regfile
      heading: "The Vector Register File"
      quote: >
        Banking splits the register's **width**, not the port
        count: a VRF read is a full ``VLEN``, so *every* port spans all four banks, and each bank carries
        all 12 ports at ``VLEN/4`` bits.
    notes: >
      Resolved 2026-08-03: this is why bank conflicts among the 9 read ports cannot arise.
      Several read ports addressing one bank is the normal case, not a hazard, which is what the
      per-port per-bank decoder exists for.

  # --- g: the canonical 0-based VRF port assignment -----------------------------

  - id: spec-vrf.g1
