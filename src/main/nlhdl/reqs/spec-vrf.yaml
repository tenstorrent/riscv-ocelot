  - id: spec-vrf.h5
    kind: interface
    statement: >
      ``CII_NUM_DST_WB`` must match the ``tt_cii_interface`` default.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vrf-ports
      heading: "Port assignment (canonical, 0-based)"
      quote: >
        The constant is flagged *must match the*
        ``tt_cii_interface`` *default* — the relay's ``type(wb_data)`` resolves against it, so an
        override that differs is a port-connection mismatch.
    notes: >
      The relay's type(wb_data) resolves against the default, so an override that differs is a
      port-connection mismatch.

  - id: spec-vrf.h6
    kind: structure
    statement: >
      The value of ``CII_NUM_SRC_REQ`` must be taken as authoritative over its inline comment.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vrf-ports
      heading: "Port assignment (canonical, 0-based)"
      quote: >
        Note that ``tt_cii_caracal_pkg.svh`` also contradicts itself here — the
        inline comment on ``CII_NUM_SRC_REQ = 4`` still reads "2 VRF read ports for CII (5,6)". The
        **value** is authoritative, not the comment.
    notes: >
      Earlier drafts said 7R/4W, reasoning that a *pull* interface "can consume at most two VRF
      reads per cycle"; the spec records that this was wrong in both directions once the SV froze —
      the pull interface has four lanes and one write port, not two. The stale inline comment in
      the package is a live source-of-truth hazard and is raised in open_questions.

  - id: spec-vrf.h7
    kind: interface
    statement: >
      The VPU wrapper must return member ``k`` of ``{VS1, VS2, VS3, VM}`` in one dat beat.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vrf-ports
      heading: "Port assignment (canonical, 0-based)"
      quote: >
        The VPU wrapper returns "member ``k`` of
        ``{VS1, VS2, VS3, VM}`` in one dat beat", so all four lanes can be live in the same cycle.
    notes: >
      Quoted here as the reason the four coprocessor read ports must be independent; the
      coprocessor-side pull and Src-Data obligations are mined by the cii family from cii.rst.

