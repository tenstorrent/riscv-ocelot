  - id: spec-vrf.g18
    kind: structure
    statement: >
      ``R1`` and ``R4`` must each have exactly one reader.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vrf-ports
      heading: "Port assignment (canonical, 0-based)"
      quote: >
        ``R1`` and ``R4`` each have **exactly one reader**. On the load path that reader is ``ld_vAGEN_1``,
        which performs the mask read for **every** access class including unit-stride
    notes: >
      Resolved 2026-08-03, closing an open question filed against the agen family: with the
      stage 2 Packer reading the VRF, R1 would have two concurrent readers. The AGEN-side
      obligations are spec-agen.e12 and e13.

  - id: spec-vrf.g19
    kind: structure
    statement: >
      ``R4`` must serve both the store mask and the store index.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vrf-ports
      heading: "Port assignment (canonical, 0-based)"
      quote: >
        ``R4`` serves both the store mask and the store index because **the two reads never need the same
        cycle**
    notes: >
      Resolved 2026-08-03, closing the second agen open question. The reason no second port is
      needed is the read cadence: the mask is read once per OP.v and latched (spec-agen.e14)
      while index members are read as the walk advances, so an indexed masked store never needs
      both in one cycle.

  - id: spec-vrf.g13
    kind: structure
    statement: >
      Segmented-LS temporaries in pvtmp must be ordinary VRF groups using the ports already
      listed.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vrf-ports
      heading: "Port assignment (canonical, 0-based)"
      quote: >
        Segmented-LS temporaries (``pvtmp``) are ordinary VRF groups and use these same ports — the
        LSU/coprocessor read or write ``pvtmp`` on the ports already listed (it is a destination for one half
        and a source for the other)

  - id: spec-vrf.g14
    kind: structure
    statement: >
      pvtmp must add no new VRF ports.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vrf-ports
      heading: "Port assignment (canonical, 0-based)"
      quote: >
        adding no new ports.

  - id: spec-vrf.g15
    kind: function
    statement: >
      The CII must never stall on a VRF write port.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vrf-ports
      heading: "Port assignment (canonical, 0-based)"
      quote: >
        Because the partition is static, **the CII can never stall on a VRF write port**: it owns ``W2``
        outright.
    notes: >
      The invariant is load-bearing because the CII Writeback channel is credit-metered and has no
      back-pressure line, so a port conflict would have nowhere to go. This is the canonical
      statement; the cii.rst restatement is spec-cii.f30.

  - id: spec-vrf.g16
    kind: structure
    statement: >
      The CII must own ``W2`` outright.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vrf-ports
      heading: "Port assignment (canonical, 0-based)"
      quote: >
        it owns ``W2``
        outright.

  - id: spec-vrf.g17
    kind: interface
    statement: >
      The coprocessor must not present two result beats in one cycle.
    source:
      file: docs_caracal/src/midcore.rst
      anchor: vrf-ports
      heading: "Port assignment (canonical, 0-based)"
      quote: >
        One port suffices precisely because
        ``CII_NUM_DST_WB = 1``: the coprocessor cannot present two result beats in one cycle, so a second
        port would never be driven.
    notes: >
      This is why one write port suffices; a second port would never be driven.

