        - 4
        - **Four** coprocessor read ports (``R5``–``R8``).
    notes: >
      All four lanes can be live in the same cycle, which is why four separate ports rather than a
      shared arbitrated port are needed. The constants themselves are also mined from cii.rst as
      spec-cii.a9 and spec-cii.a11.

  - id: spec-vrf.h4
