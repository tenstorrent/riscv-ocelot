      quote: >
        Ports are **statically partitioned**, not arbitrated. This table is the single source of truth;
        :doc:`cii` and :doc:`loadstore` refer to it rather than restating port numbers.
    notes: >
      This table is the single source of truth for port numbers; cii.rst and loadstore.rst defer
      to it. The coprocessor-side restatements in cii.rst are mined as spec-cii.f25, spec-cii.f26
      and spec-cii.f30, and the load-side ones by spec-lsu.

