retired:

  - id: spec-vrf.g5
    statement: >
      The Load Unit and LCB must write the VRF dual-lane on ``W0``–``W1`` in the Large and Mega
      configurations.
    retired_because: >
      Stated in terms of configuration names. Resolved on 2026-08-03 by binding the write-port
      count to lsuWidth instead, which covers every configuration including those below Medium.
      Superseded by spec-vrf.g20.

  - id: spec-vrf.g6
    statement: >
      The Load Unit and LCB must write the VRF on ``W0`` only in the Medium configuration.
    retired_because: >
      Same configuration-name problem as spec-vrf.g5, and it also left the assignment for any
      configuration smaller than Medium unstated, which was the open question. Superseded by
      spec-vrf.g21.

  - id: spec-vrf.g12
    statement: >
      The per-unit port assignment must total 9 read ports and 3 write ports.
    retired_because: >
      False at lsuWidth = 1, where the Load Unit has only W0 and the total is 9R/2W. The flat
      9R/3W figure was the lsuWidth = 2 case all along, which is the open question resolved on
      2026-08-03. Superseded by spec-vrf.g22 and g23.

  - id: spec-vrf.b1
    statement: >
      The vector-PRN count must be treated as a published architectural limit rather than only an area parameter.
    retired_because: >
      A statement about how to regard a parameter ("must be treated as a published architectural limit") rather than an obligation on the design. No RTL artifact can satisfy or violate it. The parameter itself is spec-vrf.a4.

  - id: spec-vrf.b10
    statement: >
      The VRF as specified must total ``96 × 256 b`` = 24 kbit.
    retired_because: >
      The quote opens "The VRF as specified is ...", recapping obligations stated elsewhere: 96 PRNs (spec-vrf.a4), 9R/3W (f2, f3, g12), flop-based (f4), banked 4x64 (f5, f6). The only new content is a storage total that silently assumes VLEN = 256. The non-normative area/timing ruling this entry carried also lives on spec-vrf.f4.

  - id: spec-vrf.b5
    statement: >
      The machine must hold at most ``(96 − 32) / 8 = 8`` LMUL=8 groups in flight.
    retired_because: >
      The quote is a capability derivation ("at most (96 - 32) / 8 = 8 LMUL=8 groups can be in flight"), which this statement converted into an enforcement duty. The family's own open question records that the spec names nothing that enforces the bound. Arithmetic retained in notes on spec-vrf.a4.

  - id: spec-vrf.b7
    statement: >
      The machine must hold at most 4 segmented LMUL=8 ops in flight.
    retired_because: >
      Same defect as spec-vrf.b5: a capability derivation ("so at most 4 of those") mined as an enforcement duty with no specified enforcer.

  - id: spec-vrf.b8
    statement: >
      The vector-PRN count must be sized against a target memory-level parallelism.
    retired_because: >
      A design-process instruction ("Size this against a target memory-level parallelism"), and the spec never states the target, so the requirement has no pass or fail condition.

  - id: spec-vrf.b9
    statement: >
      The derived in-flight limit must be stated wherever the vector-PRN parameter is documented.
    retired_because: >
      A documentation obligation ("the derived in-flight limit should be stated wherever the parameter is documented"). No RTL can carry this tag.

  - id: spec-vrf.h1
    statement: >
      Both coprocessor port figures must be derived from the frozen SV contract rather than chosen in this spec.
    retired_because: >
      Provenance about the document ("derived from the frozen SV contract, not chosen here") rather than an obligation on the design. The actionable form is spec-vrf.h2, which requires the host to match tt_cii_caracal_pkg.svh.

  - id: spec-vrf.j9
    statement: >
      The coprocessor must decide which source slots to pull.
    retired_because: >
      A framing clause ("Because the two fields are separate, the coprocessor decides what to pull") introducing spec-vrf.j10-j12, which carry the content. As an obligation it targets the VPU decoder, which no Caracal RTL can be tagged for.

# All six open questions recorded against this family were resolved on 2026-08-03, along with
# the two handed over from the agen family (both concerned this family's port table):
#
#   stale SV comment / RTL audit -> CLOSED AS MOOT, no requirement. The values in
#     tt_cii_caracal_pkg.svh are correct; only the inline comment on CII_NUM_SRC_REQ is wrong,
#     and there is no host-side RTL in the tree to have been written against it. The comment fix
#     is a change to the tt-cii submodule, which this skill does not edit.
#   9R/3W vs Medium's W0-only  -> write count binds to lsuWidth; g5/g6/g12 retired,
#     spec-vrf.g20-g23 issued
#   what enforces the group bound -> nothing; the free list is the mechanism; spec-vrf.b11
#   write-port and bank conflicts -> neither can arise; spec-vrf.f13, f14
#   VLEN scaling of the banking   -> count fixed at 4, width VLEN/4; spec-vrf.f10-f12
#   which wakeup class VL is in    -> actual completion, on the VL network; spec-vrf.e10.
#     THIS REVERSED the 2026-07-31 ruling recorded on spec-vrf.e3 — see the notes on e3 and e10.
#   (from agen) R1 has two readers -> stage 1 does the mask read for every class; spec-vrf.g18,
#     spec-agen.e12/e13, spec-agen.e3 retired
